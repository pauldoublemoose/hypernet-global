function card(kicker, title, body, chips){
  return '<div class="card">' + (kicker ? '<div class="ck">'+esc(kicker)+'</div>' : '') + (title ? '<div class="ctt">'+esc(title)+'</div>' : '') +
    (body ? '<div class="cbd">'+(Array.isArray(body) ? body.filter(Boolean).map(function(x){ return '<p>'+esc(x)+'</p>'; }).join('') : '<p>'+esc(body)+'</p>')+'</div>' : '') +
    (chips && chips.length ? '<div class="chips" style="margin-top:10px">' + chips.map(function(c){ return '<span class="chip plain">'+esc(c)+'</span>'; }).join('') + '</div>' : '') + '</div>';
}
function takePartHTML(r){
  var c = [], b = r.burn || {}, v = r.volunteering;
  if (v) c.push(card('Volunteering', EXPECTLAB[v.expectation] || titleCase(v.expectation || ''), v.how, v.teams));
  if (b.camps){
    var cm = b.camps;
    c.push(card('Camps', titleCase(cm.noun || 'Camps'), [cm.registration && cm.registration.closes ? 'Registration closes ' + fmtDay(cm.registration.closes) + '.' : '',
      cm.count ? money(cm.count) + ' registered.' : '', cm.maxSize ? 'Up to ' + cm.maxSize + '.' : '']));
  }
  if (b.artFunding){
    var af = b.artFunding;
    c.push(card('Art funding', af.name || ARTLAB[af.model] || 'Art funding', [ARTLAB[af.model] && af.name ? ARTLAB[af.model] + '.' : '',
      af.pot ? 'Pot: ' + money(af.pot, af.currency) + '.' : '', af.range ? 'Range: ' + (typeof af.range === 'object' ? JSON.stringify(af.range) : af.range) + '.' : '', af.note]));
  }
  if (b.earlyEntry) c.push(card('Early entry', b.earlyEntry.credential || 'Early entry', b.earlyEntry.via ? 'Through ' + b.earlyEntry.via + '.' : ''));
  if (r.openCalls && r.openCalls.length) c.push(card('Open calls', 'Wanted', null, r.openCalls));
  return c.length ? '<div class="cards">' + c.join('') + '</div>' : '';
}
function calloutsHTML(ids){
  var cs = (ids || []).map(calloutOf).filter(Boolean);
  return cs.length ? '<div class="chips">' + cs.map(function(c){
    return '<button class="chip" data-act="open" data-type="callout" data-id="'+c.id+'">'+ic('callout',16)+'Looking for: '+esc(c.title)+' <span class="sub">'+esc(c.hostName)+'</span></button>'; }).join('') + '</div>' : '';
}
function providedHTML(p){
  if (!p) return '';
  var it = [];
  if (p.water) it.push({ none:[false,'No water on site. Bring your own.'], taps:[true,'Drinking water from taps'], buy:[true,'Water for sale'] }[p.water] || [true, 'Water: ' + p.water]);
  if (p.power != null) it.push([!!p.power, p.power ? 'Power on site' : 'No power. Bring your own.']);
  if (p.toilets) it.push([true, String(p.toilets).charAt(0).toUpperCase() + String(p.toilets).slice(1)]);
  if (p.showers != null) it.push([!!p.showers, p.showers ? 'Showers' : 'No showers']);
  if (p.food) it.push({ none:[false,'No food for sale. Bring your own.'], volunteer_kitchen:[true,'Volunteer kitchen'] }[p.food] || [true, 'Food: ' + p.food]);
  return '<ul class="prov">' + it.map(function(x){ return '<li class="'+(x[0]?'y':'n')+'">'+esc(x[1])+'</li>'; }).join('') + '</ul>' + (p.note ? '<p>'+esc(p.note)+'</p>' : '');
}
function rulesHTML(r){
  var b = r.burn || {}, ru = b.rules, sf = b.safety, h = '';
  if (ru){
    var o = {}; ['vending','vehicles','artCars','pets','fire','sound','drones'].forEach(function(k){ if (ru[k] != null) o[k] = ru[k]; });
    Object.keys(ru).forEach(function(k){ if (o[k] === undefined && k !== 'other') o[k] = ru[k]; });
    h += kvHTML(o, { artCars:'Art cars' });
    if (ru.other && ru.other.length) h += rv(ru.other);
  }
  if (sf){
    if (sf.consentTeam) h += '<p style="margin-top:14px">There is a consent team on site.</p>';
    if (sf.teams && sf.teams.length) h += chipsHTML(sf.teams);
  }
  return h;
}
function principlesHTML(p){
  if (!p) return '';
  if (Array.isArray(p)) return chipsHTML(p);
  if (typeof p !== 'object') return rv(p);
  var h = '';
  if (p.base) h += '<p>' + (p.base === 'own' ? 'Their own principles' : 'Built on the ' + esc(p.base)) + (p.additions && p.additions.length ? ', plus:' : '.') + '</p>';
  if (p.additions && p.additions.length) h += chipsHTML(p.additions, 'strong');
  if (p.renamed && p.renamed.length) h += rv(p.renamed);
  if (p.url) h += '<p style="margin-top:12px"><a href="'+esc(p.url)+'" target="_blank" rel="noopener">Read them</a></p>';
  return h;
}
function nextHTML(n){
  if (!n) return '';
  return '<div class="themeline">' + esc(isoDate(n.date) ? fmtRange(isoDate(n.date), isoDate(n.endDate)) : (n.date || '')) + '</div>' +
    (n.theme ? '<p>Theme: '+esc(typeof n.theme === 'object' ? n.theme.name : n.theme)+'</p>' : '') + (n.note ? '<p>'+esc(n.note)+'</p>' : '');
}
function sourcesHTML(r){
  var ls = [];
  if (r.externalUrl) ls.push({ label: r.externalUrl.replace(/^https?:\/\/(www\.)?/,'').replace(/\/.*$/,''), url:r.externalUrl });
  (r.sources || []).forEach(function(s){ var u = typeof s === 'string' ? s : s.url; if (u && !ls.some(function(x){ return x.url === u; })) ls.push({ label: (s.label || u), url:u }); });
  return ls.length ? '<div class="chips">' + ls.map(function(l){ return '<a class="chip plain" href="'+esc(l.url)+'" target="_blank" rel="noopener">'+esc(l.label)+'</a>'; }).join('') + '</div>' : '';
}
function provenance(evId){
  var r = recOf(evId);
  if (/^evt-new-/.test(evId)) return '';
  if (r.illustrative) return 'Illustrative example';
  if (r.sources || r.externalUrl) return 'From the event’s own pages' + (r.unverified && r.unverified.length ? ' · from directories only: ' + r.unverified.join(', ') : '');
  return '';
}

/* the link between editions: a past one points forward, the next one points back */
function editionsHTML(evId){
  var nid = NEXTED[evId], r = recOf(evId);
  if (nid){
    var n = EVENTS[nid], nr = recOf(nid), sale = (nr.access && nr.access.sales || []).map(function(sl){ return [sl, saleState(sl)]; })
      .filter(function(x){ return x[1] && x[1] !== 'Closed'; })[0];
    return '<div class="edition"><button class="edcard" data-act="open" data-type="event" data-id="'+nid+'">' +
      '<span class="edk">Next edition</span><span class="edt">'+esc(n.title)+'</span>' +
      '<span class="edd">'+esc(fmtRange(n.date, endOf(n)))+(nr.theme && nr.theme.name ? ' · ' + esc(nr.theme.name) : '')+'</span>' +
      (sale ? '<span class="eds">'+esc(sale[0].name)+': '+esc(sale[1].toLowerCase())+'</span>' : '') +
      '<span class="edgo">'+ic('back',18).replace('class="ic"','class="ic" style="transform:scaleX(-1)"')+'</span></button></div>';
  }
  if (r._prev && EVENTS[r._prev]){
    return '<div class="edition"><div class="edprev"><button class="chip" data-act="open" data-type="event" data-id="'+r._prev+'">'+ic('back',16)+'Previous: '+esc(r._prevYear)+'</button>' +
      '<span class="ednote">Dates announced'+(r._note ? ' · ' + esc(r._note) : '')+'. Details below are from the '+esc(r._prevYear)+' edition until the organisers update them.</span></div></div>';
  }
  return '';
}
function verbsHTML(evId){
  var st = S.loggedIn ? RSVP[evId] : undefined;
  var pro = S.loggedIn && PROMOTED[evId];
  var h = '<div class="verbs">';
  h += '<div class="vpair" role="group" aria-label="Your state">' +
       '<button class="vbtn'+(st==='interested'?' on':'')+'" data-act="v-interested" data-id="'+evId+'" aria-pressed="'+(st==='interested')+'">'+ic('heart')+'Interested</button>' +
       '<button class="vbtn'+(st==='going'?' on':'')+'" data-act="v-going" data-id="'+evId+'" aria-pressed="'+(st==='going')+'">'+ic('check')+'Going</button></div>';
  h += '<button class="vpromo'+(pro?' on':'')+'" data-act="v-promote" data-id="'+evId+'" aria-pressed="'+!!pro+'">'+ic('promote')+(pro?'Promoted':'Promote') +
       (PROMOCOUNT[evId] ? ' <span class="n">'+PROMOCOUNT[evId]+'</span>' : '') + '</button>';
  h += '<span class="vsec">';
  h += '<button class="vmore" data-act="addto" data-id="'+evId+'">'+ic('addhorizon',16)+'<span class="lg">Add to horizon</span><span class="sm">Horizon</span></button>';
  h += '<button class="vmore" data-act="share" data-id="'+evId+'">'+ic('share',16)+'Share</button>';
  if (isMine(evId)) h += '<button class="vmore" data-act="customize" data-id="'+evId+'">'+ic('paint',16)+'Customize</button>';
  return h + '</span></div>';
}
/* The event page. `scale` picks how much of it there is: a meetup is time,
   place, price, what to bring, call outs; a gathering adds its timeline,
   tiers, volunteering and principles; a burn adds phases, the access
   explainer, what's provided, rules and safety, camps and art money, and
   its own vocabulary. Empty sections are never drawn. */
function canvasHTML(evId){
  var e = EVENTS[evId], t = TH(evId), r = recOf(evId), b = r.burn || {};
  var big = r.scale === 'burn' || !!r.burn;
  var hp = hostPersonOf(e), onHz = horizonsOf(evId), att = attendees(evId), past = isPast(lastDay(e));
  var h = '<article class="canvas t-'+t.type+' d-'+t.density+' sh-'+t.shape+' mo-'+t.motion+'" style="'+themeVars(t)+'">';
  h += '<header class="banner"><div class="surf u-'+t.surface+'"></div><div class="wash"></div><div class="bin">' + sqHTML(evId, 160) +
       '<div class="btxt"><div class="eyebrow">'+eyebrowOf(e)+'</div>' +
       '<h1 class="hl h-'+t.headline+'">'+headlineHTML(t, e.title)+'</h1>' +
       (t.mood ? '<p class="mood">'+esc(t.mood)+'</p>' : '') + '</div></div></header>';
  if (!past) h += '<div class="actbar">' + verbsHTML(evId) + '</div>';
  else if (S.loggedIn) h += '<div class="actbar"><div class="verbs">' +
    '<button class="vwent'+(WENT[evId]?' on':'')+'" data-act="v-went" data-id="'+evId+'" aria-pressed="'+!!WENT[evId]+'">'+ic('check')+'Went</button>' +
    '<span class="vsec"><button class="vmore" data-act="share" data-id="'+evId+'">'+ic('share',16)+'Share</button></span></div></div>';
  h += editionsHTML(evId);
  h += '<div class="layer"><div class="surf u-'+t.surface+'" style="opacity:.45"></div><div class="lin">';
  h += factsHTML(evId);
  h += sect('About', descOf(e) ? '<p class="evdesc">'+esc(descOf(e))+'</p>' : '');
  if (r.theme) h += sect('Theme', '<div class="themeline">'+esc(typeof r.theme === 'object' ? (r.theme.name || '') : r.theme)+'</div>' +
                                   (r.theme.blurb ? '<p>'+esc(r.theme.blurb)+'</p>' : ''));
  if (b.phases && b.phases.length) h += sect('Timeline', timelineHTML(b.phases, true));
  else if (r.blocks && r.blocks.length) h += sect(r.blocks.every(function(x){ return /^shift/i.test(x.label || ''); }) ? 'Shifts' : 'Timeline', timelineHTML(r.blocks, false));
  var am = r.access && r.access.model;
  if (!past) h += sect(/member/.test(am || '') ? 'Membership' : am === 'ticket' || am === 'lottery' ? 'Tickets' : 'Entry', accessHTML(r.access));
  h += sect('Take part', takePartHTML(r));
  h += sect('Call outs', calloutsHTML(r.calloutIds));
  if (big) h += sect('On site', providedHTML(b.provided));
  h += sect('Bring', rv(r.whatToBring) + (r.dressCode ? '<p style="margin-top:10px"><b>Dress:</b> '+esc(r.dressCode)+'</p>' : ''));
  if (big) h += sect('Rules & safety', rulesHTML(r));
  h += sect('Good to know', kvHTML({ age: r.age && r.age.note, accessibility: r.accessibility, lastEntry: r.gateCloses }, { lastEntry:'Last entry' }));
  h += sect('Principles', principlesHTML(r.principles));
  if (b.vocabulary && b.vocabulary.length) h += sect('Words used here', '<dl class="kv vocab">' + b.vocabulary.map(function(v){
    return '<dt>'+esc(v.term)+'</dt><dd>'+esc(v.meaning)+'</dd>'; }).join('') + '</dl>');
  if (b.nextEdition && !NEXTED[evId]) h += sect('Next edition', nextHTML(b.nextEdition));
  h += sect(past ? 'Who went' : 'Who’s going', '<div class="chips">' + att.map(function(pid){
         return '<button class="chip" data-act="open" data-type="person" data-id="'+pid+'">'+avHTML(pid,'a28')+esc(person(pid).displayName)+'</button>';
       }).join('') + '<span class="chip plain">+ '+Math.max(0, attendeeCount(evId)-att.length)+' more</span></div>');
  h += sect('On horizons', onHz.length ? '<div class="chips">' + onHz.map(function(k){
         return '<button class="chip" data-act="open" data-type="horizon" data-id="'+k+'">'+ic('horizon',16)+esc(HORIZONS[k].name)+' <span class="sub">'+esc(HORIZONS[k].ownerName)+'</span></button>';
       }).join('') + '</div>' : '');
  var hosts = '';
  if (hp && (hp.id !== 'self' || !S.loggedIn)) hosts += '<button class="chip" data-act="open" data-type="person" data-id="'+hp.id+'">'+avHTML(hp.id,'a28')+esc(hp.displayName)+'</button>';
  (r.ownerGroupIds || []).forEach(function(g){ if (GROUPS[g]) hosts += '<button class="chip" data-act="open" data-type="group" data-id="'+g+'">'+ic('camp',16)+esc(GROUPS[g].name)+'</button>'; });
  h += sect('Hosted by', hosts ? '<div class="chips">' + hosts + '</div>' : '');
  h += sect('Links', sourcesHTML(r));
  var pv = provenance(evId);
  if (pv) h += '<div class="srcline">' + esc(pv) + '</div>';
  h += '</div></div></article>';
  return h;
}

/* A horizon shows its own properties and state. No event verbs
   on the horizon itself; the events inside it carry them, per row. */
function compactVerbs(evId){
  var st = S.loggedIn ? RSVP[evId] : '';
  if (isPast(lastDay(EVENTS[evId]))) return S.loggedIn ? '<div class="cverbs"><button class="ib'+(WENT[evId]?' on':'')+'" data-act="v-went" data-id="'+evId+'" aria-label="Went" aria-pressed="'+!!WENT[evId]+'">'+ic('check')+'</button></div>' : '';
  return '<div class="cverbs">' +
    '<button class="ib'+(st==='interested'?' on':'')+'" data-act="v-interested" data-id="'+evId+'" aria-label="Interested" aria-pressed="'+(st==='interested')+'">'+ic('heart')+'</button>' +
    '<button class="ib'+(st==='going'?' on':'')+'" data-act="v-going" data-id="'+evId+'" aria-label="Going" aria-pressed="'+(st==='going')+'">'+ic('check')+'</button>' +
    '<button class="ib'+(S.loggedIn && PROMOTED[evId]?' on':'')+'" data-act="v-promote" data-id="'+evId+'" aria-label="Promote">'+ic('promote')+'</button></div>';
}
function eventCRow(e, withVerbs){
  return '<div class="crow">' + sqHTML(e.id, 40) +
    '<div class="cm" data-act="open" data-type="event" data-id="'+e.id+'"><div class="r-title"'+(READ[e.id]?'':' style="font-weight:bold"')+'>'+esc(e.title)+'</div>' +
    '<div class="r-meta">'+esc([fmtShort(e.date), whereOf(e), hostLabel(e)].filter(Boolean).join(' · '))+'</div></div>' +
    (withVerbs ? compactVerbs(e.id) : '') + '</div>';
}
/* on a phone a horizon opens like a playlist: big cover, who made it, one primary action, then its events */
function playlistHTML(hzId, withTracks){
  var hz = HORIZONS[hzId], mine = hzOwnedByMe(hzId), fol = S.loggedIn && HZFOLLOW[hzId];
  var evs = hz.eventIds.map(function(id){ return EVENTS[id]; }).filter(Boolean).sort(byDate);
  var owner = hz.isPersonalDefault ? 'You' : hz.ownerName;
  var h = '<div class="plist"><div class="pltop"><div class="plcover">' + hzMosaic(hzId, 232) + '</div>';
  h += '<div class="plhead"><div class="plk">Event Horizon'+(hz.isPublished ? '' : ' · Private')+'</div><h1 class="pln">'+esc(hz.name)+'</h1>';
  if (hz.description) h += '<p class="pld">'+esc(hz.description)+'</p>';
  h += '<div class="plo">' + (hz.ownerId && PEOPLE[hz.ownerId] && hz.ownerId !== 'self'
        ? '<button class="plown" data-act="open" data-type="person" data-id="'+hz.ownerId+'">'+avHTML(hz.ownerId)+esc(owner)+'</button>'
        : '<span class="plown">'+ic('horizon',16)+esc(owner)+'</span>') + '</div>';
  h += '<div class="plm">'+evs.length+' event'+(evs.length===1?'':'s')+' · '+(HZCOUNT[hzId]||0)+' followers · '+esc(hzRange(hzId))+'</div></div></div>';
  h += '<div class="placts">';
  if (!mine) h += '<button class="btn '+(fol?'on':'primary')+' plmain" data-act="followhz" data-id="'+hzId+'" aria-pressed="'+!!fol+'">'+ic(fol?'check':'plus')+(fol?'Following':'Follow')+'</button>';
  else {
    /* your own horizon: filling it is the job, so Add events leads */
    h += '<button class="btn primary plmain" data-act="addevents" data-id="'+hzId+'">'+ic('plus')+'Add events</button>';
    if (evs.length && !hz.isPersonalDefault) h += '<button class="btn'+(hz.isPublished?' on':'')+'" data-act="publishhz" data-id="'+hzId+'" aria-pressed="'+!!hz.isPublished+'">'+(hz.isPublished?ic('check')+'Published':'Publish')+'</button>';
    h += '<button class="ib" data-act="renamehz" data-id="'+hzId+'" aria-label="Rename">'+ic('edit')+'</button>';
    if (evs.length) h += '<button class="ib" data-act="coverhz" data-id="'+hzId+'" aria-label="Cover">'+ic('paint')+'</button>';
  }
  h += '</div>';
  if (withTracks === false) return h + '</div>';
  h += '<ol class="tracks">' + (evs.length ? evs.map(function(e, i){
    var tag = cardTag({ type:'event', id:e.id });
    return '<li class="track'+(isPast(lastDay(e))?' past':'')+'" data-act="open" data-type="event" data-id="'+e.id+'" role="button">' +
      '<span class="tn">'+(i+1)+'</span>' + sqPx(e.id, 48) +
      '<span class="tm"><span class="tt">'+esc(e.title)+'</span><span class="ts">'+esc(fmtShort(e.date) + ' · ' + whereOf(e) + ' · ' + hostLabel(e))+'</span></span>' +
      (tag ? tag.replace('ctag', 'ctag inline') : '') +
      (mine ? '<button class="ib trm" data-act="unfile" data-id="'+e.id+'" data-hz="'+hzId+'" aria-label="Remove '+esc(e.title)+' from '+esc(hz.name)+'">'+ic('close',16)+'</button>' : '') + '</li>';
  }).join('') : (mine ? '' : '<li class="empty">No events in this horizon yet.</li>')) + '</ol></div>';
  return h;
}
function horizonHTML(hzId, withContents){
  var hz = HORIZONS[hzId];
  if (!hz) return '<div class="empty">This horizon no longer exists.</div>';
  return playlistHTML(hzId, withContents);
}
function prow(k, v){ return '<div class="prow"><span class="pk">'+esc(k)+'</span><span class="pv">'+v+'</span></div>'; }
function publishedHorizonsOf(pid){
  return Object.keys(HORIZONS).filter(function(k){
    var h = HORIZONS[k];
    return h.isPublished && (h.ownerId === pid || (h.ownerGroupId && GROUPS[h.ownerGroupId] && GROUPS[h.ownerGroupId].adminIds.indexOf(pid) >= 0));
  });
}
function personHTML(pid){
  var p = person(pid), hz = publishedHorizonsOf(pid), st = PRESENCE[pid] || 'offline', fol = S.loggedIn && PFOLLOW[pid];
  var hosts = allEvents().filter(function(e){ return pid === 'self' ? ownEvent(e) : e.hostName === p.displayName; }).sort(byDate);
  var clusters = Object.keys(GROUPS).filter(function(g){ return GROUPS[g].memberIds.indexOf(pid) >= 0; });
  var h = '<div class="page">';
  h += '<div class="phead2">' + avHTML(pid, 'a64') + '<div style="flex:1;min-width:0"><div class="pname">'+esc(p.displayName)+'</div>' +
       '<div class="psub">@'+esc(p.handle)+(citiesOf(p).length?' · '+esc(citiesOf(p).join(', ')):'') +
       (pid === 'self' ? '' : ' · <span class="pres '+st+'"></span>'+esc(st)) + '</div></div></div>';
  if (p.bio) h += '<p class="pdesc">'+esc(p.bio)+'</p>';
  if (pid === 'self' && S.loggedIn){
    h += '<div class="acts"><button class="btn primary" data-act="editprofile">'+ic('edit')+'Edit profile</button></div>';
  }
  if (pid !== 'self'){
    h += '<div class="acts"><button class="btn '+(fol?'on':'primary')+'" data-act="followp" data-id="'+pid+'" aria-pressed="'+!!fol+'">'+ic(fol?'check':'plus')+(fol?'Following':'Follow')+'</button>' +
         '<button class="btn" data-act="dm" data-id="'+pid+'">'+ic('chat')+'Message</button></div>';
  }
  if ((p.skills||[]).length){
    h += '<div class="subh">Skills</div><div class="tags">' + p.skills.map(function(s){ return '<span class="tag">'+esc(skillLabel(s))+'</span>'; }).join('') + '</div>';
  }
  if (citiesOf(p).length > 1 || pid === 'self'){
    h += citiesOf(p).length ? '<div class="subh">Cities</div><div class="tags">' + citiesOf(p).map(function(c){ return '<span class="tag">'+esc(c)+'</span>'; }).join('') + '</div>' : '';
  }
  if (hz.length){
    h += '<div class="subh">Published horizons</div>' + hz.map(function(k){
      return '<div class="crow">'+(hzCover(k) ? sqHTML(hzCover(k), 40) : '<span class="r-ic">'+ic('horizon')+'</span>')+
        '<div class="cm" data-act="open" data-type="horizon" data-id="'+k+'"><div class="r-title">'+esc(HORIZONS[k].name)+'</div>' +
        '<div class="r-meta">'+HORIZONS[k].eventIds.length+' events · '+(HZCOUNT[k]||0)+' followers</div></div></div>';
    }).join('');
  }
  if (hosts.length) h += '<div class="subh">Hosting</div>' + hosts.map(function(e){ return eventCRow(e, false); }).join('');
  if (clusters.length){
    h += '<div class="subh">Clusters</div>' + clusters.map(function(g){
      return '<div class="crow"><span class="r-ic">'+ic(GROUPS[g].visibility==='private'?'lock':'camp')+'</span>' +
        '<div class="cm" data-act="open" data-type="group" data-id="'+g+'"><div class="r-title">'+esc(GROUPS[g].name)+'</div>' +
        '<div class="r-meta">'+esc(GROUPS[g].visibility)+' · '+GROUPS[g].memberIds.length+' members</div></div></div>';
    }).join('');
  }
  return h + '</div>';
}
function groupHTML(gid){
  var g = GROUPS[gid];
  return '<div class="page"><div class="phead2"><span class="r-ic" style="width:64px;height:64px;flex-basis:64px">'+ic(g.visibility==='private'?'lock':'camp',30)+'</span>' +
    '<div style="flex:1;min-width:0"><div class="pname">'+esc(g.name)+'</div><div class="psub">Cluster · '+esc(g.visibility)+' · '+g.memberIds.length+' members</div></div></div>' +
    '<p class="pdesc">'+esc(g.description)+'</p>' +
    '<div class="subh">Members</div>' + g.memberIds.map(function(m){
      return '<div class="crow">'+avHTML(m,'a40')+'<div class="cm" data-act="open" data-type="person" data-id="'+m+'"><div class="r-title">'+esc(person(m).displayName)+'</div>' +
        '<div class="r-meta">'+esc(person(m).bio||'')+(GROUPS[gid].adminIds.indexOf(m)>=0?' · admin':'')+'</div></div></div>'; }).join('') + '</div>';
}
function calloutHTML(id){
  var c = calloutOf(id);
  return '<div class="page"><div class="phead2"><span class="r-ic" style="width:64px;height:64px;flex-basis:64px">'+ic('callout',30)+'</span>' +
    '<div style="flex:1;min-width:0"><div class="psub" style="margin:0 0 4px">Call out</div><div class="pname">Looking for: '+esc(c.title)+'</div>' +
    '<div class="psub">'+esc(c.hostName)+' · open until '+fmtDate(c.expiresAt)+'</div></div></div>' +
    '<p class="pdesc">'+esc(c.body)+'</p>' +
    '<div class="acts"><button class="btn primary" data-act="answercallout" data-id="'+id+'">'+ic('chat')+'Answer</button>' +
    (c.hostId ? '<button class="btn" data-act="open" data-type="person" data-id="'+c.hostId+'">'+avHTML(c.hostId)+esc(c.hostName)+'</button>' : '') + '</div></div>';
}
function detailHTML(it){
  if (!it) return '<div class="empty" style="padding-top:25vh">'+ic('horizon',40).replace('class="ic"','class="ic" style="margin:0 auto 10px;opacity:.35"')+'</div>';
  if (it.type === 'event' && EVENTS[it.id])      return canvasHTML(it.id);
  if (it.type === 'horizon')                     return horizonHTML(it.id, S.folder.kind !== 'horizon' || S.folder.id !== it.id || S.stack.length > 1 || !L.split);
  if (it.type === 'person')                      return personHTML(it.id);
  if (it.type === 'group' && GROUPS[it.id])      return groupHTML(it.id);
  if (it.type === 'callout' && calloutOf(it.id)) return calloutHTML(it.id);
  return '<div class="empty">Nothing to show.</div>';
}
var LASTDETAIL = '';
function renderDetail(){
  var it = S.stack[S.stack.length-1] || null;
  var key = it ? it.type + ':' + it.id + ':' + S.stack.length : 'none';
  var sc = $('dscroll'), keep = key === LASTDETAIL ? sc.scrollTop : 0;
  sc.innerHTML = detailHTML(it);
  sc.scrollTop = keep;
  LASTDETAIL = key;
  /* the back bar: only when there is somewhere to go back to */
  var show = !L.phone && ((L.split && S.stack.length > 1) || (!L.split && S.stack.length > 0));
  $('app').classList.toggle('show-dbar', show);
  if (show){
    var prev = S.stack.length > 1 ? itemName(S.stack[S.stack.length-2]) : (isCal() ? folderName() + ' · Calendar' : folderName());
    $('dbar').innerHTML = '<button class="btn" data-act="back">'+ic('back')+'Back</button><span class="dcrumb">'+esc(prev)+'</span>';
  }
}
</script>
<script>
/* =========================================================================
   7b. THE PHONE FEED — Spotify's structure in a 2000-era skin
   A greeting, filter chips, quick tiles for the things you keep, then
   sideways shelves of big squares. Event squares are the album art;
   horizons are playlists with a cover built from their events.
   ========================================================================= */
/* an event square at any pixel size */
function sqPx(id, px, extra){
  var t = TH(id);
  return '<div class="sq sh-'+t.shape+(extra?' '+extra:'')+'" style="'+themeVars(t)+'width:'+px+'px;height:'+px+'px;font-size:'+Math.round(px*0.54)+'px">' +
         '<div class="pat p-'+t.square.pattern+'"></div><span class="g">'+t.square.glyph+'</span></div>';
}
/* a horizon's cover: the owner's pick, or a 2×2 mosaic of its first four events */
function hzMosaic(hzId, px){
  var hz = HORIZONS[hzId], ids = hz ? hz.eventIds.filter(function(id){ return EVENTS[id]; }) : [];
  if (HZCOVER[hzId] === 'plain' || !ids.length) return '<div class="mosaic empty" style="width:'+px+'px;height:'+px+'px">'+ic('horizon', Math.round(px/3))+'</div>';
  if (HZCOVER[hzId] || ids.length < 4) return '<div class="mosaic one" style="width:'+px+'px;height:'+px+'px">' + sqPx(hzCover(hzId), px) + '</div>';
  if (!ids.length) return '<div class="mosaic empty" style="width:'+px+'px;height:'+px+'px">'+ic('horizon', Math.round(px/3))+'</div>';
  var h = Math.floor(px/2);
  return '<div class="mosaic" style="width:'+(h*2)+'px;height:'+(h*2)+'px">' + ids.slice(0,4).map(function(id){ return sqPx(id, h); }).join('') + '</div>';
}
function cardTag(it){
  if (!S.loggedIn) return '';
  if (it.type === 'event'){
    if (WENT[it.id]) return '<span class="ctag">Went</span>';
    var st = stateOf(it.id);
    return st ? '<span class="ctag">'+{ going:'Going', interested:'Interested', hosting:'Hosting' }[st]+'</span>' : '';
  }
  if (it.type === 'horizon') return hzOwnedByMe(it.id) ? '<span class="ctag">Yours</span>' : HZFOLLOW[it.id] ? '<span class="ctag">Following</span>' : '';
  return '';
}
function cardHTML(it){
  var art, t, sub;
  if (it.type === 'event'){
    var e = EVENTS[it.id], end = endOf(e);
    art = sqPx(it.id, 150);
    t = e.title; sub = fmtShort(e.date) + (end ? ' +' + (nDays(e.date, end) - 1) + 'd' : '') + ' · ' + whereOf(e);
  } else if (it.type === 'horizon'){
    var hz = HORIZONS[it.id];
    art = hzMosaic(it.id, 150);
    t = hz.name; sub = hz.ownerName + ' · ' + hz.eventIds.length + ' events';
  } else {
    var c = calloutOf(it.id);
    art = '<div class="coart">'+ic('callout', 40)+'<span>Looking for</span><b>'+esc(c.title)+'</b></div>';
    t = c.title; sub = c.hostName + ' · until ' + fmtShort(c.expiresAt);
  }
  return '<div class="card2" data-act="row" data-type="'+it.type+'" data-id="'+it.id+'" role="button">' +
    '<div class="cart">'+art+cardTag(it)+'</div><div class="ct2">'+esc(t)+'</div><div class="cs2">'+esc(sub)+'</div></div>';
}
function tileHTML(it){
  var art = it.type === 'event' ? sqPx(it.id, 56) : hzMosaic(it.id, 56);
  var t = it.type === 'event' ? EVENTS[it.id].title : HORIZONS[it.id].name;
  return '<div class="qtile" data-act="row" data-type="'+it.type+'" data-id="'+it.id+'" role="button">'+art+'<span class="qt">'+esc(t)+'</span></div>';
}
function upcoming(e){ return !isPast(lastDay(e)); }
function popularHorizons(){ return browsableHorizons().filter(function(k){ return HORIZONS[k].isPublished; }).sort(function(a,b){ return (HZCOUNT[b]||0) - (HZCOUNT[a]||0); }); }
function quickItems(){
  var out = [], seen = {};
  function add(type, id){ var k = type + id; if (!seen[k] && (type !== 'event' || EVENTS[id]) && (type !== 'horizon' || HORIZONS[id])){ seen[k] = 1; out.push({ type:type, id:id }); } }
  if (S.loggedIn){
    MYHORIZONS.slice().reverse().forEach(function(k){ add('horizon', k); });
    rsvpList('going').filter(upcoming).forEach(function(e){ add('event', e.id); });
    rsvpList('interested').filter(upcoming).forEach(function(e){ add('event', e.id); });
    Object.keys(HZFOLLOW).filter(function(k){ return HZFOLLOW[k]; }).forEach(function(k){ add('horizon', k); });
  }
  popularHorizons().forEach(function(k){ add('horizon', k); });
  feedEvents().filter(upcoming).sort(function(a,b){ return attendeeCount(b.id) - attendeeCount(a.id); }).forEach(function(e){ add('event', e.id); });
  return out;
}
/* the shelves, in order. Each one also backs a "Show all" list. */
function shelfItems(id){
  var ev = function(list){ return list.map(function(e){ return { type:'event', id:e.id }; }); };
  if (id === 'soon'){
    var up = feedEvents().filter(upcoming);
    var week = up.filter(function(e){ return dayDiff(e.date) <= 7; });
    return ev(week.length >= 4 ? week : up.slice(0, 12));
  }
  if (id === 'announced') return ev(Object.keys(NEXTED).map(function(k){ return EVENTS[NEXTED[k]]; }).sort(byDate));
  if (id === 'horizons') return popularHorizons().filter(function(k){ return !(S.loggedIn && (HZFOLLOW[k] || MYHORIZONS.indexOf(k) >= 0)); }).map(function(k){ return { type:'horizon', id:k }; });
  if (id === 'yourhz') return !S.loggedIn ? [] : MYHORIZONS.concat(Object.keys(HZFOLLOW).filter(function(k){ return HZFOLLOW[k]; })).filter(function(k){ return HORIZONS[k]; }).map(function(k){ return { type:'horizon', id:k }; });
  if (id === 'callouts'){
    var mine = S.loggedIn ? CALLOUTS.filter(function(c){ return c.hostId && PFOLLOW[c.hostId]; }) : [];
    return (mine.length ? mine.concat(CALLOUTS.filter(function(c){ return mine.indexOf(c) < 0; })) : CALLOUTS).map(function(c){ return { type:'callout', id:c.id }; });
  }
  if (id === 'people'){
    if (!S.loggedIn) return [];
    return ev(feedEvents().filter(upcoming).filter(function(e){ var hp = hostPersonOf(e); return hp && hp.id !== 'self' && PFOLLOW[hp.id]; }));
  }
  return [];
}
function shelfTitle(id){
  if (id === 'soon'){ var up = feedEvents().filter(upcoming).filter(function(e){ return dayDiff(e.date) <= 7; }); return up.length >= 4 ? 'Happening this week' : 'Coming up'; }
  return { announced:'Announced burns', horizons:'Horizons worth following', yourhz:'Your horizons',
           callouts: S.loggedIn && CALLOUTS.some(function(c){ return c.hostId && PFOLLOW[c.hostId]; }) ? 'Call outs from your crews' : 'Call outs',
           people:'From people you follow' }[id] || '';
}
var SHELVES = { all:['soon','announced','horizons','callouts','people'], events:['soon','announced','people'],
                horizons:['yourhz','horizons'], callouts:['callouts'] };
function greeting(){
  var hr = new Date().getHours();
  var g = hr < 5 ? 'Good night' : hr < 12 ? 'Good morning' : hr < 18 ? 'Good afternoon' : 'Good evening';
  return S.loggedIn ? g + ', ' + PEOPLE['self'].displayName.split(' ')[0] : g;
}
function shelvesHTML(){
  var f = S.shelfFilter || 'all', h = '<div class="shelves">';
  h += '<div class="greet"><h2>'+esc(greeting())+'</h2>' + (S.loggedIn ? '' : '<p>Burns, builds and the people who make them.</p>') + '</div>';
  h += '<div class="fchips" role="tablist">' + [['all','All'],['events','Events'],['horizons','Horizons'],['callouts','Call outs']].map(function(c){
    return '<button role="tab" class="fchip'+(f===c[0]?' on':'')+'" aria-selected="'+(f===c[0])+'" data-act="shelffilter" data-id="'+c[0]+'">'+c[1]+'</button>'; }).join('') + '</div>';
  if (f !== 'callouts'){
    var q = quickItems().filter(function(it){ return f === 'all' || (f === 'events' ? it.type === 'event' : it.type === 'horizon'); }).slice(0, 6);
    if (q.length) h += '<div class="qgrid">' + q.map(tileHTML).join('') + '</div>';
  }
  SHELVES[f].forEach(function(id){
    var items = shelfItems(id);
    if (!items.length) return;
    h += '<section class="shelf"><div class="shh"><h3>'+esc(shelfTitle(id))+'</h3>' +
         (items.length > 2 ? '<button class="showall" data-act="shelfall" data-id="'+id+'">Show all</button>' : '') + '</div>' +
         '<div class="srow" data-shelf="'+id+'">' + items.slice(0, 10).map(cardHTML).join('') + '</div></section>';
  });
  return h + '</div>';
}
function renderShelves(){
  var lb = $('listbody'), top = lb.scrollTop, left = {};
  lb.querySelectorAll('.srow').forEach(function(r){ left[r.getAttribute('data-shelf')] = r.scrollLeft; });
  lb.innerHTML = shelvesHTML();
  lb.querySelectorAll('.srow').forEach(function(r){ var v = left[r.getAttribute('data-shelf')]; if (v) r.scrollLeft = v; });
  lb.scrollTop = top;
  S.rows = [];
}
function isShelfFeed(){ return L.phone && S.folder.kind === 'home' && viewOf() === 'feed'; }

/* =========================================================================
   8. CALENDAR — a view of the destination you are in
   ========================================================================= */
function calEvents(){ return destEvents().filter(function(e){ return (S.calMine && S.loggedIn) ? !!RSVP[e.id] || MYEVENTS.indexOf(e.id) >= 0 : true; }); }
function eventsOn(iso){
  return calEvents().filter(function(e){
    var end = endOf(e);
    return e.date === iso || (end && e.date < iso && iso <= end);
  }).sort(function(a,b){ return a.title < b.title ? -1 : 1; });
}
function calBlock(e){
  var t = TH(e.id);
  return '<div class="calev" style="'+themeVars(t)+'" data-act="open-reset" data-type="event" data-id="'+e.id+'">' +
    '<span class="cg">'+t.square.glyph+'</span><span>'+esc(e.title)+'</span>' +
    (S.loggedIn && RSVP[e.id]==='going' ? '<span style="margin-left:auto">'+ic('check',12)+'</span>' : '') + '</div>';
}
function narrowCal(){ return L.phone || L.cw < 640; }
function monthGrid(anchorIso){
  var a = dOf(anchorIso), y = a.getFullYear(), m = a.getMonth();
  var first = new Date(y, m, 1, 18), start = new Date(first);
  start.setDate(1 - ((first.getDay() + 6) % 7));
  var narrow = narrowCal();
  var h = '<div class="calgrid"><div class="caldow">' + (narrow ? ['M','T','W','T','F','S','S'] : ['Mon','Tue','Wed','Thu','Fri','Sat','Sun']).map(function(d){ return '<div>'+d+'</div>'; }).join('') + '</div>';
  for (var w = 0; w < 6; w++){
    h += '<div class="calrow">';
    for (var d = 0; d < 7; d++){
      var day = new Date(start.getFullYear(), start.getMonth(), start.getDate() + w*7 + d, 18);
      var iso = isoOf(day), evs = eventsOn(iso);
      h += '<div class="calcell'+(day.getMonth()!==m?' oth':'')+(iso===TODAY_ISO?' today':'')+'">' +
           '<span class="dn">'+day.getDate()+'</span>' +
           (narrow ? '<div class="dots">' + evs.slice(0,3).map(function(e){ return '<i style="'+themeVars(TH(e.id))+'" data-act="open-reset" data-type="event" data-id="'+e.id+'"></i>'; }).join('') + '</div>'
                   : evs.map(calBlock).join('')) + '</div>';
    }
    h += '</div>';
  }
  if (narrow){
    var inMonth = calEvents().filter(function(e){ var dd = dOf(e.date); return dd.getMonth() === m && dd.getFullYear() === y; }).sort(byDate);
    h += '<div class="agenda">' + (inMonth.length ? '<div class="band">'+MONFULL[m]+' <span class="cnt">'+inMonth.length+'</span></div>' +
      inMonth.map(function(e){ return rowHTML({ type:'event', id:e.id }).replace('data-act="row"', 'data-act="open-reset"'); }).join('')
      : '<div class="empty">Nothing in '+MONFULL[m]+'.</div>') + '</div>';
  }
  return h + '</div>';
}
function weekGrid(anchorIso){
  var a = dOf(anchorIso), start = new Date(a.getFullYear(), a.getMonth(), a.getDate() - ((a.getDay()+6)%7), 18);
  var h = '<div class="calgrid" style="flex-direction:row">';
  for (var d = 0; d < 7; d++){
    var day = new Date(start.getFullYear(), start.getMonth(), start.getDate()+d, 18), iso = isoOf(day);
    h += '<div class="weekcol'+(iso===TODAY_ISO?' today':'')+'"><div class="wh">'+DAY[day.getDay()]+' '+day.getDate()+'</div>' +
         '<div class="wb">' + eventsOn(iso).map(calBlock).join('') + '</div></div>';
  }
  return h + '</div>';
}
function dayGrid(anchorIso){
  var evs = eventsOn(anchorIso), h = '<div class="calgrid">';
  if (!evs.length) h += '<div class="empty">Nothing on '+fmtDate(anchorIso)+'.</div>';
  for (var hr = 8; hr <= 23; hr++){
    h += '<div class="dayband"><div class="hr">'+('0'+hr).slice(-2)+':00</div><div class="slot">' + (hr === 18 ? evs.map(calBlock).join('') : '') + '</div></div>';
  }
  return h + '</div>';
}
function renderCalendar(){
  var mode = narrowCal() && S.calMode === 'week' ? 'month' : S.calMode;
  var a = dOf(S.calAnchor);
  var title = mode === 'month' ? MONFULL[a.getMonth()] + ' ' + a.getFullYear() : mode === 'week' ? 'Week of ' + fmtShort(S.calAnchor) : fmtDate(S.calAnchor);
  var modes = narrowCal() ? ['day','month'] : ['day','week','month'];
  var bar = '<div class="calbar"><span class="ttl">'+esc(title)+'</span>' +
    '<button class="ib" data-act="calnav" data-id="-1" aria-label="Previous">'+ic('back')+'</button>' +
    '<button class="btn" data-act="caltoday">Today</button>' +
    '<button class="ib" data-act="calnav" data-id="1" aria-label="Next" style="transform:scaleX(-1)">'+ic('back')+'</button>' +
    '<span class="spring"></span>' +
    '<span class="seg">' + modes.map(function(m){ return '<button class="'+(mode===m?'on':'')+'" data-act="calmode" data-id="'+m+'">'+m.toUpperCase()+'</button>'; }).join('') + '</span>' +
    (S.loggedIn ? '<label><input type="checkbox" data-act="calmine"'+(S.calMine?' checked':'')+'> Only mine</label>' : '') + '</div>';
  var body = mode === 'month' ? monthGrid(S.calAnchor) : mode === 'week' ? weekGrid(S.calAnchor) : dayGrid(S.calAnchor);
  $('calcol').innerHTML = bar + '<div class="panel" style="display:flex;flex-direction:column">' + body + '</div>';
}

/* =========================================================================
   9. THE RIGHT PANE — chats, and nothing else
   ========================================================================= */
function chatAv(c){
  if (c.kind === 'dm') return avHTML(c.memberIds[0], 'a40');
  return '<span class="av a40 gav" aria-hidden="true">'+esc(initials(c.name))+'</span>';
}
function lastMsg(c){ return c.messages[c.messages.length-1]; }
function msgPreview(m, c){
  if (!m) return 'No messages yet';
  var who = m.from === 'self' ? 'You: ' : (c.kind === 'group' && m.from !== 'sys' ? person(m.from).displayName.split(' ')[0] + ': ' : '');
  if (m.from === 'sys') return m.text;
  if (m.card) return who + 'shared ' + (EVENTS[m.card] ? EVENTS[m.card].title : 'an event');
  return who + m.text;
}
function unreadChats(){ return S.loggedIn ? Object.keys(UNREADCHAT).filter(function(k){ return UNREADCHAT[k]; }).length : 0; }
function chatListHTML(){
  return '<div class="phead"><div class="ptitle">Chats</div><button class="btn primary" data-act="newchat">'+ic('edit')+'New chat</button></div>' +
    '<div class="panel">' + CHATORDER.map(function(k){
      var c = CHATS[k], m = lastMsg(c), un = UNREADCHAT[k];
      return '<div class="chrow'+(un?' unread':'')+'" data-act="chatsel" data-id="'+k+'" role="button">' + chatAv(c) +
        '<div class="cmn"><div class="cnm">'+esc(c.name)+'</div><div class="cpv">'+esc(msgPreview(m, c))+'</div></div>' +
        '<div class="cside"><span class="ctime">'+esc(m ? m.t : '')+'</span>'+(un?'<span class="udot" aria-label="Unread"></span>':'')+'</div></div>';
    }).join('') + '</div>';
}
function convHTML(cid){
  var c = CHATS[cid];
  var sub = c.kind === 'dm' ? (PRESENCE[c.memberIds[0]] || 'offline') : (c.memberIds.length + 1) + ' members';
  var h = '<div class="phead"><button class="ib" data-act="chatback" aria-label="All chats">'+ic('back')+'</button>' +
    '<div class="ptitle">'+esc(c.name)+'<small>'+esc(sub)+'</small></div>' +
    (c.kind === 'group' ? '<span class="members">' + c.memberIds.slice(0,4).map(function(m){ return '<span data-act="open" data-type="person" data-id="'+m+'">'+avHTML(m,'a28')+'</span>'; }).join('') + '</span>'
                        : '<button class="ib" data-act="open" data-type="person" data-id="'+c.memberIds[0]+'" aria-label="Profile">'+ic('user')+'</button>') + '</div>';
  h += '<div class="conv"><div class="msgs" id="msgs">' + (c.messages.length ? c.messages.map(function(m){
    if (m.from === 'sys') return '<div class="msg sys">'+esc(m.text)+'</div>';
    var me = m.from === 'self';
    var head = '<div class="mfrom">'+(me ? '' : esc(person(m.from).displayName))+'<span class="mt">'+esc(m.t)+'</span></div>';
    if (m.card && EVENTS[m.card]){
      var e = EVENTS[m.card];
      return '<div class="msg'+(me?' me':'')+'">'+head+'<div class="evcard" data-act="open-reset" data-type="event" data-id="'+m.card+'">'+sqHTML(m.card,40)+
        '<div><div class="t">'+esc(e.title)+'</div><div class="m">'+fmtShort(e.date)+' · '+esc(whereOf(e))+'</div></div></div></div>';
    }
    return '<div class="msg'+(me?' me':'')+'">'+head+'<div class="mbody">'+esc(m.text)+'</div></div>';
  }).join('') : '<div class="msg sys">No messages yet</div>') + '</div>';
  h += '<div class="composer"><input type="text" id="chatbox" placeholder="Message '+esc(c.kind === 'dm' ? c.name.split(' ')[0] : c.name)+'" autocomplete="off" aria-label="Message">' +
       '<button class="btn primary" data-act="sendchat">Send</button></div></div>';
  return h;
}
function renderChats(){
  var el = $('chats');
  var visible = L.phone ? S.tab === 'chats' : L.right;
  if (!visible) return;
  var draft = $('chatbox') ? $('chatbox').value : '', focused = document.activeElement && document.activeElement.id === 'chatbox';
  if (!S.loggedIn){
    el.innerHTML = '<div class="phead"><div class="ptitle">Chats</div></div><div class="panel"><div class="empty">'+ic('chat',36).replace('class="ic"','class="ic" style="margin:0 auto 12px"')+
      'Log in to chat with your crews.<br><button class="btn primary" data-act="login">Log in</button></div></div>';
    return;
  }
  if (S.chatOpen && CHATS[S.chatOpen]){
    el.innerHTML = convHTML(S.chatOpen);
    var box = $('chatbox'); if (box){ box.value = draft; if (focused) box.focus(); }
    var ms = $('msgs'); if (ms) ms.scrollTop = ms.scrollHeight;
  } else el.innerHTML = chatListHTML();
}
</script>
<script>
/* =========================================================================
   10. CHROME — toolbar, header, navigation, phone shell
   ========================================================================= */
function navRow(f, icon, label, opts){
  opts = opts || {};
  var sel = !opts.person && sameFolder(S.folder, f) && !(L.phone && S.folder.kind === 'you');

  try {
    var mine = {};
    MYHORIZONS.forEach(function(k){ if (HORIZONS[k]) mine[k] = HORIZONS[k]; });
    var evs = {}, recs = {}, themes = {};
    MYEVENTS.filter(function(x){ return /^evt-new-/.test(x); }).forEach(function(k){ evs[k] = EVENTS[k]; recs[k] = REC[k]; themes[k] = window.HYPERNET_THEMES.themes[k]; });
    var covers = {}; MYHORIZONS.forEach(function(k){ if (HZCOVER[k]) covers[k] = HZCOVER[k]; });
    var me = PEOPLE['self'];
    localStorage.setItem(STORE, JSON.stringify({
      account:{ loggedIn:S.loggedIn, hasAccount:S.hasAccount, name:me.displayName, handle:me.handle, bio:me.bio, skills:me.skills, cities:me.cities, city:me.city },
      horizons:mine, order:MYHORIZONS, created:CREATEDHZ, covers:covers, events:evs, recs:recs, themes:themes,
      rsvp:RSVP, went:WENT, promoted:PROMOTED, hzfollow:HZFOLLOW, pfollow:PFOLLOW
    }));
  } catch(e){}
}
function restore(){
  var d; try { d = JSON.parse(localStorage.getItem(STORE) || 'null'); } catch(e){ d = null; }
  if (!d) return;
  var a = d.account || {}, me = PEOPLE['self'];
  ['name','handle','bio','skills','cities','city'].forEach(function(k){ if (a[k] != null) me[k === 'name' ? 'displayName' : k] = a[k]; });
  S.hasAccount = !!a.hasAccount;
  Object.keys(d.events || {}).forEach(function(k){ EVENTS[k] = d.events[k]; if (d.recs && d.recs[k]) REC[k] = d.recs[k];
    if (d.themes && d.themes[k]) window.HYPERNET_THEMES.themes[k] = d.themes[k]; if (MYEVENTS.indexOf(k) < 0) MYEVENTS.push(k); READ[k] = true; PROMOCOUNT[k] = 0; });
  Object.keys(d.horizons || {}).forEach(function(k){ HORIZONS[k] = d.horizons[k]; if (HZCOUNT[k] == null) HZCOUNT[k] = 0; });
  if (d.order) MYHORIZONS = d.order.filter(function(k){ return HORIZONS[k]; });
  CREATEDHZ = d.created || [];
  Object.keys(d.covers || {}).forEach(function(k){ HZCOVER[k] = d.covers[k]; });
  ['rsvp','went','promoted','hzfollow','pfollow'].forEach(function(k){
    var tgt = { rsvp:RSVP, went:WENT, promoted:PROMOTED, hzfollow:HZFOLLOW, pfollow:PFOLLOW }[k];
    Object.keys(d[k] || {}).forEach(function(x){ tgt[x] = d[k][x]; });
  });
  if (a.loggedIn){ S.loggedIn = true; S.me = { name:me.displayName, handle:me.handle }; }
}
var RZ = null;
window.addEventListener('resize', function(){ clearTimeout(RZ); RZ = setTimeout(render, 60); });
(function boot(){
  restore();
  if (window.innerWidth >= 1120) S.leftOpen = true;
  render();
  loadRealEvents();
})();
</script>
