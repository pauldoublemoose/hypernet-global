function wizAct(which){
  if (which === 'back'){ DRAFT.step = Math.max(1, DRAFT.step-1); paintWiz(); return; }
  if (which === 'next'){ DRAFT.step = Math.min(3, DRAFT.step+1); paintWiz(); return; }
  var t = draftTheme(DRAFT);
  if (DRAFT.editing){
    window.HYPERNET_THEMES.themes[DRAFT.editing] = t;
    closeDialogs(); render();
    toast('Theme applied', ' ' + EVENTS[DRAFT.editing].title + ' now looks like itself.');
    return;
  }
  var id = 'evt-new-' + (MYEVENTS.length + 1);
  EVENTS[id] = { id:id, title:DRAFT.title || 'Untitled event', date:DRAFT.date, description:DRAFT.desc,
                 hostName:'You', privacy:DRAFT.privacy, ownerIds:['self'], kind:'own', city:DRAFT.city };
  window.HYPERNET_THEMES.themes[id] = t;
  MYEVENTS.push(id);
  PROMOCOUNT[id] = 0; READ[id] = true;
  HORIZONS['horizon-default'].eventIds.push(id);

/* a person opens as a proper contact-card window: own title bar, draggable, closable */
var CARDWIN = null;
function personWindow(id){
  var isGroup = !!GROUPS[id];

  d.style.left = Math.max(8, window.innerWidth - 430) + 'px';
  d.style.top = '96px';
  d.innerHTML = '<div class="dbar"><span>&#128100;</span><span>'+esc(title)+'</span><span class="spring"></span>' +
    '<span class="wbtn" data-act="closecard">&#10005;</span></div>' +
    '<div class="dbody" id="cardbody" style="max-height:62vh;overflow:auto">' +
    (isGroup ? cardGroupHTML(id) : cardBodyHTML(id)) + '</div>' +
    '<div class="dfoot"><button class="btn" data-act="closecard">Close</button></div>';
  document.body.appendChild(d);

  var bar = d.querySelector('.dbar');

    function mv(e2){ d.style.left = (ox + e2.clientX - sx)+'px'; d.style.top = Math.max(0, oy + e2.clientY - sy)+'px'; }

    document.addEventListener('mousemove', mv); document.addEventListener('mouseup', up);
  });

}
function closeCard(){ if (CARDWIN){ CARDWIN.remove(); CARDWIN = null; } }
function repaintCard(){

var setRSVP = gated(function(evId, mode){

var doPromote = gated(function(evId){

function doSearch(){

/* opening is type-determined: an event takes over its own window,
   a person pops its contact card, a horizon opens as a folder */
function openItemWin(){
  if (!S.sel) return;
  if (S.sel.type === 'person' || S.sel.type === 'group'){ personWindow(S.sel.id); return; }
  if (S.sel.type === 'horizon'){ openHorizonCenter(S.sel.id); return; }
  if (S.sel.type !== 'event') return;
  markRead(S.sel.id);
  S.itemOpen = true; render();

function stepItem(delta){
  var list = isCal()
    ? calEvents().slice().sort(byDate).map(function(e){ return { type:'event', id:e.id }; })
    : (S.rows.length ? S.rows : orderedItems());
  if (!list.length) return;
  var i = -1;
  if (S.sel) list.forEach(function(it, k){ if (it.type === S.sel.type && it.id === S.sel.id) i = k; });
  var n = i < 0 ? (delta > 0 ? 0 : list.length-1) : Math.max(0, Math.min(list.length-1, i + delta));
  var it = list[n];
  S.sel = it;
  if (it.type === 'event'){ markRead(it.id); if (isCal()) S.calAnchor = EVENTS[it.id].date; }
  render();
  var el = document.querySelector('.erow.sel');
  if (el && el.scrollIntoView) el.scrollIntoView({ block:'nearest' });

function runCmd(cmd, arg){
  switch (cmd){
    case 'new-event':    closePopup(); (S.loggedIn ? newEventDialog : loginDialog)(); break;
    case 'new-horizon':  closePopup(); (S.loggedIn ? newHorizonDialog : loginDialog)(); break;
    case 'new-chat':     closePopup(); (S.loggedIn ? newChatDialog : loginDialog)(); break;
    case 'new-callout':  closePopup(); (S.loggedIn ? newCalloutDialog : loginDialog)(); break;
    case 'open':         closePopup(); openItemWin(); break;
    case 'fileinto':     closePopup(); if (S.sel && S.sel.type==='event'){ S.loggedIn ? fileIntoDialog(S.sel.id) : loginDialog(); } break;
    case 'login':        closePopup(); loginDialog(); break;
    case 'logout':       doLogout(); break;
    case 'about':        closePopup(); aboutDialog(); break;
    case 'mycard':       closePopup(); personWindow('self'); break;
    case 'mark-read':    if (S.sel) READ[S.sel.id] = true; closePopup(); render(); break;
    case 'mark-unread':  if (S.sel) delete READ[S.sel.id]; closePopup(); render(); break;
    case 'mark-all':     folderItems().forEach(function(it){ if (it.type==='event') READ[it.id] = true; }); closePopup(); render(); break;
    case 'focus-find':   closePopup(); $('searchbox').focus(); $('searchbox').select(); break;
    case 'clearsearch':  closePopup(); $('searchbox').value=''; S.query=''; if (S.folder.kind==='search') goFolder({kind:'home',id:null}); render(); break;
    case 'preview':      S.preview = arg; closePopup(); render(); break;
    case 'toggle-left':  S.leftOpen = !S.leftOpen; closePopup(); render(); break;
    case 'toggle-right': S.rightOpen = !S.rightOpen; closePopup(); render(); break;
    case 'setview':      setView(arg); closePopup(); render(); break;
    case 'sort':         setSort(arg); closePopup(); break;
    case 'expand-all':   S.collapsed = {}; closePopup(); render(); break;
    case 'collapse-all': sortItems(folderItems()).forEach(function(it){ S.collapsed[bandOf(it)] = true; }); closePopup(); render(); break;
    case 'folder':       closePopup(); goFolder({ kind:arg, id:null }); render(); break;
    case 'back':         closePopup(); if (S.hi > 0){ S.hi--; S.folder = S.hist[S.hi]; S.sel = firstSelectable(); render(); } break;
    case 'fwd':          closePopup(); if (S.hi < S.hist.length-1){ S.hi++; S.folder = S.hist[S.hi]; S.sel = firstSelectable(); render(); } break;
    case 'customize':    closePopup(); if (S.sel && S.sel.type==='event'){ S.loggedIn ? customizeDialog(S.sel.id) : loginDialog(); } break;
    case 'followhz':     closePopup(); if (arg) followHz(arg); break;
  }
}
function setSort(key){
  if (S.sort.key === key) S.sort.dir = -S.sort.dir;
  else { S.sort.key = key; S.sort.dir = 1; }
  render();
}

document.addEventListener('click', function(ev){

    runCmd(pop.getAttribute('data-pop'), pop.getAttribute('data-arg'));
    return;
  }
  var mi = ev.target.closest('#menubar .mi[data-menu]');
  if (mi){ openMenu(mi.getAttribute('data-menu'), mi); return; }

  var n = ev.target.closest('[data-act]');
  if (!n){ closePopup(); return; }
  var act = n.getAttribute('data-act'), id = n.getAttribute('data-id');
  if (act !== 'newmenu' && act !== 'authmenu') closePopup();

  switch (act){
    case 'newmenu': {
      var r = n.getBoundingClientRect();
      popup(r.left, r.bottom, [
        { label:'Event…', cmd:'new-event' },
        { label:'Event Horizon…', cmd:'new-horizon' },
        { label:'Group chat…', cmd:'new-chat' },
        { label:'Call out…', cmd:'new-callout' }
      ]);
      break;
    }
    case 'authmenu': {
      var r2 = n.getBoundingClientRect();

      break;
    }

    case 'openfolder': {
      goFolder({ kind:'horizon', id:id });
      var f0 = orderedItems().filter(function(x){ return x.type === 'event'; })[0];
      if (f0) S.sel = f0;
      render();
      break;
    }
    case 'setview':     setView(id); render(); break;
    case 'card':        personWindow(id); break;
    case 'closecard':   closeCard(); break;
    case 'show-left':   S.leftOpen = true; render(); break;
    case 'show-right':  S.rightOpen = true; render(); break;
    case 'renamehz':    if (S.loggedIn) renameHzDialog(id); else loginDialog(); break;
    case 'dorename':    renameHz(id); break;
    case 'publishhz':   publishHz(id); break;
    case 'coverhz':     if (S.loggedIn) coverHzDialog(id); else loginDialog(); break;

    case 'row':         selectItem(n.getAttribute('data-rtype'), id, true); break;
    case 'sort':        setSort(id); break;
    case 'band':        S.collapsed[id] = !S.collapsed[id]; render(); break;
    case 'fgroup':      S.fcollapsed[id] = !S.fcollapsed[id]; render(); break;
    case 'v-interested': if (S.sel || id) setRSVP(id || S.sel.id, 'interested'); break;
    case 'v-going':      if (S.sel || id) setRSVP(id || S.sel.id, 'going'); break;
    case 'v-promote':    if (S.sel || id) doPromote(id || S.sel.id); break;
    case 'fileinto':     if (S.loggedIn){ if (id || (S.sel && S.sel.type==='event')) fileIntoDialog(id || S.sel.id); } else loginDialog(); break;
    case 'dofile':       addToHorizon(id, n.getAttribute('data-hz')); break;
    case 'discuss':      if (id || (S.sel && S.sel.type==='event')) discuss(id || S.sel.id); break;
    case 'customize':    if (S.loggedIn) customizeDialog(id || S.sel.id); else loginDialog(); break;
    case 'nav-person':   openPerson(id); break;
    case 'nav-group':    openGroup(id); break;
    case 'nav-horizon':  openHorizonCenter(id); break;
    case 'followhz':     followHz(id); break;
    case 'followp':      followP(id); break;
    case 'dm':
      if (!S.loggedIn){ loginDialog(); break; }
      openDM(id); S.rightOpen = true; UNREADCHAT[S.activeChat] = false; render();
      toast('Chat open', ' ' + person(id).displayName + ' — in the right-hand rail.');

    case 'answercallout': answerCallout(id || (S.sel && S.sel.id)); break;
    case 'wiz':         wizAct(id); break;
    case 'calmode':     S.calMode = id; render(); break;
    case 'caltoday':    S.calAnchor = TODAY_ISO; render(); break;
    case 'calnav': {
      var a = dOf(S.calAnchor), step = +id;

document.addEventListener('dragend', function(){
  DRAGID = null;
  document.querySelectorAll('.drag').forEach(function(n){ n.classList.remove('drag'); });
  document.querySelectorAll('.fold.drop').forEach(function(n){ n.classList.remove('drop'); });
});
document.addEventListener('dragover', function(ev){
  var f = ev.target.closest('.fold[data-drop]');
  if (f && DRAGID){ ev.preventDefault(); ev.dataTransfer.dropEffect = 'copy'; f.classList.add('drop'); }
});
document.addEventListener('dragleave', function(ev){
  var f = ev.target.closest('.fold[data-drop]');
  if (f) f.classList.remove('drop');
});
document.addEventListener('drop', function(ev){
  var f = ev.target.closest('.fold[data-drop]');
  if (f && DRAGID){
    ev.preventDefault();
    addToHorizon(DRAGID, f.getAttribute('data-drop'));
    f.classList.remove('drop');
    DRAGID = null;
  }
});

/* ---------- keyboard ---------- */
document.addEventListener('keydown', function(ev){
  var inField = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName);

  if (ev.key === 'Escape'){
    if (DLGS.length){ closeDialogs(); return; }
    if (POP){ closePopup(); return; }
    if (CARDWIN){ closeCard(); return; }
    if (S.itemOpen){ S.itemOpen = false; render(); return; }
    if (document.activeElement === $('searchbox')){ $('searchbox').blur(); return; }
    return;
  }
  if (inField){
    if (ev.key === 'Enter' && document.activeElement === $('searchbox')){ doSearch(); $('searchbox').blur(); ev.preventDefault(); }
    if (ev.key === 'Enter' && document.activeElement === $('chatbox')){ sendChat(); ev.preventDefault(); }
    if (ev.key === 'Enter' && DLGS.length && $('lg-name')){ doLogin(); ev.preventDefault(); }
    return;
  }
  if (DLGS.length) return;

  if (ev.key === '/'){ ev.preventDefault(); $('searchbox').focus(); $('searchbox').select(); return; }
  if (ev.key === 'ArrowDown'){ ev.preventDefault(); stepItem(1); if (S.itemOpen) renderItemWin(); return; }
  if (ev.key === 'ArrowUp'){ ev.preventDefault(); stepItem(-1); if (S.itemOpen) renderItemWin(); return; }
  if (ev.key === 'Enter'){ ev.preventDefault(); openItemWin(); return; }
  if (ev.key === 'Home'){ ev.preventDefault(); if (S.rows.length) selectItem(S.rows[0].type, S.rows[0].id, true); return; }
  if (ev.key === 'End'){ ev.preventDefault(); if (S.rows.length){ var l = S.rows[S.rows.length-1]; selectItem(l.type, l.id, true); } return; }
});

/* =========================================================================
   15. RENDER + BOOT
   ========================================================================= */
function render(){
  renderChrome();
  renderFolders();
  if (!isCal()){ renderList(); renderReading(); }
  else renderCalendar();
  renderContacts();
  renderItemWin();
}
window.addEventListener('resize', function(){ render(); });
(function boot(){
  var first = firstSelectable();
  if (first) S.sel = first;          /* selected, but deliberately still undiscovered */
  render();
  status('Home feed — a mix of events, horizons, call outs and network news. Bold means undiscovered.');
})();
</script>
