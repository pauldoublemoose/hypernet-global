<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#3a3a3a">
<title>Hypernet</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23d4d0c8'/%3E%3Cpath d='M16 4 28 16 16 28 4 16z' fill='%23141414'/%3E%3C/svg%3E">
<style>
/* =======================================================================
   HYPERNET — HOME FEED
   A Windows 2000 / Outlook frame, in greys only, so the events — and only
   the events — carry colour. Retro surface, modern hierarchy:
   one primary action per view, one type scale, one control height.
   The rhythm (2026-10-04, "document window"): one font (Tahoma) at three
   sizes, 12 / 14 / 20, on lines of 16 (UI), 20 (prose), 24 (titles);
   spacing 8 / 16 / 24 (4 only between buttons in a group); 32 for a person
   doing something, 48 for a thing; controls 36, 44 on touch.
   ======================================================================= */

/* ---------- 1. tokens ------------------------------------------------ */
:root{
  --face:#d4d0c8; --face-lt:#e8e5df; --face-dk:#c2beb5;
  --white:#fff; --shadow:#808080; --dark:#404040;
  --ink:#141414; --ink2:#3a3a3a; --dim:#666; --line:#e2dfd8; --hover:#f0eee9; --rule:#c9c5bc; --gb:#bdb9b0;
  --sel:#262626; --seldim:#c8c8c8;
  --bar:linear-gradient(90deg,#262626 0%,#555 58%,#9b9b9b 100%);
  --sys:Tahoma,"Segoe UI",Verdana,Geneva,sans-serif;
  --mono:var(--sys);     /* one font: what used to be monospaced is Tahoma too */
  --fs-xs:12px; --fs-s:12px; --fs:14px; --fs-m:14px; --fs-l:20px; --fs-xl:20px;
  --ctl:36px;     /* every button, field and toggle */
  --act:36px;     /* the event verbs: the same */
  --nav-w:252px; --chat-w:344px;
  /* the centre's containers (2026-10-04): the white spans the centre, what it holds is only as wide as the view needs —
     640 to read (Home), 720 to scan rows (every list), 1120 to browse squares or a month (Explore's overview, the calendar).
     The numbers live in CW (the layout engine), which sets --pl / --pr: the container's insets from the centre's edges */
  --pl:0px; --pr:0px; --sbw:0px;
  --out: inset -1px -1px 0 var(--dark), inset 1px 1px 0 var(--white), inset -2px -2px 0 var(--shadow), inset 2px 2px 0 var(--face-lt);
  --in:  inset 1px 1px 0 var(--shadow), inset -1px -1px 0 var(--white), inset 2px 2px 0 var(--dark), inset -2px -2px 0 var(--face);
  --thin: inset 1px 1px 0 var(--shadow), inset -1px -1px 0 var(--white);
}
@media (pointer:coarse){ :root{ --ctl:44px; --act:44px; } }
*{ box-sizing:border-box; }
html,body{ height:100%; }
body{ margin:0; overflow:hidden; background:var(--face); color:var(--ink);
  font:14px/20px var(--sys); -webkit-font-smoothing:antialiased; -webkit-tap-highlight-color:transparent; }
button,input,select,textarea{ font:inherit; color:inherit; }
button{ cursor:pointer; }
[data-act]{ cursor:pointer; }
a{ color:inherit; }
.ic{ flex:0 0 auto; display:block; }
[hidden]{ display:none !important; }
.sr{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); }

/* ---------- 2. controls ---------------------------------------------- */
.btn{ height:var(--ctl); min-width:var(--ctl); padding:0 14px; display:inline-flex; align-items:center; justify-content:center;
  gap:7px; border:0; background:var(--face); color:var(--ink); white-space:nowrap; font-size:var(--fs); box-shadow:var(--out); }
.btn:active, .btn.on{ box-shadow:var(--in); background:var(--face-lt); }
.btn.on{ font-weight:bold; }
.btn.primary{ font-weight:bold; box-shadow:0 0 0 1px #000, var(--out); }
.btn.primary:active{ box-shadow:0 0 0 1px #000, var(--in); }
.btn:focus-visible, .ib:focus-visible, .seg button:focus-visible{ outline:1px dotted #000; outline-offset:-6px; }
.btn[disabled], .btn[aria-disabled="true"]{ color:#8a8a8a; text-shadow:1px 1px 0 #fff; cursor:default; }
.btn .ic{ margin-left:-2px; }
.btn .caret{ margin-right:-4px; }
.ib{ width:var(--ctl); height:var(--ctl); display:inline-grid; place-items:center; border:0; padding:0; background:var(--face); box-shadow:var(--out); color:var(--ink); }
.ib:active{ box-shadow:var(--in); }
.ib.on{ background:var(--sel); color:#fff; box-shadow:inset 1px 1px 0 #000, inset -1px -1px 0 #777; }
.ib.on .fillable{ fill:currentColor; }
.badge-n{ min-width:20px; height:20px; padding:0 6px; display:inline-grid; place-items:center; background:#000; color:#fff;
  font:bold 12px var(--sys); border-radius:10px; }
input[type=text], input[type=search], input[type=date], select, textarea{
  height:var(--ctl); padding:0 10px; border:0; border-radius:0; background:#fff; box-shadow:var(--in); font-size:var(--fs); min-width:0; }
textarea{ height:auto; padding:8px 10px; resize:vertical; line-height:1.45; }
input:focus, select:focus, textarea:focus{ outline:1px dotted #000; outline-offset:-5px; }
input[type=checkbox]{ width:18px; height:18px; margin:0; accent-color:#262626; }
.seg{ display:inline-flex; }
.seg button{ height:var(--ctl); padding:0 16px; border:0; background:var(--face); font:bold 12px var(--sys);
  color:var(--ink2); box-shadow:var(--out); }
.seg button.on{ background:#fff; color:#000; box-shadow:var(--in); }

/* ---------- 3. frame ------------------------------------------------- */
#app{ position:fixed; inset:0; display:flex; flex-direction:column; }
#titlebar{ flex:0 0 32px; display:flex; align-items:center; gap:8px; padding:0 8px; color:#fff; background:var(--bar); font-size:12px; }
#titlebar .tglyph{ width:18px; height:18px; display:grid; place-items:center; background:var(--face); color:#000; font-size:12px;
  box-shadow:inset -1px -1px 0 var(--dark), inset 1px 1px 0 var(--white); }
#titlebar #wintitle{ opacity:.8; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
#toolbar{ flex:0 0 auto; display:flex; align-items:center; gap:8px; padding:8px; border-bottom:1px solid var(--shadow); box-shadow:0 1px 0 var(--white); }
#toolbar .spring{ flex:1; }
.tsep:has(+ #acct:empty){ display:none; }
.tsep{ width:2px; align-self:stretch; margin:3px 0; box-shadow:inset 1px 0 0 var(--shadow), inset -1px 0 0 var(--white); }
.searchbox{ flex:0 1 460px; min-width:160px; height:var(--ctl); display:flex; align-items:center; gap:8px; padding:0 10px; background:#fff; box-shadow:var(--in); color:var(--dim); }
.searchbox input{ flex:1; min-width:0; height:100%; padding:0; border:0; box-shadow:none; background:transparent; color:var(--ink); }
.searchbox input:focus{ outline:0; }
.searchbox:focus-within{ outline:1px dotted #000; outline-offset:-5px; }
.acct .av{ width:24px; height:24px; flex-basis:24px; font-size:10px; }

#main{ flex:1; min-height:0; display:flex; gap:8px; padding:8px; }
.pane{ display:flex; flex-direction:column; min-height:0; min-width:0; }
#nav{ flex:0 0 var(--nav-w); display:none; }
#chats{ flex:0 0 var(--chat-w); display:none; }
#app.l-open #nav, #app.r-open #chats{ display:flex; }
#app.dock-narrow #chats{ flex-basis:300px; }
#main{ position:relative; }
#app.dock-over #chats{ position:absolute; top:8px; right:8px; bottom:8px; z-index:20; width:min(344px, calc(100% - var(--nav-w) - 40px));
  background:var(--face); padding:0 0 0 6px; box-shadow:-3px 0 0 var(--face), -4px 0 0 var(--shadow), -8px 0 16px rgba(0,0,0,.18); }
#center{ flex:1 1 auto; }
.panel{ flex:1; min-height:0; overflow:auto; background:#fff; box-shadow:var(--in); overscroll-behavior:contain; }
@media (pointer:fine){
  .panel::-webkit-scrollbar{ width:16px; height:16px; }
  .panel::-webkit-scrollbar-track{ background:repeating-conic-gradient(#fff 0 25%, #d4d0c8 0 50%) 0 0/2px 2px; }
  .panel::-webkit-scrollbar-thumb{ background:var(--face); box-shadow:var(--out); }
}
#appbar, #tabbar{ display:none; }
/* logged out, the whole app is a preview: a bar across the bottom says so and offers the way in (Spotify's pattern).
   It is a row of the app's own column, so it takes its space instead of covering anything. */
#previewbar{ display:none; flex:0 0 auto; align-items:center; gap:16px; padding:8px 12px 8px 16px; color:#fff;
  background:linear-gradient(90deg,#1c1c1c 0%,#3a3a3a 60%,#5a5a5a 100%); box-shadow:inset 0 1px 0 #7a7a7a; }
#app.preview #previewbar{ display:flex; }
#previewbar .pvt{ flex:1; min-width:0; }
#previewbar .pvk{ font:bold 12px var(--sys); color:#cfcfcf; }
#previewbar .pvl{ margin-top:2px; font-size:var(--fs); line-height:1.3; }
#previewbar .pva{ flex:0 0 auto; display:flex; gap:8px; }
#previewbar .btn{ color:#000; }
#app.phone #previewbar{ gap:10px; padding:8px 8px 8px 12px; }
#app.phone #previewbar .pvl{ font-size:12px; display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; }
#app.phone #previewbar .pva{ flex-direction:column; gap:4px; }
#app.phone #previewbar .pva .btn{ height:36px; min-height:36px; padding:0 12px; }
#app.phone #previewbar .pva .btn.pvlogin{ height:auto; min-height:0; padding:4px 12px; background:transparent; box-shadow:none; color:#fff; text-decoration:underline; font-size:12px; }

/* ---------- 4. left: navigation -------------------------------------- */
#navbody{ padding:8px 0 16px; }
.navh{ padding:16px 16px 8px; font:bold 12px/16px var(--sys); color:var(--dim); }
.nrow{ display:flex; align-items:center; gap:8px; min-height:32px; margin:0 4px; padding:0 8px 0 12px; white-space:nowrap; color:var(--ink); }
.nrow .ic{ color:var(--ink2); }
.nrow .nlab{ flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; }
.nrow .nsub{ color:var(--dim); font-size:12px; }
.nrow .ncnt{ font:12px var(--sys); color:var(--dim); }
.nrow:hover{ background:var(--hover); }
.nrow.sel{ background:var(--sel); color:#fff; }
.nrow.open{ background:var(--face-lt); box-shadow:inset 3px 0 0 var(--ink); font-weight:bold; }
.nrow.sel .ic, .nrow.sel .ncnt, .nrow.sel .nsub{ color:var(--seldim); }
.nrow.search{ cursor:default; padding-right:4px; margin-bottom:8px; }
.nrow .nx{ width:36px; height:32px; display:grid; place-items:center; border:0; padding:0; background:transparent; color:#fff; }
.nrow .nx:hover{ background:#444; }
.nrow.drop{ outline:2px dashed #000; outline-offset:-2px; background:#f4f2ec; }
.nrow .sq, .nrow .av{ width:20px; height:20px; flex-basis:20px; font-size:9px; }
.nrow .sq{ font-size:12px; }
.acctcard{ display:none; }

/* ---------- 5. centre: the white spans it, the view's container sits in it, the window beside it ---------- */
#chead{ flex:0 0 auto; display:flex; align-items:center; gap:8px; padding:0 4px 8px; min-height:56px; flex-wrap:wrap; }
#chead .ct{ flex:1 1 220px; min-width:0; }
#chead h2{ margin:0; font-size:20px; line-height:24px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
#chead .csub{ color:var(--dim); font-size:12px; line-height:16px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
#chead .ctools{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
.sortsel{ display:flex; align-items:center; gap:8px; font-size:12px; color:var(--dim); }
.sortsel select{ height:var(--ctl); }
#cbody{ flex:1; min-height:0; display:flex; }
#listcol, #calcol{ flex:1; min-width:0; min-height:0; flex-direction:column; }
#listcol{ display:flex; }
/* container queries measure what the list actually has: the container inside the white, not the white */
#listbody{ container:list / inline-size; }
#calcol{ display:none; }
#app.v-cal #listcol{ display:none; }
#app.v-cal #calcol{ display:flex; }
/* desktop and tablet: the white panel takes everything between the sidebar and the chat dock; the view's container sits
   in it (centred, or stepped left beside an open window), and the heading, its tools, the calendar's bar and every band,
   row and square keep to the same two edges — 16 inside the container, the rows' own gutter */
#app.desk #chead, #app.desk .calbar{ padding-left:calc(var(--pl) + 16px); padding-right:calc(max(var(--pr), var(--sbw)) + 16px); }
#app.desk #listbody{ scrollbar-gutter:stable; padding:16px max(0px, calc(var(--pr) - var(--sbw))) 0 var(--pl); }
#app.desk .shelves > .shelf:first-child{ margin-top:8px; }
#app.desk .calpanel{ padding:16px calc(var(--pr) + 16px) 16px calc(var(--pl) + 16px); }
.calpanel{ display:flex; flex-direction:column; container:cal / inline-size; }
/* the window: a Windows 2000 frame beside the list (over the centre where there is no room), dragged by its title bar */
#win{ position:absolute; z-index:30; display:flex; flex-direction:column; min-width:0; padding:4px; background:var(--face);
  box-shadow:var(--out), 0 0 0 1px #000, 6px 6px 0 rgba(0,0,0,.2); }
#win[hidden]{ display:none; }
#app.dock-front #chats{ z-index:35; }
#win > .dbar{ flex:0 0 24px; gap:4px; padding:0 2px 0 4px; font-size:12px; cursor:move; touch-action:none; }
#win.max > .dbar{ cursor:default; }
#win > .dbar .dtitle{ flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
#win > .dbar .x{ width:20px; height:18px; flex:0 0 auto; }
#win > .dbar .x:active{ box-shadow:var(--in); }
#win > .dbar .wmax + .wclose{ margin-left:2px; }
#win > .dbar .wback{ margin-right:2px; }
.wicon{ flex:0 0 16px; height:16px; display:grid; place-items:center; overflow:hidden; }
.wicon .sq, .wicon .av{ width:16px; height:16px; flex-basis:16px; font-size:10px; }
.wicon .wglyph{ width:16px; height:16px; display:grid; place-items:center; background:var(--face); color:#000; }
#win > #dscroll{ flex:1; min-height:0; margin-top:4px; container:detail / inline-size; }
#win.dragging{ user-select:none; }
#win.dragging #dscroll{ pointer-events:none; }
#dscroll{ position:relative; }
.panempty{ display:none; }

/* rows */
/* a band is Outlook's "group by" bar: grey, one line, the group's name and how many */
.band{ position:sticky; top:0; z-index:6; display:flex; align-items:center; gap:8px; min-height:32px; padding:0 16px; background:var(--face-lt);
  border-top:1px solid #fff; border-bottom:1px solid var(--rule); font:bold 12px/16px var(--sys); color:var(--ink); }
.band .cnt{ color:var(--dim); font-weight:normal; }
/* a thing in a list: its square (48), title over its facts, its date and states at the right */
.row{ display:flex; align-items:center; gap:8px; min-height:64px; padding:8px 16px; border-bottom:1px solid var(--line); }
.row:hover{ background:var(--hover); }
.row.sel{ background:var(--sel); color:#fff; }
.row.static{ cursor:default; }
.row.static:hover{ background:transparent; }
.r-main{ flex:1; min-width:0; }
.r-title{ font-size:14px; line-height:16px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
/* bold for unread only where reading is tracked: a desktop with an account */
#app.readmarks .row.unread .r-title{ font-weight:bold; }
.row.past .r-title{ color:#6f6f6f; }
.row.sel.past .r-title{ color:#ddd; }
.r-meta{ font-size:12px; line-height:16px; color:var(--dim); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.row.sel .r-meta{ color:var(--seldim); }
.r-side{ flex:0 0 auto; display:flex; flex-direction:column; align-items:flex-end; gap:4px; }
.r-date{ font:12px/16px var(--sys); color:var(--ink2); white-space:nowrap; }
.row.sel .r-date{ color:#fff; }
.r-states{ display:flex; gap:4px; }
.r-ic{ width:48px; height:48px; flex:0 0 48px; display:grid; place-items:center; background:var(--face); box-shadow:var(--out); color:var(--ink2); }
.row.sel .r-ic{ background:#444; color:#fff; box-shadow:none; }
.pill{ display:inline-flex; align-items:center; gap:4px; height:20px; padding:0 4px; font:bold 12px/16px var(--sys);
 border:1px solid var(--ink); color:var(--ink); background:#fff; white-space:nowrap; }
.pill .ic{ width:11px; height:11px; }
.pill.going{ background:var(--ink); color:#fff; }
.pill.host{ background:var(--face); }
.pill.dim{ border-color:#aaa; color:var(--dim); }
.row.sel .pill{ border-color:#fff; background:transparent; color:#fff; }
.row.sel .pill.going{ background:#fff; color:var(--sel); }
.empty{ padding:40px 24px; color:var(--dim); text-align:center; font-size:14px; }
.empty .btn{ margin-top:16px; }
@container list (max-width:300px){ .r-states .pill span{ display:none; } }
.r-dm{ display:none; }
/* a narrow list gives the title the width: it may take two lines, and the date moves under it */
@container list (max-width:440px){
  .r-title{ white-space:normal; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; }
  .r-side .r-date{ display:none; }
  .r-dm{ display:inline; font:12px var(--sys); color:var(--ink2); }
  .row.sel .r-dm{ color:#fff; }
}

/* ---------- 6. looks — the only colour in the product: three colours and a square ---------- */
.sq{ position:relative; overflow:hidden; display:grid; place-items:center; flex:0 0 auto; background:var(--ebg); color:var(--eac); line-height:1; }
.sq .g{ position:relative; }
.sq img, .av.img img{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; display:block; }
.sq.plain:not(.img){ box-shadow:inset 0 0 0 1px rgba(0,0,0,.3); }
.sq.s20{ width:20px; height:20px; font-size:12px; }
.sq.s40{ width:40px; height:40px; font-size:22px; }
.sq.s64{ width:64px; height:64px; font-size:34px; }
.sq.s160{ width:160px; height:160px; font-size:86px; }
.sq.s180{ width:180px; height:180px; font-size:96px; }
.sq.s56{ width:56px; height:56px; font-size:30px; }
.sq.s32{ width:32px; height:32px; font-size:18px; }
.sq.s16{ width:16px; height:16px; font-size:10px; }
.sq.s48{ width:48px; height:48px; font-size:26px; }
.sq.s96{ width:96px; height:96px; font-size:52px; }
.row.sel .sq{ box-shadow:0 0 0 2px #fff; }

/* the page: a document in the app's window. One font, the app's greys and hairlines; the look's three colours reach
   only its square and its title band. Sections are group boxes, their caption in the line; labels in one column,
   values in the other. Nothing moves. */
.canvas{ position:relative; min-height:100%; background:#fff; color:var(--ink); overflow:clip; isolation:isolate; font-family:var(--sys); line-height:20px; }
.banner{ position:relative; display:flex; background:var(--ebg); color:var(--eink); border-bottom:1px solid var(--rule); }
.banner .bin{ position:relative; width:100%; display:flex; align-items:center; gap:16px; padding:24px; }
.btxt{ flex:1; min-width:0; }
.eyebrow{ margin:0; font:bold 12px/16px var(--sys); color:var(--eac); }
.hl{ margin:0; color:var(--eink); overflow-wrap:anywhere; font-size:20px; line-height:24px; font-weight:bold; }
.psub2{ margin:4px 0 0; max-width:60ch; font-size:14px; line-height:20px; color:var(--eink); }
.pgnote{ margin:4px 0 0; max-width:60ch; font-size:12px; line-height:16px; color:var(--edim); }
.dlg .kdesc.inline{ margin:0 0 16px; padding:0; border:0; background:none; font-size:12px; color:var(--dim); }
.sqwrap{ position:relative; flex:0 0 auto; }
.pg .banner .sqwrap > .sq:not(.plain), .pg .banner .sqwrap > .sq.img{ box-shadow:0 0 0 1px color-mix(in srgb, var(--eink) 22%, transparent); }
.pg-horizon .banner .mosaic{ box-shadow:0 0 0 1px var(--rule); }
/* below the band everything is the app's: the look's variables are put back to the app's greys */
.canvas > .actbar, .canvas > .entry, .canvas > .edition, .canvas > .layer{ --ebg:#fff; --eink:var(--ink); --eac:var(--ink); --eac2:var(--rule); --edim:var(--dim); --eon:#fff; --epanel:#fff; }

/* The verbs are the window's controls, not the event's: one toolbar in the app's own bevel style. */
.actbar{ position:sticky; top:0; z-index:6; margin:0; padding:8px 16px; background:var(--face); color:var(--ink); font-family:var(--sys);
  box-shadow:inset 0 1px 0 var(--white), inset 0 -1px 0 var(--shadow); }
.verbs{ display:flex; flex-wrap:wrap; align-items:center; gap:4px; }
.vgroup{ display:flex; gap:4px; }
.vsec{ display:flex; flex-wrap:wrap; gap:4px; margin-left:auto; }
/* one size for every control on an event or horizon page */
.vb{ height:var(--act); min-width:var(--act); padding:0 12px; font-size:14px; }
.vb .n{ font:12px var(--sys); color:var(--dim); }
.vb.on .n{ color:var(--ink2); }
.vb.icononly{ padding:0; width:var(--act); }
.btn.on .fillable{ fill:currentColor; }
a.btn{ text-decoration:none; color:var(--ink) !important; }
/* the way in (tickets, membership) and the next edition: a framed box under the toolbar */
.edition{ position:relative; padding:24px 24px 0; }
.edcard{ width:100%; display:grid; grid-template-columns:1fr auto; column-gap:16px; align-items:center; padding:16px; text-align:left;
  background:var(--face-lt); border:1px solid var(--gb); box-shadow:inset 1px 1px 0 #fff; color:var(--ink); font-family:var(--sys); }
.edcard:hover{ background:var(--hover); }
.edcard > span:not(.edgo){ grid-column:1; }
.edk{ font:bold 12px/16px var(--sys); color:var(--dim); }
.edt{ font-size:14px; font-weight:bold; line-height:16px; }
.edd{ font-size:12px; line-height:16px; }
.eds{ margin-top:8px; font:bold 12px/16px var(--sys); color:var(--ink2); }
.edgo{ grid-column:2; grid-row:1 / span 4; width:var(--ctl); height:var(--ctl); display:grid; place-items:center; background:var(--face); box-shadow:var(--out); color:var(--ink); }
.edprev{ display:flex; align-items:center; gap:16px; flex-wrap:wrap; }
.edprev .chip{ min-height:var(--ctl); }
.ednote{ flex:1 1 260px; font-size:12px; line-height:16px; color:var(--dim); }
.entry{ position:relative; display:flex; align-items:center; gap:16px; flex-wrap:wrap; margin:24px 24px 0; padding:16px;
  border:1px solid var(--gb); box-shadow:inset 1px 1px 0 #fff; background:var(--face-lt); font-family:var(--sys); }
.entry .ensum{ flex:1 1 240px; min-width:0; }
.entry .enk{ font:bold 12px/16px var(--sys); color:var(--dim); }
.entry .env{ font-size:14px; line-height:16px; font-weight:bold; color:var(--ink); }
.entry .ens{ font-size:12px; line-height:16px; color:var(--dim); }
/* on a phone the event's verbs live in a bar at the bottom of its sheet, always in reach */
#evbar{ display:none; flex:0 0 auto; padding:8px; background:var(--face); color:var(--ink); box-shadow:inset 0 1px 0 var(--white), 0 -1px 0 var(--shadow); font-family:var(--sys); }
#app.phone.has-evbar #evbar{ display:block; }
#app.phone .pg-event > .actbar{ display:none; }
#evbar .verbs{ flex-wrap:nowrap; gap:4px; }
#evbar .vgroup{ flex:1 1 auto; min-width:0; }
#evbar .vb{ flex:1 1 auto; min-width:0; padding:0 8px; font-size:12px; gap:4px; }
#evbar .vb.icononly{ flex:0 0 var(--act); }

.layer{ position:relative; }
.lin{ position:relative; display:flex; flex-direction:column; gap:24px; padding:24px 24px 32px; }
/* one page template for events, horizons and people: every page is its own container, wherever it is shown */
.canvas.pg{ container:detail / inline-size; }
.banner .av.a96{ box-shadow:0 0 0 1px rgba(0,0,0,.25); }

/* a group box: a hairline frame, its caption in the line */
.sect, .facts{ position:relative; margin:0; padding:16px; border:1px solid var(--gb); box-shadow:inset 1px 1px 0 #fff; min-width:0; }
.sect > h3, .facts > .fh{ position:absolute; top:-9px; left:8px; margin:0; padding:0 8px; background:#fff; font:bold 12px/16px var(--sys); color:var(--ink); }
.sect > h3 .cnt, .facts > .fh .cnt{ font-weight:normal; color:var(--dim); }
.sect p{ margin:0 0 8px; max-width:66ch; }
.sect p:last-child{ margin-bottom:0; }
/* Details: labels in one column, values in the other */
.facts{ display:flex; flex-direction:column; gap:8px; }
.fact{ display:grid; grid-template-columns:112px minmax(0, 1fr); column-gap:16px; min-width:0; }
.fk{ grid-row:1 / span 2; font:14px/16px var(--sys); color:var(--dim); }
.fv{ font-size:14px; line-height:16px; overflow-wrap:anywhere; }
.fs{ font-size:12px; line-height:16px; color:var(--dim); }
.fvlink{ padding:0; border:0; background:transparent; color:inherit; font:inherit; text-align:left; text-decoration:underline; text-underline-offset:2px; cursor:pointer; min-height:0; }
@media (pointer:coarse){ .fvlink{ min-height:32px; } }
.evdesc{ font-size:14px; line-height:20px; }
.themeline{ font-size:14px; font-weight:bold; line-height:20px; }
.chips{ display:flex; flex-wrap:wrap; gap:8px; }
.chip{ display:inline-flex; align-items:center; gap:8px; min-height:32px; padding:4px 12px 4px 4px; border:1px solid var(--rule); background:transparent;
  color:var(--ink); font:12px/16px var(--sys); text-align:left; }
.chip.plain{ padding:4px 12px; }
/* a chip you can press is a control, so it is the app's button; a chip that is only a label is a tag */
button.chip, .canvas a.chip, a.chip{ border:0; background:var(--face); color:var(--ink); box-shadow:var(--out); text-decoration:none; }
button.chip:active, a.chip:active{ box-shadow:var(--in); }
button.chip .sub, a.chip .sub{ color:var(--dim); opacity:1; }
.canvas a.chip.strong, a.chip.strong{ color:var(--ink); font-weight:bold; box-shadow:0 0 0 1px #000, var(--out); }
.chip .sub{ opacity:.7; }
.cards{ display:grid; grid-template-columns:repeat(auto-fill, minmax(208px, 1fr)); gap:8px; }
.card{ border:1px solid var(--rule); padding:8px 16px; }
.card .ck{ font:bold 12px/16px var(--sys); color:var(--dim); }
.card .ctt{ font-size:14px; font-weight:bold; line-height:20px; }
.card .cbd{ font-size:12px; line-height:16px; }
.card .cbd p{ margin:0; }
.tmodel{ display:inline-block; margin-bottom:8px; font:bold 14px/20px var(--sys); color:var(--ink); }
.blist{ margin:0; padding:0; list-style:none; max-width:70ch; }
.blist li{ position:relative; padding:0 0 0 12px; }
.blist li + li{ margin-top:8px; }
.blist li::before{ content:""; position:absolute; left:0; top:8px; width:4px; height:4px; background:var(--ink); }
.irows{ display:flex; flex-direction:column; gap:8px; max-width:70ch; }
.irow .it{ font-weight:bold; }
.irow .iw{ font:12px/16px var(--sys); color:var(--dim); }
.kv{ display:grid; grid-template-columns:112px minmax(0, 1fr); gap:8px 16px; margin:0; max-width:70ch; }
.kv dt{ color:var(--dim); font:14px/20px var(--sys); }
.kv dd{ margin:0; line-height:20px; min-width:0; }
.kv dd small{ display:block; font-size:12px; line-height:16px; color:var(--dim); }
.kv dd p{ margin:0; }
.canvas .layer a{ color:var(--ink); }
/* shifts: each a row you can take */
.tl{ list-style:none; margin:0; padding:0; max-width:70ch; display:flex; flex-direction:column; gap:8px; }
.tl li{ position:relative; display:flex; gap:16px; }
.tl .tld{ flex:0 0 112px; font:14px/20px var(--sys); color:var(--dim); }
.tl .tld span{ display:block; font-size:12px; line-height:16px; }
.tl .tlb{ flex:1; min-width:0; }
.tl .tlt{ font-weight:bold; }
.tln{ font-size:12px; line-height:16px; color:var(--dim); }
.tl.shifts li{ align-items:center; }
.shiftbtn{ flex:0 0 auto; }
.tiers{ display:grid; grid-template-columns:repeat(auto-fill, minmax(144px, 1fr)); gap:8px; margin:8px 0 16px; }
.tier{ border:1px solid var(--rule); padding:8px 16px; }
.tiname{ font:bold 12px/16px var(--sys); color:var(--dim); }
.tiprice{ font-size:14px; font-weight:bold; line-height:20px; }
.tinote{ font-size:12px; line-height:16px; color:var(--dim); }
.sales{ margin:8px 0 16px; border-top:1px solid var(--line); }
.sale{ display:flex; gap:16px; padding:8px 0; border-bottom:1px solid var(--line); }
.sale .sd{ flex:0 0 112px; font:14px/20px var(--sys); color:var(--dim); }
.sale .sm2{ flex:1; min-width:0; }
.sale .sn{ font-weight:bold; }
.sst{ display:inline-block; margin-left:8px; padding:0 4px; border:1px solid var(--dim); font:bold 12px/14px var(--sys); color:var(--dim); vertical-align:1px; }
.sst.on{ border-color:var(--ink); background:var(--ink); color:#fff; }
.asof{ margin-top:8px; font:12px/16px var(--sys); color:var(--dim); }
.prov{ list-style:none; margin:0 0 8px; padding:0; display:grid; grid-template-columns:repeat(auto-fill, minmax(208px, 1fr)); gap:8px; }
.prov li{ display:flex; align-items:center; gap:8px; }
.prov li::before{ content:""; flex:0 0 12px; height:12px; box-shadow:var(--in); background:#fff; }
.prov li.y::before{ background:var(--ink); }
.prov li.n{ color:var(--dim); }
span.chip.strong{ color:var(--ink); font-weight:bold; }
/* a label is not a button: tags are filled and borderless; only what you can press has an outline */
span.chip{ border-color:transparent; background:var(--face-lt); box-shadow:var(--thin); padding:4px 12px; }
.chipmore{ align-self:center; padding:0 4px; font-size:12px; color:var(--dim); }
.vocab dt{ font:bold 14px/20px var(--sys); color:var(--ink); }
.srcline{ font:12px/16px var(--sys); color:var(--dim); }
.av{ width:22px; height:22px; flex:0 0 22px; display:inline-grid; place-items:center; color:#fff; font:bold 10px var(--sys); }
.av.img{ position:relative; overflow:hidden; background:var(--face); }
.av.a16{ width:16px; height:16px; flex-basis:16px; font-size:7px; }
.av.a32{ width:32px; height:32px; flex-basis:32px; font-size:12px; }
.av.a40{ width:40px; height:40px; flex-basis:40px; font-size:14px; }
.av.a48{ width:48px; height:48px; flex-basis:48px; font-size:14px; }
.av.a64{ width:64px; height:64px; flex-basis:64px; font-size:20px; }
.av.a96{ width:96px; height:96px; flex-basis:96px; font-size:28px; }
.av.a28{ width:28px; height:28px; flex-basis:28px; font-size:11px; }

@container detail (max-width:560px){
  .banner .bin{ align-items:flex-start; padding:16px; }
  .banner .sq.s96, .banner .av.a96{ width:64px; height:64px; flex-basis:64px; font-size:34px; }
  .banner .av.a96{ font-size:20px; }
  .pg-horizon .banner .sqwrap, .pg-person .banner .sqwrap:has(> .sq){ zoom:.667; }
  .actbar{ padding:8px; position:relative; }
  .lin{ padding:24px 16px 24px; }
  .edition{ padding:16px 16px 0; }
  .entry{ margin:16px 16px 0; }
  .vgroup{ flex:1 1 100%; }
  .vgroup .vb{ flex:1; }
  .vsec{ display:contents; }
  .verbs > .vb, .vsec > .vb{ flex:1 1 auto; padding:0 8px; }
  .vb.icononly{ flex:0 0 var(--act); }
  .sect, .facts{ padding:16px 8px 16px 16px; }
  .sect[data-sect="replies"], .sect[data-sect="callouts"]{ padding:16px; }
  .fact, .kv{ grid-template-columns:88px minmax(0, 1fr); column-gap:8px; }
  .tl .tld, .sale .sd{ flex-basis:88px; }
  .tl li, .sale{ gap:8px; }
  .tl.shifts li{ flex-wrap:wrap; }
}

/* ---------- 7. app-chrome pages (a call out) and their rows ----------- */
.page{ padding:24px; max-width:820px; }
.phead2{ display:flex; gap:16px; align-items:flex-start; }
.pname{ font-size:20px; font-weight:bold; line-height:24px; overflow-wrap:anywhere; }
.psub{ color:var(--dim); font-size:12px; line-height:16px; }
.pdesc{ margin:8px 0 0; max-width:62ch; font-size:14px; line-height:20px; }
.acts{ display:flex; flex-wrap:wrap; gap:8px; margin-top:16px; }
.subh{ margin:24px 0 8px; font:bold 12px/16px var(--sys); color:var(--ink); display:flex; gap:8px; }
/* a thing on a page: its square (48) and three lines */
.crow{ display:flex; align-items:center; gap:8px; min-height:64px; padding:8px 0; border-bottom:1px solid var(--line); }
.crow:last-child{ border-bottom:0; }
.crow > .sq, .crow > .av, .crow > .r-ic, .crow > .cverbs{ align-self:center; }
.crow .cm{ flex:1; min-width:0; display:flex; flex-direction:column; justify-content:center; cursor:pointer; }
.crow .cm .r-title{ font-weight:bold; line-height:16px; }
.crow .cm .r-meta{ margin:0; line-height:16px; }
.crow .cm .r-title:hover{ text-decoration:underline; }
.cverbs{ display:flex; gap:4px; flex:0 0 auto; }
.sect .track, .sect .trpast{ padding-left:0; padding-right:0; }
.sect .track:hover{ background:transparent; }
.sect .track:hover .tt{ text-decoration:underline; }
.tags{ display:flex; flex-wrap:wrap; gap:8px; margin-top:8px; }
.tag{ display:inline-flex; align-items:center; height:28px; padding:0 8px; background:var(--face-lt); box-shadow:var(--thin); font-size:12px; }
.pres{ display:inline-block; width:8px; height:8px; border-radius:50%; border:1.5px solid currentColor; vertical-align:middle; margin:0 4px 1px 0; }
.pres.online{ background:currentColor; }
.pres.idle{ background:linear-gradient(90deg,currentColor 50%,transparent 50%); }
@container detail (max-width:560px){
  .page{ padding:16px; }
  .acts .btn{ flex:1 1 auto; }
}

/* ---------- 8. right: chats ------------------------------------------ */
.phead{ flex:0 0 auto; display:flex; align-items:center; gap:10px; min-height:54px; padding:4px 2px 10px 4px; }
.ptitle{ flex:1; min-width:0; font-size:var(--fs-l); font-weight:bold; line-height:1.2; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.ptitle small{ display:block; margin-top:2px; font-size:var(--fs-s); font-weight:normal; color:var(--dim); }
.chrow{ display:flex; align-items:center; gap:12px; min-height:68px; padding:10px 14px; border-bottom:1px solid var(--line); }
.chrow:hover{ background:var(--hover); }
.chrow .cmn{ flex:1; min-width:0; }
.chrow .cnm{ font-size:14px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.chrow.unread .cnm{ font-weight:bold; }
.chrow .cpv{ margin-top:2px; font-size:var(--fs-s); color:var(--dim); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.chrow.unread .cpv{ color:var(--ink); }
.chrow .cside{ display:flex; flex-direction:column; align-items:flex-end; gap:6px; }
.ctime{ font:12px var(--sys); color:var(--dim); white-space:nowrap; }
.udot{ width:10px; height:10px; background:#000; }
.conv{ flex:1; min-height:0; display:flex; flex-direction:column; gap:8px; }
.msgs{ flex:1; min-height:0; overflow:auto; padding:16px 14px; background:#fff; box-shadow:var(--in); display:flex; flex-direction:column; gap:12px; }
.msg{ max-width:86%; align-self:flex-start; }
.msg.me{ align-self:flex-end; text-align:right; }
.mfrom{ margin-bottom:3px; font-size:12px; color:var(--dim); }
.mfrom .mt{ font-family:var(--sys); font-size:12px; margin-left:6px; }
.mbody{ display:inline-block; padding:8px 12px; background:var(--face-lt); border:1px solid #d8d4cb; text-align:left; line-height:1.4; overflow-wrap:anywhere; }
.msg.me .mbody{ background:#2a2a2a; border-color:#2a2a2a; color:#fff; }
.msg.sys{ align-self:center; font:12px var(--sys); color:var(--dim); text-align:center; }
.composer{ flex:0 0 auto; display:flex; gap:8px; }
.composer input{ flex:1; }
.members{ display:flex; gap:4px; }

/* ---------- 9. calendar ---------------------------------------------- */
.calbar{ flex:0 0 auto; display:flex; align-items:center; gap:8px; padding:0 0 8px; flex-wrap:wrap; }
.calbar .ttl{ font-size:20px; font-weight:bold; min-width:0; margin-right:6px; }
.calbar .spring{ flex:1; }
.calbar label{ display:flex; gap:8px; align-items:center; min-height:var(--ctl); padding:0 4px; font-size:var(--fs-s); cursor:pointer; }
.calgrid{ flex:1; min-height:0; overflow:auto; display:flex; flex-direction:column; }
.caldow{ display:flex; background:var(--face-lt); border-bottom:1px solid #b9b4a8; position:sticky; top:0; z-index:2; }
.caldow div{ flex:1; padding:6px 8px; font:bold 12px var(--sys); border-left:1px solid #d7d3ca; }
.caldow div:first-child{ border-left:0; }
.calrow{ display:flex; flex:1 0 auto; min-height:104px; border-top:1px solid #d6d2c9; }
.calcell{ flex:1; min-width:0; border-left:1px solid #e3e0d9; padding:4px 4px 6px; overflow:hidden; }
.calcell:first-child{ border-left:0; }
.calcell.oth{ background:#f6f5f1; color:#a09c94; }
.calcell.today .dn{ background:var(--sel); color:#fff; }
.calcell .dn{ display:inline-block; padding:1px 6px; font:bold 12px var(--sys); }
.calev{ display:flex; align-items:center; gap:5px; margin:3px 0; min-height:24px; padding:2px 6px 2px 0; overflow:hidden; white-space:nowrap;
  background:var(--ebg); color:var(--eink); border-left:4px solid var(--eac); font-size:12px; }
.calev .cg{ color:var(--eac); padding-left:4px; }
.calev span{ overflow:hidden; text-overflow:ellipsis; }
.calev:hover{ outline:2px solid #000; outline-offset:-1px; }
.weekcol{ flex:1; min-width:0; border-left:1px solid #e3e0d9; display:flex; flex-direction:column; }
.weekcol .wh{ padding:8px; background:var(--face-lt); border-bottom:1px solid #b9b4a8; font:bold 12px var(--sys); }
.weekcol.today .wh{ background:var(--sel); color:#fff; }
.weekcol .wb{ flex:1; padding:4px; }
.dayband{ display:flex; border-top:1px solid #d6d2c9; min-height:42px; }
.dayband .hr{ flex:0 0 66px; padding:4px 8px; text-align:right; font:12px var(--sys); color:var(--dim); background:var(--face-lt); border-right:1px solid #b9b4a8; }
.dayband .slot{ flex:1; padding:3px; display:flex; flex-direction:column; gap:3px; }
.calcell .dots{ display:flex; flex-wrap:wrap; gap:3px; margin-top:4px; }
.calcell .dots i{ width:100%; height:6px; background:var(--eac); pointer-events:none; }
.calcell[data-act]{ cursor:pointer; }
.calcell[data-act]:hover{ background:var(--hover); }
.calcell.picked{ outline:2px solid #000; outline-offset:-2px; background:#fff; }
.weekcol .wh[data-act]{ cursor:pointer; }
.calall{ margin-left:auto; min-height:32px; padding:0 8px; border:0; background:transparent; font:bold 12px var(--sys); color:var(--ink2); text-decoration:underline; }
body.is-phone .calall{ min-height:44px; }
.agenda{ border-top:1px solid #b9b4a8; }
@container cal (max-width:640px){
  .calrow{ min-height:58px; }
  .calcell{ padding:3px 2px; }
  .calcell .dn{ font-size:12px; padding:1px 3px; }
  .caldow div{ padding:6px 3px; text-align:center; }
}

/* ---------- 10. menus, dialogs, toasts ------------------------------- */
.popmenu{ position:fixed; z-index:80; min-width:220px; padding:3px; background:var(--face); box-shadow:var(--out), 3px 3px 8px rgba(0,0,0,.3); }
.popmenu .pi{ display:flex; align-items:center; gap:11px; min-height:40px; padding:0 18px 0 12px; white-space:nowrap; }
.popmenu .pi:hover, .popmenu .pi:focus{ background:var(--sel); color:#fff; outline:0; }
.popmenu .sepi{ height:2px; min-height:0; margin:3px 2px; padding:0; box-shadow:inset 0 1px 0 var(--shadow), inset 0 -1px 0 var(--white); }
.popmenu .sepi:hover{ background:transparent; }
/* the right-click menu: Windows 2000 grey, etched hairlines, a check gutter, a black ▸ for submenus */
.ctxmenu{ position:fixed; z-index:85; min-width:196px; max-width:320px; padding:2px; background:var(--face); color:var(--ink);
  box-shadow:var(--out), 2px 2px 3px rgba(0,0,0,.35); font:var(--fs-s)/1.2 var(--sys); outline:0; user-select:none; -webkit-user-select:none; }
.ctxmenu .ci{ display:flex; align-items:center; min-height:26px; padding:0 18px 0 0; white-space:nowrap; cursor:default; outline:0; }
.ctxmenu .ci:focus, .ctxmenu .ci.open{ background:var(--sel); color:#fff; }
.ctxmenu .ci.def .clab{ font-weight:bold; }
.ctxmenu .cck{ flex:0 0 24px; display:grid; place-items:center; }
.ctxmenu .cart2{ flex:0 0 auto; margin-right:8px; display:grid; place-items:center; }
.ctxmenu .clab{ flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; }
.ctxmenu .carr{ flex:0 0 auto; margin-left:22px; margin-right:-8px; width:0; height:0; border-left:4px solid currentColor; border-top:4px solid transparent; border-bottom:4px solid transparent; }
.ctxmenu .csep{ height:0; margin:3px 1px; border-top:1px solid var(--shadow); border-bottom:1px solid var(--white); }
.ctx-on{ outline:1px dotted currentColor; outline-offset:-3px; }
/* the same menu as a bottom sheet on a phone */
.ctxsheet .sheetrow .cico{ flex:0 0 32px; display:grid; place-items:center; }
.ctxsheet .sheetrow .clab{ flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.ctxsheet .sheetrow.def .clab{ font-weight:bold; }
.ctxsheet .sheetrow .hzchk .ic{ display:none; }
.ctxsheet .sheetrow .hzchk.on .ic{ display:block; }
.ctxsheet .csep{ height:6px; background:var(--face); box-shadow:inset 0 1px 0 var(--shadow), inset 0 -1px 0 var(--white); }
/* items that answer a long-press: no text selection, no callout */
body.is-phone :is(.row[data-type], .card2[data-type], .calev, .track[data-type], .crow, .nrow, .chrow){
  -webkit-touch-callout:none; -webkit-user-select:none; user-select:none; }
@media (pointer:coarse){ :is(.row[data-type], .card2[data-type], .calev, .track[data-type], .crow, .nrow, .chrow){
  -webkit-touch-callout:none; -webkit-user-select:none; user-select:none; } }
#mask{ position:fixed; inset:0; z-index:60; display:none; background:rgba(0,0,0,.3); }
.dlg{ position:fixed; z-index:70; display:flex; flex-direction:column; max-height:calc(100vh - 32px); padding:3px; background:var(--face);
  box-shadow:var(--out), 4px 4px 16px rgba(0,0,0,.38); }
.dbar{ flex:0 0 34px; display:flex; align-items:center; gap:8px; padding:0 4px 0 12px; color:#fff; font-weight:bold; background:var(--bar); user-select:none; }
.dbar .dtitle{ flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.dbar .dbtn{ height:26px; padding:0 10px; border:0; background:transparent; color:#fff; font:inherit; font-weight:normal; text-decoration:underline; text-underline-offset:3px; }
body.is-phone .dbar .dbtn{ height:44px; }
.dbar .x{ width:30px; height:26px; display:grid; place-items:center; border:0; padding:0; background:var(--face); color:#000; box-shadow:var(--out); }
.dbody{ flex:1; min-height:0; overflow:auto; padding:20px; }
.dfoot{ flex:0 0 auto; display:flex; justify-content:flex-end; gap:8px; padding:12px 20px 18px; }
.field{ display:flex; flex-direction:column; gap:6px; margin-bottom:16px; }
.field > label, .flabel{ font-size:var(--fs-s); font-weight:bold; }
.fhelp{ font-size:var(--fs-s); color:var(--dim); }
.ferr{ font-size:var(--fs-s); font-weight:bold; color:var(--ink); }
.ferr::before{ content:"\26A0\FE0E  "; }
input[aria-invalid="true"]{ outline:1px solid #000; outline-offset:-4px; }
.demolink{ margin:4px 0 0; font-size:var(--fs-s); color:var(--dim); }
.demolink button{ min-height:32px; padding:0; border:0; background:none; color:var(--ink2); text-decoration:underline; text-underline-offset:3px; cursor:pointer; }
body.is-phone .demolink button{ min-height:44px; }
.pick{ display:flex; align-items:center; gap:12px; min-height:52px; padding:6px 10px; border-bottom:1px solid var(--line); cursor:pointer; }
.pick:hover{ background:var(--hover); }
.pick .pm{ flex:1; min-width:0; }
.pick .pm small{ display:block; color:var(--dim); font-size:var(--fs-s); }
.picklist{ background:#fff; box-shadow:var(--in); max-height:300px; overflow:auto; }
/* on a touch screen everything you can press is at least 44px */
@media (pointer:coarse){
  button.chip, a.chip{ min-height:var(--ctl); }
}
.pchips{ display:flex; flex-wrap:wrap; gap:6px; }
.pchip{ height:var(--ctl); padding:0 14px; border:0; background:var(--face); box-shadow:var(--out); font-size:var(--fs-s); }
.pchip.on{ background:var(--sel); color:#fff; box-shadow:inset 1px 1px 0 #000, inset -1px -1px 0 #777; font-weight:bold; }
.addcity{ display:inline-flex; gap:6px; flex:1 1 220px; }
.addcity input{ flex:1; min-width:0; }
.handlein{ display:flex; align-items:center; background:#fff; box-shadow:var(--in); }
.handlein > span{ padding:0 0 0 10px; color:var(--dim); }
.handlein input{ flex:1; box-shadow:none; background:transparent; padding-left:2px; }
.handlein:focus-within{ outline:1px dotted #000; outline-offset:-5px; }
.handlein input:focus{ outline:0; }
.linkrow{ display:flex; align-items:center; gap:12px; min-height:52px; padding:6px 12px; border-bottom:1px solid var(--line); background:#fff; cursor:pointer; }
.linkrow:hover{ background:var(--hover); }
.linkrow .lr{ flex:1; min-width:0; }
.linkrow .lstate{ font:12px var(--sys); color:var(--dim); }
.wizsteps{ display:flex; margin:0 0 18px; }
.wizsteps .ws{ flex:1; min-height:var(--ctl); padding:8px 4px; border:0; text-align:center; font:bold 12px var(--sys); background:var(--face-dk); box-shadow:var(--out); color:var(--ink2); }
.wizsteps .ws:hover{ color:#000; }
.wizsteps .ws.on{ background:#fff; color:#000; box-shadow:var(--in); }
.wizsteps .ws[aria-disabled="true"]{ color:#8a8a8a; text-shadow:1px 1px 0 #fff; cursor:default; }
.wizsteps .wsopt{ font-weight:normal; color:var(--dim); text-transform:lowercase; }
.wherein{ display:flex; align-items:center; gap:14px; }
.wherein input[type="text"]{ flex:1; min-width:0; }
.wherein input[disabled]{ background:var(--face-lt); }
.wzon{ display:inline-flex; align-items:center; gap:6px; font-size:var(--fs-s); white-space:nowrap; cursor:pointer; }
.ferr[hidden]{ display:none; }
/* what the wizard's Next / Publish are waiting for, beside them */
.wizneed{ margin-right:auto; align-self:center; font-size:var(--fs-s); line-height:1.35; color:var(--ink2); }
.wizneed:empty{ display:none; }
/* Customize: three colours and a square image, with a live preview of the square and the title block */
.custwrap{ display:flex; gap:18px; }
.custcol{ flex:0 0 340px; min-width:0; }
.custprev{ flex:1; min-width:0; position:sticky; top:0; align-self:flex-start; }
.czsect{ margin:0 0 7px; font:bold 12px var(--sys); color:var(--dim); }
.czstarts{ display:grid; grid-template-columns:repeat(3, minmax(0, 1fr)); gap:6px; margin-bottom:16px; }
.czstart{ justify-content:flex-start; gap:7px; padding:0 8px; font-size:var(--fs-s); white-space:nowrap; overflow:hidden; }
.czstart .sw{ flex:0 0 18px; height:18px; display:grid; place-items:center; font-size:11px; line-height:1; box-shadow:inset 0 0 0 1px rgba(0,0,0,.35); }
.czcolor{ display:flex; align-items:center; gap:8px; margin-bottom:8px; }
.czcolor > label{ flex:0 0 84px; font-size:var(--fs-s); font-weight:bold; }
.czcolor input[type=color]{ flex:0 0 46px; width:46px; height:var(--ctl); padding:3px; border:0; background:#fff; box-shadow:var(--in); cursor:pointer; }
.czcolor .czhex{ flex:1; min-width:0; font-family:var(--sys); }
.cznote{ margin:0 0 12px; font-size:var(--fs-s); color:var(--ink2); }
.cznote[hidden]{ display:none; }
.cznote .sw{ display:inline-block; width:12px; height:12px; margin:0 3px -1px 0; box-shadow:inset 0 0 0 1px rgba(0,0,0,.35); }
.czimg{ display:flex; gap:12px; align-items:flex-start; margin-bottom:16px; }
.czdrop{ flex:0 0 auto; position:relative; display:block; padding:0; border:0; background:none; cursor:pointer; outline-offset:3px; }
.czdrop.over{ outline:2px dashed var(--sel); }
.czdrop .czhint{ position:absolute; left:0; right:0; bottom:0; padding:3px 0; background:rgba(0,0,0,.55); color:#fff; font:bold 12px var(--sys); text-align:center; }
.czimgside{ flex:1; min-width:0; display:flex; flex-direction:column; align-items:flex-start; gap:6px; }
.czimgside .fhelp{ margin:0; line-height:1.4; }
.czimgside .ferr:empty{ display:none; }
.czfile{ position:absolute; width:1px; height:1px; opacity:0; overflow:hidden; pointer-events:none; }
.previewbox{ padding:12px; max-height:470px; overflow:auto; background:#fff; box-shadow:var(--in); }
.plabel{ margin:10px 0 6px; font:bold 12px var(--sys); color:var(--dim); }
.plabel:first-child{ margin-top:0; }
.minicanvas{ overflow:hidden; position:relative; container:detail / inline-size; }
.minicanvas .banner .bin{ padding:14px 16px; gap:14px; }
.minicanvas .hl{ font-size:20px !important; }
.minicanvas .actbar{ position:relative; padding:6px 16px; }
.minicanvas .lin{ padding:10px 16px 14px; }
.minicanvas .canvas{ min-height:0; }
#toasts{ position:fixed; left:50%; bottom:20px; transform:translateX(-50%); z-index:90; display:flex; flex-direction:column; align-items:center; pointer-events:none; }
.toast{ min-width:220px; max-width:320px; padding:10px 14px; background:#ffffe1; border:1px solid #6d6a5e; box-shadow:2px 2px 6px rgba(0,0,0,.3); font-size:var(--fs-s); }
.toast b{ display:block; font-size:var(--fs); }
.toast.act{ display:flex; align-items:center; gap:12px; pointer-events:auto; }
.toast .tt2{ flex:1; min-width:0; }
#sh-url{ width:100%; color:var(--ink2); }
.ab-tap{ cursor:pointer; align-self:stretch; display:flex; flex-direction:column; justify-content:center; }
.linkrow.static{ cursor:default; }
.linkrow.static:hover{ background:#fff; }
.chrow .lstate{ font:12px var(--sys); color:var(--dim); }
.cmsg{ margin:0; max-width:46ch; font-size:var(--fs-m); line-height:1.5; }

/* ---------- 10b. phone feed: shelves, tiles, playlists --------------- */
.shelves{ padding:0 0 28px; }
.shelf{ margin-top:24px; }
.sortrow{ display:flex; align-items:center; justify-content:flex-end; gap:8px; padding:6px 12px; border-bottom:1px solid var(--line); font-size:var(--fs-s); color:var(--dim); }
.sortrow select{ height:var(--ctl); }
.shh{ display:flex; align-items:center; gap:8px; padding:0 8px 0 16px; }
.shh h3{ flex:1; min-width:0; margin:0; font-size:14px; line-height:20px; }
.shh h3 .cnt{ font:normal 12px var(--sys); color:var(--dim); }
.card2{ cursor:pointer; }
.card2.sel .cart{ box-shadow:0 0 0 2px #fff, 0 0 0 4px var(--ink); }
.showall{ min-height:44px; padding:0 8px; border:0; background:transparent; font:bold 12px var(--sys); color:var(--dim); }
.srow{ display:flex; gap:12px; padding:10px 16px 4px; overflow-x:auto; overscroll-behavior-x:contain; scroll-snap-type:x mandatory; scroll-padding:0 16px;
  -webkit-overflow-scrolling:touch; scrollbar-width:none; }
.srow::-webkit-scrollbar{ display:none; }
.srow::after{ content:""; flex:0 0 4px; }
/* desktop and tablet: a section is one row of whole squares filling the container (as many as fit, --sq each), never a
   strip to scroll sideways; Show all lists the rest. The phone keeps its sideways shelves */
#app.desk .srow{ gap:16px; padding:8px 16px 0; overflow:visible; scroll-snap-type:none; }
#app.desk .srow::after{ display:none; }
#app.desk .srow .card2{ flex:0 0 var(--sq, 150px); width:var(--sq, 150px); }
#app.desk .srow .card2 .cart, #app.desk .srow .coart{ width:var(--sq, 150px); height:var(--sq, 150px); }
.card2{ flex:0 0 150px; width:150px; scroll-snap-align:start; min-height:44px; }
.card2 .cart{ position:relative; width:150px; height:150px; box-shadow:0 0 0 1px rgba(0,0,0,.18), 2px 2px 0 rgba(0,0,0,.14); }
.card2:active .cart{ transform:translate(1px,1px); box-shadow:0 0 0 1px rgba(0,0,0,.18); }
.ct2{ margin-top:8px; font-size:14px; font-weight:bold; line-height:1.25; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
.cs2{ margin-top:3px; font:12px var(--sys); color:var(--dim); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.ctag{ position:absolute; z-index:5; left:6px; bottom:6px; padding:2px 6px; background:#fff; color:#000; border:1px solid #000; font:bold 12px var(--sys); }
.ctag.inline{ position:static; flex:0 0 auto; }
.coart + .ctag{ left:auto; right:6px; bottom:auto; top:6px; }
.coart{ width:150px; height:150px; display:flex; flex-direction:column; justify-content:flex-end; gap:4px; padding:12px; background:var(--face); box-shadow:var(--out); color:var(--ink); }
.coart .ic{ margin-bottom:auto; }
.coart span{ font:bold 12px var(--sys); color:var(--dim); }
.coart b{ font-size:14px; line-height:1.15; }
.mosaic{ display:grid; grid-template-columns:1fr 1fr; background:#000; overflow:hidden; }
.mosaic .sq{ border-radius:0 !important; clip-path:none !important; }
.mosaic.one{ display:block; }
.mosaic.empty{ display:grid; place-items:center; background:var(--face); color:var(--dim); box-shadow:var(--out); }
.trm{ flex:0 0 auto; }
.rrm{ width:32px; height:32px; }
.pksearch{ position:sticky; top:-20px; z-index:3; margin:-20px -20px 12px; padding:20px 20px 12px; background:var(--face); }
body.is-phone .pksearch{ top:-18px; margin:-18px -16px 12px; padding:18px 16px 12px; }
.picklist.tall{ max-height:min(58vh, 460px); }
/* Add events: one row of filters under the search; the list keeps its height as you switch, so the dialog doesn't jump */
#pk-list{ height:min(58vh, 460px); }
.pkchips{ display:flex; flex-wrap:wrap; gap:6px; margin-top:10px; }
.pkchip{ display:inline-flex; align-items:center; gap:6px; height:30px; padding:0 10px; border:0; background:var(--face); box-shadow:var(--out); color:var(--ink); font-size:12px; white-space:nowrap; }
.pkchip:active{ box-shadow:var(--in); }
.pkchip .n{ font:12px var(--sys); color:var(--dim); }
.pkchip.on{ background:var(--sel); color:#fff; font-weight:bold; box-shadow:inset 1px 1px 0 #000; }
.pkchip.on .n{ color:var(--seldim); }
.pick .pm small.pkwhy{ color:var(--ink2); }
.pkempty{ line-height:1.5; }
.pkempty .btn{ margin-top:12px; }
.pkband{ padding:12px 10px 6px; font:bold 12px var(--sys); color:var(--dim); border-bottom:1px solid var(--line); background:#fff; }
.hzchk{ width:28px; height:28px; display:grid; place-items:center; box-shadow:var(--in); background:#fff; color:#000; }
.tracks{ list-style:none; margin:0; padding:0; }
.track{ display:flex; align-items:center; gap:8px; min-height:64px; padding:8px 16px; border-bottom:1px solid var(--line); }
.track:last-child{ border-bottom:0; }
.track:hover{ background:var(--hover); }
.track:active{ background:var(--hover); }
.track .tm{ flex:1; min-width:0; display:flex; flex-direction:column; align-items:flex-start; }
.track .tt{ font-size:14px; font-weight:bold; line-height:16px; overflow:hidden; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; }
.track .ctag.inline{ margin-top:4px; }
.track.sel{ background:var(--sel); color:#fff; }
.track.sel .ts{ color:var(--seldim); }
.trpast{ display:flex; align-items:center; gap:8px; min-height:48px; padding:0 16px; border-bottom:1px solid var(--line); cursor:pointer;
  font:bold 12px var(--sys); color:var(--dim); }
.track .ts{ font-size:12px; line-height:16px; color:var(--dim); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.track.past .tt{ color:#6f6f6f; }

/* ---------- 10c. Home: the network's activity ------------------------ */
/* AN ENTRY: a header line (the person at 32, what they did over how long ago), 8, the thing in its frame; 16 around */
.fitem{ display:flex; flex-direction:column; gap:8px; padding:16px; border-bottom:1px solid var(--line); min-width:0; }
.fhead{ display:flex; align-items:center; gap:8px; min-height:32px; min-width:0; }
.fav{ flex:0 0 32px; display:flex; }
.fhd{ flex:1; min-width:0; }
.fsent{ margin:0; font-size:14px; line-height:16px; font-weight:normal; color:var(--ink2); overflow-wrap:anywhere; }
.fsent b{ color:var(--ink); }
.fmeta{ font-size:12px; line-height:16px; color:var(--dim); }
.fexpl{ color:var(--dim); }
.fwho{ display:inline; padding:0; border:0; background:none; font:inherit; font-weight:bold; color:var(--ink); cursor:pointer; text-align:left; }
.fwho:hover{ text-decoration:underline; }
/* how long ago is legible; under a day old it is in ink */
.ftime{ font:12px/16px var(--sys); color:var(--dim); white-space:nowrap; }
.ftime.fresh{ color:var(--ink); font-weight:bold; }
.btn.s{ height:28px; min-width:28px; padding:0 8px; gap:4px; font-size:12px; }
.fmsg{ flex:0 0 auto; }
@media (pointer:coarse){ .btn.s{ height:36px; } }
/* A THING: its square (48) and three lines of 16 in a hairline frame, its verbs at the right */
.fcard{ position:relative; display:flex; align-items:center; gap:8px; padding:8px; background:#fff; border:1px solid var(--rule); min-width:0; }
.fcard:hover{ background:var(--hover); }
.fcard.sel{ background:var(--face-lt); border-color:var(--ink); box-shadow:0 0 0 1px var(--ink); }
.fcm{ flex:1; min-width:0; }
.fct{ display:block; font-size:14px; font-weight:bold; line-height:16px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.fck, .fcs, .fcs3, .fcard .soc{ font-size:12px; line-height:16px; color:var(--dim); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.fck{ font-weight:bold; }
.fcs3, .fcard .soc{ color:var(--ink2); }
.fcq{ font-size:12px; line-height:16px; color:var(--ink2); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.fverbs{ position:relative; z-index:1; flex:0 0 auto; display:flex; gap:4px; }
.fvb{ font-size:14px; padding:0 12px; }
/* several things under one entry: one frame, hairlines between */
.fstack{ display:flex; flex-direction:column; border:1px solid var(--rule); }
.fstack > .fcard{ border:0; border-bottom:1px solid var(--line); }
.fstack > .fcard:last-child{ border-bottom:0; }
.fstack > .fcard.sel{ box-shadow:inset 0 0 0 2px var(--ink); }
/* a narrow list: the verbs go under the thing, the width shared */
@container list (max-width:560px){
  .fcard{ flex-wrap:wrap; }
  .fcard > .fverbs{ flex:1 1 100%; }
  .fcard > .fverbs .btn{ flex:1; }
  .fhead .fmsg{ align-self:flex-start; }
}
.fmore{ align-self:flex-start; }
.fmore.static{ min-height:0; font-size:12px; color:var(--dim); }
.fend{ display:flex; flex-wrap:wrap; align-items:center; gap:8px 16px; padding:24px 16px 32px; color:var(--dim); font-size:12px; }
/* call outs: the one inverted thing — ink ground, paper type, a hairline frame inside; loud by inversion, not size */
.fco{ position:relative; display:flex; flex-direction:column; gap:8px; padding:16px; background:var(--ink); color:#fff; outline:1px solid #fff; outline-offset:-4px; }
.fcok{ display:flex; align-items:center; gap:8px; font-size:12px; line-height:16px; color:#c4c4c4; }
.fcotag{ flex:none; display:inline-flex; align-items:center; gap:4px; height:20px; padding:0 8px; background:#fff; color:#000; font:bold 12px/16px var(--sys); white-space:nowrap; }
/* the tag keeps its one line ("Call / out" wrapped when the date beside it was long); the date gives way instead */
.fcountil{ margin-left:auto; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.fcoa{ display:block; font-size:20px; font-weight:bold; line-height:24px; overflow-wrap:anywhere; }
.fcob{ margin:0; max-width:60ch; font-size:14px; line-height:20px; color:#e6e6e6; }
button.fcoe{ position:relative; z-index:1; display:flex; align-items:center; gap:8px; width:100%; padding:8px; border:1px solid #4a4a4a; background:#242424; color:#fff; font:inherit; text-align:left; cursor:pointer; }
button.fcoe:hover{ background:#2e2e2e; }
.fcoet{ min-width:0; display:flex; flex-direction:column; }
.fcoet b{ font-size:14px; line-height:16px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.fcoet small{ font-size:12px; line-height:16px; color:#c4c4c4; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.fcof{ display:flex; flex-wrap:wrap; align-items:center; gap:8px 16px; }
.fcoby{ margin-left:auto; display:flex; align-items:center; gap:8px; font-size:12px; line-height:16px; color:#c4c4c4; }
.fcof > .fcoby:first-child{ margin-left:0; }
.fco .av{ box-shadow:0 0 0 1px #fff; }
.fco .btn{ color:#000; position:relative; z-index:1; }
.fco.sel{ outline-width:3px; outline-offset:-5px; }
.fco .flink{ position:static; }
.fco .flink::after{ z-index:0; }
/* a feed card is a container: its title is the button that opens it, and covers the card for the pointer */
.fcard, .fco, .fuprow{ position:relative; }
.flink{ display:block; width:100%; min-width:0; padding:0; border:0; background:none; color:inherit; font:inherit; text-align:left; cursor:pointer; }
.flink::after{ content:""; position:absolute; inset:0; }
.flink:focus-visible{ outline:2px solid currentColor; outline-offset:2px; }
.fcard .btn, .fcard .pill, .fuprow .soc{ position:relative; z-index:1; }
/* call outs for you: one at a time, stepped in the band */
.costrip .fitem{ border-bottom:0; }
.band .bx{ margin-left:auto; display:flex; gap:4px; }
.band .bx .ib{ width:24px; height:24px; }
.band .bx .ib[disabled]{ color:#8a8a8a; cursor:default; }
/* you, in one line */
.fitem.fyou{ background:var(--face-lt); }
/* following only a few: the rest of the network, below your people */
.fnet{ background:#fbfaf8; }
.fnet .fav{ opacity:.6; filter:grayscale(1); }
.fnetnote{ margin:0; padding:8px 16px; border-bottom:1px solid var(--line); font-size:12px; line-height:16px; color:var(--ink2); }
/* coming up with your people: things in a list, the date at the right */
.fuprow{ display:flex; align-items:center; gap:8px; min-height:64px; padding:8px 16px; border-bottom:1px solid var(--line); }
.fuprow:hover{ background:var(--hover); }
.fuprow.sel{ background:var(--face-lt); box-shadow:inset 4px 0 0 var(--ink); }
.fuprow .fcm{ flex:1; min-width:0; }
.fuprow .fcs, .fuprow .soc{ font-size:12px; line-height:16px; color:var(--dim); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.fuprow .soc{ color:var(--ink2); }
.fupd{ flex:0 0 auto; align-self:flex-start; display:flex; flex-direction:column; align-items:flex-end; font:12px/16px var(--sys); color:var(--ink2); white-space:nowrap; }
.fupd b{ font:bold 14px/16px var(--sys); color:var(--ink); }
.fupfoot{ padding:8px 16px; border-bottom:1px solid var(--line); }
/* who you follow is on it, in a few words */
.soc{ display:flex; align-items:center; min-width:0; font-size:12px; line-height:16px; color:var(--ink2); }
.soct{ min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.row.sel .soc{ color:var(--seldim); }
.card2 .soc{ margin-top:0; }
/* who's going: two columns of people (32), the ones you follow first, with when they decided */
.whochips{ display:grid; grid-template-columns:repeat(2, minmax(0, 1fr)); gap:8px 16px; }
.chip.who{ min-height:32px; padding:0; gap:8px; border:0; background:none; box-shadow:none; color:var(--ink); min-width:0; }
.chip.who:hover .whon{ text-decoration:underline; }
.chip.who .whon, .whorow .whon{ display:flex; flex-direction:column; min-width:0; line-height:16px; text-align:left; font-size:14px; }
.chip.who .whon{ overflow:hidden; white-space:nowrap; text-overflow:ellipsis; }
.chip.who small, .whorow small{ font-size:12px; font-weight:normal; color:var(--dim); overflow:hidden; text-overflow:ellipsis; }
.chip.who.fol .whon{ font-weight:bold; }
.whochips button.chip.chipmore{ grid-column:1 / -1; justify-self:start; min-height:var(--ctl); padding:0 12px; color:var(--ink); font-size:14px; }
@container detail (max-width:560px){ .whochips{ grid-template-columns:1fr; } }
.wholist{ display:flex; flex-direction:column; }
.whorow{ display:flex; align-items:center; gap:8px; padding:8px 0; border-bottom:1px solid var(--line); }
.whomain{ flex:1; min-width:0; display:flex; align-items:center; gap:8px; padding:0; border:0; background:none; text-align:left; color:var(--ink); cursor:pointer; }
.whonote{ margin:8px 0 0; font-size:12px; line-height:16px; color:var(--dim); }
/* a call out's answers: a thread under it, drawn like a tree view — the people (32) hang from one dotted line */

<script>
/* =========================================================================
   0. DATA ADAPTERS — same fixtures as every other concept
   ========================================================================= */
var H = window.HYPERNET;
/* ONLINE: served by the backend — the globals below are refilled from the database at boot (_shared/hypernet-api.js) */
var ONLINE = !!(window.HNAPI && HNAPI.online);
/* ONE CLOCK. The app runs on the real date: TODAY_ISO is today here, nowMs() is now (the instant every
   timestamp is taken from). The mock fixtures were written for H.meta.today (2026-09-20), so their dates —
   the mock events and their sample records, the call outs' expiries — move by the whole days between that
   and today, and the mock world stays where it was relative to now. The five "World" events and everything
   in data/real-events.json keep their real dates. Stored timestamps are UTC ISO strings (timestamptz in Neon). */
function nowMs(){ return Date.now(); }
var TODAY_ISO = (function(d){ return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2); })(new Date(nowMs()));
function utcDay(iso){ var p = String(iso).split('-'); return Date.UTC(+p[0], +p[1] - 1, +p[2]); }
var FIXTODAY = H.meta.today;
var FIXSHIFT = Math.round((utcDay(TODAY_ISO) - utcDay(FIXTODAY)) / 86400000);
/* "2026-10-04" (or "2026-10-04T…") moved by n days; anything else untouched */
function shiftIso(s, n){
  var m = typeof s === 'string' && s.match(/^(\d{4})-(\d{2})-(\d{2})(.*)$/);
  if (!m || !n) return s;
  var d = new Date(Date.UTC(+m[1], +m[2] - 1, +m[3] + n));
  return d.getUTCFullYear() + '-' + ('0' + (d.getUTCMonth() + 1)).slice(-2) + '-' + ('0' + d.getUTCDate()).slice(-2) + m[4];
}
function shiftDates(o, n){
  Object.keys(o).forEach(function(k){
    var v = o[k];
    if (typeof v === 'string') o[k] = shiftIso(v, n);
    else if (v && typeof v === 'object') shiftDates(v, n);
  });
}
if (FIXSHIFT){
  var SAMPLES = (window.HYPERNET_DETAILS && window.HYPERNET_DETAILS.records) || {};
  H.events.forEach(function(e){
    if (e.kind === 'world') return;
    e.date = shiftIso(e.date, FIXSHIFT);
    if (SAMPLES[e.id]) shiftDates(SAMPLES[e.id], FIXSHIFT);
  });
  H.callouts.forEach(function(c){ c.expiresAt = shiftIso(c.expiresAt, FIXSHIFT); });
  H.meta.today = TODAY_ISO;
}

var PEOPLE = {};
H.people.forEach(function(p){ PEOPLE[p.id] = p; });
/* Michal is the demo account: to everyone else he is just another member, and the
   fixture events marked "You" are his. 'self' is whoever is logged in: nobody until you join. */
PEOPLE['p-michal'] = { id:'p-michal', displayName:'Michal', handle:'mike', bio:H.self.bio,
                       skills:['EVENT PRODUCTION/PRODUCING'], city:'SWEDEN|STOCKHOLM', cities:['Stockholm'] };
PEOPLE['self'] = { id:'self', displayName:'', handle:'', bio:'', skills:[], city:'', cities:[] };

var EVENTS = {};
H.events.forEach(function(e){ EVENTS[e.id] = e; });

var HORIZONS = {};
H.horizons.forEach(function(h){ HORIZONS[h.id] = h; });
HORIZONS['horizon-default'].ownerId = 'p-michal'; HORIZONS['horizon-default'].ownerName = 'Michal';
HORIZONS['horizon-feed'] = { id:'horizon-feed', name:'Feeding the Ridge',
  description:'Kitchen shifts, tea, and everything that ends in washing up.',
  isPersonalDefault:false, isPublished:true, ownerName:'Kai Okonkwo', ownerId:'p-kai',
  eventIds:['evt-fill-1','evt-fill-7','evt-world-camp-dinner'] };
HORIZONS['horizon-surface'] = { id:'horizon-surface', name:'Surfaces & Projections',
  description:'Anything you can throw light at after dark.',
  isPersonalDefault:false, isPublished:true, ownerName:'Mira Chen', ownerId:'p-mira',
  eventIds:['evt-fill-3','evt-fill-9','evt-world-hyperstition-2026'] };

var GROUPS = {};  H.groups.forEach(function(g){ GROUPS[g.id] = g; });
var CALLOUTS = H.callouts.map(function(c){
  var host = H.people.filter(function(p){ return p.displayName === c.hostName; })[0];
  return { id:c.id, title:c.title, body:c.body, expiresAt:c.expiresAt, hostName:c.hostName, hostId: host?host.id:null };
});

/* the fixture people (seed scaffolding: fake attendees and activity). The network itself is networkPeople() */
var CREW = ['p-anna','p-rio','p-kai','p-mira','p-jon','p-sasha'];
var PRESENCE = { 'p-anna':'online','p-rio':'online','p-kai':'idle','p-mira':'offline','p-jon':'offline','p-sasha':'offline' };
/* people are chrome, so their avatars stay in the greys */
var AVCOLOR  = { 'self':'#1c1c1c','p-michal':'#1c1c1c','p-anna':'#4b4b4b','p-rio':'#6b6b6b','p-kai':'#363636',
                 'p-mira':'#7c7c7c','p-jon':'#565656','p-sasha':'#2b2b2b' };

function hashId(str){ var n=0; for (var i=0;i<String(str).length;i++) n=(n*31+String(str).charCodeAt(i))>>>0; return n; }
var CITYPOOL = ['Stockholm','Malmö','Copenhagen','Berlin','Oslo','Gothenburg','Amsterdam'];
Object.keys(EVENTS).forEach(function(id){ if (!EVENTS[id].city) EVENTS[id].city = CITYPOOL[hashId(id) % CITYPOOL.length]; });

/* =========================================================================
   0b. EVENT RECORDS — the Hypernet event schema (docs/research/burn-event-data.md §4)
   Samples for the mock events come from _shared/hypernet-event-details.js.
   Real events come from data/real-events.json, fetched at boot: a real record
   replaces the sample for the same event (matched by id, then by title), and
   events the fixtures don't have join the network. The page renders records,
   never raw files.
   ========================================================================= */

  e.description = raw.description || e.description || '';

/* A big burn whose edition is over, with the next one announced, lives on as
   that next edition: same world, new dates. The past edition stays reachable
   from it ("Previous: 2026") but leaves the feed. */
var NEXTED = {};                 /* past edition id -> next edition id */
function makeNextEditions(){
  Object.keys(REC).forEach(function(id){
    var r = REC[id], b = r.burn, e = EVENTS[id];
    if (!e || !b || !b.nextEdition || NEXTED[id] || r._prev) return;
    var nd = isoDate(b.nextEdition.date);
    if (!nd || !isPast(lastDay(e))) return;
    var nid = id + '--next', ny = nd.slice(0,4);
    var title = /\b(19|20)\d\d\b/.test(e.title) ? e.title.replace(/\b(19|20)\d\d\b/, ny) : e.title + ' ' + ny;
    EVENTS[nid] = { id:nid, title:title, date:nd, description:e.description, hostName:e.hostName, privacy:e.privacy,
                    ownerIds:e.ownerIds || [], kind:e.kind, city:e.city };
    var nr = JSON.parse(JSON.stringify(r));
    nr.id = nid; nr.date = nd; nr.endDate = isoDate(b.nextEdition.endDate) || undefined;
    nr.theme = b.nextEdition.theme ? (typeof b.nextEdition.theme === 'object' ? b.nextEdition.theme : { name:b.nextEdition.theme }) : undefined;
    nr.burn.edition = { year:+ny }; delete nr.burn.phases; delete nr.burn.nextEdition;
    delete nr.blocks; delete nr.startTime; delete nr.endTime;
    if (nr.access){
      var ay = +(nr.access.asOf || 0);
      nr.access.sales = (nr.access.sales || []).filter(function(sl){
        var last = isoDate(sl.closes) || isoDate(sl.opens);
        return last ? last >= TODAY_ISO : ay >= +ny;
      });
    }
    nr._prev = id; nr._prevYear = e.date.slice(0,4); nr._note = b.nextEdition.note;
    REC[nid] = nr;
    window.HYPERNET_THEMES.themes[nid] = TH(id);
    PROMOCOUNT[nid] = hashId(nid) % 17;
    NEXTED[id] = nid;
  });
}
function loadRealEvents(){
  if (location.protocol === 'file:' || !window.fetch) return Promise.resolve();
  return fetch('data/real-events.json', { cache:'no-store' })
    .then(function(r){ return r.ok ? r.json() : null; })
    .then(function(json){
      if (!json) return;
      var list = Array.isArray(json) ? json : (json.events || json.records || []);
      list.forEach(mergeReal);
      makeNextEditions();
      REALIDS = REALIDS.map(function(id){ return NEXTED[id] || id; });
      if (REALIDS.length){
        HORIZONS['horizon-season'] = { id:'horizon-season', name:'Season of burns', description:'Burns, decompressions and meetups from the community’s own pages.',
          isPersonalDefault:false, isPublished:true, ownerName:'Hypernet', ownerId:null,
          eventIds: REALIDS.slice().sort(function(a,b){ return EVENTS[a].date < EVENTS[b].date ? -1 : 1; }) };
        HZCOUNT['horizon-season'] = 212; HZCOVER['horizon-season'] = REALIDS.filter(function(k){ return /burning-man/.test(k); })[0] || REALIDS[0];
      }
      if (ROUTE.ready) render();
    })
    .catch(function(){});
}

var PLAINGLYPH = { burn:'✦', burn_night:'✳', decompression:'☾', meetup:'◉', build:'▲', workshop:'■', volunteer_day:'✜', fundraiser:'◈',

  return !!t && typeof t === 'object' && !t.palette && window.HN_HEX(t.bg) === t.bg && window.HN_HEX(t.ink) === t.ink &&
         window.HN_HEX(t.accent) === t.accent && (t.image == null || window.HN_IMAGE(t.image) === t.image);
}

  var T = window.HYPERNET_THEMES.themes;

  if (!PLAINCACHE[id]){ var r = (typeof REC !== 'undefined' && REC[id]) || {}; PLAINCACHE[id] = plainTheme(PLAINGLYPH[r.kind] || PLAINGLYPH[r.scale] || '◆'); }
  return PLAINCACHE[id];

/* plain = the plain colours (a plain look may still carry an image) */

/* =========================================================================
   6. THE LIST
   ========================================================================= */
function sortItems(items){
  var k = S.sort;
  if (items.some(function(it){ return it.type !== 'event'; }) && S.folder.kind !== 'horizon') return items;
  var head = items.filter(function(it){ return it.type !== 'event'; }), evs = items.filter(function(it){ return it.type === 'event'; });

    var va = k === 'title' ? ea.title : k === 'host' ? hostLabel(ea) : k === 'city' ? cityShort(ea.city) : null;
    var vb = k === 'title' ? eb.title : k === 'host' ? hostLabel(eb) : k === 'city' ? cityShort(eb.city) : null;
    if (va !== null && va.toLowerCase() !== vb.toLowerCase()) return va.toLowerCase() < vb.toLowerCase() ? -1 : 1;
    var pa = isPast(ea.date) ? 1 : 0, pb = isPast(eb.date) ? 1 : 0;

var SEARCHBAND = { event:'Events', horizon:'Event Horizons', callout:'Call outs', person:'People' };
function bandOf(it){

  if (k === 'shelf') return null;
  if (k === 'search') return SEARCHBAND[it.type];
  var x = k === 'explore' ? S.folder.id : '';

  if (x === 'people') return it.id === 'self' ? 'You' : 'People';
  if (x === 'callouts') return S.loggedIn && calloutOf(it.id).hostId && PFOLLOW[calloutOf(it.id).hostId] ? 'From people you follow' : 'Open';
  if (it.type === 'horizon') return 'Event Horizon';

/* this week, then the rest of this month, then each month by name */
function timeBand(e){

  if (d <= 6) return 'This week';

var BANDORDER = ['Event Horizon','Happening soon','Announced','This week','Past',
                 'Events','Event Horizons','You','People','Yours','Following','Popular','From people you follow','Open'];

    order.sort(function(a,b){ var ia = BANDORDER.indexOf(a), ib = BANDORDER.indexOf(b); return (ia<0?99:ia) - (ib<0?99:ib); });

}
function isSel(it){ var s = S.stack[0]; return s && s.type === it.type && s.id === it.id; }
function statePills(evId){
  var st = stateOf(evId), h = '';

  if (st === 'interested') h += '<span class="pill int">'+ic('heart',11)+'<span>Interested</span></span>';

}
function rowHTML(it){
  var cls = 'row' + (isSel(it) ? ' sel' : ''), lead, title, meta, date = '', side = '', soc = '', act = 'data-act="row" data-type="'+it.type+'" data-id="'+it.id+'"';

    ((date || side) ? '<div class="r-side">'+(date?'<div class="r-date">'+date+'</div>':'')+(side?'<div class="r-states">'+side+'</div>':'')+'</div>' : '') +
    '</div>';
}
/* an empty phone search offers your recent searches and Explore's kinds */
var RECENTQ = [];                /* the last searches you ran, newest first */
function rememberQuery(q){
  q = String(q || '').trim(); if (q.length < 2) return;
  RECENTQ = [q].concat(RECENTQ.filter(function(x){ return fold(x) !== fold(q) && fold(q).indexOf(fold(x)) !== 0; })).slice(0, 5);

}
function browseHTML(){

    return '<div class="row" data-act="dosearch" data-id="'+esc(q)+'" role="button"><span class="r-ic">'+ic('search')+'</span><div class="r-main"><div class="r-title">'+esc(q)+'</div></div></div>'; }).join('') : '';
  return rec + '<div class="band">Explore</div>' + EXPLOREKINDS.map(function(k){
    return '<div class="row" data-act="explorekind" data-id="'+k[0]+'" role="button"><span class="r-ic">'+ic(k[2])+'</span><div class="r-main"><div class="r-title">'+esc(k[1])+'</div>' +
      '<div class="r-meta">'+esc(folderSub({ kind:'explore', id:k[0] }))+'</div></div></div>';

}
function renderList(){
  if (L.phone && S.phoneSearch && S.folder.kind !== 'search'){ $('listbody').innerHTML = browseHTML(); S.rows = []; return; }
  if (S.folder.kind === 'home'){ renderHome(); return; }
  if (isOverview()){ renderShelves(); return; }
  var items = sortItems(folderItems());
  var g = groupItems(items), h = '', rows = [];
  if (S.folder.kind === 'search' && !S.query.trim()){
    h = browseHTML();
  } else if (!items.length){
    var k = S.folder.kind;
    if (k === 'search'){
      h = '<div class="empty">Nothing matches “'+esc(S.query)+'”.</div>';
      var wk = shelfItems('week').slice(0, 4), cu = shelfItems('soon').slice(0, Math.max(0, 4 - wk.length)), ph = popularHorizons().slice(0, 3);
      var rowsOf = function(list){ return list.map(function(it){ rows.push(it); return rowHTML(it); }).join(''); };
      if (wk.length) h += '<div class="band">This week</div>' + rowsOf(wk);

      [['date','Date'],['title','Title'],['host','Host'],['city','City']].map(function(o){ return '<option value="'+o[0]+'"'+(S.sort===o[0]?' selected':'')+'>'+o[1]+'</option>'; }).join('') + '</select></label>' + h;

<script>
