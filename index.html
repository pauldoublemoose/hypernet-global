var CALLOUTSKILL = { 'co-sound':'SOUND/SOUND ENGINEERING / PA', 'co-kitchen':'CAMP OPERATIONS/KITCHEN & COOKING' };

/* ---------- the layout engine ---------- */
function computeLayout(){
  var W = window.innerWidth;
  if (W < 760) return { phone:true, left:false, right:false, cw:W };
  /* the sidebar is always there; it gets narrower (labels stay) as the screen does */
  var right = S.rightOpen, navW = W < 1120 ? 200 : W < 1400 ? 216 : 252;
  /* below 1120 there is no room for a third column: the chat dock floats over the centre's right edge */
  var over = right && W < 1120;
  /* with the dock open it narrows below 1680 */
  var narrow = right && !over && W < 1680;
  /* the container's width and where it and the window sit are measured once the frame is laid out (layoutCentre) */
  return { phone:false, left:true, right:right, navW:navW, dockOver:over, cw:CW[centreKind()], narrowDock:narrow };
}
/* ---------- the centre's containers, and where the window lies over them ----------
   The white panel spans the centre; the view sits in a container as wide as what it is for: READ (Home's feed, one
   measure), LIST (rows to scan: Explore's kinds, Show all, search, your lists), WIDE (squares to browse, a month), and
   every container starts at the white's left (2026-10-05, "make everything left aligned like the Explore page").
   Opening something never moves the page (2026-10-05, "the new window should just overlay what's behind it and the
   content underneath should not shift"): the container keeps its place, width, padding and squares whether a window
   is open, closed or replaced. The window lies over the right of the white, clear of the
   list's scrollbar, as wide as it can be (440 to 720) while the list's first LKEEP stay in view — avatars, who did
   what, titles, the call out's Answer. Its default height is the main area under the toolbar: #main starts at the
   toolbar's bottom, and the same WEDGE insets the top and the bottom, so the pane rises with the heading instead of
   starting under it. Maximised is not that inset: the window then covers the viewport. Where the centre has no room
   for both (a tablet, 1280 with the chat dock open) the window is the centre, at that same height: one thing at a time. */
var CW = { read:640, list:720, wide:1120 };
var WINW = { min:440, max:720 }, WEDGE = 8, LKEEP = 320;
function centreKind(){
  if (S.folder.kind === 'home') return 'read';
  if (isOverview() || isCal()) return 'wide';
  return 'list';
}
var SBW = null, FR = 2;
function layoutCentre(){
  var app = $('app'), c = $('center'), lb = $('listbody');
  L.fit = null; L.win = ''; L.wg = null;
  if (L.phone){ L.cw = window.innerWidth; app.classList.remove('win-over', 'win-cover'); return; }
  /* the list's scrollbar (16 with a mouse, 0 where scrollbars float): the heading's right edge keeps clear of it. It sits
     inside the white's sunken frame (FR, its 2px border), flush against it */
  if (lb.offsetParent){ SBW = lb.offsetWidth - lb.clientWidth - 2 * lb.clientLeft; FR = lb.clientLeft; }
  var sb = SBW != null ? SBW : (window.matchMedia && matchMedia('(pointer:fine)').matches ? 16 : 0), fr = FR;
  /* a list with a calendar keeps one slot, the calendar's, in both its views (2026-10-05): the list sits at the slot's
     left and the heading spans the slot, so the List / Calendar switch at its right never moves when you switch. The
     slot, like every container, starts at the white's left */
  var C = c.clientWidth, slot = Math.min(CW[viewsOf().indexOf('calendar') >= 0 ? 'wide' : centreKind()], C - 2 * fr);
  var cw = Math.min(CW[centreKind()], slot), pl = 0;
  if (S.stack.length){
    /* a tablet's chat dock floats over the centre's right: the window keeps clear of it */
    var over = L.dockOver && L.right, CE = C - (over ? $('chats').offsetWidth + WEDGE : 0);
    var right = over ? CE : C - fr - sb - WEDGE, ww = Math.min(WINW.max, right - WEDGE - LKEEP);
    /* vertical extent in #main, whose top is the toolbar's bottom: WEDGE under that, WEDGE above #main's bottom.
       x stays on the centre (#center isn't positioned, so its offsetLeft is already in #main) */
    var y0 = WEDGE, h0 = $('main').clientHeight - 2 * WEDGE;
    if (ww >= WINW.min){
      L.win = 'over';
      L.wg = { x:c.offsetLeft + right - ww, y:y0, w:ww, h:h0 };
    } else {
      /* no room for both: the window is the centre (the sidebar, and a docked chat, stay beside it); beside a floating
         dock it keeps clear of it, or — too narrow for that — leaves its edge to be touched. Same height as beside the list */
      L.win = 'cover';
      L.wg = { x:c.offsetLeft, y:y0, w:CE === C ? C : CE >= WINW.min ? CE : Math.min(C, Math.max(WINW.min, C - 64)), h:h0 };
    }
  }
  /* the container is measured inside the frame: Home's 640 is 640 of white */
  L.cw = cw; L.pl = pl; L.pr = Math.max(0, C - 2 * fr - pl - cw);
  app.style.setProperty('--pl', pl + 'px'); app.style.setProperty('--pr', L.pr + 'px'); app.style.setProperty('--sbw', sb + 'px'); app.style.setProperty('--fr', fr + 'px');
  /* the heading's tools sit at the white's right edge (2026-10-05: "align the calendar all the way to right"), wherever
     the view's container ends — a window lies over it and never changes it */
  app.style.setProperty('--hr', '0px');
  app.classList.toggle('win-over', L.win === 'over'); app.classList.toggle('win-cover', L.win === 'cover');
  /* Explore's overview: as many whole squares (at least 152) as the container holds, 16 apart, inside its 16 gutters */
  if (isOverview()){ var inner = cw - 32, cols = Math.max(1, Math.floor((inner + 16) / (152 + 16))); L.fit = { cols:cols, sq:Math.floor((inner - (cols - 1) * 16) / cols) }; }
}

function wizTakeFill(d, x){

  if (x.startTime) d.startTime = x.startTime;
  if (x.endTime) d.endTime = x.endTime;
  if (x.description) d.desc = x.description;
  if (x.online){ d.online = true; d.city = ''; d.placePin = null; d.mapReject = false; }
  else {
    var place = x.city || (x.venue && x.venue.name) || '';

    var v = x.venue || {}, lat = Number(v.lat), lng = Number(v.lng);
    if (d.city && Number.isFinite(lat) && Number.isFinite(lng)) d.placePin = { name:d.city, lat:lat, lng:lng, url:'', provider:null };
  }

function wizFill(){

  var u = String((field && field.value) || d.fillUrl || '').trim();
  if (u && !/^https?:\/\//i.test(u) && /\./.test(u)) u = 'https://' + u;
  d.fillUrl = u;
  if (!/^https?:\/\/[^\s\/]+\.[^\s]+$/i.test(u)){
    d.fillNote = 'Paste a link to the event’s page.';
    paintWiz(); focusIn('w-fill'); return;
  }
  if (!ONLINE || !window.HNAPI || !HNAPI.autofill){
    d.fillNote = 'Fill from link reads pages on the live site only. Here, fill in the fields yourself.';
    paintWiz(); focusIn('w-t'); return;

  d.fillBusy = true; d.fillNote = 'Reading ' + linkSite(u) + '…'; paintWiz();
  HNAPI.autofill(u).then(function(r){
    if (DRAFT !== d) return;
    d.fillBusy = false;

  if (!ROUTE.ready) return;
  var s = ev.state && ev.state.hn ? ev.state : parseHash(location.hash);
  closeCtx(); closePopup(); lpCancel();
  if (DLGS.length){ DLGS.forEach(function(d){ d.remove(); }); DLGS = []; $('mask').style.display = 'none'; S.pending = null; CTXS = null; }
  ROUTE.applying = true;
  applySnap(s); render();
  ROUTE.applying = false;
  restoreScroll(s.scroll);
  if (!ev.state) revealSel();
  /* an entry a visitor can't be on (an account's place, from before logging out) now names where it landed: Explore */
  var shown = snapNow();
  if (!ev.state || s.modal || (!S.loggedIn && navKeyOf(shown) !== navKeyOf(s))){ shown.idx = s.idx || 0; shown.scroll = CURSCROLL; history.replaceState(shown, '', hashOf(shown)); }
});
/* a link (not a history step): its row, if the list has one, is lit and in view */
function revealSel(){
  var el = document.querySelector('#listbody .row.sel, #listbody .track.sel, #listbody .fsel, #listbody .card2.sel');
  if (el && !L.phone){ el.scrollIntoView({ block:'center' }); CURSCROLL.list = $('listbody').scrollTop; }
}
function rootSnap(tab){
  var f = tabRootFolder(L.phone ? tab : 'home');
  return { hn:1, tab:tab, folder:f, stack:[], q:'', ps:false, view:viewsOf(f)[0] || null, cal:null };
}
function startRoutes(){
  L = computeLayout();
  var st = history.state && history.state.hn ? history.state : null;
  var s = st || parseHash(location.hash);
  ROUTE.applying = true;
  applySnap(s); render();
  ROUTE.applying = false;
  ROUTE.ready = true;
  var cur = snapNow();
  var root = rootSnap(S.tab), deep = !st && navKeyOf(cur) !== navKeyOf(root);
  if (!st) revealSel();
  if (deep){
    /* a link opened cold: put its tab's front page underneath, so back stays inside Hypernet */
    root.idx = 0; history.replaceState(root, '', hashOf(root));
    cur.idx = 1;
    /* a narrow calendar's day: its month goes underneath too, so back and ‹ <month> return to the month */
    if (dayOpen()){ var mon = Object.assign({}, cur, { cal:Object.assign({}, cur.cal, { day:null }), stack:[], idx:1 }); history.pushState(mon, '', hashOf(mon)); cur.idx = 2; }
    history.pushState(cur, '', hashOf(cur));
  } else {
    cur.idx = st ? st.idx || 0 : 0;
    if (st && st.scroll) restoreScroll(st.scroll);
    cur.scroll = CURSCROLL; history.replaceState(cur, '', hashOf(cur));
  }
}

/* =========================================================================
   15. RENDER + BOOT
   ========================================================================= */
function render(){
  captureProfileEdit();
  /* logged out there is no Home: whatever asked for it (a link, a tab, an old history entry) lands on Explore. Nor is
     there anything of an account's (2026-10-05, "doesn't make sense to be able to click on the profile and see nothing
     there"): You, Chats and your lists land on Explore too, and a phone has no tabs — Explore is a visitor's one place */
  if (!S.loggedIn){
    if (S.folder.kind === 'home' || ACCTPLACES.test(S.folder.kind)) S.folder = { kind:'explore', id:null };
    S.tab = 'explore';
    S.stack = S.stack.filter(function(it){ return it.type !== 'chat' && !(it.type === 'missing' && /^chats\//.test(it.id)); });
  }
  L = computeLayout();
  noticeNewEvents();
  var app = $('app');
  if (!L.phone){
    /* a phone conversation screen becomes the chat dock on a wider screen */
    var ct = S.stack.filter(function(it){ return it.type === 'chat'; }).pop();
    if (ct){ S.stack = S.stack.filter(function(it){ return it.type !== 'chat'; }); S.chatOpen = ct.id; S.rightOpen = true; S.lastOpened = 'right'; L = computeLayout(); }
    if (S.folder.kind === 'you' || S.folder.kind === 'chats') goFolder(landingFolder());
  } else if (S.stack.some(function(it){ return it.type === 'chat'; })){
    /* and a conversation in the stack (a link, a desktop's dock) becomes the phone's Chats tab */
    S.chatOpen = S.stack.filter(function(it){ return it.type === 'chat'; }).pop().id;
    S.stack = []; S.tab = 'chats'; S.folder = { kind:'chats', id:null };
  }
  /* a horizon is never a list of its own: an old link or history entry that made it one opens it in the window,
     over Explore's Event Horizons */
  if (S.folder.kind === 'horizon'){
    var hid1 = S.folder.id; S.folder = { kind:'explore', id:'horizons' };
    if (L.phone){ S.tab = S.tab === 'home' || !S.tab ? 'explore' : S.tab; if (S.tab !== 'explore') S.folder = tabRootFolder(S.tab); }
    S.stack = [{ type:'horizon', id:hid1 }].concat(S.stack);
  }
  var conv = phoneConv();
  /* on a phone the window is a sheet over the screen you were on, which stays as it was behind it */
  var scr = L.phone ? ((conv || S.tab === 'chats') ? 'chats' : (S.tab === 'you' && S.folder.kind === 'you') ? 'you' : 'center') : '';
  L.scr = scr;
  if (!L.phone) app.style.setProperty('--nav-w', L.navW + 'px');
  var front = app.classList.contains('dock-front');
  app.className = [L.phone ? 'phone' : 'desk', L.left ? 'l-open' : '', L.right ? 'r-open' : '', L.narrowDock ? 'dock-narrow' : '', L.dockOver ? 'dock-over' : '',
    isCal() ? 'v-cal' : '', S.stack.length ? 'win-open' : '', scr ? 'scr-' + scr : '', front && L.right ? 'dock-front' : '',
    conv && S.loggedIn ? 'conv-open' : '', !L.phone && S.loggedIn ? 'readmarks' : '', S.loggedIn ? '' : 'preview'].filter(Boolean).join(' ');
  document.body.className = L.phone ? 'is-phone' : 'is-desk';
  layoutCentre();
  syncCalloutPage();

  if (L.phone){ renderAppbar(); renderTabbar(); } else renderToolbar();
  if (L.left || scr === 'you') renderNav();
  if (!L.phone || scr === 'center'){
    renderCHead();
    if (isCal()) renderCalendar(); else renderList();
  }
  if (!L.phone && isOverview()){
    var fit = overviewFit();
    if (fit && (!L.fit || fit.sq !== L.fit.sq || fit.cols !== L.fit.cols)){ L.fit = fit; renderShelves(); }
  }
  renderDetail();
  fitProfileTags();
  renderChats();
  renderPreview();
  /* the phone's sheet ends above the preview bar, which is always there when logged out (the tabs under it stay) */
  placePvh();
  placeWin();
  placeToasts();
  document.title = (S.stack.length ? itemName(S.stack[S.stack.length-1]) : folderName()) + ' · HYPERNET · GLOBAL';
  if (window.HNRel) HNRel.mount(document);
  schedulePersist();
  syncRoute();
}
/* what you make and keep survives a reload. The network (events, horizons and call outs people
   made here) is shared; each account keeps its own relations and chats. */
var STORE = 'hypernet-feed:v2';
function isCreatedHz(k){ var h = HORIZONS[k]; return !!h && (!!h.ownerAcct || k === 'horizon-default'); }
/* every write to this browser's storage goes through here: when it is full, say so once, quietly — never fail silently */
var STOREFULL = false;
function storeSet(key, val){
  try { localStorage.setItem(key, val); return true; }
  catch(e){
    var full = e && (e.name === 'QuotaExceededError' || e.name === 'NS_ERROR_DOM_QUOTA_REACHED' || e.code === 22 || e.code === 1014 || /quota/i.test(String(e.message)));
    /* after whatever the action itself says, so its own confirmation doesn't cover the warning */
    if (full && !STOREFULL){ STOREFULL = true; setTimeout(function(){ toast('This browser’s storage is full', 'Recent changes are kept until you close the tab. Remove an image to make room.'); }, 0); }
    return false;
  }
}
/* saved on change, not on every render: render marks the store dirty and it is written once things settle (and when
   the page goes away); a write that would store the same thing again is skipped */
var PERSISTED = null;
function persist(){
  clearTimeout(PERSISTT); PERSISTT = null;
  if (ONLINE){ HNAPI.persistUi(); return; }   /* the network lives in the database; only conveniences stay here */
  try {
    if (S.loggedIn && S.acct) ACCTS[S.acct] = captureAcct();
    var evs = {}, recs = {}, themes = {}, hzs = {}, covers = {}, hzthemes = {};
    Object.keys(EVENTS).filter(function(k){ return /^evt-new-/.test(k); }).forEach(function(k){ evs[k] = EVENTS[k]; recs[k] = REC[k]; themes[k] = window.HYPERNET_THEMES.themes[k]; });
    Object.keys(HORIZONS).filter(isCreatedHz).forEach(function(k){ hzs[k] = HORIZONS[k]; if (HZCOVER[k]) covers[k] = HZCOVER[k]; if (HZTHEME[k]) hzthemes[k] = HZTHEME[k]; });
    /* hosts can change events they did not create here (the demo's own), so those edits are kept too */
    var edits = {};
    Object.keys(EDITED).forEach(function(k){ if (EVENTS[k] && !/^evt-new-/.test(k)){ var th = window.HYPERNET_THEMES.themes[k] || null; edits[k] = { ev:EVENTS[k], rec:REC[k] || null, theme:th, plain:!th }; } });
    var json = JSON.stringify({ v:2,
      session:{ acct: S.loggedIn ? S.acct : null },
      ui:{ rightOpen:!!S.rightOpen, chatOpen:S.chatOpen || null, recent:RECENTQ },
      accounts:ACCTS,
      network:{ events:evs, recs:recs, themes:themes, horizons:hzs, covers:covers, hzthemes:hzthemes, edits:edits, deleted:DELETED,
                callouts:CALLOUTS.filter(function(c){ return !!c.hostAcct; }), replies:REPLIES, replyGone:REPLYGONE }
    });
    if (json !== PERSISTED && storeSet(STORE, json)) PERSISTED = json;
  } catch(e){}
}
function restore(){
  if (ONLINE){ HNAPI.restoreUi(); return; }
  var d = null;
  try { d = JSON.parse(localStorage.getItem(STORE) || 'null'); } catch(e){}
  if (!d) return;
  var n = d.network || {};
  Object.keys(n.events || {}).forEach(function(k){ EVENTS[k] = n.events[k]; if (n.recs && n.recs[k]) REC[k] = n.recs[k];
    if (n.themes && n.themes[k]) window.HYPERNET_THEMES.themes[k] = asLook(n.themes[k]); READ[k] = true; PROMOCOUNT[k] = PROMOCOUNT[k] || 0; });
  Object.keys(n.horizons || {}).forEach(function(k){ HORIZONS[k] = n.horizons[k]; if (HZCOUNT[k] == null) HZCOUNT[k] = 0; });
  Object.keys(n.covers || {}).forEach(function(k){ HZCOVER[k] = n.covers[k]; });
  Object.keys(n.hzthemes || {}).forEach(function(k){ if (n.hzthemes[k]) HZTHEME[k] = asLook(n.hzthemes[k]); });
  Object.keys(n.edits || {}).forEach(function(k){
    var x = n.edits[k]; EDITED[k] = true;
    EVENTS[k] = Object.assign(EVENTS[k] || {}, x.ev);
    if (x.rec) REC[k] = x.rec;
    if (x.theme) window.HYPERNET_THEMES.themes[k] = asLook(x.theme); else if (x.plain) delete window.HYPERNET_THEMES.themes[k];
  });
  if (n.callouts && n.callouts.length){
    var ids = n.callouts.map(function(c){ return c.id; });
    CALLOUTS = n.callouts.concat(CALLOUTS.filter(function(c){ return ids.indexOf(c.id) < 0; }));
    /* answers used to be chats; they are replies under the call out now */
    CALLOUTS.forEach(function(c){ delete c.answers; });
  }
  REPLIES = Array.isArray(n.replies) ? n.replies : []; REPLYGONE = n.replyGone || {};
  if (n.deleted){
    DELETED = { events:n.deleted.events || [], horizons:n.deleted.horizons || [] };
    DELETED.events.forEach(function(k){ delete EVENTS[k]; delete REC[k]; });
    DELETED.horizons.forEach(function(k){ delete HORIZONS[k]; });
  }
  if (d.ui){ S.rightOpen = !!d.ui.rightOpen; S.chatOpen = d.ui.chatOpen || null; RECENTQ = d.ui.recent || []; }
  ACCTS = d.accounts || {};
  var k = d.session && d.session.acct;
  if (k === 'demo' && ACCTS[k] && !('lists' in ACCTS[k])) ACCTS[k].lists = fixtureLists(); /* same rule as useAcct */
  if (k && ACCTS[k]){ S.acct = k; S.loggedIn = true; loadAcct(ACCTS[k]); if (k === 'demo') seedDemoInvites(); }
  syncAcctPeople();
}
var PERSISTT = null;
function schedulePersist(){ if (!PERSISTT) PERSISTT = setTimeout(persist, 300); }
/* a reload, a closed tab or a phone putting the page away writes what is pending */
window.addEventListener('pagehide', function(){ if (PERSISTT) persist(); });
document.addEventListener('visibilitychange', function(){ if (document.visibilityState === 'hidden' && PERSISTT) persist(); });
function placePvh(){
  var pvb = $('previewbar');
  $('app').style.setProperty('--pvh', (L.phone && !S.loggedIn && pvb.offsetHeight ? Math.max(0, window.innerHeight - pvb.getBoundingClientRect().top) : 0) + 'px');
}
/* A new width is a new layout: everything is drawn again. A resize that changes only the height is, on a phone, the
   keyboard coming or going (or the browser's bars): no layout depends on the height alone, so only what is placed by it
   moves (the window, the preview bar's room, toasts) and nothing is rebuilt. Rebuilding replaced the reply box you had
   just tapped — the keyboard opened, the viewport shrank, the resize redrew the page, the box was a new one and the
   keyboard closed (owner, 2026-10-05). The visual viewport has no handler of its own: nothing here listens to it. */
var RZ = null, RZW = window.innerWidth;
window.addEventListener('resize', function(){
  clearTimeout(RZ);
  RZ = setTimeout(function(){
    if (window.innerWidth !== RZW || !ROUTE.ready){ RZW = window.innerWidth; render(); return; }
    layoutCentre(); placeWin(); placePvh(); placeToasts();
  }, 60);
});
(function boot(){
  if (ONLINE){ HNAPI.boot(startRoutes); return; }   /* the network comes from GET /api/bootstrap */
  restore();
  /* the real events carry the links people share, so the route waits for them (briefly) */
  var started = false, start = function(){ if (!started){ started = true; startRoutes(); } };
  loadRealEvents().then(start, start);
  setTimeout(start, 2500);
})();
</script>
