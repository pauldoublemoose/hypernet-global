/* =========================================================================
   9. THE RIGHT PANE — chats, and nothing else
   ========================================================================= */
function chatAv(c){ return avHTML(c.memberIds[0], 'a40'); }
function lastMsg(c){ return c.messages[c.messages.length-1]; }
/* when a message was sent: new ones carry a timestamp; the fixtures' "09:31" and "yesterday" are read on a
   morning clock that ends just before you arrived, so anything you send is newer */
var BOOTNOW = nowMs();
function msgTs(m){
  if (!m) return 0;
  if (m.ts) return typeof m.ts === 'number' ? m.ts : isoMs(m.ts);
  var t = String(m.t || ''), hm = t.match(/^(\d{1,2}):(\d{2})$/), H = 3600000;
  if (/^yesterday$/i.test(t)) return BOOTNOW - 22 * H;
  if (hm){ var ago = (10 - +hm[1] - +hm[2] / 60) * H; if (ago < 0) ago += 24 * H; return BOOTNOW - 60000 - ago; }
  return BOOTNOW - 48 * H;
}
function stamp(){ return { t:nowClock(), ts:tsIso(nowMs()) }; }
/* the chat list: newest message first; a chat with nothing in it yet is not listed */
function chatList(){
  /* a chat is listed once it has a message, or something you started typing in it (a draft floats to the top) */
  var ts = function(k){ return CHATDRAFT[k] && !CHATS[k].messages.length ? nowMs() : msgTs(lastMsg(CHATS[k])); };
  return CHATORDER.filter(function(k){ return CHATS[k] && (CHATS[k].messages.length || CHATDRAFT[k]); })
    .sort(function(a, b){ return ts(b) - ts(a); });

function msgPreview(m, c){

  if (m.cocard) return who + 'shared a call out' + (calloutOf(m.cocard) ? ': ' + calloutOf(m.cocard).title : '');

function unreadChats(){ return S.loggedIn ? Object.keys(UNREADCHAT).filter(function(k){ return UNREADCHAT[k]; }).length : 0; }
/* no chats yet: message someone straight away */
function chatsEmptyHTML(){

  return '<div class="band">'+(ppl.some(function(k){ return PFOLLOW[k]; }) ? 'People you follow' : 'People on Hypernet')+'</div>' +
    ppl.map(function(pid){ var p = person(pid);
      return '<div class="chrow" data-act="dm" data-id="'+pid+'" role="button">'+avHTML(pid,'a40')+'<div class="cmn"><div class="cnm">'+esc(p.displayName)+'</div>' +
        '<div class="cpv">@'+esc(p.handle)+(p.bio ? ' · '+esc(p.bio) : '')+'</div></div><span class="lstate">Message</span></div>'; }).join('');
}
function chatListHTML(){
  var list = chatList();

        '<div class="cmn"><div class="cnm">'+esc(c.name)+'</div><div class="cpv">'+(CHATDRAFT[k] ? '<b>Draft:</b> '+esc(CHATDRAFT[k]) : esc(msgPreview(m, c)))+'</div></div>' +
        '<div class="cside"><span class="ctime">'+esc(m ? m.t : '')+'</span>'+(un?'<span class="udot" aria-label="Unread"></span>':'')+'</div></div>';
    }).join('') + '</div>';
}
function convHTML(cid){
  var c = CHATS[cid];
  var sub = chatSub(c);
  var h = '<div class="phead"><button class="ib" data-act="chatback" aria-label="All chats">'+ic('back')+'</button>' +
    '<div class="ptitle">'+esc(c.name)+'<small>'+esc(sub)+'</small></div>' +
    '<button class="ib" data-act="open" data-type="person" data-id="'+c.memberIds[0]+'" aria-label="Profile">'+ic('user')+'</button></div>';
  h += '<div class="conv">' + chatPinHTML(c) + '<div class="msgs" id="msgs">' + (c.messages.length ? c.messages.map(function(m){
    if (m.from === 'sys') return '<div class="msg sys">'+esc(m.text)+'</div>';

      return '<div class="msg'+(me?' me':'')+'">'+head+'<div class="evcard" data-act="open" data-type="event" data-id="'+m.card+'">'+sqHTML(m.card,40)+
        '<div><div class="t">'+esc(e.title)+'</div><div class="m">'+fmtShort(e.date)+' · '+esc(whereOf(e))+'</div></div></div></div>';
    }
    if (m.cocard && calloutOf(m.cocard)){
      var co = calloutOf(m.cocard);
      return '<div class="msg'+(me?' me':'')+'">'+head+'<div class="evcard" data-act="open" data-type="callout" data-id="'+m.cocard+'"><span class="r-ic">'+ic('callout')+'</span>'+
        '<div><div class="t">'+esc(co.title)+'</div><div class="m">Call out · '+esc(co.hostName)+'</div></div></div></div>';
    }
    if (m.hzcard && HORIZONS[m.hzcard]){
      var hz = HORIZONS[m.hzcard];
      return '<div class="msg'+(me?' me':'')+'">'+head+'<div class="evcard" data-act="open" data-type="horizon" data-id="'+m.hzcard+'">'+hzMosaic(m.hzcard,40)+
        '<div><div class="t">'+esc(hz.name)+'</div><div class="m">Event Horizon · '+hz.eventIds.length+' events</div></div></div></div>';
    }
    return '<div class="msg'+(me?' me':'')+'">'+head+'<div class="mbody">'+esc(m.text)+'</div></div>';
  }).join('') : '<div class="msg sys">No messages yet</div>') + '</div>';
  /* the box grows with what you write: Enter sends, Shift+Enter starts a new line */
  h += '<div class="composer"><textarea id="chatbox" rows="1" placeholder="Message '+esc(c.name.split(' ')[0])+'" autocomplete="off" aria-label="Message" aria-describedby="chathint">'+esc(CHATDRAFT[cid] || '')+'</textarea>' +
       '<button class="btn primary" data-act="sendchat">Send</button><span id="chathint" class="sr">Enter sends, Shift+Enter adds a new line</span></div></div>';
  return h;
}
/* a conversation started by answering a call out keeps that call out pinned at its top */
function chatPinHTML(c){
  var coId = c.pin && c.pin.callout, co = coId && calloutOf(coId); if (!co) return '';
  var ev = EVENTS[calloutEventId(co)];
  var lab = isOwnCallout(co) ? 'Answer to your call out' : ANSWERED[coId] === c.id ? 'You answered' : 'Answering';
  return '<button type="button" class="cpin" data-act="open" data-type="callout" data-id="'+coId+'">'+ic('callout',16) +
    '<span class="cpt"><b>'+esc(lab)+':</b> '+esc(co.title)+(ev ? ' · for '+esc(ev.title) : '')+'</span></button>';
}
function growBox(b){ if (!b) return; b.style.height = 'auto'; b.style.height = Math.min(b.scrollHeight + 2, 168) + 'px'; }
/* on a phone a conversation is a screen pushed onto whatever tab you are in; on a desktop it sits in the dock */
function phoneConv(){ var t = S.stack[S.stack.length-1]; return L.phone && t && t.type === 'chat' && CHATS[t.id] ? t.id : null; }
function activeChat(){ return L.phone ? phoneConv() : (S.chatOpen && CHATS[S.chatOpen] ? S.chatOpen : null); }
function chatSub(c){ return PRESENCE[c.memberIds[0]] || 'offline'; }
function renderChats(){
  var el = $('chats');
  var visible = L.phone ? L.scr === 'chats' : L.right;
  if (!visible) return;
  var focused = document.activeElement && document.activeElement.id === 'chatbox';
  if (!S.loggedIn){
    el.innerHTML = '<div class="phead"><div class="ptitle">Chats</div></div><div class="panel"><div class="empty">'+ic('chat',36).replace('class="ic"','class="ic" style="margin:0 auto 12px"')+
      'Chat with the people you make events with.</div></div>';
    return;
  }
  var cid = activeChat();
  if (cid){
    el.innerHTML = convHTML(cid);
    var box = $('chatbox'); growBox(box); if (box && focused){ box.focus(); box.setSelectionRange(box.value.length, box.value.length); }
    var ms = $('msgs'); if (ms) ms.scrollTop = ms.scrollHeight;
  } else el.innerHTML = chatListHTML();
}
</script>
<script>
/* =========================================================================
   9b. ACTIVITY — what people on the network did
   Home is built from these rows, newest first. One row per thing someone did,
   shaped like the Postgres table it becomes when Neon is wired:
     activity(id text pk, actor text, verb text, obj_type text, obj_id text, ts timestamptz, extra jsonb)
   verbs: going · interested · promoted (obj event) · created_event (event)
          published_horizon · followed_horizon · added_to_horizon (horizon; extra.eventIds)
          created_horizon (a private horizon: only its author ever sees the row)
          posted_callout (callout) · followed_person (person)
   ========================================================================= */
/* the app's clock is the real one (nowMs, section 0). The fixture rows are seeded back from the moment the app started */
var FIXNOW = nowMs();
function appNow(){ return nowMs(); }
/* timestamps are UTC ISO strings, as timestamptz; rows kept from before (local "2026-09-20T12:00") still read as local */
function tsIso(ms){ return new Date(ms).toISOString(); }
function isoMs(s){ var t = Date.parse(s || ''); return isNaN(t) ? 0 : t; }
/* a row's time. Rows made here also carry the real moment (at) */
function actTime(a){ return a.at || isoMs(a.ts); }

/* -------------------------------------------------------------------------
   ACTIVITY SEED (fixture) — generated from the people, events, horizons and call outs in
   _shared/hypernet-data.js, and from the real events once they have loaded. Deterministic: the
   same data always gives the same rows. Three weeks before the demo's today, denser toward now,
   a few in the last hours. When Neon is wired this block goes; the rows come from
     select * from activity where ts > now() - interval '21 days' order by ts desc
   ------------------------------------------------------------------------- */
var ACTWINDOW = 21;
/* who follows whom: the fixture friendships both ways, plus a few one-way follows.
   p-michal's are the demo account's (see demoAcct), so his rows agree with what the demo follows. */
var NETFOLLOWS = (function(){
  var g = {};
  var add = function(a, b){ if (a === b || !/^p-/.test(a) || !/^p-/.test(b)) return; g[a] = g[a] || []; if (g[a].indexOf(b) < 0) g[a].push(b); };
  (H.friendships || []).forEach(function(f){ add(f[0], f[1]); add(f[1], f[0]); });
  [['p-anna','p-mira'], ['p-rio','p-mira'], ['p-kai','p-jon'], ['p-sasha','p-kai'], ['p-sasha','p-jon'], ['p-jon','p-kai'],
   ['p-michal','p-anna'], ['p-michal','p-rio'], ['p-michal','p-kai'], ['p-michal','p-sasha']].forEach(function(x){ add(x[0], x[1]); });
  return g;
})();
/* the fixture call outs name no event; these are the ones they are for when no event record lists them */
var CALLOUTFOR = { 'co-sound':'evt-deep-listening', 'co-kitchen':'evt-fill-7' };
function calloutEventId(c){
  if (!c) return null;
  if (c.eventId) return EVENTS[c.eventId] ? c.eventId : null;
  var hit = Object.keys(REC).filter(function(k){ return EVENTS[k] && (REC[k].calloutIds || []).indexOf(c.id) >= 0 && !isPast(lastDay(EVENTS[k])); })[0];
  return hit || (EVENTS[CALLOUTFOR[c.id]] ? CALLOUTFOR[c.id] : null);
}
/* a number in 0..1 that is always the same for the same key */
function mix32(n){ n = Math.imul(n ^ (n >>> 16), 0x85ebca6b); n = Math.imul(n ^ (n >>> 13), 0xc2b2ae35); return (n ^ (n >>> 16)) >>> 0; }
function seedU(key){ return mix32(hashId(key)) / 4294967296; }
/* when someone did something: `min`..`max` days back (denser toward now unless flat), 07:00–22:00, never after now */
function seedTs(key, max, min, flat){
  max = max == null ? ACTWINDOW - 1 : max; min = min || 0;
  var u = seedU(key), d = min + Math.floor((flat ? u : Math.pow(u, 1.35)) * (max - min + 1));
  var day = new Date(FIXNOW); day.setHours(0, 0, 0, 0); day.setDate(day.getDate() - d);
  var ms = day.getTime() + (7 * 60 + Math.floor(seedU(key + '#m') * 15 * 60)) * 60000;
  if (ms > FIXNOW - 20 * 60000) ms = FIXNOW - (20 + Math.floor(seedU(key + '#r') * 280)) * 60000;   /* today: some time this morning */
  return ms;
}
/* the person behind an event, whoever is looking (hostPersonOf answers "you" to its host) */
function hostPid(e){
  if (e.hostAcct) return acctPid(e.hostAcct);
  return Object.keys(PEOPLE).filter(function(k){ return k !== 'self' && !/^u-/.test(k) && PEOPLE[k].displayName === e.hostName; })[0] || null;
}
var ACTSEED = null;
function seedActivity(){
  var key = Object.keys(EVENTS).length + ':' + Object.keys(HORIZONS).length + ':' + CALLOUTS.length;
  if (ACTSEED && ACTSEED.key === key) return ACTSEED.rows;
  var rows = [], lo = FIXNOW - ACTWINDOW * 86400000, byKey = {};
  var row = function(actor, verb, objType, objId, ms, extra){
    if (!PEOPLE[actor] || actor === 'self' || /^u-/.test(actor) || ms < lo || ms > FIXNOW) return null;
    var r = { id:'a-' + verb + '-' + actor + '-' + objId, actor:actor, verb:verb, objType:objType, objId:objId, ts:tsIso(ms), extra:extra || null };
    rows.push(r); byKey[verb + '|' + actor + '|' + objId] = r; return r;
  };
  /* after something that came first (an RSVP after the event was made): anywhere between then and now */
  var after = function(key, from){ return from > lo ? from + (.05 + .95 * seedU(key + '#a')) * (FIXNOW - 30 * 60000 - from) : seedTs(key); };
  var up = allEvents().filter(function(e){ return !NEXTED[e.id] && !/^evt-new-/.test(e.id) && !isPast(lastDay(e)); }).sort(byDate);
  up.forEach(function(e){
    var host = hostPid(e), made = host ? seedTs('made|' + e.id, 60, 2, true) : lo;
    if (host) row(host, 'created_event', 'event', e.id, made);
    var going = baseAttendees(e.id).filter(function(p){ return p !== host; }).slice(0, 3);
    going.forEach(function(p){ row(p, 'going', 'event', e.id, after('going|' + p + '|' + e.id, made)); });
    var others = CREW.filter(function(p){ return going.indexOf(p) < 0 && p !== host; });
    if (others.length && seedU('int|' + e.id) < .6){ var ip = others[mix32(hashId(e.id)) % others.length]; row(ip, 'interested', 'event', e.id, after('int|' + ip + '|' + e.id, made)); }
    if (going.length && (PROMOCOUNT[e.id] || 0) >= 12) row(going[0], 'promoted', 'event', e.id, after('promo|' + e.id, made));
  });
  Object.keys(HORIZONS).forEach(function(k){
    var hz = HORIZONS[k], own = hz.ownerId, ids = hz.eventIds.filter(function(id){ return EVENTS[id]; });
    if (hz.isPublished && own && !hz.ownerAcct){
      var pub = seedTs('pub|' + k, 30, 0, true);
      row(own, 'published_horizon', 'horizon', k, pub, { count:ids.length });
      /* and it keeps being filled, a couple of events at a time */
      if (ids.length >= 3) row(own, 'added_to_horizon', 'horizon', k, after('add|' + k, pub), { eventIds:ids.slice(-2) });
    }
    /* people follow the horizons they like (Michal's follows are the demo account's own) */
    if (hz.isPublished && !hz.ownerAcct) CREW.forEach(function(p){
      if (p !== own && seedU('fh|' + p + '|' + k) < .3) row(p, 'followed_horizon', 'horizon', k, seedTs('fh|' + p + '|' + k));
    });
  });

  var f = fold(firstName(pid)), me = myActor();
  return !!f && Object.keys(PEOPLE).some(function(k){ return k !== pid && k !== me && !(k === 'self' && !S.loggedIn) && fold(firstName(k)) === f; });
}
function whoName(pid, full){
  if (pid === myActor() || pid === 'self') return 'You';
  var p = person(pid);
  if (full) return p.displayName || '';
  return nameClash(pid) && p.handle ? '@' + p.handle : firstName(pid);
}
function objLink(type, id, label){ return '<button type="button" class="fwho" data-act="row" data-type="'+type+'" data-id="'+id+'">'+esc(label)+'</button>'; }
function whoLink(pid, full){ return objLink('person', pid === myActor() ? 'self' : pid, whoName(pid, full)); }
/* one name in full; two or three by first name; more as "Anna, Rio and 2 others". You come first. */
function namesHTML(ids, link){
  var me = myActor(), f = function(x){ return link ? whoLink(x, ids.length === 1) : esc(whoName(x, ids.length === 1)); };
  ids = ids.slice().sort(function(a, b){ return (b === me) - (a === me); });
  if (ids.length === 1) return f(ids[0]);
  if (ids.length <= 3) return ids.slice(0, -1).map(f).join(', ') + ' and ' + f(ids[ids.length - 1]);
  return f(ids[0]) + ', ' + f(ids[1]) + ' and ' + (ids.length - 2) + ' others';
}
function hzLink(hzId){ return objLink('horizon', hzId, HORIZONS[hzId].name); }
function evLink(evId){ return objLink('event', evId, EVENTS[evId].title); }
/* everything that happened to one horizon: "Mira published an Event Horizon and added 2 events · Jon and Sasha followed it" */
function hzSentence(e){
  var p = e.parts, n = e.eventIds.length, segs = [], made = p.published_horizon || p.created_horizon;
  var main = p.published_horizon ? namesHTML(p.published_horizon, true) + ' published an Event Horizon'
           : p.created_horizon ? namesHTML(p.created_horizon, true) + ' made a private Event Horizon' : '';
  if (p.added_to_horizon && n){
    var same = made && p.added_to_horizon.every(function(x){ return made.indexOf(x) >= 0; });
    if (same) main += ' and added ' + plural(n, 'event');
    else segs.push(namesHTML(p.added_to_horizon, true) + ' added ' + plural(n, 'event') + ' to ' + hzLink(e.objId));
  }
  if (p.followed_horizon) segs.push(namesHTML(p.followed_horizon, true) + (main || segs.length ? ' followed it' : ' followed an Event Horizon'));
  return [main].concat(segs).filter(Boolean).join(' · ');
}
function actSentence(e){
  if (HZVERBS[e.verb]) return hzSentence(e);
  var who = namesHTML(e.actors, true), be = e.actors.length > 1 || e.actors[0] === myActor() ? ' are ' : ' is ';
  switch (e.verb){
    case 'going':             return who + be + 'going';
    case 'interested':        return who + be + 'interested';
    case 'promoted':          return who + ' promoted an event';
    case 'created_event':     return who + ' created an event';
    case 'posted_callout':    return who + ' posted a call out';
    case 'followed_person':   return who + ' followed ' + namesHTML(e.objs, true);
  }
  return who;
}
/* everything you did in the last day, said once: "You: going to X, followed Kai, posted a call out" */
function youLineHTML(rows){
  if (!rows.length) return '';
  var by = {}, order = [];
  rows.forEach(function(r){ var v = r.a.verb; if (!by[v]){ by[v] = []; order.push(v); } if (by[v].indexOf(r.a) < 0) by[v].push(r.a); });
  var list = function(objs, link){ var u = []; objs.forEach(function(a){ if (u.indexOf(a.objId) < 0) u.push(a.objId); });
    return u.length <= 2 ? u.map(link).join(' and ') : link(u[0]) + ' and ' + (u.length - 1) + ' more'; };
  var frag = {
    going:function(l){ return 'going to ' + list(l, evLink); },
    interested:function(l){ return 'interested in ' + list(l, evLink); },
    promoted:function(l){ return 'promoted ' + list(l, evLink); },
    created_event:function(l){ return 'created ' + list(l, evLink); },
    published_horizon:function(l){ return 'published ' + list(l, hzLink); },
    created_horizon:function(l){ return 'made ' + list(l, hzLink) + ' (private)'; },
    followed_horizon:function(l){ return 'followed ' + list(l, hzLink); },
    added_to_horizon:function(l){ var n = 0; l.forEach(function(a){ n += ((a.extra && a.extra.eventIds) || []).filter(function(x){ return EVENTS[x]; }).length; });
      return 'added ' + plural(n, 'event') + ' to ' + list(l, hzLink); },
    posted_callout:function(l){ return l.length === 1 ? 'posted a call out: ' + objLink('callout', l[0].objId, calloutOf(l[0].objId).title) : 'posted ' + l.length + ' call outs'; },
    followed_person:function(l){ return 'followed ' + list(l, function(pid){ return objLink('person', pid, whoName(pid)); }); }
  };
  var parts = order.filter(function(v){ return frag[v]; }).map(function(v){ return frag[v](by[v]); });
  var shown = parts.slice(0, 4), more = parts.length - shown.length;
  return '<article class="fitem fyou" data-ts="'+tsIso(rows[0].ms)+'" data-verb="you"><div class="fav">'+avHTML('self', 'a32')+'</div>' +
    '<div class="fbody"><div class="fline"><span class="fsent"><b>You</b>: '+shown.join(', ')+(more ? ' and ' + more + ' more' : '')+'</span>'+timeHTML(rows[0].ms)+'</div></div></article>';
}
function selCls(type, id){ return isSel({ type:type, id:id }) ? ' sel fsel' : ''; }
function fbtn(act, id, on, label, onLabel, icon, onIcon, primary){
  return '<button class="btn fvb'+(on ? ' on' : primary ? ' primary' : '')+'" data-act="'+act+'" data-id="'+id+'" aria-pressed="'+!!on+'">'+ic(on ? onIcon : icon, 16)+esc(on ? onLabel : label)+'</button>';

/* a feed card is a plain container: its title is the button that opens it (and covers the card for the mouse),
   its verbs are buttons beside it — never a button inside a button */
function flink(type, id, inner){ return '<button type="button" class="flink" data-act="row" data-type="'+type+'" data-id="'+id+'">'+inner+'</button>'; }
/* an event as Home carries it: square, title, when, where — and Interested / Going right there */
function fEventCard(evId, small){
  var e = EVENTS[evId], past = isPast(lastDay(e)), st = S.loggedIn ? RSVP[evId] : '';

    : '<div class="fverbs">' + fbtn('v-interested', evId, st === 'interested', 'Interested', 'Interested', 'heart', 'heart') +

}
function fHorizonCard(hzId){
  var hz = HORIZONS[hzId], mine = hzOwnedByMe(hzId), fol = S.loggedIn && HZFOLLOW[hzId];
  var meta = ['by ' + (mine ? 'you' : hz.ownerName), plural(hz.eventIds.filter(function(id){ return EVENTS[id]; }).length, 'event'), hzWhen(hzId)].filter(Boolean).join(' · ');

    '<div class="fcm"><div class="fck">Event Horizon'+(hz.isPublished ? '' : ' · Private')+'</div>'+flink('horizon', hzId, '<span class="fct">'+esc(hz.name)+'</span>')+'<div class="fcs">'+esc(meta)+'</div></div>' +

function fPersonCard(pid, sub){
  var p = person(pid), fol = S.loggedIn && PFOLLOW[pid], me = pid === myActor() || pid === 'self';
  return '<div class="fcard fp'+selCls('person', pid)+'" data-type="person" data-id="'+pid+'">' + avHTML(pid, 'a40') +
    '<div class="fcm">'+flink('person', pid, '<span class="fct">'+esc(p.displayName)+'</span>')+'<div class="fcs">'+esc(sub || ['@' + p.handle, p.bio].filter(Boolean).join(' · '))+'</div></div>' +
    (me ? '' : fbtn('followp', pid, fol, 'Follow', 'Following', 'plus', 'check', true)) + '</div>';
}
/* what a call out offers you: Answer while it is open; your answer's chat once you have */
function calloutAct(coId, small){
  var c = calloutOf(coId), ans = S.loggedIn && ANSWERED[coId] && CHATS[ANSWERED[coId]] ? ANSWERED[coId] : null;
  if (isOwnCallout(c)) return '';

  return calloutOpen(c) && calloutAuthor(c) ? '<button class="btn'+(small ? '' : ' primary')+'" data-act="answercallout" data-id="'+coId+'">'+ic('chat',16)+'Answer</button>' : '';

/* a call out is someone standing up in the room: the one inverted thing on Home, the ask in big type */
function fCalloutCard(coId, ms){
  var c = calloutOf(coId), evId = calloutEventId(c), mine = isOwnCallout(c);
  return '<div class="fco'+selCls('callout', coId)+'" data-type="callout" data-id="'+coId+'">' +
    '<div class="fcok"><span class="fcotag">'+ic('callout',14)+'Call out</span>'+(ms ? timeHTML(ms) : '')+'</div>' +
    '<div class="fcol">Looking for</div>' + flink('callout', coId, '<span class="fcoa">'+esc(c.title)+'</span>') + (c.body ? '<p class="fcob">'+esc(c.body)+'</p>' : '') +
    (evId ? '<button type="button" class="fcoe" data-act="row" data-type="event" data-id="'+evId+'">'+sqPx(evId, 36)+'<span><small>For</small>'+esc(EVENTS[evId].title)+'<small>'+esc(relDay(EVENTS[evId]) + ' · ' + whereOf(EVENTS[evId]))+'</small></span></button>' : '') +
    '<div class="fcof"><span class="fcoby">' + (c.hostId && PEOPLE[c.hostId] ? avHTML(c.hostId) : '') + '<span>'+esc(mine ? 'You' : c.hostName)+'<small>open until '+esc(fmtShort(c.expiresAt))+'</small></span></span>' + calloutAct(coId) + '</div></div>';

function coTileHTML(x){
  var coId = x.id || x, c = calloutOf(coId), evId = calloutEventId(c), why = x.why && x.why.t;
  return '<div class="cotile'+selCls('callout', coId)+'" data-type="callout" data-id="'+coId+'">' +
    '<span class="fcotag">'+ic('callout',14)+'Call out</span>' + flink('callout', coId, '<b class="cta">'+esc(c.title)+'</b>') +
    '<span class="ctw">'+esc(c.hostName + (evId ? ' · for ' + EVENTS[evId].title : ''))+'</span>' +

}
function viaText(x){
  var n = x.via.map(function(v){ return whoName(v); });
  var names = n.length <= 2 ? n.join(' and ') : n[0] + ', ' + n[1] + ' and ' + (n.length - 2) + ' more';
  if (x.popular) return n.length ? 'Followed by ' + names : person(x.id).bio || '';
  return names + (n.length === 1 ? ' follows ' : ' follow ') + whoName(x.id);
}
function peopleCardHTML(list, title, note){
  return '<section class="fitem ffof"><h3 class="ffh">'+esc(title)+'</h3>' + (note ? '<p class="ffn">'+esc(note)+'</p>' : '') +
    list.map(function(x){ return fPersonCard(x.id, viaText(x)); }).join('') + '</section>';

var HZEXPLAINED = false;
function feedEntryHTML(e, cls){
  var at = ' data-ts="'+tsIso(e.ms)+'" data-verb="'+e.verb+'"';
  if (e.verb === 'posted_callout') return '<article class="fitem fitco'+(cls ? ' ' + cls : '')+'"'+at+'>' + fCalloutCard(e.objId, e.ms) + '</article>';
  var lead = e.actors.slice(0, 2), body = '';
  if (e.objType === 'event') body = fEventCard(e.objId);
  else if (e.objType === 'horizon'){
    var onlyAdded = !e.parts.published_horizon && !e.parts.created_horizon && e.parts.added_to_horizon && e.eventIds.length;
    if (onlyAdded){
      body = e.eventIds.slice(0, 2).map(function(id){ return fEventCard(id, true); }).join('');
      if (e.eventIds.length > 2) body += '<button class="fmore" data-act="row" data-type="horizon" data-id="'+e.objId+'">and '+(e.eventIds.length - 2)+' more on '+esc(HORIZONS[e.objId].name)+'</button>';
    } else {
      body = fHorizonCard(e.objId);
      if (!HZEXPLAINED && !hzOwnedByMe(e.objId)){ HZEXPLAINED = true; body = '<p class="fexpl">'+esc(KINDDESC.horizons)+'</p>' + body; }
    }
  } else if (e.objType === 'person') body = e.objs.slice(0, 3).map(function(pid){ return fPersonCard(pid); }).join('') +
    (e.objs.length > 3 ? '<div class="fmore static">and '+(e.objs.length - 3)+' more</div>' : '');
  /* fresh news of someone deciding to go is the moment to reach out */
  var who = e.actors.filter(function(p){ return p !== myActor(); })[0];
  var msg = (e.verb === 'going' || e.verb === 'interested') && isFresh(e.ms) && who && PEOPLE[who]
    ? '<button type="button" class="fmsg" data-act="dm" data-id="'+who+'" aria-label="Message '+esc(person(who).displayName)+'">'+ic('chat',14)+'Message</button>' : '';
  return '<article class="fitem'+(cls ? ' ' + cls : '')+'"'+at+'><div class="fav'+(lead.length > 1 ? ' two' : '')+'">' + lead.map(function(p){ return avHTML(p === myActor() ? 'self' : p, 'a32'); }).join('') + '</div>' +
    '<div class="fbody"><div class="fline"><span class="fsent">'+actSentence(e)+'</span>'+msg+timeHTML(e.ms)+'</div>' + body + '</div></article>';

function homeHTML(){
  var sc = homeScope(), parts = homeParts(), entries = parts.stream, cos = homeCallouts(), h = '';

  h += '<div class="greet deskgreet fgreet"><h2>'+esc(greeting())+'</h2>'+(L.phone ? '<p>'+esc(folderSub({ kind:'home' }))+'</p>' : '')+'</div>';
  /* following nobody: Home is the whole network until you follow someone */
  if (S.loggedIn && sc.all) h += peopleCardHTML(popularPeople().slice(0, 3), 'Make Home yours',
    'Home shows what the people you follow do. You don’t follow anyone yet, so here is everyone on Hypernet.');
  if (cos.length) h += '<div class="band coband">Open call outs' + (S.loggedIn && !sc.all && !sc.few ? ' for you' : '') + ' <span class="cnt">'+cos.length+'</span>' +
    '<span class="costep"><button type="button" class="ib" data-act="costep" data-id="-1" aria-label="Previous call outs">'+ic('back',14)+'</button>' +
    '<button type="button" class="ib" data-act="costep" data-id="1" aria-label="Next call outs">'+ic('back',14).replace('class="ic"', 'class="ic" style="transform:scaleX(-1)"')+'</button></span></div>' +

  entries.forEach(function(e, i){

    h += feedEntryHTML(e);
    if ((i === 2 || (i > 2 && (i - 2) % 9 === 0)) && fi < fof.length){
      var chunk = S.loggedIn ? fof.slice(fi, fi + 2) : fof; fi += chunk.length;
      h += peopleCardHTML(chunk, S.loggedIn ? 'People your friends follow' : 'People to follow');
    }
  });
  if (!entries.length) h += '<div class="empty">'+(sc.few ? 'The people you follow haven’t done anything in the last three weeks.' : 'Nothing has happened in your network in the last three weeks.') +
    (sc.few ? '' : '<br><button class="btn primary" data-act="explorekind" data-id="">'+ic('explore')+'Explore</button>') + '</div>';
  /* following only a few people: the rest of the network keeps Home alive, below your people and marked as such */
  if (parts.net.length){
    h += '<div class="band netband">Around the network</div><p class="fnetnote">From people you don’t follow yet. Follow a few more and Home becomes yours.</p>';
    parts.net.forEach(function(e){ h += feedEntryHTML(e, 'fnet'); });
  }
  if (entries.length || parts.net.length) h += '<div class="fend">That’s the last three weeks. <button class="btn" data-act="explorekind" data-id="events">'+ic('cal')+'All events</button></div>';
  return h;
}
/* the call-out strip shows whole tiles only: as many columns as fit, the rest a step away */
function fitStrip(){
  var s = document.querySelector('#listbody .costrip'); if (!s) return;
  var w = s.clientWidth - 32, cols = Math.max(1, Math.min(3, Math.floor((w + 16) / 216)));
  s.style.setProperty('--tw', Math.max(160, Math.floor((w - (cols - 1) * 16) / cols)) + 'px');
  var band = s.previousElementSibling; if (band) band.classList.toggle('more', s.querySelectorAll('.cotile').length > cols);
}
function stepStrip(dir){
  var s = document.querySelector('#listbody .costrip'); if (!s) return;
  s.scrollBy({ left: dir * Math.max(160, s.clientWidth - 32 + 16), behavior:'smooth' });
}
function renderHome(){
  var lb = $('listbody'), top = lb.scrollTop, cs0 = lb.querySelector('.costrip'), left = cs0 ? cs0.scrollLeft : 0;
  lb.innerHTML = homeHTML();
  fitStrip();
  var cs = lb.querySelector('.costrip'); if (cs && left) cs.scrollLeft = left;
  lb.scrollTop = top;

<script>
/* =========================================================================
   10. CHROME — toolbar, header, navigation, phone shell

function navRow(f, icon, label, opts){

          : !opts.person && sameFolder(S.folder, f) && !(L.phone && S.folder.kind === 'you');

     : opts.hz ? 'data-act="open-reset" data-type="horizon" data-id="'+f.id+'"'

    icon + '<span class="nlab">'+esc(label)+(opts.sub ? ' <span class="nsub">'+esc(opts.sub)+'</span>' : '')+'</span>' +
    (cnt !== '' ? '<span class="ncnt">'+cnt+'</span>' : '') + '</div>';
}
function renderNav(){

    var me = PEOPLE['self'];
    h += '<div class="acctcard"><div class="acrow" data-act="open-reset" data-type="person" data-id="self" role="button">' + avHTML('self','a40') +
         '<div class="an">'+esc(me.displayName)+'<small>@'+esc(me.handle)+(citiesOf(me).length ? ' · '+esc(citiesOf(me).join(', ')) : '')+'</small></div></div>' +
         (me.bio ? '<p class="acbio">'+esc(me.bio)+'</p>' : '') +

         '<button class="nx" data-act="clearsearch" aria-label="Clear search">'+ic('close',14)+'</button></div>';

  });
  if (!S.loggedIn){
    h += '<p class="navnote">Join to keep the events you’re going to, your Event Horizons and the people you follow here.</p>';
    $('navbody').innerHTML = h;

  }
  h += '<div class="navh">Your events</div>';
  h += navRow({kind:'going'}, ic('check'), 'Going', { count: rsvpList('going').length || '' });
  h += navRow({kind:'interested'}, ic('heart'), 'Interested', { count: rsvpList('interested').length || '' });
  h += navRow({kind:'hosting'}, ic('star'), 'Hosting', { count: MYEVENTS.length || '' });
  var npro = Object.keys(PROMOTED).filter(function(k){ return PROMOTED[k] && EVENTS[k]; }).length;
  if (npro) h += navRow({kind:'promoted'}, ic('promote'), 'Promoted', { count: npro });

  var followed = Object.keys(HZFOLLOW).filter(function(k){ return HZFOLLOW[k] && HORIZONS[k]; });

    h += '<div class="navh">Following</div>';

  }

    h += '<div class="navh">People you follow</div>';

function czSetColor(k, v, from){
  v = String(v || '').trim().toLowerCase();
  if (/^#?[0-9a-f]{3}$/.test(v)){ v = v.replace('#', ''); v = '#' + v[0] + v[0] + v[1] + v[1] + v[2] + v[2]; }
  else if (/^#?[0-9a-f]{6}$/.test(v)) v = '#' + v.replace('#', '');
  else return;
  if (DRAFT[k] === v) return;
  DRAFT[k] = v; DRAFT.lookTouched = true;
  czRefresh(from);
}

/* ---- the square image: checked, centre-cropped and downscaled in the browser ----
   STORAGE: for now the result is a data URL kept on the look (look.image) and saved with it in localStorage.
   With the backend this is where the file goes to real storage instead (Vercel Blob; its URL is what look.image
   holds in the look's JSON column in Neon). Only squareImage()'s callers change: they get a URL back, not a data URL. */
var IMGMAX = 10 * 1024 * 1024, IMGPX = 512, IMGBUDGET = 150 * 1024;
function imageProblem(file){
  if (!file) return 'No file chosen.';
  if (!/^image\//.test(file.type || '')) return 'That file isn’t an image. Choose a JPG, PNG, WebP or GIF.';
  if (file.size > IMGMAX) return 'That image is ' + (file.size / 1048576).toFixed(1) + ' MB. The limit is 10 MB.';
  return '';
}
function squareImage(file, bg){
  return new Promise(function(resolve, reject){
    var src = URL.createObjectURL(file), img = new Image();
    img.onload = function(){
      URL.revokeObjectURL(src);
      var w = img.naturalWidth, h = img.naturalHeight, s = Math.min(w, h);
      if (!s) return reject(new Error('empty image'));
      var out = Math.min(IMGPX, s), c = document.createElement('canvas');
      c.width = c.height = out;
      var g = c.getContext('2d');
      g.fillStyle = bg || '#ffffff'; g.fillRect(0, 0, out, out);          /* a transparent picture sits on the look's ground */
      g.imageSmoothingQuality = 'high';
      g.drawImage(img, (w - s) / 2, (h - s) / 2, s, s, 0, 0, out, out);
      var url = '';
      for (var q = .86; q >= .38; q -= .12){
        url = c.toDataURL('image/webp', q);
        if (!/^data:image\/webp/.test(url)) url = c.toDataURL('image/jpeg', q);   /* browsers that cannot write WebP */
        if (url.length * .75 <= IMGBUDGET) break;
      }
      resolve(url);
    };
    img.onerror = function(){ URL.revokeObjectURL(src); reject(new Error('unreadable image')); };
    img.src = src;
  });
}
function czTakeFile(file){
  var err = $('cz-imgerr'), bad = imageProblem(file), d = DRAFT;
  if (err) err.textContent = bad;
  if (bad || !d) return;
  squareImage(file, d.bg).then(function(url){
    if (DRAFT !== d) return;
    d.image = url; d.lookTouched = true; paintWiz(); schedulePersist();
  }, function(){ var e2 = $('cz-imgerr'); if (e2) e2.textContent = 'That image couldn’t be read. Try another file.'; });
}

  if (a === 'start'){ var s = LOOKSTARTS[+b.getAttribute('data-i')]; DRAFT.bg = s.bg; DRAFT.ink = s.ink; DRAFT.accent = s.accent; }
  else if (a === 'rmimg') DRAFT.image = null;
  else if (a === 'reset') Object.assign(DRAFT, { bg:window.HN_PLAIN.bg, ink:window.HN_PLAIN.ink, accent:window.HN_PLAIN.accent, image:null });
  DRAFT.lookTouched = true; paintWiz(); schedulePersist();
});

/* ---- what each step needs before you can go on (owner, 2026-10-04: "not possible to go to the next step until you have
   everything filled out"). Basics: a title, a start date (a new event: today or later), an end on or after the start if
   there is one, and where it is — a place, or Online. Words: a description. Look: nothing, it is optional. ---- */
function wizEvent(d){ return !!d && (!d.editing || d.mode === 'edit'); }
function wizMissing(d, step){
  var m = {};
  if (!wizEvent(d)) return m;
  if (step === 1){
    var st = isoDate(d.date), en = String(d.end || '').trim() ? isoDate(d.end) : '';
    if (!String(d.title || '').trim()) m.title = 'Add a title';
    if (!st) m.date = 'Add the day it starts';
    else if (d.mode !== 'edit' && st < TODAY_ISO) m.date = 'Pick today or a later day';
    if (en === null || (en && st && en < st)) m.end = 'It ends before it starts';
    if (!d.online && !String(d.city || '').trim()) m.city = 'Add where it is, or tick Online';
  }
  if (step === 2 && !String(d.desc || '').trim()) m.desc = 'Add a line or two about it';
  return m;
}
function wizValid(d, step){ return !Object.keys(wizMissing(d, step)).length; }
/* the first step (of those before `upTo`) that still needs something; 0 = none */
function wizFirstBad(d, upTo){ for (var i = 1; i < Math.min(upTo || 3, 3); i++) if (!wizValid(d, i)) return i; return 0; }
function wizReach(d, step){ return !wizFirstBad(d, step); }
var WIZFIELD = { title:'w-t', date:'w-d', end:'w-e', city:'w-c', desc:'w-desc' };
var WIZNEED = { title:'a title', date:'the start date', end:'an end after the start', city:'where it is', desc:'a description' };
/* "Still needed: a title and where it is" — what the button beside it is waiting for */
function wizNeedText(d){
  var upTo = d.mode === 'edit' || d.step === 3 ? 3 : d.step + 1, need = [];
  for (var i = 1; i < upTo; i++) Object.keys(wizMissing(d, i)).forEach(function(k){ need.push(WIZNEED[k]); });
  if (!need.length) return '';
  return 'Still needed: ' + (need.length === 1 ? need[0] : need.slice(0, -1).join(', ') + ' and ' + need[need.length - 1]);
}
/* show a step with what it still needs, inline, and put the cursor on the first of them */
function wizShowMissing(step){

  var k = Object.keys(wizMissing(DRAFT, step))[0]; if (k) focusIn(WIZFIELD[k]);
}
/* once you have tried to go on, the messages follow what you type (without repainting the field you are in) */
function wizSyncErrs(){
  var dl = DLGS[DLGS.length-1]; if (!dl || !DRAFT) return;
  var m = DRAFT.showErr ? wizMissing(DRAFT, DRAFT.step) : {};
  dl.querySelectorAll('[data-err]').forEach(function(sp){
    var k = sp.getAttribute('data-err'), msg = m[k] || '', inp = $(WIZFIELD[k]);
    if (sp.textContent !== msg) sp.textContent = msg;
    sp.hidden = !msg;
    if (inp){ if (msg) inp.setAttribute('aria-invalid', 'true'); else inp.removeAttribute('aria-invalid'); }
  });
}
function wizFootHTML(){

  var need = '<span class="wizneed" id="wiz-need" role="status">'+esc(wizNeedText(d))+'</span>', all = !wizFirstBad(d);

function applySnap(s){

  if (S.folder.kind !== 'search') SEARCHRET = null;

var SYNCT = null;

    if (navKeyOf(cur) === navKeyOf(s) && s.idx > 0){ ROUTE.ignore++; setTimeout(function(){ ROUTE.ignore = 0; }, 1500); history.back(); return; }

/* ---- where you were on the page: kept per history entry, and per phone tab ---- */
var CURSCROLL = { list:0, detail:0, nav:0, chats:0, shelves:{} };
function copyScroll(sc){ sc = sc || {}; return { list:sc.list || 0, detail:sc.detail || 0, nav:sc.nav || 0, chats:sc.chats || 0, shelves:Object.assign({}, sc.shelves || {}) }; }

  sc = copyScroll(sc);
  $('listbody').scrollTop = sc.list; $('dscroll').scrollTop = sc.detail; $('navbody').scrollTop = sc.nav;
  document.querySelectorAll('#listbody .srow[data-shelf]').forEach(function(r){ r.scrollLeft = sc.shelves[r.getAttribute('data-shelf')] || 0; });

/* a new place starts at the top, unless it is the same list with something opened on it */
function placeScroll(cur, s, same){

var SCROLLT = null;

/* the app's own back buttons: the same step the phone's back gesture takes */
function navBack(){

  ROUTE.applying = true;

/* a link (not a history step): its row, if the list has one, is lit and in view */
function revealSel(){
  var el = document.querySelector('#listbody .row.sel, #listbody .track.sel, #listbody .fsel, #listbody .card2.sel');

}
function rootSnap(tab){
  var f = tabRootFolder(L.phone ? tab : 'home');

}
function startRoutes(){
  L = computeLayout();

  ROUTE.ready = true;
  var cur = snapNow();
  var root = rootSnap(S.tab), deep = !st && navKeyOf(cur) !== navKeyOf(root);

    root.idx = 0; history.replaceState(root, '', hashOf(root));

/* =========================================================================
   15. RENDER + BOOT
   ========================================================================= */
function render(){
  L = computeLayout();
  noticeNewEvents();
  var app = $('app');
  if (!L.phone){
    /* a phone conversation screen becomes the chat dock on a wider screen */
    var ct = S.stack.filter(function(it){ return it.type === 'chat'; }).pop();
    if (ct){ S.stack = S.stack.filter(function(it){ return it.type !== 'chat'; }); S.chatOpen = ct.id; S.rightOpen = true; S.lastOpened = 'right'; L = computeLayout(); }
    if (S.folder.kind === 'you' || S.folder.kind === 'chats') goFolder({ kind:'home' });
    /* a horizon opened as a page (a phone habit, or a link) becomes the destination on a wide screen */
    var hi = -1; S.stack.forEach(function(it, i){ if (it.type === 'horizon' && HORIZONS[it.id]) hi = i; });
    if (hi >= 0){ var hid0 = S.stack[hi].id; S.stack = S.stack.slice(hi + 1); S.folder = { kind:'horizon', id:hid0 }; }
  } else if (S.folder.kind === 'horizon'){
    /* and on a phone it is a page on the Horizons tab */
    var hid1 = S.folder.id; S.folder = { kind:'explore', id:'horizons' }; S.tab = S.tab === 'home' || !S.tab ? 'explore' : S.tab;
    if (S.tab !== 'explore') S.folder = tabRootFolder(S.tab);

  var conv = phoneConv();
  var scr = L.phone ? ((conv || (S.tab === 'chats' && !S.stack.length)) ? 'chats' : (S.tab === 'you' && S.folder.kind === 'you' && !S.stack.length) ? 'you' : 'center') : '';
  L.scr = scr;
  if (!L.phone) app.style.setProperty('--nav-w', L.navW + 'px');
  app.className = [L.phone ? 'phone' : 'desk', L.left ? 'l-open' : '', L.right ? 'r-open' : '', L.narrowDock ? 'dock-narrow' : '', L.dockOver ? 'dock-over' : '', L.split ? 'split' : 'push',
    isCal() ? 'v-cal' : '', S.stack.length ? 'has-detail' : '', scr ? 'scr-' + scr : '',
    conv && S.loggedIn ? 'conv-open' : '', !L.phone && S.loggedIn ? 'readmarks' : '', S.loggedIn ? '' : 'preview', L.paneClosed ? 'pane-closed' : ''].filter(Boolean).join(' ');
  document.body.className = L.phone ? 'is-phone' : 'is-desk';

  if (L.phone){ renderAppbar(); renderTabbar(); } else renderToolbar();
  if (L.left || scr === 'you') renderNav();

  renderPreview();

}
/* what you make and keep survives a reload. The network (events, horizons and call outs people
   made here) is shared; each account keeps its own relations and chats. */
var STORE = 'hypernet-feed:v2';
function isCreatedHz(k){ var h = HORIZONS[k]; return !!h && (!!h.ownerAcct || k === 'horizon-default'); }

var STOREFULL = false;
function storeSet(key, val){

  catch(e){
    var full = e && (e.name === 'QuotaExceededError' || e.name === 'NS_ERROR_DOM_QUOTA_REACHED' || e.code === 22 || e.code === 1014 || /quota/i.test(String(e.message)));

/* saved on change, not on every render: render marks the store dirty and it is written once things settle (and when

var PERSISTED = null;
function persist(){
  clearTimeout(PERSISTT); PERSISTT = null;

    if (S.loggedIn && S.acct) ACCTS[S.acct] = captureAcct();
    var evs = {}, recs = {}, themes = {}, hzs = {}, covers = {}, hzthemes = {};
    Object.keys(EVENTS).filter(function(k){ return /^evt-new-/.test(k); }).forEach(function(k){ evs[k] = EVENTS[k]; recs[k] = REC[k]; themes[k] = window.HYPERNET_THEMES.themes[k]; });
    Object.keys(HORIZONS).filter(isCreatedHz).forEach(function(k){ hzs[k] = HORIZONS[k]; if (HZCOVER[k]) covers[k] = HZCOVER[k]; if (HZTHEME[k]) hzthemes[k] = HZTHEME[k]; });
    /* hosts can change events they did not create here (the demo's own), so those edits are kept too */
    var edits = {};
    Object.keys(EDITED).forEach(function(k){ if (EVENTS[k] && !/^evt-new-/.test(k)){ var th = window.HYPERNET_THEMES.themes[k] || null; edits[k] = { ev:EVENTS[k], rec:REC[k] || null, theme:th, plain:!th }; } });

function restore(){

var PERSISTT = null;
function schedulePersist(){ if (!PERSISTT) PERSISTT = setTimeout(persist, 300); }

window.addEventListener('pagehide', function(){ if (PERSISTT) persist(); });

(function boot(){

  loadRealEvents().then(start, start);
  setTimeout(start, 2500);
})();
