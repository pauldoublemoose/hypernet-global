  if (WIN.max){ w.style.left = pad + 'px'; w.style.top = pad + 'px'; w.style.width = (mw - 2 * pad) + 'px'; w.style.height = (mh - 2 * pad) + 'px'; return; }
  var g = L.wg || { x:pad, y:pad, w:Math.min(WINW.max, mw - 2 * pad), h:mh - 2 * pad };
  var ww = Math.min(g.w, mw), wh = Math.max(240, Math.min(g.h, mh));
  var x = WIN.x != null ? WIN.x : g.x;
  var y = WIN.y != null ? WIN.y : g.y;
  x = Math.max(0, Math.min(mw - ww, x)); y = Math.max(0, Math.min(mh - wh, y));
  if (WIN.x != null){ WIN.x = x; WIN.y = y; }
  w.style.left = x + 'px'; w.style.top = y + 'px'; w.style.width = ww + 'px'; w.style.height = wh + 'px';
}
function toggleMaxWin(){ if (L.phone || !S.stack.length) return; WIN.max = !WIN.max; renderDetail(); }
/* drag by the title bar (not by its buttons) */
(function(){
  var d = null;
  document.addEventListener('pointerdown', function(ev){
    var bar = ev.target.closest && ev.target.closest('#win > #dbar');
    /* the window that was touched last is in front of the chat dock, and the other way round */
    if (ev.target.closest){ var inWin = !!ev.target.closest('#win'), inDock = !!ev.target.closest('#chats'); if (inWin || inDock) $('app').classList.toggle('dock-front', inDock); }
    if (!bar || L.phone || ev.button !== 0 || ev.target.closest('button') || WIN.max) return;
    var w = $('win');
    d = { dx:ev.clientX - w.offsetLeft, dy:ev.clientY - w.offsetTop };
    try { bar.setPointerCapture(ev.pointerId); } catch(e){}
    w.classList.add('dragging');
    ev.preventDefault();
  });
  document.addEventListener('pointermove', function(ev){
    if (!d) return;
    WIN.x = ev.clientX - d.dx; WIN.y = ev.clientY - d.dy;
    placeWin();
  });
  var end = function(){ if (!d) return; d = null; $('win').classList.remove('dragging'); };
  document.addEventListener('pointerup', end); document.addEventListener('pointercancel', end);
  document.addEventListener('dblclick', function(ev){
    if (ev.target.closest && ev.target.closest('#win > #dbar') && !ev.target.closest('button')) toggleMaxWin();
  });
})();
</script>
<script>
/* =========================================================================
   7b. EXPLORE'S OVERVIEW — Spotify's structure in a 2000-era skin
   Sections of big squares: sideways shelves on a phone, one fitted row on a wider screen. Event squares are the album art;
   horizons are playlists with a cover built from their events.
   ========================================================================= */
/* an event square at any pixel size */
function sqPx(id, px, extra){ return sqT(TH(id), px, extra); }
/* a horizon's cover: the owner's pick, or a 2×2 mosaic of its first four events */
function mosaicOf(ids, px){
  ids = ids.filter(function(id){ return EVENTS[id]; });
  if (!ids.length) return '<div class="mosaic empty" style="width:'+px+'px;height:'+px+'px">'+ic('horizon', Math.round(px/3))+'</div>';
  if (ids.length < 4) return '<div class="mosaic one" style="width:'+px+'px;height:'+px+'px">' + sqPx(ids[0], px) + '</div>';
  var h = Math.floor(px/2);
  return '<div class="mosaic" style="width:'+(h*2)+'px;height:'+(h*2)+'px">' + ids.slice(0,4).map(function(id){ return sqPx(id, h); }).join('') + '</div>';
}
function hzMosaic(hzId, px){
  var hz = HORIZONS[hzId], ids = hzEventIds(hzId);
  if (hzOwnSquare(hzId)) return '<div class="mosaic one" style="width:'+px+'px;height:'+px+'px">' + sqT(HZTHEME[hzId], px) + '</div>';
  if (!ids.length) return '<div class="mosaic empty" style="width:'+px+'px;height:'+px+'px">'+ic('horizon', Math.round(px/3))+'</div>';
  if (HZCOVER[hzId] || ids.length < 4) return '<div class="mosaic one" style="width:'+px+'px;height:'+px+'px">' + sqPx(hzCover(hzId), px) + '</div>';
  var h = Math.floor(px/2);
  return '<div class="mosaic" style="width:'+(h*2)+'px;height:'+(h*2)+'px">' + ids.slice(0,4).map(function(id){ return sqPx(id, h); }).join('') + '</div>';
}
function cardTag(it){
  if (!S.loggedIn) return '';
  if (it.type === 'event'){
    if (WENT[it.id]) return '<span class="ctag">Went</span>';
    var st = stateOf(it.id);
    return st ? '<span class="ctag">'+{ going:'Going', interested:'Interested', hosting:'Hosting' }[st]+'</span>' : PROMOTED[it.id] ? '<span class="ctag">Promoted</span>' : '';
  }
  if (it.type === 'horizon') return hzOwnedByMe(it.id) ? '<span class="ctag">Yours</span>' : HZFOLLOW[it.id] ? '<span class="ctag">Following</span>' : '';
  if (it.type === 'callout') return isOwnCallout(calloutOf(it.id)) ? '<span class="ctag">Yours</span>' : myReplies(it.id).length ? '<span class="ctag">Replied</span>' : '';
  return '';
}
function cardHTML(it, px){
  var art, t, sub, sub2 = '', soc = '';
  px = px || 150;
  if (it.type === 'event'){
    var e = EVENTS[it.id], end = endOf(e);
    art = sqPx(it.id, px);
    t = e.title; sub = relDay(e) + (end && dayDiff(e.date) > 6 ? ' +' + (nDays(e.date, end) - 1) + 'd' : ''); sub2 = whereOf(e);
    soc = isPast(lastDay(e)) ? '' : socialHTML(it.id, 'csoc');
  } else if (it.type === 'horizon'){
    var hz = HORIZONS[it.id];
    art = hzMosaic(it.id, px);
    t = hz.name; sub = hz.ownerName; sub2 = plural(hz.eventIds.length, 'event');
  } else {
    var c = calloutOf(it.id);
    art = '<div class="coart">'+ic('callout', px > 160 ? 48 : 40)+'<span>Looking for</span><b>'+esc(c.title)+'</b></div>';
    t = c.hostName; sub = 'until ' + fmtShort(c.expiresAt);
  }
  return '<div class="card2'+(isSel(it) ? ' sel' : '')+'" data-act="row" data-type="'+it.type+'" data-id="'+it.id+'" role="button">' +
    '<div class="cart">'+art+cardTag(it)+'</div><div class="ct2">'+esc(t)+'</div><div class="cs2">'+esc(sub)+'</div>'+(sub2 ? '<div class="cs2">'+esc(sub2)+'</div>' : '')+soc+'</div>';
}
function upcoming(e){ return !isPast(lastDay(e)); }
function plural(n, w){ return n + ' ' + w + (n === 1 ? '' : 's'); }
/* this week's days read as days: Today, Tomorrow, Wed · in 3 days */
function relDay(e){
  var d = dayDiff(e.date);
  if (d < 0 && !isPast(lastDay(e))) return 'On now';
  if (d === 0) return 'Today';
  if (d === 1) return 'Tomorrow';
  if (d > 1 && d <= 6) return DAY[dOf(e.date).getDay()] + ' · in ' + d + ' days';
  return fmtShort(e.date);
}
/* horizons worth following: the newly published first, then the most followed */
function popularHorizons(){
  return browsableHorizons().filter(function(k){ return HORIZONS[k].isPublished; }).sort(function(a,b){
    var na = HORIZONS[a].ownerAcct ? 1 : 0, nb = HORIZONS[b].ownerAcct ? 1 : 0;
    return (nb - na) || (hzFollowers(b) - hzFollowers(a));
  });
}
/* the sections of Explore's overview, in order. Each one also backs a "Show all" list. */
var HOMESECTIONS = ['week','followed','soon','announced','yourhz','horizons','callouts'];
function shelfItems(id){
  var ev = function(list){ return list.map(function(e){ return { type:'event', id:e.id }; }); };
  var up = feedEvents().filter(upcoming);
  if (id === 'week') return ev(up.filter(function(e){ return dayDiff(e.date) <= 6; }));
  if (id === 'soon') return ev(up.filter(function(e){ return dayDiff(e.date) > 6; }).slice(0, 12));
  if (id === 'announced') return ev(Object.keys(NEXTED).map(function(k){ return EVENTS[NEXTED[k]]; }).filter(canSeeEvent).sort(byDate));
  if (id === 'horizons') return popularHorizons().filter(function(k){ return !(S.loggedIn && (HZFOLLOW[k] || MYHORIZONS.indexOf(k) >= 0)); }).map(function(k){ return { type:'horizon', id:k }; });
  if (id === 'yourhz') return !S.loggedIn ? [] : MYHORIZONS.slice().reverse().concat(Object.keys(HZFOLLOW).filter(function(k){ return HZFOLLOW[k] && MYHORIZONS.indexOf(k) < 0; })).filter(function(k){ return HORIZONS[k]; }).map(function(k){ return { type:'horizon', id:k }; });
  if (id === 'callouts') return openCallouts().map(function(c){ return { type:'callout', id:c.id }; });
  if (id === 'followed'){
    if (!S.loggedIn) return [];
    return ev(up.filter(function(e){ var hp = hostPersonOf(e); return hp && hp.id !== 'self' && PFOLLOW[hp.id]; }));
  }
  return [];
}
function shelfTitle(id){
  return { week:'This week', soon:'Coming up', announced:'Announced burns', yourhz:'Your Event Horizons', horizons:'Event Horizons worth following',
           callouts:'Call outs',
           followed:'From people you follow' }[id] || '';
}
/* each event shows up once in the overview, in the first section that has it */
function homeSections(){
  var seen = {};
  return HOMESECTIONS.map(function(id){
    var items = shelfItems(id).filter(function(it){
      var k = it.type + ':' + it.id;
      if (seen[k]) return false; seen[k] = 1; return true;
    });
    return { id:id, title:shelfTitle(id), items:items };
  }).filter(function(sec){ return sec.items.length; });
}
function shelvesHTML(){
  var h = '<div class="shelves">', n = shelfShown(), px = L.phone || !L.fit ? 150 : L.fit.sq;
  homeSections().forEach(function(sec){
    /* a phone's shelf offers Show all past two; a desktop's row, once it holds fewer than there are */
    var more = L.phone ? sec.items.length > 2 : sec.items.length > n;
    h += '<section class="shelf"><div class="shh"><h3>'+esc(sec.title)+' <span class="cnt">'+sec.items.length+'</span></h3>' +
         (more ? '<button class="showall" data-act="shelfall" data-id="'+sec.id+'">Show all</button>' : '') + '</div>';
    h += '<div class="srow" data-shelf="'+sec.id+'"'+(L.phone ? '' : ' style="--sq:'+px+'px"')+'>' +
         sec.items.slice(0, n).map(function(it){ return cardHTML(it, px); }).join('') + '</div></section>';
  });
  return h + '</div>';
}
function renderShelves(){
  var lb = $('listbody'), top = lb.scrollTop, left = {};
  lb.querySelectorAll('.srow').forEach(function(r){ left[r.getAttribute('data-shelf')] = r.scrollLeft; });
  lb.innerHTML = shelvesHTML();
  lb.querySelectorAll('.srow').forEach(function(r){ var v = left[r.getAttribute('data-shelf')]; if (v) r.scrollLeft = v; });
  lb.scrollTop = top;
  S.rows = overviewItems();
}

/* =========================================================================
   8. CALENDAR — a view of the destination you are in
   ========================================================================= */
function calEvents(){ return destEvents().filter(function(e){ return (S.calMine && S.loggedIn) ? !!RSVP[e.id] || MYEVENTS.indexOf(e.id) >= 0 : true; }); }
function eventsOn(iso){
  return calEvents().filter(function(e){
    var end = endOf(e);
    return e.date === iso || (end && e.date < iso && iso <= end);
  }).sort(function(a,b){ return a.title < b.title ? -1 : 1; });
}
function calBlock(e){
  var t = TH(e.id);
  return '<div class="calev" style="'+themeVars(t)+'" data-act="open-reset" data-type="event" data-id="'+e.id+'">' +
    '<span class="cg">'+esc(t.glyph)+'</span><span>'+esc(e.title)+'</span>' +
    (S.loggedIn && RSVP[e.id]==='going' ? '<span style="margin-left:auto">'+ic('check',12)+'</span>' : '') + '</div>';
}
function narrowCal(){ return L.phone || L.cw < 640; }
function monthGrid(anchorIso){
  var a = dOf(anchorIso), y = a.getFullYear(), m = a.getMonth();
  var first = new Date(y, m, 1, 18), start = new Date(first);
  start.setDate(1 - ((first.getDay() + 6) % 7));
  var narrow = narrowCal();
  var h = '<div class="calgrid"><div class="caldow">' + (narrow ? ['M','T','W','T','F','S','S'] : ['Mon','Tue','Wed','Thu','Fri','Sat','Sun']).map(function(d){ return '<div>'+d+'</div>'; }).join('') + '</div>';
  for (var w = 0; w < 6; w++){
    h += '<div class="calrow">';
    for (var d = 0; d < 7; d++){
      var day = new Date(start.getFullYear(), start.getMonth(), start.getDate() + w*7 + d, 18);
      var iso = isoOf(day), evs = eventsOn(iso);
      /* the whole day is the target: on a phone it lists that day below, on a desktop it opens the day */
      var picked = narrow && S.calDay === iso;
      h += '<div class="calcell'+(day.getMonth()!==m?' oth':'')+(iso===TODAY_ISO?' today':'')+(picked?' picked':'')+'" data-act="calday" data-id="'+iso+'" role="button" ' +
             'aria-label="'+esc(fmtDate(iso) + (evs.length ? ', ' + evs.length + ' event' + (evs.length === 1 ? '' : 's') : ''))+'"'+(narrow ? ' aria-pressed="'+picked+'"' : '')+'>' +
           '<span class="dn">'+day.getDate()+'</span>' +
           (narrow ? '<div class="dots">' + evs.slice(0,3).map(function(e){ return '<i style="'+themeVars(TH(e.id))+'"></i>'; }).join('') + '</div>'
                   : evs.map(calBlock).join('')) + '</div>';
    }
    h += '</div>';
  }
  if (narrow){
    var dayPick = S.calDay && dOf(S.calDay).getMonth() === m ? S.calDay : null;
    var list = dayPick ? eventsOn(dayPick).sort(byDate)
             : calEvents().filter(function(e){ var dd = dOf(e.date); return dd.getMonth() === m && dd.getFullYear() === y; }).sort(byDate);
    var head = dayPick ? fmtDate(dayPick) : MONFULL[m];
    h += '<div class="agenda"><div class="band">'+esc(head)+' <span class="cnt">'+list.length+'</span>' +
      (dayPick ? '<button class="calall" data-act="calday" data-id="'+dayPick+'">All of '+MONFULL[m]+'</button>' : '') + '</div>' +
      (list.length ? list.map(function(e){ return rowHTML({ type:'event', id:e.id }).replace('data-act="row"', 'data-act="open-reset"'); }).join('')
                   : '<div class="empty">Nothing on '+esc(head)+'.</div>') + '</div>';
  }
  return h + '</div>';
}
function weekGrid(anchorIso){
  var a = dOf(anchorIso), start = new Date(a.getFullYear(), a.getMonth(), a.getDate() - ((a.getDay()+6)%7), 18);
  var h = '<div class="calgrid" style="flex-direction:row">';
  for (var d = 0; d < 7; d++){
    var day = new Date(start.getFullYear(), start.getMonth(), start.getDate()+d, 18), iso = isoOf(day);
    h += '<div class="weekcol'+(iso===TODAY_ISO?' today':'')+'"><div class="wh" data-act="calday" data-id="'+iso+'" role="button">'+DAY[day.getDay()]+' '+day.getDate()+'</div>' +
         '<div class="wb">' + eventsOn(iso).map(calBlock).join('') + '</div></div>';
  }
  return h + '</div>';
}
function dayGrid(anchorIso){
  var evs = eventsOn(anchorIso), h = '<div class="calgrid">';
  if (!evs.length) h += '<div class="empty">Nothing on '+fmtDate(anchorIso)+'.</div>';
  for (var hr = 8; hr <= 23; hr++){
    h += '<div class="dayband"><div class="hr">'+('0'+hr).slice(-2)+':00</div><div class="slot">' + (hr === 18 ? evs.map(calBlock).join('') : '') + '</div></div>';
  }
  return h + '</div>';
}
function renderCalendar(){
  var mode = narrowCal() ? 'month' : S.calMode;
  var a = dOf(S.calAnchor);
  var title = mode === 'month' ? MONFULL[a.getMonth()] + ' ' + a.getFullYear() : mode === 'week' ? 'Week of ' + fmtShort(S.calAnchor) : fmtDate(S.calAnchor);
  /* on a phone the day tap is the day view, so month is the only mode */
  var modes = narrowCal() ? [] : ['day','week','month'];
  var bar = '<div class="calbar"><span class="ttl">'+esc(title)+'</span>' +
    '<button class="ib" data-act="calnav" data-id="-1" aria-label="Previous">'+ic('back')+'</button>' +
    '<button class="btn" data-act="caltoday">Today</button>' +
    '<button class="ib" data-act="calnav" data-id="1" aria-label="Next" style="transform:scaleX(-1)">'+ic('back')+'</button>' +
    '<span class="spring"></span>' +
    (modes.length ? '<span class="seg">' + modes.map(function(m){ return '<button class="'+(mode===m?'on':'')+'" data-act="calmode" data-id="'+m+'">'+titleCase(m)+'</button>'; }).join('') + '</span>' : '') +
    (S.loggedIn ? '<label><input type="checkbox" data-act="calmine"'+(S.calMine?' checked':'')+'> Only mine</label>' : '') + '</div>';
  var body = mode === 'month' ? monthGrid(S.calAnchor) : mode === 'week' ? weekGrid(S.calAnchor) : dayGrid(S.calAnchor);
  $('calcol').innerHTML = bar + '<div class="panel calpanel">' + body + '</div>';
}

/* =========================================================================
   9. THE RIGHT PANE — chats, and nothing else
   ========================================================================= */
function chatAv(c){ return avHTML(c.memberIds[0], 'a40'); }
function lastMsg(c){ return c.messages[c.messages.length-1]; }
/* when a message was sent: new ones carry a timestamp; the fixtures' "09:31" and "yesterday" are read on a
   morning clock that ends just before you arrived, so anything you send is newer */
var BOOTNOW = nowMs();
function msgTs(m){
  if (!m) return 0;
  if (m.ts) return typeof m.ts === 'number' ? m.ts : isoMs(m.ts);
  var t = String(m.t || ''), hm = t.match(/^(\d{1,2}):(\d{2})$/), H = 3600000;
  if (/^yesterday$/i.test(t)) return BOOTNOW - 22 * H;
  if (hm){ var ago = (10 - +hm[1] - +hm[2] / 60) * H; if (ago < 0) ago += 24 * H; return BOOTNOW - 60000 - ago; }
  return BOOTNOW - 48 * H;
}
function stamp(){ return { t:nowClock(), ts:tsIso(nowMs()) }; }
/* the chat list: newest message first; a chat with nothing in it yet is not listed */
function chatList(){
  /* a chat is listed once it has a message, or something you started typing in it (a draft floats to the top) */
  var ts = function(k){ return CHATDRAFT[k] && !CHATS[k].messages.length ? nowMs() : msgTs(lastMsg(CHATS[k])); };
  return CHATORDER.filter(function(k){ return CHATS[k] && (CHATS[k].messages.length || CHATDRAFT[k]); })
    .sort(function(a, b){ return ts(b) - ts(a); });
}
function msgPreview(m, c){
  if (!m) return 'No messages yet';
  var who = m.from === 'self' ? 'You: ' : '';
  if (m.from === 'sys') return m.text;
  return who + m.text;
}
function unreadChats(){ return S.loggedIn ? Object.keys(UNREADCHAT).filter(function(k){ return UNREADCHAT[k]; }).length : 0; }
/* no chats yet: message someone straight away */
function chatsEmptyHTML(){
  var ppl = ncPeopleAll().slice(0, 8);
  /* New chat is already in the header; the body offers the people */
  return '<div class="band">'+(ppl.some(function(k){ return PFOLLOW[k]; }) ? 'People you follow' : 'People on Hypernet')+'</div>' +
    ppl.map(function(pid){ var p = person(pid);
      return '<div class="chrow" data-act="dm" data-id="'+pid+'" role="button">'+avHTML(pid,'a40')+'<div class="cmn"><div class="cnm">'+esc(p.displayName)+'</div>' +
        '<div class="cpv">@'+esc(p.handle)+(p.bio ? ' · '+esc(p.bio) : '')+'</div></div><span class="lstate">Message</span></div>'; }).join('');
}
function chatListHTML(){
  var list = chatList();
  return '<div class="phead"><div class="ptitle">Chats</div><button class="btn primary" data-act="newchat">'+ic('edit')+'New chat</button></div>' +
    '<div class="panel">' + (list.length ? '' : chatsEmptyHTML()) + list.map(function(k){
      var c = CHATS[k], m = lastMsg(c), un = UNREADCHAT[k];
      return '<div class="chrow'+(un?' unread':'')+'" data-act="chatsel" data-id="'+k+'" role="button">' + chatAv(c) +
        '<div class="cmn"><div class="cnm">'+esc(c.name)+'</div><div class="cpv">'+(CHATDRAFT[k] ? '<b>Draft:</b> '+esc(CHATDRAFT[k]) : esc(msgPreview(m, c)))+'</div></div>' +
        '<div class="cside"><span class="ctime">'+esc(m ? m.t : '')+'</span>'+(un?'<span class="udot" aria-label="Unread"></span>':'')+'</div></div>';
    }).join('') + '</div>';
}
function convHTML(cid){
  var c = CHATS[cid], pid = c.memberIds[0];
  var sub = chatSub(c);
  /* their name and the profile button open their profile in a window over the chat; closing it leaves you here */
  var h = '<div class="phead"><button class="ib" data-act="chatback" aria-label="All chats">'+ic('back')+'</button>' +
    '<button type="button" class="ptitle ptbtn" data-act="chatprofile" data-id="'+pid+'">'+esc(c.name)+'<small>'+esc(sub)+'</small></button>' +
    '<button class="ib" data-act="chatprofile" data-id="'+pid+'" aria-label="Profile">'+ic('user')+'</button></div>';
  h += '<div class="conv"><div class="msgs" id="msgs" data-chat="'+cid+'">' + (c.messages.length ? c.messages.map(function(m){
    if (m.from === 'sys') return '<div class="msg sys">'+esc(m.text)+'</div>';
    var me = m.from === 'self';
    var head = '<div class="mfrom">'+(me ? '' : '<button type="button" class="mwho" data-act="chatprofile" data-id="'+esc(m.from)+'">'+esc(person(m.from).displayName)+'</button>')+'<span class="mt">'+esc(m.t)+'</span></div>';
    return '<div class="msg'+(me?' me':'')+'">'+head+'<div class="mbody">'+esc(m.text)+'</div></div>';
  }).join('') : '<div class="msg sys">No messages yet</div>') + '</div>';
  /* the box grows with what you write: Enter sends, Shift+Enter starts a new line */
  h += '<div class="composer"><textarea id="chatbox" rows="1" placeholder="Message '+esc(c.name.split(' ')[0])+'" autocomplete="off" aria-label="Message" aria-describedby="chathint">'+esc(CHATDRAFT[cid] || '')+'</textarea>' +
       '<button class="btn primary" data-act="sendchat">Send</button><span id="chathint" class="sr">Enter sends, Shift+Enter adds a new line</span></div></div>';
  return h;
}
function growBox(b){ if (!b) return; b.style.height = 'auto'; b.style.height = Math.min(b.scrollHeight + 2, 168) + 'px'; }
/* the open conversation (S.chatOpen) sits in the dock on a desktop or tablet, and is the Chats tab on a phone */
/* on a phone the open conversation is the Chats tab's screen (a window opened from it is a sheet over it) */
function phoneConv(){ return L.phone && S.tab === 'chats' && S.chatOpen && CHATS[S.chatOpen] ? S.chatOpen : null; }
function activeChat(){ return L.phone ? phoneConv() : (S.chatOpen && CHATS[S.chatOpen] ? S.chatOpen : null); }
function chatSub(c){ return PRESENCE[c.memberIds[0]] || 'offline'; }
function renderChats(){
  var el = $('chats');
  var visible = L.phone ? L.scr === 'chats' : L.right;
  if (!visible) return;
  var focused = document.activeElement && document.activeElement.id === 'chatbox';
  if (!S.loggedIn){

/* ---------- the layout engine ---------- */
function computeLayout(){
  var W = window.innerWidth;
  if (W < 760) return { phone:true, left:false, right:false, cw:W };
  /* the sidebar is always there; it gets narrower (labels stay) as the screen does */
  var right = S.rightOpen, navW = W < 1120 ? 200 : W < 1400 ? 216 : 252;

  var over = right && W < 1120;
  /* with the dock open it narrows below 1680 */
  var narrow = right && !over && W < 1680;
  /* the container's width and where it and the window sit are measured once the frame is laid out (layoutCentre) */
  return { phone:false, left:true, right:right, navW:navW, dockOver:over, cw:CW[centreKind()], narrowDock:narrow };
}
/* ---------- the centre's containers, and the window's place beside them ----------

   measure), LIST (rows to scan: Explore's kinds, Show all, search, your lists), WIDE (squares to browse, a month).
   Opening something steps the list aside instead of covering it: the list and the window sit side by side (centred as a
   pair when there is more room than both need), the list giving up width down to LMIN before the window drops below
   its minimum. Where even that doesn't fit (a tablet, or 1280 with the chat dock open) the window takes the centre:
   one thing at a time. */
var CW = { read:640, list:720, wide:1120 };

function centreKind(){

var SBW = null;
function layoutCentre(){

  /* the list's scrollbar (16 with a mouse, 0 where scrollbars float): the heading's right edge keeps clear of it */
  if (lb.offsetParent) SBW = lb.offsetWidth - lb.clientWidth;

  var C = c.clientWidth, cw = Math.min(CW[centreKind()], C), lw = cw, pl = Math.max(0, Math.floor((C - cw) / 2));
  if (S.stack.length){

    if (lw2 >= lmin){

      /* no room for both: the window is the centre (the sidebar, and a docked chat, stay beside it); beside a floating

/* ---- add events: search the network's events, narrow them with one row of filters, tick the ones you want, Done ----

var PK = null;

/* every event you could add (and can see), with the search applied */
function pickerPool(){

}
/* "from people you follow" means what it means on Explore's shelf of that name: someone you follow hosts it */
function pickerWhy(e){

var PKEMPTY = { upcoming:'No upcoming events yet.', going:'You’re not going to anything coming up.', interested:'Nothing coming up that you marked Interested.',

<script>
/* =========================================================================
   12. THE HOST'S EDITOR — New Event wizard, ending in Customize
   ========================================================================= */
/* Customize is three colours and a square image (owner, 2026-10-01: "Keep pick your colors … just select colors and
   image for now"). A few one-click starting points; the text colour is always kept legible on the background. */
var LOOKSTARTS = [
  { n:'Plain paper', bg:window.HN_PLAIN.bg, ink:window.HN_PLAIN.ink, accent:window.HN_PLAIN.accent },
  { n:'Night',  bg:'#0e1018', ink:'#e8e9ef', accent:'#8fb4ff' },
  { n:'Desert', bg:'#3a2a12', ink:'#fdf3df', accent:'#e6b23c' },
  { n:'Sea',    bg:'#0d1b2e', ink:'#eaf2ff', accent:'#5ea8ff' },
  { n:'Forest', bg:'#10201a', ink:'#e4f4ea', accent:'#48c98a' },
  { n:'Neon',   bg:'#000000', ink:'#f5f5f5', accent:'#ff2fd0' }
];
var DRAFT = null;
/* the draft fields that make up a look (anything else is a fact about the thing) */
var LOOKKEYS = /^(bg|ink|accent|image)$/;
function lookDraft(t){ return { bg:t.bg, ink:t.ink, accent:t.accent, image:t.image || null, glyph:t.glyph }; }
/* the look a draft stands for, its text colour corrected; draftLook is null when that is just the plain look */
function draftTheme(d){ return asLook({ bg:d.bg, ink:d.ink, accent:d.accent, image:d.image || null, glyph:d.glyph }); }

function hzOwnsSquare(hzId, lk){

}

function czSubject(d, t, px){
  var lk = draftLook(d);
  if (d.kind === 'horizon'){
    var hz = HORIZONS[d.editing];
    return { cover: hzOwnsSquare(d.editing, lk) ? '<div class="mosaic one" style="width:'+px+'px;height:'+px+'px">'+sqT(t, px)+'</div>' : mosaicOf(hz.eventIds, px),
             eyebrow:'Event Horizon', title:hz.name, facts:[['By', 'You'], ['Events', String(hz.eventIds.length)]] };

    var me = person('self');

             eyebrow:'@'+esc(me.handle || 'you'), title:me.displayName || 'You', facts:[['Based in', citiesOf(me).join(', ') || '—'], ['Going', '3']] };
  }
  return { cover:sqT(t, px), eyebrow:esc(KINDLAB[d.kind] || 'Event'), title:d.title || 'Untitled event',
           facts:[['When', isoDate(d.date) ? fmtDate(d.date) : '—'], ['Where', String(d.city || '').trim() || '—']] };
}

function czColorRow(k, label, v){

function czNoteHTML(d){

function czDropHTML(d){ var t = draftTheme(d); return sqT(t, 96) + '<span class="czhint" aria-hidden="true">'+(t.image ? 'Replace' : 'Drop image')+'</span>'; }
function customizeHTML(){
  var d = DRAFT, note;

    '<div class="czsect" id="cz-start-l">Start from</div><div class="czstarts" role="group" aria-labelledby="cz-start-l">' + LOOKSTARTS.map(function(s, i){
      return '<button type="button" class="btn czstart" data-czact="start" data-i="'+i+'"><span class="sw" style="background:'+s.bg+';color:'+s.accent+'" aria-hidden="true">'+esc(d.glyph || '◆')+'</span>'+esc(s.n)+'</button>'; }).join('') + '</div>' +
    '<div class="czsect">Colours</div>' + czColorRow('bg', 'Background', d.bg) + czColorRow('ink', 'Text', d.ink) + czColorRow('accent', 'Accent', d.accent) +
    '<p class="cznote" id="cz-note" role="status"'+(note ? '' : ' hidden')+'>'+note+'</p>' +
    '<div class="czsect">Image</div><div class="czimg">' +
      '<button type="button" class="czdrop" data-czact="pick" data-czdrop="look" aria-label="'+(d.image ? 'Replace the image' : 'Choose a square image')+'">'+czDropHTML(d)+'</button>' +
      '<div class="czimgside"><input type="file" id="cz-file" class="czfile" accept="image/*" data-czfile="look" tabindex="-1" aria-hidden="true">' +
        '<button type="button" class="btn" data-czact="pick">'+(d.image ? 'Replace image' : 'Upload image')+'</button>' +

/* a colour change repaints only what shows it, so a picker that is open stays open */

function czSetColor(k, v, from){

  if (/^#?[0-9a-f]{3}$/.test(v)){ v = v.replace('#', ''); v = '#' + v[0] + v[0] + v[1] + v[1] + v[2] + v[2]; }

/* ---- the square image: checked, centre-cropped and downscaled in the browser ----
   STORAGE: for now the result is a data URL kept on the look (look.image) and saved with it in localStorage.
   With the backend this is where the file goes to real storage instead (Vercel Blob; its URL is what look.image

var IMGMAX = 10 * 1024 * 1024, IMGPX = 512, IMGBUDGET = 150 * 1024;
function imageProblem(file){
  if (!file) return 'No file chosen.';
  if (!/^image\//.test(file.type || '')) return 'That file isn’t an image. Choose a JPG, PNG, WebP or GIF.';
  if (file.size > IMGMAX) return 'That image is ' + (file.size / 1048576).toFixed(1) + ' MB. The limit is 10 MB.';
  return '';
}
function squareImage(file, bg){
  return new Promise(function(resolve, reject){

<script>

function goFolder(f){

var TABMEM = {};

    if (ROUTE.ready && st && st.hn) history.replaceState(Object.assign({}, st, { scroll:CURSCROLL }), '', location.hash);
  }, 250);
}, true);
/* the app's own back buttons: the same step the phone's back gesture takes */
function navBack(){
  var cur = history.state;
  if (cur && cur.hn && cur.idx > 0){ history.back(); return; }
  ROUTE.replace = true;
  if (L.phone) phoneBack(); else goBack();
}
window.addEventListener('popstate', function(ev){
  if (ROUTE.ignore > 0){ ROUTE.ignore--; syncRoute(); return; }
  if (!ROUTE.ready) return;
  var s = ev.state && ev.state.hn ? ev.state : parseHash(location.hash);
  closeCtx(); closePopup(); lpCancel();
  if (DLGS.length){ DLGS.forEach(function(d){ d.remove(); }); DLGS = []; $('mask').style.display = 'none'; S.pending = null; CTXS = null; }
  ROUTE.applying = true;
  applySnap(s); render();
  ROUTE.applying = false;
  restoreScroll(s.scroll);
  if (!ev.state) revealSel();
  if (!ev.state || s.modal){ var c = snapNow(); c.idx = s.idx || 0; c.scroll = CURSCROLL; history.replaceState(c, '', hashOf(c)); }
});
/* a link (not a history step): its row, if the list has one, is lit and in view */
function revealSel(){
  var el = document.querySelector('#listbody .row.sel, #listbody .track.sel, #listbody .fsel, #listbody .card2.sel');
  if (el && !L.phone){ el.scrollIntoView({ block:'center' }); CURSCROLL.list = $('listbody').scrollTop; }
}
function rootSnap(tab){
  var f = tabRootFolder(L.phone ? tab : 'home');
  return { hn:1, tab:tab, folder:f, stack:[], q:'', ps:false, view:viewsOf(f)[0] || null, cal:null };
}
function startRoutes(){
  L = computeLayout();
  var st = history.state && history.state.hn ? history.state : null;
  var s = st || parseHash(location.hash);
  ROUTE.applying = true;
  applySnap(s); render();
  ROUTE.applying = false;
  ROUTE.ready = true;
  var cur = snapNow();
  var root = rootSnap(S.tab), deep = !st && navKeyOf(cur) !== navKeyOf(root);
  if (!st) revealSel();
  if (deep){
    /* a link opened cold: put its tab's front page underneath, so back stays inside Hypernet */
    root.idx = 0; history.replaceState(root, '', hashOf(root));
    cur.idx = 1; history.pushState(cur, '', hashOf(cur));
  } else {
    cur.idx = st ? st.idx || 0 : 0;
    if (st && st.scroll) restoreScroll(st.scroll);
    cur.scroll = CURSCROLL; history.replaceState(cur, '', hashOf(cur));
  }
}

/* =========================================================================
   15. RENDER + BOOT
   ========================================================================= */
function render(){
  /* logged out there is no Home: whatever asked for it (a link, a tab, an old history entry) lands on Explore */
  if (!S.loggedIn){ if (S.folder.kind === 'home') S.folder = { kind:'explore', id:null }; if (S.tab === 'home') S.tab = 'explore'; }
  var wasWin = L.win;
  L = computeLayout();
  noticeNewEvents();
  var app = $('app');
  if (!L.phone){
    /* a phone conversation screen becomes the chat dock on a wider screen */
    var ct = S.stack.filter(function(it){ return it.type === 'chat'; }).pop();
    if (ct){ S.stack = S.stack.filter(function(it){ return it.type !== 'chat'; }); S.chatOpen = ct.id; S.rightOpen = true; S.lastOpened = 'right'; L = computeLayout(); }
    if (S.folder.kind === 'you' || S.folder.kind === 'chats') goFolder({ kind:'home' });
  } else if (S.stack.some(function(it){ return it.type === 'chat'; })){
    /* and a conversation in the stack (a link, a desktop's dock) becomes the phone's Chats tab */
    S.chatOpen = S.stack.filter(function(it){ return it.type === 'chat'; }).pop().id;
    S.stack = []; S.tab = 'chats'; S.folder = { kind:'chats', id:null };
  }
  /* a horizon is never a list of its own: an old link or history entry that made it one opens it in the window,
     over Explore's Event Horizons */
  if (S.folder.kind === 'horizon'){
    var hid1 = S.folder.id; S.folder = { kind:'explore', id:'horizons' };
    if (L.phone){ S.tab = S.tab === 'home' || !S.tab ? 'explore' : S.tab; if (S.tab !== 'explore') S.folder = tabRootFolder(S.tab); }
    S.stack = [{ type:'horizon', id:hid1 }].concat(S.stack);
  }
  var conv = phoneConv();
  /* on a phone the window is a sheet over the screen you were on, which stays as it was behind it */
  var scr = L.phone ? ((conv || S.tab === 'chats') ? 'chats' : (S.tab === 'you' && S.folder.kind === 'you') ? 'you' : 'center') : '';
  L.scr = scr;
  if (!L.phone) app.style.setProperty('--nav-w', L.navW + 'px');
  var front = app.classList.contains('dock-front');
  app.className = [L.phone ? 'phone' : 'desk', L.left ? 'l-open' : '', L.right ? 'r-open' : '', L.narrowDock ? 'dock-narrow' : '', L.dockOver ? 'dock-over' : '',
    isCal() ? 'v-cal' : '', S.stack.length ? 'win-open' : '', scr ? 'scr-' + scr : '', front && L.right ? 'dock-front' : '',
    conv && S.loggedIn ? 'conv-open' : '', !L.phone && S.loggedIn ? 'readmarks' : '', S.loggedIn ? '' : 'preview'].filter(Boolean).join(' ');
  document.body.className = L.phone ? 'is-phone' : 'is-desk';
  layoutCentre();

  if (L.phone){ renderAppbar(); renderTabbar(); } else renderToolbar();
  if (L.left || scr === 'you') renderNav();
  if (!L.phone || scr === 'center'){
    renderCHead();
    if (isCal()) renderCalendar(); else renderList();
  }
  renderDetail();
  renderChats();
  renderPreview();
  /* the phone's sheet ends above the preview bar, which is always there when logged out (the tabs under it stay) */
  var pvb = $('previewbar');
  app.style.setProperty('--pvh', (L.phone && !S.loggedIn && pvb.offsetHeight ? Math.max(0, window.innerHeight - pvb.getBoundingClientRect().top) : 0) + 'px');
  placeWin();
  /* the list just stepped aside for the window (or back): what is lit in it stays in view */
  if (!L.phone && wasWin !== L.win && !ROUTE.applying){
    var lit = document.querySelector('#listbody .sel'), lbr = $('listbody').getBoundingClientRect();
    if (lit){ var r = lit.getBoundingClientRect(); if (r.top < lbr.top || r.bottom > lbr.bottom) lit.scrollIntoView({ block:'nearest' }); }
  }
  placeToasts();
  document.title = (S.stack.length ? itemName(S.stack[S.stack.length-1]) : folderName()) + ' · Hypernet';
  schedulePersist();
  syncRoute();
}
/* what you make and keep survives a reload. The network (events, horizons and call outs people
   made here) is shared; each account keeps its own relations and chats. */
var STORE = 'hypernet-feed:v2';
function isCreatedHz(k){ var h = HORIZONS[k]; return !!h && (!!h.ownerAcct || k === 'horizon-default'); }
/* every write to this browser's storage goes through here: when it is full, say so once, quietly — never fail silently */
var STOREFULL = false;
function storeSet(key, val){
  try { localStorage.setItem(key, val); return true; }
  catch(e){
    var full = e && (e.name === 'QuotaExceededError' || e.name === 'NS_ERROR_DOM_QUOTA_REACHED' || e.code === 22 || e.code === 1014 || /quota/i.test(String(e.message)));
    /* after whatever the action itself says, so its own confirmation doesn't cover the warning */
    if (full && !STOREFULL){ STOREFULL = true; setTimeout(function(){ toast('This browser’s storage is full', 'Recent changes are kept until you close the tab. Remove an image to make room.'); }, 0); }
    return false;
  }
}
/* saved on change, not on every render: render marks the store dirty and it is written once things settle (and when
   the page goes away); a write that would store the same thing again is skipped */
var PERSISTED = null;
function persist(){
  clearTimeout(PERSISTT); PERSISTT = null;
  if (ONLINE){ HNAPI.persistUi(); return; }   /* the network lives in the database; only conveniences stay here */
  try {
    if (S.loggedIn && S.acct) ACCTS[S.acct] = captureAcct();
    var evs = {}, recs = {}, themes = {}, hzs = {}, covers = {}, hzthemes = {};
    Object.keys(EVENTS).filter(function(k){ return /^evt-new-/.test(k); }).forEach(function(k){ evs[k] = EVENTS[k]; recs[k] = REC[k]; themes[k] = window.HYPERNET_THEMES.themes[k]; });
    Object.keys(HORIZONS).filter(isCreatedHz).forEach(function(k){ hzs[k] = HORIZONS[k]; if (HZCOVER[k]) covers[k] = HZCOVER[k]; if (HZTHEME[k]) hzthemes[k] = HZTHEME[k]; });
    /* hosts can change events they did not create here (the demo's own), so those edits are kept too */
    var edits = {};
    Object.keys(EDITED).forEach(function(k){ if (EVENTS[k] && !/^evt-new-/.test(k)){ var th = window.HYPERNET_THEMES.themes[k] || null; edits[k] = { ev:EVENTS[k], rec:REC[k] || null, theme:th, plain:!th }; } });
    var json = JSON.stringify({ v:2,
      session:{ acct: S.loggedIn ? S.acct : null },
      ui:{ rightOpen:!!S.rightOpen, chatOpen:S.chatOpen || null, recent:RECENTQ },
      accounts:ACCTS,
      network:{ events:evs, recs:recs, themes:themes, horizons:hzs, covers:covers, hzthemes:hzthemes, edits:edits, deleted:DELETED,
                callouts:CALLOUTS.filter(function(c){ return !!c.hostAcct; }), replies:REPLIES, replyGone:REPLYGONE }
    });
    if (json !== PERSISTED && storeSet(STORE, json)) PERSISTED = json;
  } catch(e){}
}
function restore(){
  if (ONLINE){ HNAPI.restoreUi(); return; }
  var d = null;
  try { d = JSON.parse(localStorage.getItem(STORE) || 'null'); } catch(e){}
  if (!d) return;
  var n = d.network || {};
  Object.keys(n.events || {}).forEach(function(k){ EVENTS[k] = n.events[k]; if (n.recs && n.recs[k]) REC[k] = n.recs[k];
    if (n.themes && n.themes[k]) window.HYPERNET_THEMES.themes[k] = asLook(n.themes[k]); READ[k] = true; PROMOCOUNT[k] = PROMOCOUNT[k] || 0; });
  Object.keys(n.horizons || {}).forEach(function(k){ HORIZONS[k] = n.horizons[k]; if (HZCOUNT[k] == null) HZCOUNT[k] = 0; });
  Object.keys(n.covers || {}).forEach(function(k){ HZCOVER[k] = n.covers[k]; });
  Object.keys(n.hzthemes || {}).forEach(function(k){ if (n.hzthemes[k]) HZTHEME[k] = asLook(n.hzthemes[k]); });
  Object.keys(n.edits || {}).forEach(function(k){
    var x = n.edits[k]; EDITED[k] = true;
    EVENTS[k] = Object.assign(EVENTS[k] || {}, x.ev);
    if (x.rec) REC[k] = x.rec;
    if (x.theme) window.HYPERNET_THEMES.themes[k] = asLook(x.theme); else if (x.plain) delete window.HYPERNET_THEMES.themes[k];
  });
  if (n.callouts && n.callouts.length){
    var ids = n.callouts.map(function(c){ return c.id; });
    CALLOUTS = n.callouts.concat(CALLOUTS.filter(function(c){ return ids.indexOf(c.id) < 0; }));
    /* answers used to be chats; they are replies under the call out now */
    CALLOUTS.forEach(function(c){ delete c.answers; });
  }
  REPLIES = Array.isArray(n.replies) ? n.replies : []; REPLYGONE = n.replyGone || {};
  if (n.deleted){
    DELETED = { events:n.deleted.events || [], horizons:n.deleted.horizons || [] };
    DELETED.events.forEach(function(k){ delete EVENTS[k]; delete REC[k]; });
    DELETED.horizons.forEach(function(k){ delete HORIZONS[k]; });
  }
  if (d.ui){ S.rightOpen = !!d.ui.rightOpen; S.chatOpen = d.ui.chatOpen || null; RECENTQ = d.ui.recent || []; }
  ACCTS = d.accounts || {};
  var k = d.session && d.session.acct;
  if (k && ACCTS[k]){ S.acct = k; S.loggedIn = true; loadAcct(ACCTS[k]); }
  syncAcctPeople();
}
var PERSISTT = null;
function schedulePersist(){ if (!PERSISTT) PERSISTT = setTimeout(persist, 300); }
/* a reload, a closed tab or a phone putting the page away writes what is pending */
window.addEventListener('pagehide', function(){ if (PERSISTT) persist(); });
document.addEventListener('visibilitychange', function(){ if (document.visibilityState === 'hidden' && PERSISTT) persist(); });
var RZ = null;
window.addEventListener('resize', function(){ clearTimeout(RZ); RZ = setTimeout(render, 60); });
(function boot(){
  if (ONLINE){ HNAPI.boot(startRoutes); return; }   /* the network comes from GET /api/bootstrap */
  restore();
  /* the real events carry the links people share, so the route waits for them (briefly) */
  var started = false, start = function(){ if (!started){ started = true; startRoutes(); } };
  loadRealEvents().then(start, start);
  setTimeout(start, 2500);
})();
</script>
