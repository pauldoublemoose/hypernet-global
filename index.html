<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#3a3a3a">
<title>Hypernet</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23d4d0c8'/%3E%3Cpath d='M16 4 28 16 16 28 4 16z' fill='%23141414'/%3E%3C/svg%3E">
<style>
/* =======================================================================
   HYPERNET — HOME FEED
   A Windows 2000 / Outlook frame, in greys only, so the events — and only
   the events — carry colour. Retro surface, modern hierarchy:
   one primary action per view, one type scale, one control height.
   ======================================================================= */

/* ---------- 1. tokens ------------------------------------------------ */
:root{
  --face:#d4d0c8; --face-lt:#e8e5df; --face-dk:#c2beb5;
  --white:#fff; --shadow:#808080; --dark:#404040;
  --ink:#141414; --ink2:#3a3a3a; --dim:#666; --line:#e2dfd8; --hover:#f0eee9;
  --sel:#262626; --seldim:#c8c8c8;
  --bar:linear-gradient(90deg,#262626 0%,#555 58%,#9b9b9b 100%);
  --sys:Tahoma,"Segoe UI",Verdana,Geneva,sans-serif;
  --mono:"Lucida Console",Monaco,Consolas,"Courier New",monospace;
  --fs-xs:11px; --fs-s:13px; --fs:14px; --fs-m:16px; --fs-l:20px; --fs-xl:26px;
  --ctl:36px;     /* every button, field and toggle */
  --act:44px;     /* the event verbs */
  --nav-w:252px; --chat-w:344px;
  --out: inset -1px -1px 0 var(--dark), inset 1px 1px 0 var(--white), inset -2px -2px 0 var(--shadow), inset 2px 2px 0 var(--face-lt);
  --in:  inset 1px 1px 0 var(--shadow), inset -1px -1px 0 var(--white), inset 2px 2px 0 var(--dark), inset -2px -2px 0 var(--face);
  --thin: inset 1px 1px 0 var(--shadow), inset -1px -1px 0 var(--white);
}
@media (pointer:coarse){ :root{ --ctl:44px; } }
*{ box-sizing:border-box; }
html,body{ height:100%; }
body{ margin:0; overflow:hidden; background:var(--face); color:var(--ink);
  font:var(--fs)/1.45 var(--sys); -webkit-font-smoothing:antialiased; -webkit-tap-highlight-color:transparent; }
button,input,select,textarea{ font:inherit; color:inherit; }
button{ cursor:pointer; }
[data-act]{ cursor:pointer; }
a{ color:inherit; }
.ic{ flex:0 0 auto; display:block; }
.sr{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); }

/* ---------- 2. controls ---------------------------------------------- */
.btn{ height:var(--ctl); min-width:var(--ctl); padding:0 14px; display:inline-flex; align-items:center; justify-content:center;
  gap:7px; border:0; background:var(--face); color:var(--ink); white-space:nowrap; font-size:var(--fs); box-shadow:var(--out); }
.btn:active, .btn.on{ box-shadow:var(--in); background:var(--face-lt); }
.btn.on{ font-weight:bold; }
.btn.primary{ font-weight:bold; box-shadow:0 0 0 1px #000, var(--out); }
.btn.primary:active{ box-shadow:0 0 0 1px #000, var(--in); }
.btn:focus-visible, .ib:focus-visible, .seg button:focus-visible{ outline:1px dotted #000; outline-offset:-6px; }
.btn[disabled]{ color:#8a8a8a; text-shadow:1px 1px 0 #fff; cursor:default; }
.btn .ic{ margin-left:-2px; }
.btn .caret{ margin-right:-4px; }
.ib{ width:var(--ctl); height:var(--ctl); display:inline-grid; place-items:center; border:0; padding:0; background:var(--face); box-shadow:var(--out); color:var(--ink); }
.ib:active{ box-shadow:var(--in); }
.ib.on{ background:var(--sel); color:#fff; box-shadow:inset 1px 1px 0 #000, inset -1px -1px 0 #777; }
.ib.on .fillable{ fill:currentColor; }
.badge-n{ min-width:20px; height:20px; padding:0 6px; display:inline-grid; place-items:center; background:#000; color:#fff;
  font:bold 11px var(--mono); border-radius:10px; }
input[type=text], input[type=search], input[type=date], select, textarea{
  height:var(--ctl); padding:0 10px; border:0; border-radius:0; background:#fff; box-shadow:var(--in); font-size:var(--fs); min-width:0; }
textarea{ height:auto; padding:8px 10px; resize:vertical; line-height:1.45; }
input:focus, select:focus, textarea:focus{ outline:1px dotted #000; outline-offset:-5px; }
input[type=checkbox]{ width:18px; height:18px; margin:0; accent-color:#262626; }
.seg{ display:inline-flex; }
.seg button{ height:var(--ctl); padding:0 16px; border:0; background:var(--face); font:bold 12px var(--mono); letter-spacing:.08em;
  color:var(--ink2); box-shadow:var(--out); }
.seg button.on{ background:#fff; color:#000; box-shadow:var(--in); }

/* ---------- 3. frame ------------------------------------------------- */
#app{ position:fixed; inset:0; display:flex; flex-direction:column; }
#titlebar{ flex:0 0 30px; display:flex; align-items:center; gap:9px; padding:0 10px; color:#fff; background:var(--bar); font-size:13px; }
#titlebar .tglyph{ width:18px; height:18px; display:grid; place-items:center; background:var(--face); color:#000; font-size:11px;
  box-shadow:inset -1px -1px 0 var(--dark), inset 1px 1px 0 var(--white); }
#titlebar #wintitle{ opacity:.8; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
#toolbar{ flex:0 0 auto; display:flex; align-items:center; gap:10px; padding:9px 10px; border-bottom:1px solid var(--shadow); box-shadow:0 1px 0 var(--white); }
#toolbar .spring{ flex:1; }
.tsep{ width:2px; align-self:stretch; margin:3px 0; box-shadow:inset 1px 0 0 var(--shadow), inset -1px 0 0 var(--white); }
.searchbox{ flex:0 1 460px; min-width:160px; height:var(--ctl); display:flex; align-items:center; gap:8px; padding:0 10px; background:#fff; box-shadow:var(--in); color:var(--dim); }
.searchbox input{ flex:1; min-width:0; height:100%; padding:0; border:0; box-shadow:none; background:transparent; color:var(--ink); }
.searchbox input:focus{ outline:0; }
.searchbox:focus-within{ outline:1px dotted #000; outline-offset:-5px; }
.acct .av{ width:24px; height:24px; flex-basis:24px; font-size:10px; }

#main{ flex:1; min-height:0; display:flex; gap:6px; padding:6px; }
.pane{ display:flex; flex-direction:column; min-height:0; min-width:0; }
#nav{ flex:0 0 var(--nav-w); display:none; }
#chats{ flex:0 0 var(--chat-w); display:none; }
#app.l-open #nav, #app.r-open #chats{ display:flex; }
#app.dock-narrow #chats{ flex-basis:300px; }
#center{ flex:1 1 auto; }
.panel{ flex:1; min-height:0; overflow:auto; background:#fff; box-shadow:var(--in); overscroll-behavior:contain; }
@media (pointer:fine){
  .panel::-webkit-scrollbar{ width:16px; height:16px; }
  .panel::-webkit-scrollbar-track{ background:repeating-conic-gradient(#fff 0 25%, #d4d0c8 0 50%) 0 0/2px 2px; }
  .panel::-webkit-scrollbar-thumb{ background:var(--face); box-shadow:var(--out); }
}
#appbar, #tabbar{ display:none; }

/* ---------- 4. left: navigation -------------------------------------- */
#navbody{ padding:6px 0 18px; }
.navh{ padding:18px 20px 6px; font:bold 11px var(--mono); letter-spacing:.14em; text-transform:uppercase; color:var(--dim); }
.nrow{ display:flex; align-items:center; gap:11px; min-height:40px; margin:0 6px; padding:0 12px 0 14px; white-space:nowrap; color:var(--ink); }
.nrow .ic{ color:var(--ink2); }
.nrow .nlab{ flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; }
.nrow .nsub{ color:var(--dim); font-size:var(--fs-s); }
.nrow .ncnt{ font:12px var(--mono); color:var(--dim); }
.nrow:hover{ background:var(--hover); }
.nrow.sel{ background:var(--sel); color:#fff; }
.nrow.sel .ic, .nrow.sel .ncnt, .nrow.sel .nsub{ color:var(--seldim); }
.nrow.unread .nlab{ font-weight:bold; }
.nrow.unread .ncnt{ color:var(--ink); font-weight:bold; }
.nrow.sel.unread .ncnt{ color:#fff; }
.nrow.search{ cursor:default; padding-right:4px; margin-bottom:6px; }
.nrow .nx{ width:36px; height:32px; display:grid; place-items:center; border:0; padding:0; background:transparent; color:#fff; }
.nrow .nx:hover{ background:#444; }
.nrow.drop{ outline:2px dashed #000; outline-offset:-2px; background:#f4f2ec; }
.nrow .sq, .nrow .av{ width:20px; height:20px; flex-basis:20px; font-size:11px; }
/* the toolbar already carries Join on a desktop; the card is the phone's You tab entry */
.logincard{ display:none; margin:14px 12px; padding:16px; background:var(--face-lt); box-shadow:var(--thin); }
.logincard b{ display:block; font-size:var(--fs-m); margin-bottom:12px; }
.acctcard{ display:none; }

/* ---------- 5. centre: header, list, detail -------------------------- */
#chead{ flex:0 0 auto; display:flex; align-items:center; gap:12px; padding:4px 2px 10px 4px; min-height:54px; flex-wrap:wrap; }
#chead .ct{ flex:1 1 220px; min-width:0; }
#chead h2{ margin:0; font-size:var(--fs-l); line-height:1.2; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
#chead .csub{ color:var(--dim); font-size:var(--fs-s); margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
#chead .ctools{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
.sortsel{ display:flex; align-items:center; gap:8px; font-size:var(--fs-s); color:var(--dim); }
.sortsel select{ height:var(--ctl); }
#cbody{ flex:1; min-height:0; display:flex; gap:6px; }
#listcol, #calcol, #detailcol{ min-width:0; min-height:0; flex-direction:column; }
#listcol{ display:flex; container:list / inline-size; }
#calcol{ display:none; flex:1; container:cal / inline-size; }
#detailcol{ display:flex; container:detail / inline-size; }
#app.split #listcol{ flex:0 0 clamp(340px, 41%, 470px); }
#app.split #detailcol{ flex:1; }
#app.push #listcol{ flex:1; }
#app.push #detailcol{ display:none; flex:1; }
#app.v-cal #listcol{ display:none; }
#app.v-cal #calcol{ display:flex; }
#app.push.has-detail #listcol, #app.push.has-detail #calcol{ display:none; }
#app.push.has-detail #detailcol{ display:flex; }
#dbar{ display:none; flex:0 0 auto; align-items:center; gap:10px; padding:0 0 6px; }
#app.show-dbar #dbar{ display:flex; }
#dbar .dcrumb{ color:var(--dim); font-size:var(--fs-s); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
#dscroll{ position:relative; }

/* rows */
.band{ position:sticky; top:0; z-index:6; display:flex; align-items:baseline; gap:8px; padding:14px 16px 7px; background:#fff;
  border-bottom:1px solid var(--line); font:bold 11px var(--mono); letter-spacing:.14em; text-transform:uppercase; color:var(--ink2); }
.band .cnt{ color:var(--dim); font-weight:normal; letter-spacing:.04em; }
.row{ display:flex; align-items:center; gap:13px; min-height:66px; padding:10px 16px; border-bottom:1px solid var(--line); }
.row:hover{ background:var(--hover); }
.row.sel{ background:var(--sel); color:#fff; }
.row.static{ cursor:default; }
.row.static:hover{ background:transparent; }
.r-main{ flex:1; min-width:0; }
.r-title{ font-size:15px; line-height:1.3; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.row.unread .r-title{ font-weight:bold; }
.row.past .r-title{ color:#6f6f6f; }
.row.sel.past .r-title{ color:#ddd; }
.r-meta{ margin-top:3px; font-size:var(--fs-s); color:var(--dim); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.row.sel .r-meta{ color:var(--seldim); }
.r-side{ flex:0 0 auto; display:flex; flex-direction:column; align-items:flex-end; gap:5px; }
.r-date{ font:12px var(--mono); letter-spacing:.04em; text-transform:uppercase; color:var(--ink2); white-space:nowrap; }
.row.sel .r-date{ color:#fff; }
.r-states{ display:flex; gap:4px; }
.r-ic{ width:40px; height:40px; flex:0 0 40px; display:grid; place-items:center; background:var(--face); box-shadow:var(--out); color:var(--ink2); }
.row.sel .r-ic{ background:#444; color:#fff; box-shadow:none; }
.pill{ display:inline-flex; align-items:center; gap:4px; height:21px; padding:0 7px; font:bold 10px var(--mono); letter-spacing:.06em;
  text-transform:uppercase; border:1px solid var(--ink); color:var(--ink); background:#fff; white-space:nowrap; }
.pill .ic{ width:11px; height:11px; }
.pill.going{ background:var(--ink); color:#fff; }
.pill.host{ background:var(--face); }
.pill.dim{ border-color:#aaa; color:var(--dim); }
.row.sel .pill{ border-color:#fff; background:transparent; color:#fff; }
.row.sel .pill.going{ background:#fff; color:var(--sel); }
.empty{ padding:40px 24px; color:var(--dim); text-align:center; font-size:var(--fs-m); }
.empty .btn{ margin-top:14px; }
@container list (max-width:300px){ .r-states .pill span{ display:none; } }
.r-dm{ display:none; }
/* a narrow list gives the title the width: it may take two lines, and the date moves under it */
@container list (max-width:440px){
  .r-title{ white-space:normal; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; }
  .r-side .r-date{ display:none; }
  .r-dm{ display:inline; font:12px var(--mono); letter-spacing:.02em; text-transform:uppercase; color:var(--ink2); }
  .row.sel .r-dm{ color:#fff; }
}

/* ---------- 6. the event theme layer — the only colour in the product - */
.sq{ position:relative; isolation:isolate; overflow:hidden; display:grid; place-items:center; flex:0 0 auto; background:var(--ebg); color:var(--eac); line-height:1; }
.sq .g{ position:relative; z-index:2; }
.sq .pat{ position:absolute; inset:0; z-index:1; }
.sq.s20{ width:20px; height:20px; font-size:12px; }
.sq.s40{ width:40px; height:40px; font-size:22px; }
.sq.s64{ width:64px; height:64px; font-size:34px; }
.sq.s160{ width:160px; height:160px; font-size:86px; }
.sq.s180{ width:180px; height:180px; font-size:96px; }
.sq.s56{ width:56px; height:56px; font-size:30px; }
.sq.s32{ width:32px; height:32px; font-size:18px; }
.sq.s16{ width:16px; height:16px; font-size:10px; }
.sq.sh-rounded{ border-radius:14%; }
.sq.sh-cut{ clip-path:polygon(0 0,100% 0,100% 78%,78% 100%,0 100%); }
.row.sel .sq{ box-shadow:0 0 0 2px #fff; }
.pat.p-plain{ background:radial-gradient(circle at 30% 24%, rgba(255,255,255,.18), rgba(0,0,0,0) 62%); }
.pat.p-stripe{ background:repeating-linear-gradient(45deg, var(--eac2, rgba(255,255,255,.16)) 0 6px, transparent 6px 12px); }
.pat.p-grid{ background:linear-gradient(var(--eac2) 1px, transparent 1px) 0 0/9px 9px, linear-gradient(90deg, var(--eac2) 1px, transparent 1px) 0 0/9px 9px; }
.pat.p-dither{ background:radial-gradient(var(--eac2) 40%, transparent 41%) 0 0/6px 6px, radial-gradient(var(--eac2) 40%, transparent 41%) 3px 3px/6px 6px; }
.pat.p-rays{ background:repeating-conic-gradient(from 0deg at 50% 116%, var(--eac2) 0deg 7deg, transparent 7deg 16deg); }
.pat.p-scan{ background:repeating-linear-gradient(0deg, rgba(0,0,0,.34) 0 2px, transparent 2px 4px); }
.pat.p-halftone{ background:radial-gradient(var(--eac) 22%, transparent 23%) 0 0/10px 10px, radial-gradient(var(--eac2) 32%, transparent 33%) 5px 5px/10px 10px; opacity:.85; }
.pat.p-moon{ background:radial-gradient(circle at 66% 32%, var(--eac2) 0 30%, transparent 31%), radial-gradient(circle at 26% 74%, var(--eac2) 0 16%, transparent 17%); }

.surf{ position:absolute; inset:0; pointer-events:none; z-index:1; }
.surf.u-none{ display:none; }
.surf.u-grain{ background:radial-gradient(rgba(255,255,255,.055) 1px, transparent 1px) 0 0/3px 3px, radial-gradient(rgba(0,0,0,.09) 1px, transparent 1px) 2px 1px/5px 5px; }
.surf.u-paper{ background:repeating-linear-gradient(92deg, rgba(0,0,0,.035) 0 1px, transparent 1px 4px), repeating-linear-gradient(3deg, rgba(0,0,0,.03) 0 1px, transparent 1px 7px), radial-gradient(circle at 20% 15%, rgba(0,0,0,.05), transparent 55%); }
.surf.u-dither{ background:radial-gradient(var(--eac2) 32%, transparent 33%) 0 0/4px 4px, radial-gradient(var(--eac2) 32%, transparent 33%) 2px 2px/4px 4px; opacity:.55; }
.surf.u-halftone{ background:radial-gradient(var(--eac) 15%, transparent 16%) 0 0/14px 14px, radial-gradient(var(--eac2) 26%, transparent 27%) 7px 7px/14px 14px; opacity:.5; }
.surf.u-scanlines{ background:repeating-linear-gradient(0deg, rgba(0,0,0,.30) 0 1px, transparent 1px 3px); }
.surf.u-grid{ background:linear-gradient(var(--eac2) 1px, transparent 1px) 0 0/26px 26px, linear-gradient(90deg, var(--eac2) 1px, transparent 1px) 0 0/26px 26px; opacity:.85; }
.surf.u-rays{ background:repeating-conic-gradient(from 0deg at 50% 112%, var(--eac2) 0deg 4deg, transparent 4deg 11deg); opacity:.8; }
.surf.u-photocopy{ background:repeating-linear-gradient(88deg, rgba(0,0,0,.22) 0 2px, transparent 2px 9px), radial-gradient(circle at 78% 10%, rgba(255,255,255,.14), transparent 46%), repeating-linear-gradient(0deg, rgba(0,0,0,.12) 0 1px, transparent 1px 6px); }
.surf.u-plasma{ background:radial-gradient(circle at 18% 22%, var(--eac2) 0, transparent 46%), radial-gradient(circle at 76% 64%, var(--eac) 0, transparent 38%), radial-gradient(circle at 44% 88%, var(--eac2) 0, transparent 42%); opacity:.55; filter:blur(.4px); }
@keyframes hn-drift{ 0%{ transform:translate3d(0,0,0);} 50%{ transform:translate3d(-14px,-9px,0);} 100%{ transform:translate3d(0,0,0);} }
@keyframes hn-pulse{ 0%,100%{ opacity:.42; } 50%{ opacity:1; } }
@keyframes hn-flicker{ 0%,100%{ opacity:.95;} 6%{opacity:.35;} 9%{opacity:1;} 23%{opacity:.55;} 26%{opacity:1;} 61%{opacity:.4;} 64%{opacity:1;} }
@keyframes hn-scroll{ from{ background-position:0 0, 0 0, 0 0; } to{ background-position:0 120px, 0 -120px, 60px 0; } }
@keyframes hn-marquee{ from{ transform:translateX(0); } to{ transform:translateX(-50%); } }
.mo-drift .surf{ animation:hn-drift 13s ease-in-out infinite; }
.mo-pulse .surf{ animation:hn-pulse 3.4s ease-in-out infinite; }
.mo-flicker .surf{ animation:hn-flicker 5s steps(1,end) infinite; }
.mo-scroll .surf{ animation:hn-scroll 9s linear infinite; }
@media (prefers-reduced-motion: reduce){ .surf, .hl.h-marquee b{ animation:none !important; } }

/* the canvas: the event's own world, edge to edge inside the reading pane */
.canvas{ position:relative; min-height:100%; background:var(--ebg); color:var(--eink); overflow:clip; }
.t-serif{ font-family:Georgia,"Times New Roman",Times,serif; }
.t-grotesk{ font-family:"Helvetica Neue",Helvetica,Arial,sans-serif; }
.t-mono{ font-family:"Courier New",Courier,monospace; letter-spacing:.01em; }
.t-stencil{ font-family:"Arial Black","Arial Bold",Impact,sans-serif; }
.t-display{ font-family:Impact,Haettenschweiler,"Arial Narrow Bold","Franklin Gothic Heavy",sans-serif; letter-spacing:.01em; }
.t-stencil .hl{ letter-spacing:.04em; text-transform:uppercase; }
.banner{ position:relative; display:flex; min-height:250px; border-bottom:1px solid var(--eac2); }
.banner .wash{ position:absolute; inset:0; z-index:2; background:linear-gradient(180deg, transparent 35%, color-mix(in srgb, var(--ebg) 80%, transparent) 100%); }
.banner .bin{ position:relative; z-index:3; width:100%; display:flex; align-items:flex-end; gap:26px; padding:30px 34px 28px; }
.btxt{ flex:1; min-width:0; }
.eyebrow{ margin-bottom:10px; font:bold 12px var(--mono); letter-spacing:.14em; text-transform:uppercase; color:var(--edim); }
.hl{ margin:0; color:var(--eink); overflow-wrap:anywhere; }
.hl.h-huge{ font-size:clamp(34px, 7.4cqi, 58px); line-height:.98; letter-spacing:-.018em; }
.hl.h-condensed{ font-size:clamp(32px, 6.6cqi, 52px); line-height:1; transform:scaleX(.84); transform-origin:left center; }
.hl.h-stacked{ font-size:clamp(28px, 5.4cqi, 42px); line-height:.98; }
.hl.h-stacked span{ display:block; }
.hl.h-outlined{ font-size:clamp(32px, 7cqi, 54px); line-height:1; color:transparent; -webkit-text-stroke:1.5px var(--eink); text-shadow:3px 3px 0 var(--eac2); }
.hl.h-marquee{ font-size:clamp(28px, 5.8cqi, 44px); line-height:1.1; white-space:nowrap; overflow:hidden; }
.hl.h-marquee b{ display:inline-block; font-weight:inherit; animation:hn-marquee 15s linear infinite; }
.mood{ margin:14px 0 0; font-size:18px; line-height:1.45; font-style:italic; color:var(--eac); border-left:3px solid var(--eac); padding-left:12px; max-width:52ch; }
.t-stencil .mood, .t-mono .mood{ font-style:normal; }

/* the verbs — themed, never illegible, Promote set apart, one shared grid */
.actbar{ position:sticky; top:0; z-index:6; background:var(--ebg); border-bottom:1px solid var(--eac2); padding:12px 34px; font-family:var(--sys); }
.verbs{ display:flex; flex-wrap:wrap; align-items:center; gap:8px; }
.vpair{ display:flex; height:var(--act); }
.vbtn{ height:var(--act); padding:0 14px; display:inline-flex; align-items:center; justify-content:center; gap:8px; border:2px solid var(--eac); background:transparent;
  color:var(--eink); font:bold 14px var(--sys); letter-spacing:.02em; }
.vbtn + .vbtn{ border-left:0; }
.vbtn:hover{ background:color-mix(in srgb, var(--eac) 20%, transparent); }
.vbtn.on{ background:var(--eac); color:var(--eon); }
.vbtn.on .fillable{ fill:currentColor; }
.vpromo{ height:var(--act); padding:0 13px; display:inline-flex; align-items:center; gap:8px; background:transparent; color:var(--eink);
  border:1px solid var(--edim); font:bold 14px var(--sys); }
.vpromo:hover{ border-color:var(--eink); }
.vpromo.on{ border-style:solid; border-color:var(--eink); background:color-mix(in srgb, var(--eink) 14%, transparent); }
.vpromo .n{ font:12px var(--mono); opacity:.8; }
.vsec{ display:flex; flex-wrap:wrap; gap:8px; margin-left:auto; }
.vwent{ height:var(--act); padding:0 16px; display:inline-flex; align-items:center; gap:8px; background:transparent; color:var(--edim);
  border:1px solid var(--edim); font:bold 14px var(--sys); }
.vwent:hover{ color:var(--eink); border-color:var(--eink); }
.vwent.on{ background:var(--eac); border-color:var(--eac); color:var(--eon); }
.edition{ position:relative; z-index:3; padding:18px 34px 0; }
.edcard{ width:100%; display:grid; grid-template-columns:1fr auto; column-gap:16px; align-items:center; padding:16px 18px; text-align:left;
  background:color-mix(in srgb, var(--eac) 14%, transparent); border:2px solid var(--eac); color:var(--eink); font-family:var(--sys); }
.edcard:hover{ background:color-mix(in srgb, var(--eac) 24%, transparent); }
.edcard > span:not(.edgo){ grid-column:1; }
.edk{ font:bold 11px var(--mono); letter-spacing:.14em; text-transform:uppercase; color:var(--eac); }
.edt{ margin-top:4px; font-size:20px; font-weight:bold; line-height:1.2; }
.edd{ margin-top:3px; font-size:15px; }
.eds{ margin-top:8px; font:bold 12px var(--mono); letter-spacing:.06em; text-transform:uppercase; color:var(--eac); }
.edgo{ grid-column:2; grid-row:1 / span 4; width:44px; height:44px; display:grid; place-items:center; border:1px solid var(--eac); color:var(--eac); }
.edprev{ display:flex; align-items:center; gap:14px; flex-wrap:wrap; }
.edprev .chip{ min-height:44px; }
.ednote{ flex:1 1 260px; font-size:13px; color:var(--edim); }
.vmore{ height:var(--act); padding:0 12px; display:inline-flex; align-items:center; gap:7px; background:transparent; color:var(--eink);
  border:1px solid var(--edim); font:13px var(--sys); }
.vmore:hover{ border-color:var(--eink); }
.sh-rounded .vpair, .sh-rounded .vpromo, .sh-rounded .vmore, .sh-rounded .chip, .sh-rounded .card{ border-radius:10px; }
.sh-rounded .vpair{ overflow:hidden; }
.sh-rounded .vpair .vbtn{ border-radius:0; }
/* the way in: a burn's tickets or membership, summarised, one tap from the top */
.entry{ position:relative; z-index:3; display:flex; align-items:center; gap:16px; flex-wrap:wrap; margin:18px 34px 0; padding:14px 16px;
  border:2px solid var(--eac); background:color-mix(in srgb, var(--eac) 10%, transparent); font-family:var(--sys); }
.entry .ensum{ flex:1 1 240px; min-width:0; }
.entry .enk{ font:bold 11px var(--mono); letter-spacing:.14em; text-transform:uppercase; color:var(--eac); }
.entry .env{ margin-top:4px; font-size:16px; font-weight:bold; color:var(--eink); }
.entry .ens{ margin-top:2px; font-size:13px; color:var(--edim); }
.enbtn{ height:var(--act); padding:0 18px; display:inline-flex; align-items:center; gap:8px; background:var(--eac); color:var(--eon) !important;
  border:0; font:bold 15px var(--sys); text-decoration:none; white-space:nowrap; }
.sh-rounded .entry, .sh-rounded .enbtn{ border-radius:10px; }
/* on a phone the event's verbs live in a bar at the bottom of the screen, always in reach */
#evbar{ display:none; flex:0 0 auto; padding:8px 10px; background:var(--ebg); color:var(--eink); border-top:1px solid var(--eac2); font-family:var(--sys); }
#app.phone.has-evbar #evbar{ display:block; }
#app.phone .canvas > .actbar{ display:none; }
#evbar .verbs{ flex-wrap:nowrap; }
#evbar .vpair{ flex:1 1 auto; min-width:0; }
#evbar .vbtn{ flex:1 1 0; min-width:0; padding:0 8px; }
#evbar .vwent, #evbar .vmore:not(.vdots){ flex:1 1 auto; justify-content:center; }
#evbar .vmore.vdots{ flex:0 0 var(--act); }
.sh-cut .chip, .sh-cut .vmore, .sh-cut .card{ clip-path:polygon(0 0,100% 0,100% 72%,94% 100%,0 100%); }

.layer{ position:relative; }
.lin{ position:relative; z-index:3; padding:6px 34px 44px; }
.d-packed .lin{ padding-top:0; }
.d-packed{ line-height:1.38; }
.d-airy{ line-height:1.68; }
.facts{ display:grid; grid-template-columns:repeat(auto-fill, minmax(168px, 1fr)); margin-top:24px; border-top:1px solid var(--eac2); border-left:1px solid var(--eac2); }
.fact{ padding:12px 14px 13px; border-right:1px solid var(--eac2); border-bottom:1px solid var(--eac2); min-width:0; }
.fk{ font:bold 11px var(--mono); letter-spacing:.14em; text-transform:uppercase; color:var(--edim); }
.fv{ margin-top:5px; font-size:16px; font-weight:bold; line-height:1.3; overflow-wrap:anywhere; }
.fs{ margin-top:3px; font-size:13px; color:var(--edim); line-height:1.4; }
.sect{ margin-top:30px; }
.sect > h3{ margin:0 0 12px; padding-bottom:7px; border-bottom:1px solid var(--eac2); font:bold 12px var(--mono); letter-spacing:.16em; text-transform:uppercase; color:var(--edim); }
.sect p{ margin:0 0 10px; max-width:66ch; }
.evdesc{ font-size:17px; }
.themeline{ font-size:24px; font-weight:bold; line-height:1.2; margin-bottom:6px; color:var(--eac); }
.chips{ display:flex; flex-wrap:wrap; gap:8px; }
.chip{ display:inline-flex; align-items:center; gap:8px; min-height:38px; padding:4px 13px 4px 6px; border:1px solid var(--eac2); background:transparent;
  color:var(--eink); font:13px var(--sys); text-align:left; }
.chip.plain{ padding:4px 13px; }
button.chip:hover{ border-color:var(--eac); }
.chip .sub{ opacity:.7; }
.cards{ display:grid; grid-template-columns:repeat(auto-fill, minmax(220px, 1fr)); gap:10px; }
.card{ border:1px solid var(--eac2); padding:14px 16px 15px; }
.card .ck{ font:bold 11px var(--mono); letter-spacing:.14em; text-transform:uppercase; color:var(--eac); }
.card .ctt{ margin:6px 0 4px; font-size:16px; font-weight:bold; line-height:1.3; }
.card .cbd{ font-size:14px; }
.card .cbd p{ margin:0; }
.card .cdl{ margin-top:9px; font:12px var(--mono); color:var(--edim); }
.tmodel{ display:inline-block; margin-bottom:10px; padding:4px 10px; border:2px solid var(--eac); font:bold 12px var(--mono); letter-spacing:.12em; text-transform:uppercase; color:var(--eac); }
.blist{ margin:0; padding:0; list-style:none; max-width:70ch; }
.blist li{ position:relative; padding:7px 0 7px 22px; border-bottom:1px dashed color-mix(in srgb, var(--eac2) 80%, transparent); }
.blist li::before{ content:""; position:absolute; left:3px; top:calc(.72em + 3px); width:7px; height:7px; background:var(--eac); }
.irows{ display:flex; flex-direction:column; gap:0; max-width:70ch; }
.irow{ padding:9px 0; border-bottom:1px dashed color-mix(in srgb, var(--eac2) 80%, transparent); }
.irow .it{ font-weight:bold; }
.irow .iw{ margin-top:3px; font:12px var(--mono); color:var(--edim); }
.kv{ display:grid; grid-template-columns:minmax(110px, 30%) 1fr; gap:8px 16px; margin:8px 0 0; max-width:70ch; }
.kv dt{ color:var(--edim); font:12px var(--mono); letter-spacing:.06em; text-transform:uppercase; padding-top:2px; }
.kv dd{ margin:0; }
.kv dd p{ margin:0; }
.canvas a{ color:var(--eac); }
/* timeline: build, gates, burns, strike — the event is a sequence, not a date */
.tl{ list-style:none; margin:0; padding:0; max-width:70ch; }
.tl li{ position:relative; display:flex; gap:18px; padding:0 0 16px 22px; }
.tl li::before{ content:""; position:absolute; left:4px; top:7px; width:9px; height:9px; background:var(--eac); }
.tl li::after{ content:""; position:absolute; left:8px; top:18px; bottom:-4px; width:1px; background:var(--eac2); }
.tl li:last-child::after{ display:none; }
.tl .tld{ flex:0 0 150px; font:bold 12px var(--mono); letter-spacing:.04em; text-transform:uppercase; color:var(--eink); padding-top:2px; }
.tl .tld span{ display:block; font-weight:normal; color:var(--edim); margin-top:2px; }
.tl .tlb{ flex:1; min-width:0; }
.tl .tlt{ font-weight:bold; }
.tln{ font-size:14px; color:var(--edim); margin-top:2px; }
.tiers{ display:grid; grid-template-columns:repeat(auto-fill, minmax(150px, 1fr)); gap:10px; margin:14px 0; }
.tier{ border:1px solid var(--eac2); padding:12px 14px; }
.tiname{ font:bold 11px var(--mono); letter-spacing:.12em; text-transform:uppercase; color:var(--edim); }
.tiprice{ font-size:22px; font-weight:bold; margin-top:4px; }
.tinote{ font-size:13px; color:var(--edim); margin-top:4px; }
.sales{ margin:6px 0 14px; border-top:1px solid var(--eac2); }
.sale{ display:flex; gap:18px; padding:11px 0; border-bottom:1px solid var(--eac2); }
.sale .sd{ flex:0 0 150px; font:bold 12px var(--mono); letter-spacing:.04em; text-transform:uppercase; padding-top:2px; }
.sale .sm2{ flex:1; min-width:0; }
.sale .sn{ font-weight:bold; }
.sst{ display:inline-block; margin-left:6px; padding:1px 7px; border:1px solid var(--edim); font:bold 10px var(--mono); letter-spacing:.08em; text-transform:uppercase; color:var(--edim); vertical-align:2px; }
.sst.on{ border-color:var(--eac); background:var(--eac); color:var(--eon); }
.asof{ margin-top:10px; font:11px var(--mono); letter-spacing:.08em; text-transform:uppercase; color:var(--edim); }
.prov{ list-style:none; margin:0 0 10px; padding:0; display:grid; grid-template-columns:repeat(auto-fill, minmax(220px, 1fr)); gap:8px; }
.prov li{ display:flex; align-items:center; gap:10px; padding:10px 12px; border:1px solid var(--eac2); }
.prov li::before{ content:""; flex:0 0 12px; height:12px; border:2px solid var(--eac); }
.prov li.y::before{ background:var(--eac); }
.prov li.n{ color:var(--edim); }
.chip.strong{ border-color:var(--eac); color:var(--eac); font-weight:bold; }
/* a label is not a button: tags and facts are filled and borderless; only what you can press has an outline */
span.chip{ border-color:transparent; background:color-mix(in srgb, var(--eac2) 55%, transparent); padding:4px 11px; }
span.chip.strong{ border-color:transparent; background:color-mix(in srgb, var(--eac) 16%, transparent); }
.chipmore{ align-self:center; padding:0 4px; font-size:13px; color:var(--edim); }
.vocab dt{ text-transform:none; letter-spacing:0; font:bold 14px var(--sys); color:var(--eink); }
.srcline{ margin-top:38px; font:11px var(--mono); letter-spacing:.1em; text-transform:uppercase; color:var(--edim); }
.av{ width:22px; height:22px; flex:0 0 22px; display:inline-grid; place-items:center; color:#fff; font:bold 10px var(--sys); }
.av.a40{ width:40px; height:40px; flex-basis:40px; font-size:14px; }
.av.a64{ width:64px; height:64px; flex-basis:64px; font-size:22px; }
.av.a28{ width:28px; height:28px; flex-basis:28px; font-size:11px; }

@container detail (max-width:620px){
  .banner{ min-height:0; }
  .banner .bin{ flex-direction:column; align-items:flex-start; gap:16px; padding:22px 18px 20px; }
  .banner .sq.s160{ width:92px; height:92px; font-size:50px; }
  .hl.h-huge{ font-size:clamp(32px, 11cqi, 46px); }
  .hl.h-outlined{ font-size:clamp(30px, 10cqi, 44px); }
  .hl.h-condensed{ font-size:clamp(30px, 10cqi, 44px); }
  .hl.h-stacked{ font-size:clamp(26px, 9cqi, 38px); }
  .mood{ font-size:16px; }
  .actbar{ padding:10px 14px; }
  .lin{ padding:4px 18px 36px; }
  .edition{ padding:14px 14px 0; }
  .vwent{ flex:1 1 auto; justify-content:center; }
  .entry{ margin:14px 14px 0; }
  .vpair{ flex:1 1 100%; }
  .vbtn{ flex:1; padding:0 10px; }
  .actbar{ position:relative; }
  .vsec{ display:contents; }
  .vpromo, .vmore{ flex:1 1 auto; justify-content:center; padding:0 8px; }
  .vmore.vdots{ flex:0 0 var(--act); }
  .facts{ grid-template-columns:1fr 1fr; }
  .evdesc{ font-size:16px; }
  .kv{ grid-template-columns:1fr; gap:2px; }
  .tl li, .sale{ flex-direction:column; gap:2px; }
  .tl .tld, .sale .sd{ flex-basis:auto; }
  .kv dd{ margin-bottom:8px; }
}

/* ---------- 7. app-chrome detail pages (horizon, person, call out) --- */
.page{ padding:26px 30px 40px; max-width:820px; }
.phead2{ display:flex; gap:18px; align-items:flex-start; }
.pname{ font-size:var(--fs-xl); font-weight:bold; line-height:1.15; overflow-wrap:anywhere; }
.psub{ margin-top:5px; color:var(--dim); }
.pdesc{ margin:14px 0 0; max-width:62ch; font-size:var(--fs-m); line-height:1.55; }
.acts{ display:flex; flex-wrap:wrap; gap:8px; margin-top:18px; }
fieldset.props{ margin:24px 0 0; padding:8px 18px 12px; border:1px solid var(--shadow); box-shadow:inset 1px 1px 0 #fff, 1px 1px 0 #fff; }
fieldset.props legend{ padding:0 6px; font-weight:bold; }
.prow{ display:flex; align-items:center; gap:14px; min-height:40px; padding:6px 0; border-bottom:1px solid var(--line); }
.prow:last-child{ border-bottom:0; }
.pk{ flex:0 0 112px; color:var(--dim); }
.pv{ flex:1; min-width:0; }
.subh{ margin:30px 0 8px; font:bold 11px var(--mono); letter-spacing:.14em; text-transform:uppercase; color:var(--dim); display:flex; gap:8px; }
.crow{ display:flex; align-items:center; gap:13px; min-height:64px; padding:10px 0; border-bottom:1px solid var(--line); }
.crow{ align-items:stretch; }
.crow > .sq, .crow > .av, .crow > .r-ic, .crow > .cverbs{ align-self:center; }
.crow .cm{ flex:1; min-width:0; min-height:44px; display:flex; flex-direction:column; justify-content:center; cursor:pointer; }
.crow .cm .r-title:hover{ text-decoration:underline; }
.cverbs{ display:flex; gap:6px; flex:0 0 auto; }
.tags{ display:flex; flex-wrap:wrap; gap:6px; margin-top:6px; }
.tag{ display:inline-flex; align-items:center; height:28px; padding:0 10px; background:var(--face-lt); box-shadow:var(--thin); font-size:var(--fs-s); }
.pres{ display:inline-block; width:9px; height:9px; border-radius:50%; border:1.5px solid #000; vertical-align:middle; margin-right:4px; }
.pres.online{ background:#000; }
.pres.idle{ background:linear-gradient(90deg,#000 50%,transparent 50%); }
@container detail (max-width:560px){
  .page{ padding:20px 16px 36px; }
  .phead2{ gap:14px; }
  .pname{ font-size:22px; }
  .acts .btn{ flex:1 1 auto; }
  .pk{ flex-basis:92px; }
}

/* ---------- 8. right: chats ------------------------------------------ */
.phead{ flex:0 0 auto; display:flex; align-items:center; gap:10px; min-height:54px; padding:4px 2px 10px 4px; }
.ptitle{ flex:1; min-width:0; font-size:var(--fs-l); font-weight:bold; line-height:1.2; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.ptitle small{ display:block; margin-top:2px; font-size:var(--fs-s); font-weight:normal; color:var(--dim); }
.chrow{ display:flex; align-items:center; gap:12px; min-height:68px; padding:10px 14px; border-bottom:1px solid var(--line); }
.chrow:hover{ background:var(--hover); }
.chrow .cmn{ flex:1; min-width:0; }
.chrow .cnm{ font-size:15px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.chrow.unread .cnm{ font-weight:bold; }
.chrow .cpv{ margin-top:2px; font-size:var(--fs-s); color:var(--dim); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.chrow.unread .cpv{ color:var(--ink); }
.chrow .cside{ display:flex; flex-direction:column; align-items:flex-end; gap:6px; }
.ctime{ font:11px var(--mono); color:var(--dim); white-space:nowrap; }
.udot{ width:10px; height:10px; background:#000; }
.av.gav{ background:var(--face); color:var(--ink); box-shadow:var(--out); }
.conv{ flex:1; min-height:0; display:flex; flex-direction:column; gap:8px; }
.msgs{ flex:1; min-height:0; overflow:auto; padding:16px 14px; background:#fff; box-shadow:var(--in); display:flex; flex-direction:column; gap:12px; }
.msg{ max-width:86%; align-self:flex-start; }
.msg.me{ align-self:flex-end; text-align:right; }
.mfrom{ margin-bottom:3px; font-size:12px; color:var(--dim); }
.mfrom .mt{ font-family:var(--mono); font-size:11px; margin-left:6px; }
.mbody{ display:inline-block; padding:8px 12px; background:var(--face-lt); border:1px solid #d8d4cb; text-align:left; line-height:1.4; overflow-wrap:anywhere; }
.msg.me .mbody{ background:#2a2a2a; border-color:#2a2a2a; color:#fff; }
.msg.sys{ align-self:center; font:12px var(--mono); color:var(--dim); text-align:center; }
.evcard{ display:flex; gap:10px; align-items:center; padding:8px; background:#fff; border:1px solid #bdb9b0; text-align:left; cursor:pointer; }
.evcard .t{ font-weight:bold; }
.evcard .m{ font-size:12px; color:var(--dim); }
.composer{ flex:0 0 auto; display:flex; gap:8px; }
.composer input{ flex:1; }
.members{ display:flex; gap:4px; }

/* ---------- 9. calendar ---------------------------------------------- */
.calbar{ flex:0 0 auto; display:flex; align-items:center; gap:8px; padding:0 0 8px; flex-wrap:wrap; }
.calbar .ttl{ font-size:18px; font-weight:bold; min-width:0; margin-right:6px; }
.calbar .spring{ flex:1; }
.calbar label{ display:flex; gap:8px; align-items:center; min-height:var(--ctl); padding:0 4px; font-size:var(--fs-s); cursor:pointer; }
.calgrid{ flex:1; min-height:0; overflow:auto; display:flex; flex-direction:column; }
.caldow{ display:flex; background:var(--face-lt); border-bottom:1px solid #b9b4a8; position:sticky; top:0; z-index:2; }
.caldow div{ flex:1; padding:6px 8px; font:bold 11px var(--mono); letter-spacing:.1em; text-transform:uppercase; border-left:1px solid #d7d3ca; }
.caldow div:first-child{ border-left:0; }
.calrow{ display:flex; flex:1 0 auto; min-height:104px; border-top:1px solid #d6d2c9; }
.calcell{ flex:1; min-width:0; border-left:1px solid #e3e0d9; padding:4px 4px 6px; overflow:hidden; }
.calcell:first-child{ border-left:0; }
.calcell.oth{ background:#f6f5f1; color:#a09c94; }
.calcell.today .dn{ background:var(--sel); color:#fff; }
.calcell .dn{ display:inline-block; padding:1px 6px; font:bold 12px var(--mono); }
.calev{ display:flex; align-items:center; gap:5px; margin:3px 0; min-height:24px; padding:2px 6px 2px 0; overflow:hidden; white-space:nowrap;
  background:var(--ebg); color:var(--eink); border-left:4px solid var(--eac); font-size:12px; }
.calev .cg{ color:var(--eac); padding-left:4px; }
.calev span{ overflow:hidden; text-overflow:ellipsis; }
.calev:hover{ outline:2px solid #000; outline-offset:-1px; }
.weekcol{ flex:1; min-width:0; border-left:1px solid #e3e0d9; display:flex; flex-direction:column; }
.weekcol .wh{ padding:8px; background:var(--face-lt); border-bottom:1px solid #b9b4a8; font:bold 12px var(--mono); }
.weekcol.today .wh{ background:var(--sel); color:#fff; }
.weekcol .wb{ flex:1; padding:4px; }
.dayband{ display:flex; border-top:1px solid #d6d2c9; min-height:42px; }
.dayband .hr{ flex:0 0 66px; padding:4px 8px; text-align:right; font:12px var(--mono); color:var(--dim); background:var(--face-lt); border-right:1px solid #b9b4a8; }
.dayband .slot{ flex:1; padding:3px; display:flex; flex-direction:column; gap:3px; }
.calcell .dots{ display:flex; flex-wrap:wrap; gap:3px; margin-top:4px; }
.calcell .dots i{ width:100%; height:6px; background:var(--eac); pointer-events:none; }
.calcell[data-act]{ cursor:pointer; }
.calcell[data-act]:hover{ background:var(--hover); }
.calcell.picked{ outline:2px solid #000; outline-offset:-2px; background:#fff; }
.weekcol .wh[data-act]{ cursor:pointer; }
.calall{ margin-left:auto; min-height:32px; padding:0 8px; border:0; background:transparent; font:bold 11px var(--mono); letter-spacing:.08em; text-transform:uppercase; color:var(--ink2); text-decoration:underline; }
body.is-phone .calall{ min-height:44px; }
.agenda{ border-top:1px solid #b9b4a8; }
@container cal (max-width:640px){
  .calrow{ min-height:58px; }
  .calcell{ padding:3px 2px; }
  .calcell .dn{ font-size:11px; padding:1px 3px; }
  .caldow div{ padding:6px 3px; text-align:center; }
}

/* ---------- 10. menus, dialogs, toasts ------------------------------- */
.popmenu{ position:fixed; z-index:80; min-width:220px; padding:3px; background:var(--face); box-shadow:var(--out), 3px 3px 8px rgba(0,0,0,.3); }
.popmenu .pi{ display:flex; align-items:center; gap:11px; min-height:40px; padding:0 18px 0 12px; white-space:nowrap; }
.popmenu .pi:hover, .popmenu .pi:focus{ background:var(--sel); color:#fff; outline:0; }
.popmenu .sepi{ height:2px; min-height:0; margin:3px 2px; padding:0; box-shadow:inset 0 1px 0 var(--shadow), inset 0 -1px 0 var(--white); }

/* the right-click menu: Windows 2000 grey, etched hairlines, a check gutter, a black ▸ for submenus */

var NEXTED = {};                 /* past edition id -> next edition id */

function makeNextEditions(){
  Object.keys(REC).forEach(function(id){
    var r = REC[id], b = r.burn, e = EVENTS[id];
    if (!e || !b || !b.nextEdition || NEXTED[id] || r._prev) return;
    var nd = isoDate(b.nextEdition.date);
    if (!nd || !isPast(lastDay(e))) return;
    var nid = id + '--next', ny = nd.slice(0,4);
    var title = /\b(19|20)\d\d\b/.test(e.title) ? e.title.replace(/\b(19|20)\d\d\b/, ny) : e.title + ' ' + ny;

                    ownerIds:e.ownerIds || [], kind:e.kind, city:e.city };
    var nr = JSON.parse(JSON.stringify(r));
    nr.id = nid; nr.date = nd; nr.endDate = isoDate(b.nextEdition.endDate) || undefined;
    nr.theme = b.nextEdition.theme ? (typeof b.nextEdition.theme === 'object' ? b.nextEdition.theme : { name:b.nextEdition.theme }) : undefined;
    nr.burn.edition = { year:+ny }; delete nr.burn.phases; delete nr.burn.nextEdition;
    delete nr.blocks; delete nr.startTime; delete nr.endTime;
    if (nr.access){

        var last = isoDate(sl.closes) || isoDate(sl.opens);

    }
    nr._prev = id; nr._prevYear = e.date.slice(0,4); nr._note = b.nextEdition.note;
    REC[nid] = nr;
    window.HYPERNET_THEMES.themes[nid] = TH(id);
    PROMOCOUNT[nid] = hashId(nid) % 17;
    NEXTED[id] = nid;
  });
}

function TH(id){ return window.HN_THEME(id); }
function hex2rgb(h){
  h = String(h||'#000').replace('#','');
  if (h.length === 3) h = h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
  return [parseInt(h.slice(0,2),16), parseInt(h.slice(2,4),16), parseInt(h.slice(4,6),16)];
}
function relLum(h){
  var c = hex2rgb(h).map(function(v){ v/=255; return v<=0.03928 ? v/12.92 : Math.pow((v+0.055)/1.055, 2.4); });
  return 0.2126*c[0] + 0.7152*c[1] + 0.0722*c[2];
}
function contrast(a,b){ var l1=relLum(a), l2=relLum(b); if (l1<l2){ var t=l1; l1=l2; l2=t; } return (l1+0.05)/(l2+0.05); }
function onColor(bg){ return contrast('#ffffff',bg) >= contrast('#000000',bg) ? '#ffffff' : '#000000'; }
function safeAccent(p){ return contrast(p.accent, p.bg) >= 3 ? p.accent : p.ink; }
function safeDim(p){ return contrast(p.dim, p.bg) >= 3 ? p.dim : p.ink; }
function themeVars(t){
  var p = t.palette;
  return '--ebg:'+p.bg+';--eink:'+p.ink+';--eac:'+safeAccent(p)+';--eac2:'+p.accent2+
         ';--edim:'+safeDim(p)+';--eon:'+onColor(safeAccent(p))+';';
}
function sqHTML(id, size, extraCls){
  var t = TH(id);
  return '<div class="sq s'+size+' sh-'+t.shape+(extraCls?' '+extraCls:'')+'" style="'+themeVars(t)+'">' +
         '<div class="pat p-'+t.square.pattern+'"></div><span class="g">'+t.square.glyph+'</span></div>';
}
function headlineHTML(t, title){
  if (t.headline === 'stacked') return title.split(' ').map(function(w){ return '<span>'+esc(w)+'</span>'; }).join('');
  if (t.headline === 'marquee'){ var s = esc(title) + ' &nbsp;·&nbsp; '; return '<b>'+s+s+'</b>'; }
  return esc(title);
}

function byDate(a,b){ return a.date < b.date ? -1 : a.date > b.date ? 1 : 0; }
function rsvpList(mode){ if (!S.loggedIn) return []; return allEvents().filter(function(e){ return RSVP[e.id] === mode; }).sort(byDate); }
function horizonsOf(evId){ return Object.keys(HORIZONS).filter(function(k){ return HORIZONS[k].eventIds.indexOf(evId) >= 0 && (HORIZONS[k].isPublished || hzOwnedByMe(k)); }); }
function hzCover(hzId){
  var hz = HORIZONS[hzId];
  if (!hz || HZCOVER[hzId] === 'plain') return null;
  if (HZCOVER[hzId] === 'own') return hz.eventIds.filter(function(id){ return EVENTS[id]; })[0] || null;
  if (HZCOVER[hzId] && hz.eventIds.indexOf(HZCOVER[hzId]) >= 0) return HZCOVER[hzId];
  return hz.eventIds.filter(function(id){ return EVENTS[id]; })[0] || null;
}
/* a square from a theme object (the event square, drawn for anything that has a theme) */
function sqT(t, px, extra){
  return '<div class="sq sh-'+t.shape+(extra?' '+extra:'')+'" style="'+themeVars(t)+'width:'+px+'px;height:'+px+'px;font-size:'+Math.round(px*0.54)+'px">' +
         '<div class="pat p-'+t.square.pattern+'"></div><span class="g">'+t.square.glyph+'</span></div>';
}
function hzOwnSquare(hzId){ return HZCOVER[hzId] === 'own' && HZTHEME[hzId]; }
/* one square standing for a horizon: its own, its chosen event's, or the first event's */
function hzArt(hzId, px){
  if (hzOwnSquare(hzId)) return sqT(HZTHEME[hzId], px);
  var cov = hzCover(hzId);
  return cov ? sqPx(cov, px) : ic('horizon', px > 24 ? Math.round(px * .6) : 18);
}
function hzIconHTML(hzId, size){ return hzArt(hzId, size || 20); }
function hzDates(hzId){
  var hz = HORIZONS[hzId];
  return (hz ? hz.eventIds : []).map(function(id){ return EVENTS[id]; }).filter(Boolean).map(function(e){ return e.date; }).sort();
}
function hzRange(hzId){
  var d = hzDates(hzId);
  if (!d.length) return 'No events yet';
  return d.length === 1 ? fmtDate(d[0]) : fmtShort(d[0]) + ' – ' + fmtDate(d[d.length-1]);
}
/* a horizon's date, said as what it means: its next event, or when its last one was */
function hzWhen(hzId){
  var hz = HORIZONS[hzId], evs = (hz ? hz.eventIds : []).map(function(id){ return EVENTS[id]; }).filter(Boolean);
  if (!evs.length) return '';
  var up = evs.filter(function(e){ return !isPast(lastDay(e)); }).sort(byDate)[0];
  if (up) return 'Next ' + fmtShort(up.date);
  return 'Ended ' + fmtShort(evs.map(lastDay).sort().pop());
}
function hzOwnedByMe(hzId){ return S.loggedIn && MYHORIZONS.indexOf(hzId) >= 0; }
function attendees(evId){
  if (/^evt-new-/.test(evId)) return (S.loggedIn && RSVP[evId] === 'going') ? ['self'] : [];
  var w = H.worlds.filter(function(x){ return x.eventId === evId; })[0];
  var ids = w && w.participantIds ? w.participantIds.filter(function(p){ return PEOPLE[p] && p !== 'self'; }) : [];
  if (!ids.length){ var n = hashId(evId); ids = CREW.filter(function(_,i){ return (n >> i) & 1; }); }
  if (S.loggedIn && RSVP[evId] === 'going') ids = ['self'].concat(ids);
  return ids.slice(0,6);
}
function attendeeCount(evId){ return attendees(evId).length + (/^evt-new-/.test(evId) ? 0 : (hashId(evId) % 34) + 4); }
function stateOf(evId){
  if (!S.loggedIn) return '';
  if (MYEVENTS.indexOf(evId) >= 0) return 'hosting';
  return RSVP[evId] || '';
}
/* where an event is, preferring its own details over the fixture's generated city */
function whereOf(e){
  var r = recOf(e.id);
  if (r.venueKind === 'virtual') return 'Online';
  return r.city || r.region || COUNTRY[r.country] || r.country || cityShort(e.city);
}
function isMine(evId){ return S.loggedIn && ownEvent(EVENTS[evId]); }
/* the entry point for someone without an account says so */
function joinLabel(){ return ACCTS.me ? 'Log in' : 'Join / Log in'; }
function unreadCount(items){ return items.filter(function(it){ return it.type==='event' && !READ[it.id]; }).length; }
function calloutOf(id){ return CALLOUTS.filter(function(x){ return x.id === id; })[0]; }
var TOASTT = null;
var WELCOME = null;             /* the first confirmation after joining also says hello */
var TOASTACT = null;            /* the one thing a toast can do: undo what it reports */
function toast(title, body, undo){
  if (WELCOME){ body = title + (body ? ' · ' + body : ''); title = WELCOME; WELCOME = null; }
  var box = $('toasts');
  TOASTACT = undo || null;
  box.innerHTML = '<div class="toast'+(undo ? ' act' : '')+'"><span class="tt2"><b>'+esc(title)+'</b>'+(body?esc(body):'')+'</span>' +
    (undo ? '<button class="btn" data-act="toastundo">'+esc(undo.label || 'Undo')+'</button>' : '') + '</div>';
  clearTimeout(TOASTT);
  TOASTT = setTimeout(function(){ box.innerHTML = ''; TOASTACT = null; }, undo ? 6000 : 2400);
}
/* logged-out actions ask for a login, then carry on with what you asked for.
   Carried on means made so: a verb you asked for is switched on, never toggled back off. */
var RESUMING = false;
function gated(fn){
  return function(){
    var args = arguments;
    if (!S.loggedIn){
      S.pending = function(){ RESUMING = true; try { fn.apply(null, args); } finally { RESUMING = false; } };
      loginDialog(); return;
    }
    fn.apply(null, args);
  };
}
/* a camp (group) is met through the Event Horizon it publishes */
function groupHorizon(g){ return Object.keys(HORIZONS).filter(function(k){ return HORIZONS[k].ownerGroupId === g && HORIZONS[k].isPublished; })[0] || null; }
function itemName(it){
  if (!it) return '';
  if (it.type === 'event') return EVENTS[it.id] ? EVENTS[it.id].title : '';
  if (it.type === 'horizon') return HORIZONS[it.id] ? HORIZONS[it.id].name : '';
  if (it.type === 'person') return person(it.id).displayName;
  if (it.type === 'callout') return (calloutOf(it.id) || {}).title || '';
  if (it.type === 'chat') return CHATS[it.id] ? CHATS[it.id].name : '';
  return '';
}

<script>
/* =========================================================================
   4. DESTINATIONS
   Home (FEED / LIST / CALENDAR), Horizons, People — plus the things you keep.
   A view is a way of looking at one destination, never a destination.
   ========================================================================= */
function feedEvents(){
  return allEvents().filter(function(e){ return !NEXTED[e.id]; }).sort(function(a,b){
    var pa = isPast(a.date) ? 1 : 0, pb = isPast(b.date) ? 1 : 0;
    if (pa !== pb) return pa - pb;
    return byDate(a,b);
  });
}
function browsableHorizons(){
  return Object.keys(HORIZONS).filter(function(k){ return HORIZONS[k].isPublished || hzOwnedByMe(k); });
}
function browsablePeople(){ var ids = CREW.slice(); if (S.loggedIn) ids.unshift('self'); return ids; }
/* Home on a desktop is the phone's shelves as bands: the same sections, in the same order */
var HOMEBAND = 8;
function homeItems(){
  var out = [];
  homeSections().forEach(function(sec){
    sec.items.slice(0, HOMEBAND).forEach(function(it){ out.push({ type:it.type, id:it.id, band:sec.title }); });
    if (sec.items.length > HOMEBAND) out.push({ type:'more', id:sec.id, band:sec.title, n:sec.items.length });
  });
  return out;
}
var VIEWS = { home:['feed','list','calendar'], horizons:['list','calendar'], going:['list','calendar'], interested:['list','calendar'],
              hosting:['list','calendar'], promoted:['list','calendar'], horizon:['list','calendar'] };
function destKey(f){ f = f || S.folder; return f.kind + (f.id ? ':' + f.id : ''); }
function viewsOf(f){
  f = f || S.folder;
  /* Show all keeps the switcher: an event shelf is a list you can also see as a calendar */
  if (f.kind === 'shelf') return EVENTSHELVES.test(f.id || '') ? ['list','calendar'] : [];
  return VIEWS[f.kind] || [];
}
var EVENTSHELVES = /^(week|soon|announced|people)$/;
function viewOf(f){ f = f || S.folder; var v = viewsOf(f); return v.length ? (S.view[destKey(f)] || v[0]) : 'list'; }
function isCal(){ return viewOf() === 'calendar'; }

function folderItems(f){
  f = f || S.folder;
  var evs = [];
  var k = f.kind;
  if (k === 'home')  return viewOf(f) === 'feed' ? homeItems() : feedEvents().map(function(e){ return { type:'event', id:e.id }; });
  if (k === 'horizons') return browsableHorizons().sort(function(a, b){ return hzFollowers(b) - hzFollowers(a); }).map(function(h){ return { type:'horizon', id:h }; });
  if (k === 'people')   return browsablePeople().map(function(p){ return { type:'person', id:p }; });
  if (k === 'shelf')    return shelfItems(f.id);
  if (k === 'search')   return searchItems(S.query);
  if (k === 'interested') evs = rsvpList('interested');
  else if (k === 'going') evs = rsvpList('going');
  else if (k === 'promoted') evs = S.loggedIn ? allEvents().filter(function(e){ return PROMOTED[e.id]; }).sort(byDate) : [];
  else if (k === 'hosting') evs = (S.loggedIn ? MYEVENTS : []).map(function(id){ return EVENTS[id]; }).filter(Boolean).sort(byDate);
  else if (k === 'horizon') evs = (HORIZONS[f.id] ? HORIZONS[f.id].eventIds : []).map(function(id){ return EVENTS[id]; }).filter(Boolean).sort(byDate);
  return evs.map(function(e){ return { type:'event', id:e.id }; });
}
function destEvents(f){
  f = f || S.folder;
  if (f.kind === 'horizons'){
    var seen = {}, out = [];
    browsableHorizons().forEach(function(k){ HORIZONS[k].eventIds.forEach(function(id){ if (EVENTS[id] && !seen[id]){ seen[id] = 1; out.push(EVENTS[id]); } }); });
    return out.sort(byDate);
  }
  if (f.kind === 'home') return feedEvents();
  return folderItems(f).filter(function(it){ return it.type === 'event'; }).map(function(it){ return EVENTS[it.id]; });
}
function folderName(f){
  f = f || S.folder;
  return { home:'Home', horizons:'Horizons', people:'People', interested:'Interested', going:'Going', hosting:'Hosting', promoted:'Promoted',
           search:'Search', you:'You', chats:'Chats', shelf: shelfTitle(f.id) }[f.kind] || (f.kind === 'horizon' && HORIZONS[f.id] ? HORIZONS[f.id].name : 'Home');
}
function folderSub(f){
  f = f || S.folder;
  var n = folderItems(f).length;
  if (f.kind === 'home')     return viewOf(f) === 'feed' ? '' : destEvents(f).length + ' events';
  if (f.kind === 'horizons') return n + ' horizons';
  if (f.kind === 'people')   return n + ' people';
  if (f.kind === 'search')   return n + ' result' + (n === 1 ? '' : 's') + ' for “' + S.query + '”';
  if (f.kind === 'horizon'){ var h = HORIZONS[f.id]; return h ? 'Event Horizon · ' + h.ownerName + ' · ' + h.eventIds.length + ' events' : ''; }
  return n + ' event' + (n === 1 ? '' : 's');
}
function sameFolder(a,b){ return a && b && a.kind === b.kind && (a.id||null) === (b.id||null); }

/* =========================================================================
   5. SEARCH — every family, grouped
   ========================================================================= */
/* search folds accents and case on both sides: "malmo" finds Malmö, "eksjo" finds Eksjö */
function fold(s){
  return String(s == null ? '' : s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '')
    .replace(/ø/g, 'o').replace(/æ/g, 'ae').replace(/ß/g, 'ss').replace(/đ/g, 'd').replace(/ł/g, 'l');
}
function matches(hay, q){ return fold(hay).indexOf(fold(q)) >= 0; }
/* where an event is, in every word someone might type: city, venue, region, country */
function placeWords(e){
  var r = recOf(e.id);
  return [e.city, whereOf(e), r.city, r.region, r.country, COUNTRY[r.country], r.venue && r.venue.name].filter(Boolean).join(' ');
}
/* "this week" (the next seven days, as on Home), "today", "tomorrow", "this weekend", "this month", "next week" read as dates */
function dateQuery(q){
  q = fold(q).trim();
  var dow = (NOW.getDay() + 6) % 7;   /* Monday = 0 */
  var R = { 'today':[0,0], 'tonight':[0,0], 'tomorrow':[1,1], 'this week':[0, 6], 'week':[0, 6], 'next week':[7 - dow, 13 - dow],
            'this weekend':[Math.max(0, 5 - dow), 6 - dow], 'weekend':[Math.max(0, 5 - dow), 6 - dow],
            'this month':[0, new Date(NOW.getFullYear(), NOW.getMonth() + 1, 0).getDate() - NOW.getDate()] }[q];
  return R || null;
}
function searchItems(q){
  q = String(q||'').trim();
  if (!q) return [];
  var out = [], dq = dateQuery(q);
  if (dq) return feedEvents().filter(function(e){ var a = dayDiff(e.date), b = dayDiff(lastDay(e)); return b >= dq[0] && a <= dq[1]; })
    .map(function(e){ return { type:'event', id:e.id }; });
  allEvents().sort(function(a,b){
    var pa = isPast(lastDay(a)) ? 1 : 0, pb = isPast(lastDay(b)) ? 1 : 0;
    return pa !== pb ? pa - pb : (pa ? -byDate(a,b) : byDate(a,b));
  }).forEach(function(e){
    if (matches(e.title,q) || matches(descOf(e),q) || matches(placeWords(e),q) || matches(e.hostName,q) || matches(TH(e.id).mood,q)) out.push({ type:'event', id:e.id });
  });
  Object.keys(HORIZONS).forEach(function(k){
    var hz = HORIZONS[k];
    if ((hz.isPublished || hzOwnedByMe(k)) && (matches(hz.name,q) || matches(hz.description,q) || matches(hz.ownerName,q))) out.push({ type:'horizon', id:k });
  });
  CALLOUTS.forEach(function(c){ if (matches(c.title,q) || matches(c.body,q) || matches(c.hostName,q)) out.push({ type:'callout', id:c.id }); });
  Object.keys(PEOPLE).forEach(function(k){
    var p = PEOPLE[k];
    if ((k === 'self' && !S.loggedIn) || k === 'p-michal' || /^u-/.test(k)) return;
    if (matches(p.displayName,q) || matches(p.handle,q) || matches(p.bio,q) || matches((p.skills||[]).join(' '),q) || matches(citiesOf(p).join(' '),q)) out.push({ type:'person', id:k });
  });
  return out;
}

/* =========================================================================
   6. THE LIST
   ========================================================================= */
function sortItems(items){
  var k = S.sort;
  if (S.folder.kind === 'home' && viewOf() === 'feed') return items;
  if (items.some(function(it){ return it.type !== 'event'; }) && S.folder.kind !== 'horizon') return items;
  var head = items.filter(function(it){ return it.type !== 'event'; }), evs = items.filter(function(it){ return it.type === 'event'; });
  evs.sort(function(a,b){
    var ea = EVENTS[a.id], eb = EVENTS[b.id];
    var va = k === 'title' ? ea.title : k === 'host' ? hostLabel(ea) : k === 'city' ? cityShort(ea.city) : null;
    var vb = k === 'title' ? eb.title : k === 'host' ? hostLabel(eb) : k === 'city' ? cityShort(eb.city) : null;
    if (va !== null && va.toLowerCase() !== vb.toLowerCase()) return va.toLowerCase() < vb.toLowerCase() ? -1 : 1;
    var pa = isPast(ea.date) ? 1 : 0, pb = isPast(eb.date) ? 1 : 0;
    if (k === 'date' && pa !== pb) return pa - pb;
    return byDate(ea, eb);
  });
  return head.concat(evs);
}
var SEARCHBAND = { event:'Events', horizon:'Event Horizons', callout:'Call outs', person:'People' };
function bandOf(it){
  var k = S.folder.kind;
  if (k === 'shelf') return null;
  if (k === 'search') return SEARCHBAND[it.type];
  if (k === 'home' && viewOf() === 'feed')
    return it.band;
  if (k === 'horizons') return hzOwnedByMe(it.id) ? 'Yours' : (S.loggedIn && HZFOLLOW[it.id]) ? 'Following' : 'Popular';
  if (k === 'people') return it.id === 'self' ? 'You' : (S.loggedIn && PFOLLOW[it.id]) ? 'People you follow' : 'Around the network';
  if (it.type === 'horizon') return 'Event Horizon';
  if (S.sort !== 'date') return null;
  var d = dayDiff(EVENTS[it.id].date);
  if (d < 0) return 'Past';
  if (d <= 7) return 'This week';
  if (d <= 31) return 'This month';
  return 'Later';
}
var BANDORDER = ['Event Horizon','Happening soon','Announced','This week','This month','Later','Past',
                 'Events','Event Horizons','People','You','Yours','Following','People you follow','Around the network','Popular'];
function groupItems(items){
  var groups = {}, order = [];
  items.forEach(function(it){ var b = bandOf(it) || ''; if (!groups[b]){ groups[b] = []; order.push(b); } groups[b].push(it); });
  if (!(S.folder.kind === 'home' && viewOf() === 'feed'))
    order.sort(function(a,b){ var ia = BANDORDER.indexOf(a), ib = BANDORDER.indexOf(b); return (ia<0?99:ia) - (ib<0?99:ib); });
  return { groups:groups, order:order };
}
function orderedItems(){
  var g = groupItems(sortItems(folderItems())), out = [];
  g.order.forEach(function(b){ g.groups[b].forEach(function(it){ out.push(it); }); });
  return out;
}
function isSel(it){ var s = S.stack[0]; return s && s.type === it.type && s.id === it.id; }
function statePills(evId){
  var st = stateOf(evId), h = '';
  if (S.loggedIn && WENT[evId]) return '<span class="pill going">'+ic('check',11)+'<span>Went</span></span>';
  if (st === 'going')      h += '<span class="pill going">'+ic('check',11)+'<span>Going</span></span>';
  if (st === 'interested') h += '<span class="pill int">'+ic('heart',11)+'<span>Interested</span></span>';
  if (st === 'hosting')    h += '<span class="pill host">'+ic('star',11)+'<span>Hosting</span></span>';
  if (S.loggedIn && PROMOTED[evId]) h += '<span class="pill">'+ic('promote',11)+'<span>Promoted</span></span>';
  return h;
}
function rowHTML(it){
  if (it.type === 'more') return '<div class="row more" data-act="shelfall" data-id="'+it.id+'" role="button" tabindex="-1"><div class="r-main"><div class="r-title">Show all '+it.n+'</div></div>' +
    ic('back',16).replace('class="ic"','class="ic" style="transform:scaleX(-1)"')+'</div>';
  var cls = 'row' + (isSel(it) ? ' sel' : ''), lead, title, meta, date = '', side = '', act = 'data-act="row" data-type="'+it.type+'" data-id="'+it.id+'"';
  if (it.type === 'event'){
    var e = EVENTS[it.id];
    if (!READ[it.id]) cls += ' unread';
    if (isPast(lastDay(e))) cls += ' past';
    lead = sqHTML(it.id, 40);
    title = esc(e.title);
    var rk = recOf(it.id).kind;
    meta = [hostLabel(e), whereOf(e), rk && rk !== 'meetup' ? KINDLAB[rk] : (e.kind === 'world' ? 'World' : '')].filter(Boolean).map(esc).join(' · ');
    var dd = endOf(e);
    date = dd ? fmtShort(e.date) + ' +' + (nDays(e.date, dd) - 1) + 'd' : fmtShort(e.date);
    side = statePills(it.id);
    if (S.folder.kind === 'search' && isPast(lastDay(e)) && !side) side = '<span class="pill dim"><span>Past</span></span>';
  } else if (it.type === 'horizon'){
    var hz = HORIZONS[it.id];
    lead = '<span class="r-ic">'+hzArt(it.id, 32)+'</span>';
    title = esc(hz.name);
    meta = esc('Event Horizon · ' + hz.ownerName + ' · ' + hz.eventIds.length + ' events');
    date = hzWhen(it.id);
    side = hzOwnedByMe(it.id) ? '<span class="pill host"><span>Yours</span></span>' : (S.loggedIn && HZFOLLOW[it.id]) ? '<span class="pill going">'+ic('check',11)+'<span>Following</span></span>' : '';
  } else if (it.type === 'person'){
    var p = person(it.id);
    lead = avHTML(it.id, 'a40');
    title = esc(p.displayName) + (it.id === 'self' ? ' <span class="r-meta" style="display:inline">(you)</span>' : '');
    meta = esc(['@'+p.handle, cityShort(p.city), p.bio].filter(Boolean).join(' · '));
    side = (it.id !== 'self' && S.loggedIn && PFOLLOW[it.id]) ? '<span class="pill going">'+ic('check',11)+'<span>Following</span></span>' : '';
  } else if (it.type === 'callout'){
    var c = calloutOf(it.id);
    lead = '<span class="r-ic">'+ic('callout')+'</span>';
    title = esc(c.title);
    meta = esc([c.hostName, c.eventId && EVENTS[c.eventId] ? 'for ' + EVENTS[c.eventId].title : '', c.body].filter(Boolean).join(' · '));
    date = c.closed ? 'closed' : 'until ' + fmtShort(c.expiresAt);
  }
  var drag = it.type === 'event' && !L.phone ? ' draggable="true"' : '';
  if (it.type === 'event' && S.folder.kind === 'horizon' && hzOwnedByMe(S.folder.id))
    side += '<button class="ib rrm" data-act="unfile" data-id="'+it.id+'" data-hz="'+S.folder.id+'" aria-label="Remove from '+esc(HORIZONS[S.folder.id].name)+'">'+ic('close',14)+'</button>';
  return '<div class="'+cls+'" '+act+drag+' role="button" tabindex="-1">' + lead +
    '<div class="r-main"><div class="r-title">'+title+'</div>'+((meta || date)?'<div class="r-meta">'+(date?'<span class="r-dm">'+date+(meta?' · ':'')+'</span>':'')+meta+'</div>':'')+'</div>' +
    ((date || side) ? '<div class="r-side">'+(date?'<div class="r-date">'+date+'</div>':'')+(side?'<div class="r-states">'+side+'</div>':'')+'</div>' : '') +
    '</div>';
}
/* an empty phone search offers the directories that have no tab of their own */
var RECENTQ = [];                /* the last searches you ran, newest first */
function rememberQuery(q){
  q = String(q || '').trim(); if (q.length < 2) return;
  RECENTQ = [q].concat(RECENTQ.filter(function(x){ return fold(x) !== fold(q) && fold(q).indexOf(fold(x)) !== 0; })).slice(0, 5);
  schedulePersist();
}
function browseHTML(){
  var rec = RECENTQ.length ? '<div class="band">Recent</div>' + RECENTQ.map(function(q){
    return '<div class="row" data-act="dosearch" data-id="'+esc(q)+'" role="button"><span class="r-ic">'+ic('search')+'</span><div class="r-main"><div class="r-title">'+esc(q)+'</div></div></div>'; }).join('') : '';
  return rec + '<div class="band">Browse</div>' +
    '<div class="row" data-act="folder" data-kind="people" role="button">'+'<span class="r-ic">'+ic('people')+'</span><div class="r-main"><div class="r-title">People</div>' +
      '<div class="r-meta">'+browsablePeople().filter(function(k){ return k !== 'self'; }).length+' on Hypernet</div></div></div>' +
    '<div class="row" data-act="shelfall" data-id="callouts" role="button">'+'<span class="r-ic">'+ic('callout')+'</span><div class="r-main"><div class="r-title">Call outs</div>' +
      '<div class="r-meta">'+shelfItems('callouts').length+' open</div></div></div>';
}

  if (onEv){ var bt = TH(it.id); bar.className = 't-' + bt.type + ' sh-' + bt.shape; bar.setAttribute('style', themeVars(bt)); bar.innerHTML = evbarHTML(it.id); }
  else bar.innerHTML = '';
  /* the back bar: only when there is somewhere to go back to */
  var show = !L.phone && ((L.split && S.stack.length > 1) || (!L.split && S.stack.length > 0));
  $('app').classList.toggle('show-dbar', show);
  if (show){
    var prev = S.stack.length > 1 ? itemName(S.stack[S.stack.length-2]) : (isCal() ? folderName() + ' · Calendar' : folderName());
    $('dbar').innerHTML = '<button class="btn" data-act="back">'+ic('back')+'Back</button><span class="dcrumb">'+esc(prev)+'</span>';

</script>
<script>
/* =========================================================================
   7b. THE PHONE FEED — Spotify's structure in a 2000-era skin
   A greeting, filter chips, quick tiles for the things you keep, then
   sideways shelves of big squares. Event squares are the album art;
   horizons are playlists with a cover built from their events.
   ========================================================================= */
/* an event square at any pixel size */
function sqPx(id, px, extra){
  var t = TH(id);
  return '<div class="sq sh-'+t.shape+(extra?' '+extra:'')+'" style="'+themeVars(t)+'width:'+px+'px;height:'+px+'px;font-size:'+Math.round(px*0.54)+'px">' +
         '<div class="pat p-'+t.square.pattern+'"></div><span class="g">'+t.square.glyph+'</span></div>';
}
/* a horizon's cover: the owner's pick, or a 2×2 mosaic of its first four events */
function mosaicOf(ids, px){
  ids = ids.filter(function(id){ return EVENTS[id]; });
  if (!ids.length) return '<div class="mosaic empty" style="width:'+px+'px;height:'+px+'px">'+ic('horizon', Math.round(px/3))+'</div>';
  if (ids.length < 4) return '<div class="mosaic one" style="width:'+px+'px;height:'+px+'px">' + sqPx(ids[0], px) + '</div>';
  var h = Math.floor(px/2);
  return '<div class="mosaic" style="width:'+(h*2)+'px;height:'+(h*2)+'px">' + ids.slice(0,4).map(function(id){ return sqPx(id, h); }).join('') + '</div>';
}
function hzMosaic(hzId, px){
  var hz = HORIZONS[hzId], ids = hz ? hz.eventIds.filter(function(id){ return EVENTS[id]; }) : [];
  if (hzOwnSquare(hzId)) return '<div class="mosaic one" style="width:'+px+'px;height:'+px+'px">' + sqT(HZTHEME[hzId], px) + '</div>';
  if (HZCOVER[hzId] === 'plain' || !ids.length) return '<div class="mosaic empty" style="width:'+px+'px;height:'+px+'px">'+ic('horizon', Math.round(px/3))+'</div>';
  if (HZCOVER[hzId] || ids.length < 4) return '<div class="mosaic one" style="width:'+px+'px;height:'+px+'px">' + sqPx(hzCover(hzId), px) + '</div>';
  if (!ids.length) return '<div class="mosaic empty" style="width:'+px+'px;height:'+px+'px">'+ic('horizon', Math.round(px/3))+'</div>';
  var h = Math.floor(px/2);
  return '<div class="mosaic" style="width:'+(h*2)+'px;height:'+(h*2)+'px">' + ids.slice(0,4).map(function(id){ return sqPx(id, h); }).join('') + '</div>';
}
function cardTag(it){
  if (!S.loggedIn) return '';
  if (it.type === 'event'){
    if (WENT[it.id]) return '<span class="ctag">Went</span>';
    var st = stateOf(it.id);
    return st ? '<span class="ctag">'+{ going:'Going', interested:'Interested', hosting:'Hosting' }[st]+'</span>' : PROMOTED[it.id] ? '<span class="ctag">Promoted</span>' : '';
  }
  if (it.type === 'horizon') return hzOwnedByMe(it.id) ? '<span class="ctag">Yours</span>' : HZFOLLOW[it.id] ? '<span class="ctag">Following</span>' : '';
  return '';
}
function cardHTML(it){
  var art, t, sub;
  if (it.type === 'event'){
    var e = EVENTS[it.id], end = endOf(e);
    art = sqPx(it.id, 150);
    t = e.title; sub = relDay(e) + (end && dayDiff(e.date) > 6 ? ' +' + (nDays(e.date, end) - 1) + 'd' : '') + ' · ' + whereOf(e);
  } else if (it.type === 'horizon'){
    var hz = HORIZONS[it.id];
    art = hzMosaic(it.id, 150);
    t = hz.name; sub = hz.ownerName + ' · ' + hz.eventIds.length + ' events';
  } else {
    var c = calloutOf(it.id);
    art = '<div class="coart">'+ic('callout', 40)+'<span>Looking for</span><b>'+esc(c.title)+'</b></div>';
    t = c.hostName; sub = 'until ' + fmtShort(c.expiresAt);
  }
  return '<div class="card2" data-act="row" data-type="'+it.type+'" data-id="'+it.id+'" role="button">' +
    '<div class="cart">'+art+cardTag(it)+'</div><div class="ct2">'+esc(t)+'</div><div class="cs2">'+esc(sub)+'</div></div>';
}
function upcoming(e){ return !isPast(lastDay(e)); }
/* this week's days read as days: Today, Tomorrow, Wed · in 3 days */
function relDay(e){
  var d = dayDiff(e.date);
  if (d < 0 && !isPast(lastDay(e))) return 'On now';
  if (d === 0) return 'Today';
  if (d === 1) return 'Tomorrow';
  if (d > 1 && d <= 6) return DAY[dOf(e.date).getDay()] + ' · in ' + d + ' days';
  return fmtShort(e.date);
}
/* horizons worth following: the newly published first, then the most followed */
function popularHorizons(){
  return browsableHorizons().filter(function(k){ return HORIZONS[k].isPublished; }).sort(function(a,b){
    var na = HORIZONS[a].ownerAcct ? 1 : 0, nb = HORIZONS[b].ownerAcct ? 1 : 0;
    return (nb - na) || (hzFollowers(b) - hzFollowers(a));
  });
}
/* the sections of Home, in order. Each one also backs a "Show all" list. */
var HOMESECTIONS = ['week','people','soon','announced','yourhz','horizons','callouts'];
function shelfItems(id){
  var ev = function(list){ return list.map(function(e){ return { type:'event', id:e.id }; }); };
  var up = feedEvents().filter(upcoming);
  if (id === 'week') return ev(up.filter(function(e){ return dayDiff(e.date) <= 6; }));
  if (id === 'soon') return ev(up.filter(function(e){ return dayDiff(e.date) > 6; }).slice(0, 12));
  if (id === 'announced') return ev(Object.keys(NEXTED).map(function(k){ return EVENTS[NEXTED[k]]; }).filter(Boolean).sort(byDate));
  if (id === 'horizons') return popularHorizons().filter(function(k){ return !(S.loggedIn && (HZFOLLOW[k] || MYHORIZONS.indexOf(k) >= 0)); }).map(function(k){ return { type:'horizon', id:k }; });
  if (id === 'yourhz') return !S.loggedIn ? [] : MYHORIZONS.slice().reverse().concat(Object.keys(HZFOLLOW).filter(function(k){ return HZFOLLOW[k] && MYHORIZONS.indexOf(k) < 0; })).filter(function(k){ return HORIZONS[k]; }).map(function(k){ return { type:'horizon', id:k }; });
  if (id === 'callouts'){
    var open = CALLOUTS.filter(function(c){ return !c.closed; });
    var mine = S.loggedIn ? open.filter(function(c){ return c.hostId && PFOLLOW[c.hostId]; }) : [];
    return mine.concat(open.filter(function(c){ return mine.indexOf(c) < 0; })).map(function(c){ return { type:'callout', id:c.id }; });
  }
  if (id === 'people'){
    if (!S.loggedIn) return [];
    return ev(up.filter(function(e){ var hp = hostPersonOf(e); return hp && hp.id !== 'self' && PFOLLOW[hp.id]; }));
  }
  return [];
}
function shelfTitle(id){
  return { week:'This week', soon:'Coming up', announced:'Announced burns', yourhz:'Your Event Horizons', horizons:'Event Horizons worth following',
           callouts: S.loggedIn && CALLOUTS.some(function(c){ return !c.closed && c.hostId && PFOLLOW[c.hostId]; }) ? 'Call outs from your crews' : 'Call outs',
           people:'From people you follow' }[id] || '';
}
/* each event shows up once on Home, in the first section that has it */
function homeSections(){
  var seen = {};
  return HOMESECTIONS.map(function(id){
    var items = shelfItems(id).filter(function(it){
      var k = it.type + ':' + it.id;
      if (seen[k]) return false; seen[k] = 1; return true;
    });
    return { id:id, title:shelfTitle(id), items:items };
  }).filter(function(sec){ return sec.items.length; });
}
function greeting(){
  var hr = new Date().getHours();
  var g = hr < 5 ? 'Good night' : hr < 12 ? 'Good morning' : hr < 18 ? 'Good afternoon' : 'Good evening';
  return S.loggedIn ? g + ', ' + PEOPLE['self'].displayName.split(' ')[0] : g;
}
function shelvesHTML(){
  var h = '<div class="shelves">';
  h += '<div class="greet"><h2>'+esc(greeting())+'</h2>' + (S.loggedIn ? '' : '<p>Burns, builds and the people who make them.</p>') + '</div>';
  homeSections().forEach(function(sec){
    var more = sec.items.length > 2;
    h += '<section class="shelf"><div class="shh"><h3>'+esc(sec.title)+'</h3>' +
         (more ? '<button class="showall" data-act="shelfall" data-id="'+sec.id+'">Show all</button>' : '') + '</div>';
    h += '<div class="srow" data-shelf="'+sec.id+'">' + sec.items.slice(0, 10).map(cardHTML).join('') + '</div></section>';
  });
  return h + '</div>';
}
function renderShelves(){
  var lb = $('listbody'), top = lb.scrollTop, left = {};
  lb.querySelectorAll('.srow').forEach(function(r){ left[r.getAttribute('data-shelf')] = r.scrollLeft; });
  lb.innerHTML = shelvesHTML();
  lb.querySelectorAll('.srow').forEach(function(r){ var v = left[r.getAttribute('data-shelf')]; if (v) r.scrollLeft = v; });
  lb.scrollTop = top;
  S.rows = [];
}
function isShelfFeed(){ return L.phone && S.folder.kind === 'home' && viewOf() === 'feed'; }

/* =========================================================================
   8. CALENDAR — a view of the destination you are in
   ========================================================================= */
function calEvents(){ return destEvents().filter(function(e){ return (S.calMine && S.loggedIn) ? !!RSVP[e.id] || MYEVENTS.indexOf(e.id) >= 0 : true; }); }
function eventsOn(iso){
  return calEvents().filter(function(e){
    var end = endOf(e);
    return e.date === iso || (end && e.date < iso && iso <= end);
  }).sort(function(a,b){ return a.title < b.title ? -1 : 1; });
}
function calBlock(e){
  var t = TH(e.id);
  return '<div class="calev" style="'+themeVars(t)+'" data-act="open-reset" data-type="event" data-id="'+e.id+'">' +
    '<span class="cg">'+t.square.glyph+'</span><span>'+esc(e.title)+'</span>' +
    (S.loggedIn && RSVP[e.id]==='going' ? '<span style="margin-left:auto">'+ic('check',12)+'</span>' : '') + '</div>';
}
function narrowCal(){ return L.phone || L.cw < 640; }
function monthGrid(anchorIso){
  var a = dOf(anchorIso), y = a.getFullYear(), m = a.getMonth();
  var first = new Date(y, m, 1, 18), start = new Date(first);
  start.setDate(1 - ((first.getDay() + 6) % 7));
  var narrow = narrowCal();
  var h = '<div class="calgrid"><div class="caldow">' + (narrow ? ['M','T','W','T','F','S','S'] : ['Mon','Tue','Wed','Thu','Fri','Sat','Sun']).map(function(d){ return '<div>'+d+'</div>'; }).join('') + '</div>';
  for (var w = 0; w < 6; w++){
    h += '<div class="calrow">';
    for (var d = 0; d < 7; d++){
      var day = new Date(start.getFullYear(), start.getMonth(), start.getDate() + w*7 + d, 18);
      var iso = isoOf(day), evs = eventsOn(iso);
      /* the whole day is the target: on a phone it lists that day below, on a desktop it opens the day */
      var picked = narrow && S.calDay === iso;
      h += '<div class="calcell'+(day.getMonth()!==m?' oth':'')+(iso===TODAY_ISO?' today':'')+(picked?' picked':'')+'" data-act="calday" data-id="'+iso+'" role="button" ' +
             'aria-label="'+esc(fmtDate(iso) + (evs.length ? ', ' + evs.length + ' event' + (evs.length === 1 ? '' : 's') : ''))+'"'+(narrow ? ' aria-pressed="'+picked+'"' : '')+'>' +
           '<span class="dn">'+day.getDate()+'</span>' +
           (narrow ? '<div class="dots">' + evs.slice(0,3).map(function(e){ return '<i style="'+themeVars(TH(e.id))+'"></i>'; }).join('') + '</div>'
                   : evs.map(calBlock).join('')) + '</div>';
    }
    h += '</div>';
  }
  if (narrow){
    var dayPick = S.calDay && dOf(S.calDay).getMonth() === m ? S.calDay : null;
    var list = dayPick ? eventsOn(dayPick).sort(byDate)
             : calEvents().filter(function(e){ var dd = dOf(e.date); return dd.getMonth() === m && dd.getFullYear() === y; }).sort(byDate);
    var head = dayPick ? fmtDate(dayPick) : MONFULL[m];
    h += '<div class="agenda"><div class="band">'+esc(head)+' <span class="cnt">'+list.length+'</span>' +
      (dayPick ? '<button class="calall" data-act="calday" data-id="'+dayPick+'">All of '+MONFULL[m]+'</button>' : '') + '</div>' +
      (list.length ? list.map(function(e){ return rowHTML({ type:'event', id:e.id }).replace('data-act="row"', 'data-act="open-reset"'); }).join('')
                   : '<div class="empty">Nothing on '+esc(head)+'.</div>') + '</div>';
  }
  return h + '</div>';
}
function weekGrid(anchorIso){
  var a = dOf(anchorIso), start = new Date(a.getFullYear(), a.getMonth(), a.getDate() - ((a.getDay()+6)%7), 18);
  var h = '<div class="calgrid" style="flex-direction:row">';
  for (var d = 0; d < 7; d++){
    var day = new Date(start.getFullYear(), start.getMonth(), start.getDate()+d, 18), iso = isoOf(day);
    h += '<div class="weekcol'+(iso===TODAY_ISO?' today':'')+'"><div class="wh" data-act="calday" data-id="'+iso+'" role="button">'+DAY[day.getDay()]+' '+day.getDate()+'</div>' +
         '<div class="wb">' + eventsOn(iso).map(calBlock).join('') + '</div></div>';
  }
  return h + '</div>';
}
function dayGrid(anchorIso){
  var evs = eventsOn(anchorIso), h = '<div class="calgrid">';
  if (!evs.length) h += '<div class="empty">Nothing on '+fmtDate(anchorIso)+'.</div>';
  for (var hr = 8; hr <= 23; hr++){
    h += '<div class="dayband"><div class="hr">'+('0'+hr).slice(-2)+':00</div><div class="slot">' + (hr === 18 ? evs.map(calBlock).join('') : '') + '</div></div>';
  }
  return h + '</div>';
}
function renderCalendar(){
  var mode = narrowCal() && S.calMode === 'week' ? 'month' : S.calMode;
  var a = dOf(S.calAnchor);
  var title = mode === 'month' ? MONFULL[a.getMonth()] + ' ' + a.getFullYear() : mode === 'week' ? 'Week of ' + fmtShort(S.calAnchor) : fmtDate(S.calAnchor);
  var modes = narrowCal() ? ['day','month'] : ['day','week','month'];
  var bar = '<div class="calbar"><span class="ttl">'+esc(title)+'</span>' +
    '<button class="ib" data-act="calnav" data-id="-1" aria-label="Previous">'+ic('back')+'</button>' +
    '<button class="btn" data-act="caltoday">Today</button>' +
    '<button class="ib" data-act="calnav" data-id="1" aria-label="Next" style="transform:scaleX(-1)">'+ic('back')+'</button>' +
    '<span class="spring"></span>' +
    '<span class="seg">' + modes.map(function(m){ return '<button class="'+(mode===m?'on':'')+'" data-act="calmode" data-id="'+m+'">'+m.toUpperCase()+'</button>'; }).join('') + '</span>' +
    (S.loggedIn ? '<label><input type="checkbox" data-act="calmine"'+(S.calMine?' checked':'')+'> Only mine</label>' : '') + '</div>';
  var body = mode === 'month' ? monthGrid(S.calAnchor) : mode === 'week' ? weekGrid(S.calAnchor) : dayGrid(S.calAnchor);
  $('calcol').innerHTML = bar + '<div class="panel" style="display:flex;flex-direction:column">' + body + '</div>';
