<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#3a3a3a">
<title>Hypernet</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23d4d0c8'/%3E%3Cpath d='M16 4 28 16 16 28 4 16z' fill='%23141414'/%3E%3C/svg%3E">
<style>
/* =======================================================================
   HYPERNET — HOME FEED
   A Windows 2000 / Outlook frame, in greys only, so the events — and only
   the events — carry colour. Retro surface, modern hierarchy:
   one primary action per view, one type scale, one control height.
   ======================================================================= */

/* ---------- 1. tokens ------------------------------------------------ */
:root{
  --face:#d4d0c8; --face-lt:#e8e5df; --face-dk:#c2beb5;
  --white:#fff; --shadow:#808080; --dark:#404040;
  --ink:#141414; --ink2:#3a3a3a; --dim:#666; --line:#e2dfd8; --hover:#f0eee9;
  --sel:#262626; --seldim:#c8c8c8;
  --bar:linear-gradient(90deg,#262626 0%,#555 58%,#9b9b9b 100%);
  --sys:Tahoma,"Segoe UI",Verdana,Geneva,sans-serif;
  --mono:"Lucida Console",Monaco,Consolas,"Courier New",monospace;
  --fs-xs:11px; --fs-s:13px; --fs:14px; --fs-m:16px; --fs-l:20px; --fs-xl:26px;
  --ctl:36px;     /* every button, field and toggle */
  --act:44px;     /* the event verbs */
  --nav-w:252px; --chat-w:344px;
  --out: inset -1px -1px 0 var(--dark), inset 1px 1px 0 var(--white), inset -2px -2px 0 var(--shadow), inset 2px 2px 0 var(--face-lt);
  --in:  inset 1px 1px 0 var(--shadow), inset -1px -1px 0 var(--white), inset 2px 2px 0 var(--dark), inset -2px -2px 0 var(--face);
  --thin: inset 1px 1px 0 var(--shadow), inset -1px -1px 0 var(--white);
}
@media (pointer:coarse){ :root{ --ctl:44px; } }
*{ box-sizing:border-box; }
html,body{ height:100%; }
body{ margin:0; overflow:hidden; background:var(--face); color:var(--ink);
  font:var(--fs)/1.45 var(--sys); -webkit-font-smoothing:antialiased; -webkit-tap-highlight-color:transparent; }
button,input,select,textarea{ font:inherit; color:inherit; }
button{ cursor:pointer; }
[data-act]{ cursor:pointer; }
a{ color:inherit; }
.ic{ flex:0 0 auto; display:block; }
[hidden]{ display:none !important; }
.sr{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); }

/* ---------- 2. controls ---------------------------------------------- */
.btn{ height:var(--ctl); min-width:var(--ctl); padding:0 14px; display:inline-flex; align-items:center; justify-content:center;
  gap:7px; border:0; background:var(--face); color:var(--ink); white-space:nowrap; font-size:var(--fs); box-shadow:var(--out); }
.btn:active, .btn.on{ box-shadow:var(--in); background:var(--face-lt); }
.btn.on{ font-weight:bold; }
.btn.primary{ font-weight:bold; box-shadow:0 0 0 1px #000, var(--out); }
.btn.primary:active{ box-shadow:0 0 0 1px #000, var(--in); }
.btn:focus-visible, .ib:focus-visible, .seg button:focus-visible{ outline:1px dotted #000; outline-offset:-6px; }
.btn[disabled], .btn[aria-disabled="true"]{ color:#8a8a8a; text-shadow:1px 1px 0 #fff; cursor:default; }
.btn .ic{ margin-left:-2px; }
.btn .caret{ margin-right:-4px; }
.ib{ width:var(--ctl); height:var(--ctl); display:inline-grid; place-items:center; border:0; padding:0; background:var(--face); box-shadow:var(--out); color:var(--ink); }
.ib:active{ box-shadow:var(--in); }
.ib.on{ background:var(--sel); color:#fff; box-shadow:inset 1px 1px 0 #000, inset -1px -1px 0 #777; }
.ib.on .fillable{ fill:currentColor; }
.badge-n{ min-width:20px; height:20px; padding:0 6px; display:inline-grid; place-items:center; background:#000; color:#fff;
  font:bold 11px var(--mono); border-radius:10px; }
input[type=text], input[type=search], input[type=date], select, textarea{
  height:var(--ctl); padding:0 10px; border:0; border-radius:0; background:#fff; box-shadow:var(--in); font-size:var(--fs); min-width:0; }
textarea{ height:auto; padding:8px 10px; resize:vertical; line-height:1.45; }
input:focus, select:focus, textarea:focus{ outline:1px dotted #000; outline-offset:-5px; }
input[type=checkbox]{ width:18px; height:18px; margin:0; accent-color:#262626; }
.seg{ display:inline-flex; }
.seg button{ height:var(--ctl); padding:0 16px; border:0; background:var(--face); font:bold 12px var(--mono); letter-spacing:.08em;
  color:var(--ink2); box-shadow:var(--out); }
.seg button.on{ background:#fff; color:#000; box-shadow:var(--in); }

/* ---------- 3. frame ------------------------------------------------- */
#app{ position:fixed; inset:0; display:flex; flex-direction:column; }
#titlebar{ flex:0 0 30px; display:flex; align-items:center; gap:9px; padding:0 10px; color:#fff; background:var(--bar); font-size:13px; }
#titlebar .tglyph{ width:18px; height:18px; display:grid; place-items:center; background:var(--face); color:#000; font-size:11px;
  box-shadow:inset -1px -1px 0 var(--dark), inset 1px 1px 0 var(--white); }
#titlebar #wintitle{ opacity:.8; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
#toolbar{ flex:0 0 auto; display:flex; align-items:center; gap:10px; padding:9px 10px; border-bottom:1px solid var(--shadow); box-shadow:0 1px 0 var(--white); }
#toolbar .spring{ flex:1; }
.tsep:has(+ #acct:empty){ display:none; }
.tsep{ width:2px; align-self:stretch; margin:3px 0; box-shadow:inset 1px 0 0 var(--shadow), inset -1px 0 0 var(--white); }
.searchbox{ flex:0 1 460px; min-width:160px; height:var(--ctl); display:flex; align-items:center; gap:8px; padding:0 10px; background:#fff; box-shadow:var(--in); color:var(--dim); }
.searchbox input{ flex:1; min-width:0; height:100%; padding:0; border:0; box-shadow:none; background:transparent; color:var(--ink); }
.searchbox input:focus{ outline:0; }
.searchbox:focus-within{ outline:1px dotted #000; outline-offset:-5px; }
.acct .av{ width:24px; height:24px; flex-basis:24px; font-size:10px; }

#main{ flex:1; min-height:0; display:flex; gap:6px; padding:6px; }
.pane{ display:flex; flex-direction:column; min-height:0; min-width:0; }
#nav{ flex:0 0 var(--nav-w); display:none; }
#chats{ flex:0 0 var(--chat-w); display:none; }
#app.l-open #nav, #app.r-open #chats{ display:flex; }
#app.dock-narrow #chats{ flex-basis:300px; }
#main{ position:relative; }
#app.dock-over #chats{ position:absolute; top:6px; right:6px; bottom:6px; z-index:20; width:min(344px, calc(100% - var(--nav-w) - 40px));
  background:var(--face); padding:0 0 0 6px; box-shadow:-3px 0 0 var(--face), -4px 0 0 var(--shadow), -8px 0 16px rgba(0,0,0,.18); }
#center{ flex:1 1 auto; }
.panel{ flex:1; min-height:0; overflow:auto; background:#fff; box-shadow:var(--in); overscroll-behavior:contain; }
@media (pointer:fine){
  .panel::-webkit-scrollbar{ width:16px; height:16px; }
  .panel::-webkit-scrollbar-track{ background:repeating-conic-gradient(#fff 0 25%, #d4d0c8 0 50%) 0 0/2px 2px; }
  .panel::-webkit-scrollbar-thumb{ background:var(--face); box-shadow:var(--out); }
}
#appbar, #tabbar{ display:none; }
/* logged out, the whole app is a preview: a bar across the bottom says so and offers the way in (Spotify's pattern).
   It is a row of the app's own column, so it takes its space instead of covering anything. */
#previewbar{ display:none; flex:0 0 auto; align-items:center; gap:16px; padding:8px 12px 8px 16px; color:#fff;
  background:linear-gradient(90deg,#1c1c1c 0%,#3a3a3a 60%,#5a5a5a 100%); box-shadow:inset 0 1px 0 #7a7a7a; }
#app.preview #previewbar{ display:flex; }
#previewbar .pvt{ flex:1; min-width:0; }
#previewbar .pvk{ font:bold 11px var(--mono); letter-spacing:.16em; text-transform:uppercase; color:#cfcfcf; }
#previewbar .pvl{ margin-top:2px; font-size:var(--fs); line-height:1.3; }
#previewbar .pva{ flex:0 0 auto; display:flex; gap:8px; }
#previewbar .btn{ color:#000; }
#app.phone #previewbar{ gap:10px; padding:8px 8px 8px 12px; }
#app.phone #previewbar .pvl{ font-size:13px; display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; }
#app.phone #previewbar .pva{ flex-direction:column; gap:4px; }
#app.phone #previewbar .pva .btn{ height:36px; min-height:36px; padding:0 12px; }
#app.phone #previewbar .pva .btn.pvlogin{ height:auto; min-height:0; padding:4px 12px; background:transparent; box-shadow:none; color:#fff; text-decoration:underline; font-size:13px; }

/* ---------- 4. left: navigation -------------------------------------- */
#navbody{ padding:6px 0 18px; }
.navh{ padding:18px 20px 6px; font:bold 11px var(--mono); letter-spacing:.14em; text-transform:uppercase; color:var(--dim); }
.nrow{ display:flex; align-items:center; gap:11px; min-height:40px; margin:0 6px; padding:0 12px 0 14px; white-space:nowrap; color:var(--ink); }
.nrow .ic{ color:var(--ink2); }
.nrow .nlab{ flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; }
.nrow .nsub{ color:var(--dim); font-size:var(--fs-s); }
.nrow .ncnt{ font:12px var(--mono); color:var(--dim); }
.nrow:hover{ background:var(--hover); }
.nrow.sel{ background:var(--sel); color:#fff; }
.nrow.sel .ic, .nrow.sel .ncnt, .nrow.sel .nsub{ color:var(--seldim); }
.nrow.search{ cursor:default; padding-right:4px; margin-bottom:6px; }
.nrow .nx{ width:36px; height:32px; display:grid; place-items:center; border:0; padding:0; background:transparent; color:#fff; }
.nrow .nx:hover{ background:#444; }
.nrow.drop{ outline:2px dashed #000; outline-offset:-2px; background:#f4f2ec; }
.nrow .sq, .nrow .av{ width:20px; height:20px; flex-basis:20px; font-size:11px; }
.acctcard{ display:none; }

/* ---------- 5. centre: header, list, detail -------------------------- */
#chead{ flex:0 0 auto; display:flex; align-items:center; gap:12px; padding:4px 2px 10px 4px; min-height:54px; flex-wrap:wrap; }
#chead .ct{ flex:1 1 220px; min-width:0; }
#chead h2{ margin:0; font-size:var(--fs-l); line-height:1.2; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
#chead .csub{ color:var(--dim); font-size:var(--fs-s); margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
#chead .ctools{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
.sortsel{ display:flex; align-items:center; gap:8px; font-size:var(--fs-s); color:var(--dim); }
.sortsel select{ height:var(--ctl); }
#cbody{ flex:1; min-height:0; display:flex; gap:6px; }
#listcol, #calcol, #detailcol{ min-width:0; min-height:0; flex-direction:column; }
#listcol{ display:flex; container:list / inline-size; }
#calcol{ display:none; flex:1; container:cal / inline-size; }
#detailcol{ display:flex; container:detail / inline-size; }
#app.split #listcol{ flex:0 0 clamp(340px, 41%, 470px); }
#app.split #detailcol{ flex:1; }
#app.push #listcol{ flex:1; }
#app.push #detailcol{ display:none; flex:1; }
#app.v-cal #listcol{ display:none; }
#app.v-cal #calcol{ display:flex; }
#app.push.has-detail #listcol, #app.push.has-detail #calcol{ display:none; }
#app.push.has-detail #detailcol{ display:flex; }
#dbar{ display:none; flex:0 0 auto; align-items:center; gap:10px; padding:0 0 6px; }
#app.show-dbar #dbar{ display:flex; }
#dbar .dcrumb{ color:var(--dim); font-size:var(--fs-s); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.panempty{ min-height:100%; display:grid; place-items:center; color:var(--face); background:#fff; }
.panempty svg{ opacity:.9; }
#dbar .dkind{ font:bold 11px var(--mono); letter-spacing:.14em; text-transform:uppercase; }
#dbar .dclose{ margin-left:auto; flex:0 0 auto; width:30px; height:26px; display:grid; place-items:center; border:0; padding:0; background:var(--face); color:#000; box-shadow:var(--out); }
#dbar .dclose:active{ box-shadow:var(--in); }
#dscroll{ position:relative; }

/* rows */
.band{ position:sticky; top:0; z-index:6; display:flex; align-items:baseline; gap:8px; padding:14px 16px 7px; background:#fff;
  border-bottom:1px solid var(--line); font:bold 11px var(--mono); letter-spacing:.14em; text-transform:uppercase; color:var(--ink2); }
.band .cnt{ color:var(--dim); font-weight:normal; letter-spacing:.04em; }
.row{ display:flex; align-items:center; gap:13px; min-height:66px; padding:10px 16px; border-bottom:1px solid var(--line); }
.row:hover{ background:var(--hover); }
.row.sel{ background:var(--sel); color:#fff; }
.row.static{ cursor:default; }
.row.static:hover{ background:transparent; }
.r-main{ flex:1; min-width:0; }
.r-title{ font-size:15px; line-height:1.3; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
/* bold for unread only where reading is tracked: a desktop with an account */
#app.readmarks .row.unread .r-title{ font-weight:bold; }
.row.past .r-title{ color:#6f6f6f; }
.row.sel.past .r-title{ color:#ddd; }
.r-meta{ margin-top:3px; font-size:var(--fs-s); color:var(--dim); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.row.sel .r-meta{ color:var(--seldim); }
.r-side{ flex:0 0 auto; display:flex; flex-direction:column; align-items:flex-end; gap:5px; }
.r-date{ font:12px var(--mono); letter-spacing:.04em; text-transform:uppercase; color:var(--ink2); white-space:nowrap; }
.row.sel .r-date{ color:#fff; }
.r-states{ display:flex; gap:4px; }
.r-ic{ width:40px; height:40px; flex:0 0 40px; display:grid; place-items:center; background:var(--face); box-shadow:var(--out); color:var(--ink2); }
.row.sel .r-ic{ background:#444; color:#fff; box-shadow:none; }
.pill{ display:inline-flex; align-items:center; gap:4px; height:21px; padding:0 7px; font:bold 10px var(--mono); letter-spacing:.06em;
  text-transform:uppercase; border:1px solid var(--ink); color:var(--ink); background:#fff; white-space:nowrap; }
.pill .ic{ width:11px; height:11px; }
.pill.going{ background:var(--ink); color:#fff; }
.pill.host{ background:var(--face); }
.pill.dim{ border-color:#aaa; color:var(--dim); }
.row.sel .pill{ border-color:#fff; background:transparent; color:#fff; }
.row.sel .pill.going{ background:#fff; color:var(--sel); }
.empty{ padding:40px 24px; color:var(--dim); text-align:center; font-size:var(--fs-m); }
.empty .btn{ margin-top:14px; }
@container list (max-width:300px){ .r-states .pill span{ display:none; } }
.r-dm{ display:none; }
/* a narrow list gives the title the width: it may take two lines, and the date moves under it */
@container list (max-width:440px){
  .r-title{ white-space:normal; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; }
  .r-side .r-date{ display:none; }
  .r-dm{ display:inline; font:12px var(--mono); letter-spacing:.02em; text-transform:uppercase; color:var(--ink2); }
  .row.sel .r-dm{ color:#fff; }
}

/* ---------- 6. looks — the only colour in the product: three colours and a square ---------- */
.sq{ position:relative; overflow:hidden; display:grid; place-items:center; flex:0 0 auto; background:var(--ebg); color:var(--eac); line-height:1; }
.sq .g{ position:relative; }
.sq img, .av.img img{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; display:block; }
.sq.plain:not(.img){ box-shadow:inset 0 0 0 1px rgba(0,0,0,.3); }
.sq.s20{ width:20px; height:20px; font-size:12px; }
.sq.s40{ width:40px; height:40px; font-size:22px; }
.sq.s64{ width:64px; height:64px; font-size:34px; }
.sq.s160{ width:160px; height:160px; font-size:86px; }
.sq.s180{ width:180px; height:180px; font-size:96px; }
.sq.s56{ width:56px; height:56px; font-size:30px; }
.sq.s32{ width:32px; height:32px; font-size:18px; }
.sq.s16{ width:16px; height:16px; font-size:10px; }
.row.sel .sq{ box-shadow:0 0 0 2px #fff; }

/* the page: the plain layout, in the look's colours — paper, hairlines, ink. Nothing moves. */
.canvas{ position:relative; min-height:100%; background:var(--ebg); color:var(--eink); overflow:clip; isolation:isolate;
  font-family:"Helvetica Neue",Helvetica,Arial,sans-serif; line-height:1.68; }
.banner{ position:relative; display:flex; border-bottom:1px solid var(--eac2); }
.banner .bin{ position:relative; width:100%; display:flex; align-items:flex-end; gap:26px; padding:30px 34px 28px; }
.btxt{ flex:1; min-width:0; }
.eyebrow{ margin-bottom:10px; font:bold 12px var(--mono); letter-spacing:.14em; text-transform:uppercase; color:var(--edim); }
.hl{ margin:0; color:var(--eink); overflow-wrap:anywhere; font-size:clamp(34px, 7.4cqi, 58px); line-height:.98; letter-spacing:-.018em; }

/* The verbs are the window's controls, not the event's: one toolbar in the app's own bevel style, sitting on top of
   the event's world. No event colour, border, font or shape ever reaches a control. */
.actbar{ position:sticky; top:0; z-index:6; margin:0; padding:8px 34px; background:var(--face); color:var(--ink); font-family:var(--sys);
  box-shadow:inset 0 1px 0 var(--white), inset 0 -1px 0 var(--shadow), 0 1px 0 var(--dark), 0 3px 8px rgba(0,0,0,.25); }
.verbs{ display:flex; flex-wrap:wrap; align-items:center; gap:6px; }
.vgroup{ display:flex; }
.vgroup .btn + .btn{ margin-left:2px; }
.vsec{ display:flex; flex-wrap:wrap; gap:6px; margin-left:auto; }
/* one size for every control on an event or horizon page */
.vb{ height:var(--act); min-width:var(--act); padding:0 14px; font-size:var(--fs); }
.vb .n{ font:12px var(--mono); color:var(--dim); }
.vb.on .n{ color:var(--ink2); }
.vb.icononly{ padding:0; width:var(--act); }
.btn.on .fillable{ fill:currentColor; }
a.btn{ text-decoration:none; color:var(--ink) !important; }
.edition{ position:relative; z-index:3; padding:18px 34px 0; }
.edcard{ width:100%; display:grid; grid-template-columns:1fr auto; column-gap:16px; align-items:center; padding:16px 18px; text-align:left;
  background:color-mix(in srgb, var(--eac) 14%, transparent); border:2px solid var(--eac); color:var(--eink); font-family:var(--sys); }
.edcard:hover{ background:color-mix(in srgb, var(--eac) 24%, transparent); }
.edcard > span:not(.edgo){ grid-column:1; }
.edk{ font:bold 11px var(--mono); letter-spacing:.14em; text-transform:uppercase; color:var(--eac); }
.edt{ margin-top:4px; font-size:20px; font-weight:bold; line-height:1.2; }
.edd{ margin-top:3px; font-size:15px; }
.eds{ margin-top:8px; font:bold 12px var(--mono); letter-spacing:.06em; text-transform:uppercase; color:var(--eac); }
.edgo{ grid-column:2; grid-row:1 / span 4; width:44px; height:44px; display:grid; place-items:center; border:1px solid var(--eac); color:var(--eac); }
.edprev{ display:flex; align-items:center; gap:14px; flex-wrap:wrap; }
.edprev .chip{ min-height:44px; }
.ednote{ flex:1 1 260px; font-size:13px; color:var(--edim); }
/* the way in: a burn's tickets or membership, summarised, one tap from the top */
.entry{ position:relative; z-index:3; display:flex; align-items:center; gap:16px; flex-wrap:wrap; margin:18px 34px 0; padding:14px 16px;
  border:2px solid var(--eac); background:color-mix(in srgb, var(--eac) 10%, transparent); font-family:var(--sys); }
.entry .ensum{ flex:1 1 240px; min-width:0; }
.entry .enk{ font:bold 11px var(--mono); letter-spacing:.14em; text-transform:uppercase; color:var(--eac); }
.entry .env{ margin-top:4px; font-size:16px; font-weight:bold; color:var(--eink); }
.entry .ens{ margin-top:2px; font-size:13px; color:var(--edim); }
/* on a phone the event's verbs live in a bar at the bottom of the screen, always in reach */
#evbar{ display:none; flex:0 0 auto; padding:6px 8px; background:var(--face); color:var(--ink); box-shadow:inset 0 1px 0 var(--white), 0 -1px 0 var(--shadow); font-family:var(--sys); }
#app.phone.has-evbar #evbar{ display:block; }
#app.phone .pg-event > .actbar{ display:none; }
#evbar .verbs{ flex-wrap:nowrap; }
#evbar .verbs{ gap:4px; }
#evbar .vgroup{ flex:1 1 auto; min-width:0; }
#evbar .vb{ flex:1 1 auto; min-width:0; padding:0 6px; font-size:13px; gap:5px; }
#evbar .vb.icononly{ flex:0 0 var(--act); }

.layer{ position:relative; }
.lin{ position:relative; z-index:3; padding:6px 34px 44px; }

.canvas > .banner .eyebrow{ color:var(--eink); }
.sqwrap{ position:relative; flex:0 0 auto; }
/* content sits on a calm panel: white on the plain look, a step away from the ground on a customised one */
.canvas > .layer{ z-index:5; margin:28px clamp(0px, 3cqi, 40px) 0; background:var(--epanel, #fff); box-shadow:0 0 0 1px var(--eac2); }
/* one page template for events, horizons and people: every page is its own container, wherever it is shown */
.canvas.pg{ container:detail / inline-size; padding-bottom:48px; }
.psub2{ margin:12px 0 0; max-width:60ch; font-size:16px; line-height:1.45; color:var(--eink); }
.pgnote{ margin:10px 0 0; max-width:60ch; font-size:var(--fs-s); line-height:1.4; color:var(--edim); }
.dlg .kdesc.inline{ margin:0 0 16px; padding:0; border:0; background:none; font-size:var(--fs-s); color:var(--dim); }
.banner .av.a160{ width:160px; height:160px; flex-basis:160px; font-size:56px; box-shadow:0 0 0 1px rgba(0,0,0,.25), 4px 4px 0 rgba(0,0,0,.18); }

.pg .tracks{ margin:0; border-top:1px solid var(--eac2); }
.pg .track, .pg .trpast{ padding-left:0; padding-right:0; border-color:var(--eac2); }

.pg .track:hover, .pg .track:active{ background:color-mix(in srgb, var(--eac) 10%, transparent); }
.pg .track.sel{ background:var(--sel); color:#fff; margin:0 -12px; padding-left:12px; padding-right:12px; }
.pg .track.sel .tt, .pg .track.sel .ts{ color:#fff; }

@container detail (max-width:620px){

}
.canvas > .entry, .canvas > .edition{ z-index:5; }
.canvas > .entry{ background:color-mix(in srgb, var(--eac) 10%, var(--ebg)); }
.canvas > .edition .edcard{ background:color-mix(in srgb, var(--eac) 14%, var(--ebg)); }

}
.facts{ display:grid; grid-template-columns:repeat(auto-fill, minmax(168px, 1fr)); margin-top:24px; border-top:1px solid var(--eac2); border-left:1px solid var(--eac2); }
.fact{ padding:12px 14px 13px; border-right:1px solid var(--eac2); border-bottom:1px solid var(--eac2); min-width:0; }

.fvlink{ padding:0; border:0; background:transparent; color:inherit; font:inherit; text-align:left; text-decoration:underline; text-decoration-color:var(--eac); text-underline-offset:3px; cursor:pointer; min-height:0; }
@media (pointer:coarse){ .fvlink{ min-height:44px; } }
.fv{ margin-top:5px; font-size:16px; font-weight:bold; line-height:1.3; overflow-wrap:anywhere; }
.fs{ margin-top:3px; font-size:13px; color:var(--edim); line-height:1.4; }
.sect{ margin-top:30px; }
.sect > h3{ margin:0 0 12px; padding-bottom:7px; border-bottom:1px solid var(--eac2); font:bold 12px var(--mono); letter-spacing:.16em; text-transform:uppercase; color:var(--edim); }
.sect p{ margin:0 0 10px; max-width:66ch; }
.evdesc{ font-size:17px; }
.themeline{ font-size:24px; font-weight:bold; line-height:1.2; margin-bottom:6px; color:var(--eac); }
.chips{ display:flex; flex-wrap:wrap; gap:8px; }
.chip{ display:inline-flex; align-items:center; gap:8px; min-height:38px; padding:4px 13px 4px 6px; border:1px solid var(--eac2); background:transparent;
  color:var(--eink); font:13px var(--sys); text-align:left; }
.chip.plain{ padding:4px 13px; }
/* a chip you can press is a control, so it is the app's button; a chip that is only a label stays in the event's world */
button.chip, .canvas a.chip, a.chip{ border:0; background:var(--face); color:var(--ink); box-shadow:var(--out); text-decoration:none; }
button.chip:active, a.chip:active{ box-shadow:var(--in); }
button.chip .sub, a.chip .sub{ color:var(--dim); opacity:1; }
.canvas a.chip.strong, a.chip.strong{ color:var(--ink); font-weight:bold; box-shadow:0 0 0 1px #000, var(--out); }
.chip .sub{ opacity:.7; }
.cards{ display:grid; grid-template-columns:repeat(auto-fill, minmax(220px, 1fr)); gap:10px; }
.card{ border:1px solid var(--eac2); padding:14px 16px 15px; }
.card .ck{ font:bold 11px var(--mono); letter-spacing:.14em; text-transform:uppercase; color:var(--eac); }
.card .ctt{ margin:6px 0 4px; font-size:16px; font-weight:bold; line-height:1.3; }
.card .cbd{ font-size:14px; }
.card .cbd p{ margin:0; }
.tmodel{ display:inline-block; margin-bottom:10px; padding:4px 10px; border:2px solid var(--eac); font:bold 12px var(--mono); letter-spacing:.12em; text-transform:uppercase; color:var(--eac); }
.blist{ margin:0; padding:0; list-style:none; max-width:70ch; }
.blist li{ position:relative; padding:7px 0 7px 22px; border-bottom:1px dashed color-mix(in srgb, var(--eac2) 80%, transparent); }
.blist li::before{ content:""; position:absolute; left:3px; top:calc(.72em + 3px); width:7px; height:7px; background:var(--eac); }
.irows{ display:flex; flex-direction:column; gap:0; max-width:70ch; }
.irow{ padding:9px 0; border-bottom:1px dashed color-mix(in srgb, var(--eac2) 80%, transparent); }
.irow .it{ font-weight:bold; }
.irow .iw{ margin-top:3px; font:12px var(--mono); color:var(--edim); }
.kv{ display:grid; grid-template-columns:minmax(110px, 30%) 1fr; gap:8px 16px; margin:8px 0 0; max-width:70ch; }
.kv dt{ color:var(--edim); font:12px var(--mono); letter-spacing:.06em; text-transform:uppercase; padding-top:2px; }
.kv dd{ margin:0; }
.kv dd p{ margin:0; }
.canvas a{ color:var(--eac); }
/* timeline: build, gates, burns, strike — the event is a sequence, not a date */
.tl{ list-style:none; margin:0; padding:0; max-width:70ch; }
.tl li{ position:relative; display:flex; gap:18px; padding:0 0 16px 22px; }
.tl li::before{ content:""; position:absolute; left:4px; top:7px; width:9px; height:9px; background:var(--eac); }
.tl li::after{ content:""; position:absolute; left:8px; top:18px; bottom:-4px; width:1px; background:var(--eac2); }
.tl li:last-child::after{ display:none; }
.tl .tld{ flex:0 0 150px; font:bold 12px var(--mono); letter-spacing:.04em; text-transform:uppercase; color:var(--eink); padding-top:2px; }
.tl .tld span{ display:block; font-weight:normal; color:var(--edim); margin-top:2px; }
.tl .tlb{ flex:1; min-width:0; }
.tl .tlt{ font-weight:bold; }
.tln{ font-size:14px; color:var(--edim); margin-top:2px; }
.tl.shifts li{ align-items:center; }
.shiftbtn{ flex:0 0 auto; }
.tiers{ display:grid; grid-template-columns:repeat(auto-fill, minmax(150px, 1fr)); gap:10px; margin:14px 0; }
.tier{ border:1px solid var(--eac2); padding:12px 14px; }
.tiname{ font:bold 11px var(--mono); letter-spacing:.12em; text-transform:uppercase; color:var(--edim); }
.tiprice{ font-size:22px; font-weight:bold; margin-top:4px; }
.tinote{ font-size:13px; color:var(--edim); margin-top:4px; }
.sales{ margin:6px 0 14px; border-top:1px solid var(--eac2); }
.sale{ display:flex; gap:18px; padding:11px 0; border-bottom:1px solid var(--eac2); }
.sale .sd{ flex:0 0 150px; font:bold 12px var(--mono); letter-spacing:.04em; text-transform:uppercase; padding-top:2px; }
.sale .sm2{ flex:1; min-width:0; }
.sale .sn{ font-weight:bold; }
.sst{ display:inline-block; margin-left:6px; padding:1px 7px; border:1px solid var(--edim); font:bold 10px var(--mono); letter-spacing:.08em; text-transform:uppercase; color:var(--edim); vertical-align:2px; }
.sst.on{ border-color:var(--eac); background:var(--eac); color:var(--eon); }
.asof{ margin-top:10px; font:11px var(--mono); letter-spacing:.08em; text-transform:uppercase; color:var(--edim); }
.prov{ list-style:none; margin:0 0 10px; padding:0; display:grid; grid-template-columns:repeat(auto-fill, minmax(220px, 1fr)); gap:8px; }
.prov li{ display:flex; align-items:center; gap:10px; padding:10px 12px; border:1px solid var(--eac2); }
.prov li::before{ content:""; flex:0 0 12px; height:12px; border:2px solid var(--eac); }
.prov li.y::before{ background:var(--eac); }
.prov li.n{ color:var(--edim); }
span.chip.strong{ color:var(--eac); font-weight:bold; }
/* a label is not a button: tags and facts are filled and borderless; only what you can press has an outline */
span.chip{ border-color:transparent; background:color-mix(in srgb, var(--eac2) 55%, transparent); padding:4px 11px; }
span.chip.strong{ border-color:transparent; background:color-mix(in srgb, var(--eac) 16%, transparent); }
.chipmore{ align-self:center; padding:0 4px; font-size:13px; color:var(--edim); }
.vocab dt{ text-transform:none; letter-spacing:0; font:bold 14px var(--sys); color:var(--eink); }
.srcline{ margin-top:12px; font:11px var(--mono); letter-spacing:.1em; text-transform:uppercase; color:var(--edim); }
.av{ width:22px; height:22px; flex:0 0 22px; display:inline-grid; place-items:center; color:#fff; font:bold 10px var(--sys); }
.av.img{ position:relative; overflow:hidden; background:var(--face); }
.av.a40{ width:40px; height:40px; flex-basis:40px; font-size:14px; }
.av.a64{ width:64px; height:64px; flex-basis:64px; font-size:22px; }
.av.a28{ width:28px; height:28px; flex-basis:28px; font-size:11px; }

@container detail (max-width:620px){
  .banner .bin{ flex-direction:column; align-items:flex-start; gap:16px; padding:22px 18px 20px; }
  .banner .sq.s160{ width:92px; height:92px; font-size:50px; }
  .hl{ font-size:clamp(32px, 11cqi, 46px); }
  .actbar{ padding:8px 14px; }
  .lin{ padding:4px 18px 36px; }
  .edition{ padding:14px 14px 0; }
  .entry{ margin:14px 14px 0; }
  .vgroup{ flex:1 1 100%; }
  .vgroup .vb{ flex:1; }
  .actbar{ position:relative; }
  .vsec{ display:contents; }

  .facts{ grid-template-columns:1fr 1fr; }

/* ---------- 7. app-chrome detail pages (horizon, person, call out) --- */
.page{ padding:26px 30px 40px; max-width:820px; }
.phead2{ display:flex; gap:18px; align-items:flex-start; }
.pname{ font-size:var(--fs-xl); font-weight:bold; line-height:1.15; overflow-wrap:anywhere; }

.pdesc{ margin:14px 0 0; max-width:62ch; font-size:var(--fs-m); line-height:1.55; }
.acts{ display:flex; flex-wrap:wrap; gap:8px; margin-top:18px; }
.subh{ margin:30px 0 8px; font:bold 11px var(--mono); letter-spacing:.14em; text-transform:uppercase; color:var(--dim); display:flex; gap:8px; }

@container detail (max-width:560px){

/* ---------- 8. right: chats ------------------------------------------ */
.phead{ flex:0 0 auto; display:flex; align-items:center; gap:10px; min-height:54px; padding:4px 2px 10px 4px; }
.ptitle{ flex:1; min-width:0; font-size:var(--fs-l); font-weight:bold; line-height:1.2; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.ptitle small{ display:block; margin-top:2px; font-size:var(--fs-s); font-weight:normal; color:var(--dim); }
.chrow{ display:flex; align-items:center; gap:12px; min-height:68px; padding:10px 14px; border-bottom:1px solid var(--line); }
.chrow:hover{ background:var(--hover); }
.chrow .cmn{ flex:1; min-width:0; }
.chrow .cnm{ font-size:15px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.chrow.unread .cnm{ font-weight:bold; }
.chrow .cpv{ margin-top:2px; font-size:var(--fs-s); color:var(--dim); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

.chrow .cside{ display:flex; flex-direction:column; align-items:flex-end; gap:6px; }
.ctime{ font:11px var(--mono); color:var(--dim); white-space:nowrap; }
.udot{ width:10px; height:10px; background:#000; }
.conv{ flex:1; min-height:0; display:flex; flex-direction:column; gap:8px; }
.msgs{ flex:1; min-height:0; overflow:auto; padding:16px 14px; background:#fff; box-shadow:var(--in); display:flex; flex-direction:column; gap:12px; }
.msg{ max-width:86%; align-self:flex-start; }
.msg.me{ align-self:flex-end; text-align:right; }
.mfrom{ margin-bottom:3px; font-size:12px; color:var(--dim); }
.mfrom .mt{ font-family:var(--mono); font-size:11px; margin-left:6px; }
.mbody{ display:inline-block; padding:8px 12px; background:var(--face-lt); border:1px solid #d8d4cb; text-align:left; line-height:1.4; overflow-wrap:anywhere; }
.msg.me .mbody{ background:#2a2a2a; border-color:#2a2a2a; color:#fff; }
.msg.sys{ align-self:center; font:12px var(--mono); color:var(--dim); text-align:center; }
.evcard{ display:flex; gap:10px; align-items:center; padding:8px; background:#fff; border:1px solid #bdb9b0; text-align:left; cursor:pointer; }
.evcard .t{ font-weight:bold; }
.evcard .m{ font-size:12px; color:var(--dim); }
.composer{ flex:0 0 auto; display:flex; gap:8px; }
.composer input{ flex:1; }
.members{ display:flex; gap:4px; }

/* ---------- 9. calendar ---------------------------------------------- */
.calbar{ flex:0 0 auto; display:flex; align-items:center; gap:8px; padding:0 0 8px; flex-wrap:wrap; }
.calbar .ttl{ font-size:18px; font-weight:bold; min-width:0; margin-right:6px; }
.calbar .spring{ flex:1; }
.calbar label{ display:flex; gap:8px; align-items:center; min-height:var(--ctl); padding:0 4px; font-size:var(--fs-s); cursor:pointer; }
.calgrid{ flex:1; min-height:0; overflow:auto; display:flex; flex-direction:column; }
.caldow{ display:flex; background:var(--face-lt); border-bottom:1px solid #b9b4a8; position:sticky; top:0; z-index:2; }
.caldow div{ flex:1; padding:6px 8px; font:bold 11px var(--mono); letter-spacing:.1em; text-transform:uppercase; border-left:1px solid #d7d3ca; }
.caldow div:first-child{ border-left:0; }
.calrow{ display:flex; flex:1 0 auto; min-height:104px; border-top:1px solid #d6d2c9; }
.calcell{ flex:1; min-width:0; border-left:1px solid #e3e0d9; padding:4px 4px 6px; overflow:hidden; }
.calcell:first-child{ border-left:0; }
.calcell.oth{ background:#f6f5f1; color:#a09c94; }
.calcell.today .dn{ background:var(--sel); color:#fff; }
.calcell .dn{ display:inline-block; padding:1px 6px; font:bold 12px var(--mono); }
.calev{ display:flex; align-items:center; gap:5px; margin:3px 0; min-height:24px; padding:2px 6px 2px 0; overflow:hidden; white-space:nowrap;
  background:var(--ebg); color:var(--eink); border-left:4px solid var(--eac); font-size:12px; }
.calev .cg{ color:var(--eac); padding-left:4px; }
.calev span{ overflow:hidden; text-overflow:ellipsis; }
.calev:hover{ outline:2px solid #000; outline-offset:-1px; }
.weekcol{ flex:1; min-width:0; border-left:1px solid #e3e0d9; display:flex; flex-direction:column; }
.weekcol .wh{ padding:8px; background:var(--face-lt); border-bottom:1px solid #b9b4a8; font:bold 12px var(--mono); }
.weekcol.today .wh{ background:var(--sel); color:#fff; }
.weekcol .wb{ flex:1; padding:4px; }
.dayband{ display:flex; border-top:1px solid #d6d2c9; min-height:42px; }
.dayband .hr{ flex:0 0 66px; padding:4px 8px; text-align:right; font:12px var(--mono); color:var(--dim); background:var(--face-lt); border-right:1px solid #b9b4a8; }
.dayband .slot{ flex:1; padding:3px; display:flex; flex-direction:column; gap:3px; }
.calcell .dots{ display:flex; flex-wrap:wrap; gap:3px; margin-top:4px; }
.calcell .dots i{ width:100%; height:6px; background:var(--eac); pointer-events:none; }
.calcell[data-act]{ cursor:pointer; }
.calcell[data-act]:hover{ background:var(--hover); }
.calcell.picked{ outline:2px solid #000; outline-offset:-2px; background:#fff; }
.weekcol .wh[data-act]{ cursor:pointer; }
.calall{ margin-left:auto; min-height:32px; padding:0 8px; border:0; background:transparent; font:bold 11px var(--mono); letter-spacing:.08em; text-transform:uppercase; color:var(--ink2); text-decoration:underline; }

.agenda{ border-top:1px solid #b9b4a8; }
@container cal (max-width:640px){
  .calrow{ min-height:58px; }
  .calcell{ padding:3px 2px; }
  .calcell .dn{ font-size:11px; padding:1px 3px; }
  .caldow div{ padding:6px 3px; text-align:center; }
}

/* ---------- 10. menus, dialogs, toasts ------------------------------- */
.popmenu{ position:fixed; z-index:80; min-width:220px; padding:3px; background:var(--face); box-shadow:var(--out), 3px 3px 8px rgba(0,0,0,.3); }
.popmenu .pi{ display:flex; align-items:center; gap:11px; min-height:40px; padding:0 18px 0 12px; white-space:nowrap; }
.popmenu .pi:hover, .popmenu .pi:focus{ background:var(--sel); color:#fff; outline:0; }
.popmenu .sepi{ height:2px; min-height:0; margin:3px 2px; padding:0; box-shadow:inset 0 1px 0 var(--shadow), inset 0 -1px 0 var(--white); }
.popmenu .sepi:hover{ background:transparent; }
/* the right-click menu: Windows 2000 grey, etched hairlines, a check gutter, a black ▸ for submenus */
.ctxmenu{ position:fixed; z-index:85; min-width:196px; max-width:320px; padding:2px; background:var(--face); color:var(--ink);
  box-shadow:var(--out), 2px 2px 3px rgba(0,0,0,.35); font:var(--fs-s)/1.2 var(--sys); outline:0; user-select:none; -webkit-user-select:none; }
.ctxmenu .ci{ display:flex; align-items:center; min-height:26px; padding:0 18px 0 0; white-space:nowrap; cursor:default; outline:0; }
.ctxmenu .ci:focus, .ctxmenu .ci.open{ background:var(--sel); color:#fff; }
.ctxmenu .ci.def .clab{ font-weight:bold; }
.ctxmenu .cck{ flex:0 0 24px; display:grid; place-items:center; }
.ctxmenu .cart2{ flex:0 0 auto; margin-right:8px; display:grid; place-items:center; }
.ctxmenu .clab{ flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; }
.ctxmenu .carr{ flex:0 0 auto; margin-left:22px; margin-right:-8px; width:0; height:0; border-left:4px solid currentColor; border-top:4px solid transparent; border-bottom:4px solid transparent; }
.ctxmenu .csep{ height:0; margin:3px 1px; border-top:1px solid var(--shadow); border-bottom:1px solid var(--white); }
.ctx-on{ outline:1px dotted currentColor; outline-offset:-3px; }
/* the same menu as a bottom sheet on a phone */
.ctxsheet .sheetrow .cico{ flex:0 0 32px; display:grid; place-items:center; }
.ctxsheet .sheetrow .clab{ flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.ctxsheet .sheetrow.def .clab{ font-weight:bold; }
.ctxsheet .sheetrow .hzchk .ic{ display:none; }
.ctxsheet .sheetrow .hzchk.on .ic{ display:block; }
.ctxsheet .csep{ height:6px; background:var(--face); box-shadow:inset 0 1px 0 var(--shadow), inset 0 -1px 0 var(--white); }
/* items that answer a long-press: no text selection, no callout */
body.is-phone :is(.row[data-type], .card2[data-type], .calev, .track[data-type], .crow, .nrow, .evcard, .chrow){
  -webkit-touch-callout:none; -webkit-user-select:none; user-select:none; }
@media (pointer:coarse){ :is(.row[data-type], .card2[data-type], .calev, .track[data-type], .crow, .nrow, .evcard, .chrow){
  -webkit-touch-callout:none; -webkit-user-select:none; user-select:none; } }
#mask{ position:fixed; inset:0; z-index:60; display:none; background:rgba(0,0,0,.3); }
.dlg{ position:fixed; z-index:70; display:flex; flex-direction:column; max-height:calc(100vh - 32px); padding:3px; background:var(--face);
  box-shadow:var(--out), 4px 4px 16px rgba(0,0,0,.38); }
.dbar{ flex:0 0 34px; display:flex; align-items:center; gap:8px; padding:0 4px 0 12px; color:#fff; font-weight:bold; background:var(--bar); user-select:none; }
.dbar .dtitle{ flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.dbar .dbtn{ height:26px; padding:0 10px; border:0; background:transparent; color:#fff; font:inherit; font-weight:normal; text-decoration:underline; text-underline-offset:3px; }
body.is-phone .dbar .dbtn{ height:44px; }
.dbar .x{ width:30px; height:26px; display:grid; place-items:center; border:0; padding:0; background:var(--face); color:#000; box-shadow:var(--out); }
.dbody{ flex:1; min-height:0; overflow:auto; padding:20px; }
.dfoot{ flex:0 0 auto; display:flex; justify-content:flex-end; gap:8px; padding:12px 20px 18px; }
.field{ display:flex; flex-direction:column; gap:6px; margin-bottom:16px; }
.field > label, .flabel{ font-size:var(--fs-s); font-weight:bold; }
.fhelp{ font-size:var(--fs-s); color:var(--dim); }
.ferr{ font-size:var(--fs-s); font-weight:bold; color:var(--ink); }
.ferr::before{ content:"\26A0\FE0E  "; }
input[aria-invalid="true"]{ outline:1px solid #000; outline-offset:-4px; }
.demolink{ margin:4px 0 0; font-size:var(--fs-s); color:var(--dim); }
.demolink button{ min-height:32px; padding:0; border:0; background:none; color:var(--ink2); text-decoration:underline; text-underline-offset:3px; cursor:pointer; }
body.is-phone .demolink button{ min-height:44px; }
.pick{ display:flex; align-items:center; gap:12px; min-height:52px; padding:6px 10px; border-bottom:1px solid var(--line); cursor:pointer; }
.pick:hover{ background:var(--hover); }
.pick .pm{ flex:1; min-width:0; }
.pick .pm small{ display:block; color:var(--dim); font-size:var(--fs-s); }
.picklist{ background:#fff; box-shadow:var(--in); max-height:300px; overflow:auto; }
/* on a touch screen everything you can press is at least 44px */
@media (pointer:coarse){
  button.chip, a.chip{ min-height:var(--ctl); }
}
.pchips{ display:flex; flex-wrap:wrap; gap:6px; }
.pchip{ height:var(--ctl); padding:0 14px; border:0; background:var(--face); box-shadow:var(--out); font-size:var(--fs-s); }
.pchip.on{ background:var(--sel); color:#fff; box-shadow:inset 1px 1px 0 #000, inset -1px -1px 0 #777; font-weight:bold; }
.addcity{ display:inline-flex; gap:6px; flex:1 1 220px; }
.addcity input{ flex:1; min-width:0; }
.handlein{ display:flex; align-items:center; background:#fff; box-shadow:var(--in); }
.handlein > span{ padding:0 0 0 10px; color:var(--dim); }
.handlein input{ flex:1; box-shadow:none; background:transparent; padding-left:2px; }
.handlein:focus-within{ outline:1px dotted #000; outline-offset:-5px; }
.handlein input:focus{ outline:0; }
.linkrow{ display:flex; align-items:center; gap:12px; min-height:52px; padding:6px 12px; border-bottom:1px solid var(--line); background:#fff; cursor:pointer; }
.linkrow:hover{ background:var(--hover); }
.linkrow .lr{ flex:1; min-width:0; }
.linkrow .lstate{ font:12px var(--mono); color:var(--dim); text-transform:uppercase; letter-spacing:.06em; }
.wizsteps{ display:flex; margin:0 0 18px; }
.wizsteps .ws{ flex:1; min-height:var(--ctl); padding:8px 4px; border:0; text-align:center; font:bold 12px var(--mono); letter-spacing:.06em; background:var(--face-dk); box-shadow:var(--out); color:var(--ink2); }
.wizsteps .ws:hover{ color:#000; }
.wizsteps .ws.on{ background:#fff; color:#000; box-shadow:var(--in); }
.wizsteps .ws[aria-disabled="true"]{ color:#8a8a8a; text-shadow:1px 1px 0 #fff; cursor:default; }
.wizsteps .wsopt{ font-weight:normal; letter-spacing:.02em; color:var(--dim); text-transform:lowercase; }
.wherein{ display:flex; align-items:center; gap:14px; }
.wherein input[type="text"]{ flex:1; min-width:0; }
.wherein input[disabled]{ background:var(--face-lt); }
.wzon{ display:inline-flex; align-items:center; gap:6px; font-size:var(--fs-s); white-space:nowrap; cursor:pointer; }
.ferr[hidden]{ display:none; }
/* what the wizard's Next / Publish are waiting for, beside them */
.wizneed{ margin-right:auto; align-self:center; font-size:var(--fs-s); line-height:1.35; color:var(--ink2); }
.wizneed:empty{ display:none; }
/* Customize: three colours and a square image, with a live preview of the square and the title block */
.custwrap{ display:flex; gap:18px; }
.custcol{ flex:0 0 340px; min-width:0; }
.custprev{ flex:1; min-width:0; position:sticky; top:0; align-self:flex-start; }
.czsect{ margin:0 0 7px; font:bold 11px var(--mono); letter-spacing:.12em; text-transform:uppercase; color:var(--dim); }
.czstarts{ display:grid; grid-template-columns:repeat(3, minmax(0, 1fr)); gap:6px; margin-bottom:16px; }
.czstart{ justify-content:flex-start; gap:7px; padding:0 8px; font-size:var(--fs-s); white-space:nowrap; overflow:hidden; }
.czstart .sw{ flex:0 0 18px; height:18px; display:grid; place-items:center; font-size:11px; line-height:1; box-shadow:inset 0 0 0 1px rgba(0,0,0,.35); }
.czcolor{ display:flex; align-items:center; gap:8px; margin-bottom:8px; }
.czcolor > label{ flex:0 0 84px; font-size:var(--fs-s); font-weight:bold; }
.czcolor input[type=color]{ flex:0 0 46px; width:46px; height:var(--ctl); padding:3px; border:0; background:#fff; box-shadow:var(--in); cursor:pointer; }
.czcolor .czhex{ flex:1; min-width:0; font-family:var(--mono); }
.cznote{ margin:0 0 12px; font-size:var(--fs-s); color:var(--ink2); }
.cznote[hidden]{ display:none; }
.cznote .sw{ display:inline-block; width:12px; height:12px; margin:0 3px -1px 0; box-shadow:inset 0 0 0 1px rgba(0,0,0,.35); }
.czimg{ display:flex; gap:12px; align-items:flex-start; margin-bottom:16px; }
.czdrop{ flex:0 0 auto; position:relative; display:block; padding:0; border:0; background:none; cursor:pointer; outline-offset:3px; }
.czdrop.over{ outline:2px dashed var(--sel); }
.czdrop .czhint{ position:absolute; left:0; right:0; bottom:0; padding:3px 0; background:rgba(0,0,0,.55); color:#fff; font:bold 10px var(--mono); letter-spacing:.08em; text-align:center; text-transform:uppercase; }
.czimgside{ flex:1; min-width:0; display:flex; flex-direction:column; align-items:flex-start; gap:6px; }
.czimgside .fhelp{ margin:0; line-height:1.4; }
.czimgside .ferr:empty{ display:none; }
.czfile{ position:absolute; width:1px; height:1px; opacity:0; overflow:hidden; pointer-events:none; }
.previewbox{ padding:12px; max-height:470px; overflow:auto; background:#fff; box-shadow:var(--in); }
.plabel{ margin:10px 0 6px; font:bold 11px var(--mono); letter-spacing:.12em; text-transform:uppercase; color:var(--dim); }
.plabel:first-child{ margin-top:0; }
.minicanvas{ overflow:hidden; position:relative; container:detail / inline-size; }
.minicanvas .banner .bin{ padding:14px 16px; gap:14px; }
.minicanvas .hl{ font-size:26px !important; }
.minicanvas .actbar{ position:relative; padding:6px 16px; }
.minicanvas .lin{ padding:10px 16px 14px; }
.minicanvas .canvas{ min-height:0; }
#toasts{ position:fixed; left:50%; bottom:20px; transform:translateX(-50%); z-index:90; display:flex; flex-direction:column; align-items:center; pointer-events:none; }
.toast{ min-width:220px; max-width:320px; padding:10px 14px; background:#ffffe1; border:1px solid #6d6a5e; box-shadow:2px 2px 6px rgba(0,0,0,.3); font-size:var(--fs-s); }
.toast b{ display:block; font-size:var(--fs); }
.toast.act{ display:flex; align-items:center; gap:12px; pointer-events:auto; }
.toast .tt2{ flex:1; min-width:0; }
.linkline{ display:flex; gap:8px; }
.linkline input{ flex:1; min-width:0; color:var(--ink2); }
#sh-msg, #sh-q{ width:100%; }
#sh-list{ max-height:260px; }
body.is-phone #sh-list{ max-height:none; }
.answered{ display:inline-flex; align-items:center; gap:6px; min-height:var(--ctl); padding:0 6px 0 0; font-weight:bold; }
.ab-tap{ cursor:pointer; align-self:stretch; display:flex; flex-direction:column; justify-content:center; }
.linkrow.static{ cursor:default; }
.linkrow.static:hover{ background:#fff; }
.chrow .lstate{ font:12px var(--mono); color:var(--dim); text-transform:uppercase; letter-spacing:.06em; }
.cmsg{ margin:0; max-width:46ch; font-size:var(--fs-m); line-height:1.5; }

/* ---------- 10b. phone feed: shelves, tiles, playlists --------------- */
.shelves{ padding:0 0 28px; }
.greet{ padding:20px 16px 4px; }
.greet h2{ margin:0; font-size:24px; line-height:1.15; }
.greet p{ margin:4px 0 0; color:var(--dim); font-size:14px; }
.shelf{ margin-top:22px; }
.sortrow{ display:flex; align-items:center; justify-content:flex-end; gap:8px; padding:6px 12px; border-bottom:1px solid var(--line); font-size:var(--fs-s); color:var(--dim); }
.sortrow select{ height:var(--ctl); }
.deskgreet{ padding:22px 16px 14px; border-bottom:1px solid var(--line); }
.shh{ display:flex; align-items:center; gap:10px; padding:0 8px 0 16px; }
.shh h3{ flex:1; min-width:0; margin:0; font-size:19px; line-height:1.2; }
.shh h3 .cnt{ font:normal 12px var(--mono); letter-spacing:.04em; color:var(--dim); }
.shstep{ display:none; gap:4px; margin-left:4px; }
.shelf.more .shstep{ display:inline-flex; }
.shstep .ib{ width:30px; height:26px; }
.card2{ cursor:pointer; }
.card2.sel .cart{ box-shadow:0 0 0 2px #fff, 0 0 0 4px var(--ink); }
.showall{ min-height:44px; padding:0 8px; border:0; background:transparent; font:bold 11px var(--mono); letter-spacing:.1em; text-transform:uppercase; color:var(--dim); }
.srow{ display:flex; gap:12px; padding:10px 16px 4px; overflow-x:auto; overscroll-behavior-x:contain; scroll-snap-type:x mandatory; scroll-padding:0 16px;
  -webkit-overflow-scrolling:touch; scrollbar-width:none; }
.srow::-webkit-scrollbar{ display:none; }
.srow::after{ content:""; flex:0 0 4px; }
.card2{ flex:0 0 150px; width:150px; scroll-snap-align:start; min-height:44px; }
.card2 .cart{ position:relative; width:150px; height:150px; box-shadow:0 0 0 1px rgba(0,0,0,.18), 2px 2px 0 rgba(0,0,0,.14); }
.card2:active .cart{ transform:translate(1px,1px); box-shadow:0 0 0 1px rgba(0,0,0,.18); }
.ct2{ margin-top:8px; font-size:14px; font-weight:bold; line-height:1.25; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
.cs2{ margin-top:3px; font:11px var(--mono); letter-spacing:.02em; color:var(--dim); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.ctag{ position:absolute; z-index:5; left:6px; bottom:6px; padding:2px 6px; background:#fff; color:#000; border:1px solid #000; font:bold 10px var(--mono); letter-spacing:.08em; text-transform:uppercase; }
.ctag.inline{ position:static; flex:0 0 auto; }
.coart + .ctag{ left:auto; right:6px; bottom:auto; top:6px; }
.coart{ width:150px; height:150px; display:flex; flex-direction:column; justify-content:flex-end; gap:4px; padding:12px; background:var(--face); box-shadow:var(--out); color:var(--ink); }
.coart .ic{ margin-bottom:auto; }
.coart span{ font:bold 10px var(--mono); letter-spacing:.12em; text-transform:uppercase; color:var(--dim); }
.coart b{ font-size:17px; line-height:1.15; }
.mosaic{ display:grid; grid-template-columns:1fr 1fr; background:#000; overflow:hidden; }
.mosaic .sq{ border-radius:0 !important; clip-path:none !important; }
.mosaic.one{ display:block; }
.mosaic.empty{ display:grid; place-items:center; background:var(--face); color:var(--dim); box-shadow:var(--out); }
.trm{ flex:0 0 auto; }
.rrm{ width:32px; height:32px; }
.pksearch{ position:sticky; top:-20px; z-index:3; margin:-20px -20px 12px; padding:20px 20px 12px; background:var(--face); }
body.is-phone .pksearch{ top:-18px; margin:-18px -16px 12px; padding:18px 16px 12px; }
.picklist.tall{ max-height:min(58vh, 460px); }
/* Add events: one row of filters under the search; the list keeps its height as you switch, so the dialog doesn't jump */
#pk-list{ height:min(58vh, 460px); }
.pkchips{ display:flex; flex-wrap:wrap; gap:6px; margin-top:10px; }
.pkchip{ display:inline-flex; align-items:center; gap:6px; height:30px; padding:0 10px; border:0; background:var(--face); box-shadow:var(--out); color:var(--ink); font-size:13px; white-space:nowrap; }
.pkchip:active{ box-shadow:var(--in); }
.pkchip .n{ font:11px var(--mono); letter-spacing:.02em; color:var(--dim); }
.pkchip.on{ background:var(--sel); color:#fff; font-weight:bold; box-shadow:inset 1px 1px 0 #000; }
.pkchip.on .n{ color:var(--seldim); }
.pick .pm small.pkwhy{ color:var(--ink2); }
.pkempty{ line-height:1.5; }
.pkempty .btn{ margin-top:12px; }
.pkband{ padding:12px 10px 6px; font:bold 11px var(--mono); letter-spacing:.14em; text-transform:uppercase; color:var(--dim); border-bottom:1px solid var(--line); background:#fff; }
.hzchk{ width:28px; height:28px; display:grid; place-items:center; box-shadow:var(--in); background:#fff; color:#000; }
.tracks{ list-style:none; margin:8px 0 0; padding:0; border-top:1px solid var(--line); }
.track{ display:flex; align-items:center; gap:12px; min-height:68px; padding:10px 16px; border-bottom:1px solid var(--line); }
.track:active{ background:var(--hover); }
.track .tm{ flex:1; min-width:0; display:flex; flex-direction:column; align-items:flex-start; }
.track .tt{ font-size:15px; font-weight:bold; overflow:hidden; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; }
.track .ctag.inline{ margin-top:5px; }
.track.sel{ background:var(--sel); color:#fff; }
.track.sel .ts{ color:var(--seldim); }
.trpast{ display:flex; align-items:center; gap:8px; min-height:48px; padding:0 16px; border-bottom:1px solid var(--line); cursor:pointer;
  font:bold 11px var(--mono); letter-spacing:.12em; text-transform:uppercase; color:var(--dim); }
.track .ts{ margin-top:2px; font-size:13px; color:var(--dim); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.track.past .tt{ color:#6f6f6f; }

/* ---------- 10c. Home: the network's activity ------------------------ */
.fgreet{ border-bottom:0; padding-bottom:10px; }
.fgreet p{ margin:4px 0 0; color:var(--dim); font-size:14px; }
.fitem{ display:flex; gap:12px; padding:14px 16px 16px; border-bottom:1px solid var(--line); }
.fav{ flex:0 0 32px; display:flex; flex-direction:column; align-items:flex-start; }
.av.a32{ width:32px; height:32px; flex-basis:32px; font-size:12px; }
.fav.two .av + .av{ width:20px; height:20px; flex-basis:20px; font-size:8px; margin:-12px 0 0 16px; box-shadow:0 0 0 2px #fff; }
.fbody{ flex:1; min-width:0; display:flex; flex-direction:column; gap:10px; }
.fline{ display:flex; align-items:baseline; gap:10px; }
.fsent{ flex:1; min-width:0; font-size:15px; line-height:1.35; color:var(--ink2); }
.fwho{ color:var(--ink); cursor:pointer; }
.fwho:hover{ text-decoration:underline; }
.ftime{ flex:0 0 auto; font:12px var(--mono); letter-spacing:.04em; color:var(--dim); white-space:nowrap; }
.fexpl{ margin:-2px 0 0; font-size:13px; line-height:1.4; color:var(--dim); }
.fcard{ display:grid; grid-template-columns:auto minmax(0, 1fr); align-items:center; column-gap:12px; row-gap:10px; padding:10px; background:#fff; cursor:pointer;
  box-shadow:0 0 0 1px rgba(0,0,0,.16), 2px 2px 0 rgba(0,0,0,.1); }
.fcard:hover{ background:var(--hover); }
.fcard .fverbs{ grid-column:1 / -1; display:flex; flex-wrap:wrap; gap:6px; }
.fcard.fp{ display:flex; align-items:center; gap:12px; }
.fcard.fp .fcm{ flex:1; }
.fcm{ min-width:0; }
.fct{ font-size:16px; font-weight:bold; line-height:1.25; overflow-wrap:anywhere; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
.fcard.small .fct, .fcard.fp .fct{ font-size:15px; }
.fck{ margin-bottom:2px; font:bold 10px var(--mono); letter-spacing:.12em; text-transform:uppercase; color:var(--dim); }
.fcs{ margin-top:3px; font-size:13px; color:var(--dim); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.fcard.fp .fcs{ white-space:normal; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; }
.fcard.sel{ background:var(--face-lt); box-shadow:0 0 0 2px var(--ink), 2px 2px 0 rgba(0,0,0,.1); }
.fvb{ font-size:13px; padding:0 12px; }
.fmore{ align-self:flex-start; min-height:32px; padding:0; border:0; background:transparent; font-size:13px; color:var(--ink2); text-decoration:underline; }
.fmore.static{ text-decoration:none; }
.fend{ display:flex; flex-wrap:wrap; align-items:center; gap:12px; padding:22px 16px 32px; color:var(--dim); font-size:var(--fs-s); }
/* call outs: the one inverted thing on Home — ink ground, paper type, the ask at headline size */
.fitem.fitco{ display:block; padding:16px 16px 18px; }
.fco{ position:relative; padding:16px 18px 18px; background:var(--ink); color:#fff; cursor:pointer;
  outline:1px solid #fff; outline-offset:-6px; box-shadow:4px 4px 0 var(--face-dk); }
.fcok{ display:flex; align-items:center; gap:10px; }
.fcotag{ display:inline-flex; align-items:center; gap:6px; padding:3px 8px; background:#fff; color:#000; font:bold 11px var(--mono); letter-spacing:.16em; text-transform:uppercase; }
.fco .ftime{ margin-left:auto; color:#c4c4c4; }
.fcol{ margin-top:16px; font:bold 11px var(--mono); letter-spacing:.14em; text-transform:uppercase; color:#c4c4c4; }
.fcoa{ margin-top:2px; font-size:32px; font-weight:bold; line-height:1.05; letter-spacing:-.01em; overflow-wrap:anywhere; }
.fcob{ margin:10px 0 0; max-width:56ch; font-size:15px; line-height:1.45; color:#e6e6e6; }
.fcoe{ display:flex; align-items:center; gap:10px; margin-top:14px; padding:8px; background:#242424; box-shadow:inset 0 0 0 1px #4a4a4a; }
.fcoe > span{ min-width:0; font-size:14px; font-weight:bold; line-height:1.3; }
.fcoe small{ display:block; font:normal 11px var(--mono); letter-spacing:.06em; color:#c4c4c4; }
.fcof{ display:flex; flex-wrap:wrap; align-items:center; gap:12px; margin-top:16px; }
.fcoby{ flex:1 1 160px; min-width:0; display:flex; align-items:center; gap:10px; font-size:14px; font-weight:bold; }
.fcoby small{ display:block; font:normal 11px var(--mono); letter-spacing:.04em; color:#c4c4c4; }
.fco .av{ box-shadow:0 0 0 1px #fff; }
.fco .btn, .cotile .btn{ color:#000; }
.fco.sel, .cotile.sel{ outline-width:3px; outline-offset:-7px; }
.costrip.srow{ padding:12px 16px 14px; border-bottom:1px solid var(--line); scroll-snap-type:x proximity; }
.cotile{ flex:0 0 228px; width:228px; min-height:168px; display:flex; flex-direction:column; align-items:flex-start; gap:8px; padding:14px; background:var(--ink); color:#fff;
  outline:1px solid #fff; outline-offset:-5px; scroll-snap-align:start; cursor:pointer; }
.cotile .cta{ font-size:20px; line-height:1.12; overflow-wrap:anywhere; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
.cotile .ctw{ display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; font-size:12px; line-height:1.35; color:#d0d0d0; }
.cotile .btn{ margin-top:auto; }
/* a feed card is a container: its title is the button that opens it, and covers the card for the pointer */
.fcard, .fco, .cotile, .fuprow{ position:relative; }
.flink{ display:block; width:100%; min-width:0; padding:0; border:0; background:none; color:inherit; font:inherit; text-align:left; cursor:pointer; }
.flink::after{ content:""; position:absolute; inset:0; }
.flink:focus-visible{ outline:2px solid currentColor; outline-offset:2px; }
.fcard .btn, .fcard .pill, .fco .btn, .fcoe, .cotile .btn, .fuprow .soc{ position:relative; z-index:1; }
.fcoa{ display:block; }
button.fcoe{ width:100%; border:0; color:inherit; font:inherit; text-align:left; cursor:pointer; }
.fwho{ display:inline; padding:0; border:0; background:none; font:inherit; font-weight:bold; color:var(--ink); cursor:pointer; text-align:left; }
.fwho:hover{ text-decoration:underline; }
/* how long ago is legible; under a day old it is in ink */
.ftime{ font-size:13px; letter-spacing:0; color:var(--ink2); }
.ftime.fresh{ color:var(--ink); font-weight:bold; }
.fco .ftime{ color:#e0e0e0; }
.fco .ftime.fresh{ color:#fff; }
.fline{ flex-wrap:wrap; }
.fsent{ flex:1 1 180px; }
.fmsg{ flex:0 0 auto; align-self:center; display:inline-flex; align-items:center; gap:5px; height:28px; padding:0 9px; border:0; background:var(--face); box-shadow:var(--out); font-size:12px; color:var(--ink); }
.fmsg:active{ box-shadow:var(--in); }
/* you, in one line */
.fitem.fyou{ padding:10px 16px 12px; background:var(--face-lt); }
.fyou .fsent{ font-size:14px; }
/* following only a few: the rest of the network, below your people */
.fnet{ background:#fbfaf8; }
.fnet .fav{ opacity:.6; filter:grayscale(1); }
.fnetnote{ margin:0; padding:8px 16px 10px; border-bottom:1px solid var(--line); font-size:13px; line-height:1.4; color:var(--ink2); }
/* coming up with your people */
.band .bsub{ margin-left:auto; font-weight:normal; letter-spacing:.06em; color:var(--dim); }
.fuprow{ display:flex; align-items:center; gap:12px; padding:8px 16px; border-bottom:1px solid var(--line); }
.fuprow:hover{ background:var(--hover); }

<script>
/* =========================================================================
   0. DATA ADAPTERS — same fixtures as every other concept
   ========================================================================= */
var H = window.HYPERNET;
/* ONE CLOCK. The app runs on the real date: TODAY_ISO is today here, nowMs() is now (the instant every
   timestamp is taken from). The mock fixtures were written for H.meta.today (2026-09-20), so their dates —
   the mock events and their sample records, the call outs' expiries — move by the whole days between that
   and today, and the mock world stays where it was relative to now. The five "World" events and everything
   in data/real-events.json keep their real dates. Stored timestamps are UTC ISO strings (timestamptz in Neon). */
function nowMs(){ return Date.now(); }
var TODAY_ISO = (function(d){ return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2); })(new Date(nowMs()));
function utcDay(iso){ var p = String(iso).split('-'); return Date.UTC(+p[0], +p[1] - 1, +p[2]); }
var FIXTODAY = H.meta.today;
var FIXSHIFT = Math.round((utcDay(TODAY_ISO) - utcDay(FIXTODAY)) / 86400000);
/* "2026-10-04" (or "2026-10-04T…") moved by n days; anything else untouched */
function shiftIso(s, n){
  var m = typeof s === 'string' && s.match(/^(\d{4})-(\d{2})-(\d{2})(.*)$/);
  if (!m || !n) return s;
  var d = new Date(Date.UTC(+m[1], +m[2] - 1, +m[3] + n));
  return d.getUTCFullYear() + '-' + ('0' + (d.getUTCMonth() + 1)).slice(-2) + '-' + ('0' + d.getUTCDate()).slice(-2) + m[4];
}
function shiftDates(o, n){
  Object.keys(o).forEach(function(k){
    var v = o[k];
    if (typeof v === 'string') o[k] = shiftIso(v, n);
    else if (v && typeof v === 'object') shiftDates(v, n);
  });
}
if (FIXSHIFT){
  var SAMPLES = (window.HYPERNET_DETAILS && window.HYPERNET_DETAILS.records) || {};
  H.events.forEach(function(e){
    if (e.kind === 'world') return;
    e.date = shiftIso(e.date, FIXSHIFT);
    if (SAMPLES[e.id]) shiftDates(SAMPLES[e.id], FIXSHIFT);
  });
  H.callouts.forEach(function(c){ c.expiresAt = shiftIso(c.expiresAt, FIXSHIFT); });
  H.meta.today = TODAY_ISO;
}

var PEOPLE = {};
H.people.forEach(function(p){ PEOPLE[p.id] = p; });
/* Michal is the demo account: to everyone else he is just another member, and the
   fixture events marked "You" are his. 'self' is whoever is logged in: nobody until you join. */
PEOPLE['p-michal'] = { id:'p-michal', displayName:'Michal', handle:'mike', bio:H.self.bio,
                       skills:['EVENT PRODUCTION/PRODUCING'], city:'SWEDEN|STOCKHOLM', cities:['Stockholm'] };
PEOPLE['self'] = { id:'self', displayName:'', handle:'', bio:'', skills:[], city:'', cities:[] };

var EVENTS = {};
H.events.forEach(function(e){ EVENTS[e.id] = e; });

var HORIZONS = {};
H.horizons.forEach(function(h){ HORIZONS[h.id] = h; });
HORIZONS['horizon-default'].ownerId = 'p-michal'; HORIZONS['horizon-default'].ownerName = 'Michal';
HORIZONS['horizon-feed'] = { id:'horizon-feed', name:'Feeding the Ridge',
  description:'Kitchen shifts, tea, and everything that ends in washing up.',
  isPersonalDefault:false, isPublished:true, ownerName:'Kai Okonkwo', ownerId:'p-kai',
  eventIds:['evt-fill-1','evt-fill-7','evt-world-camp-dinner'] };
HORIZONS['horizon-surface'] = { id:'horizon-surface', name:'Surfaces & Projections',
  description:'Anything you can throw light at after dark.',
  isPersonalDefault:false, isPublished:true, ownerName:'Mira Chen', ownerId:'p-mira',
  eventIds:['evt-fill-3','evt-fill-9','evt-world-hyperstition-2026'] };

var GROUPS = {};  H.groups.forEach(function(g){ GROUPS[g.id] = g; });
var CALLOUTS = H.callouts.map(function(c){
  var host = H.people.filter(function(p){ return p.displayName === c.hostName; })[0];
  return { id:c.id, title:c.title, body:c.body, expiresAt:c.expiresAt, hostName:c.hostName, hostId: host?host.id:null };
});

/* the fixture people (seed scaffolding: fake attendees and activity). The network itself is networkPeople() */
var CREW = ['p-anna','p-rio','p-kai','p-mira','p-jon','p-sasha'];
var PRESENCE = { 'p-anna':'online','p-rio':'online','p-kai':'idle','p-mira':'offline','p-jon':'offline','p-sasha':'offline' };
/* people are chrome, so their avatars stay in the greys */
var AVCOLOR  = { 'self':'#1c1c1c','p-michal':'#1c1c1c','p-anna':'#4b4b4b','p-rio':'#6b6b6b','p-kai':'#363636',
                 'p-mira':'#7c7c7c','p-jon':'#565656','p-sasha':'#2b2b2b' };

function hashId(str){ var n=0; for (var i=0;i<String(str).length;i++) n=(n*31+String(str).charCodeAt(i))>>>0; return n; }
var CITYPOOL = ['Stockholm','Malmö','Copenhagen','Berlin','Oslo','Gothenburg','Amsterdam'];
Object.keys(EVENTS).forEach(function(id){ if (!EVENTS[id].city) EVENTS[id].city = CITYPOOL[hashId(id) % CITYPOOL.length]; });

/* =========================================================================
   0b. EVENT RECORDS — the Hypernet event schema (docs/research/burn-event-data.md §4)
   Samples for the mock events come from _shared/hypernet-event-details.js.
   Real events come from data/real-events.json, fetched at boot: a real record
   replaces the sample for the same event (matched by id, then by title), and
   events the fixtures don't have join the network. The page renders records,
   never raw files.
   ========================================================================= */
var REC = (window.HYPERNET_DETAILS && window.HYPERNET_DETAILS.records) || {};
var COUNTRY = { SE:'Sweden', US:'USA', ZA:'South Africa', ES:'Spain', AT:'Austria', NO:'Norway', CZ:'Czechia', CH:'Switzerland',
                GB:'United Kingdom', UK:'United Kingdom', DE:'Germany', DK:'Denmark', NL:'Netherlands', LT:'Lithuania', IL:'Israel',
                FR:'France', FI:'Finland', BE:'Belgium', IT:'Italy', PT:'Portugal', PL:'Poland', HU:'Hungary' };
function recOf(id){ return REC[id] || {}; }
/* a sample can name the real host of a fixture event */
Object.keys(REC).forEach(function(id){ if (EVENTS[id] && REC[id].hostName) EVENTS[id].hostName = REC[id].hostName; });
function descOf(e){ return recOf(e.id).description || e.description || ''; }
function endOf(e){ var r = recOf(e.id); return r.endDate && r.endDate > e.date ? r.endDate : null; }
function lastDay(e){ return endOf(e) || e.date; }
function pickK(o, keys){
  if (!o || typeof o !== 'object' || Array.isArray(o)) return undefined;
  for (var i = 0; i < keys.length; i++){
    var v = o[keys[i]];
    if (v != null && v !== '' && !(Array.isArray(v) && !v.length)) return v;
  }
  return undefined;
}
function isoDate(v){ if (v == null) return null; var m = String(v).match(/(\d{4})-(\d{2})-(\d{2})/); return m ? m[0] : null; }
function normTitle(t){ return String(t||'').toLowerCase().replace(/\b(19|20)\d\d\b/g,'').replace(/^\s*the\s+/,'').replace(/[^a-z0-9]+/g,' ').trim(); }
var REALIDS = [];
function mergeReal(raw){
  if (!raw || typeof raw !== 'object' || !raw.title) return;
  var id = raw.id && EVENTS[raw.id] ? raw.id : null;

<script>
/* =========================================================================
   4. DESTINATIONS
   Home (the network's activity), Explore (events, Event Horizons, call outs, people, and

   A view is a way of looking at one destination, never a destination.
   ========================================================================= */
function feedEvents(){
  return allEvents().filter(function(e){ return !NEXTED[e.id] && canSeeEvent(e); }).sort(function(a,b){
    var pa = isPast(a.date) ? 1 : 0, pb = isPast(b.date) ? 1 : 0;

}
function browsableHorizons(){
  return Object.keys(HORIZONS).filter(function(k){ return HORIZONS[k].isPublished || hzOwnedByMe(k); });
}
/* THE NETWORK — everyone on Hypernet here: the fixture people, then every account made in this browser

   With Neon this is  select … from people  (minus you). */
function networkPeople(){
  var me = myPid();
  var accts = Object.keys(PEOPLE).filter(function(k){ return CREW.indexOf(k) < 0 && (k === 'p-michal' || /^u-/.test(k)); });
  return CREW.concat(accts).filter(function(k){ return PEOPLE[k] && k !== me && k !== 'self'; });
}
/* a first name, with the handle when someone else here has the same first name ("Kai @kai.lowend") */
function firstOf(pid){ return String(person(pid).displayName || '').trim().split(/\s+/)[0]; }
function shortName(pid){
  var f = firstOf(pid), others = networkPeople().concat(S.loggedIn ? ['self'] : []).filter(function(k){ return k !== pid && k !== myPid(); });
  return others.some(function(k){ return fold(firstOf(k)) === fold(f); }) ? f + ' @' + person(pid).handle : f;
}
function browsablePeople(){ var ids = networkPeople(); if (S.loggedIn) ids.unshift('self'); return ids; }
/* Explore's kinds: each is a list of one family; the overview (no kind) is the categorical sections, as shelves of squares */
var EXPLOREKINDS = [['events','Events','cal'], ['horizons','Event Horizons','horizon'], ['callouts','Call outs','callout'], ['people','People','people']];

function sameFolder(a,b){ return a && b && a.kind === b.kind && (a.id||null) === (b.id||null); }

/* =========================================================================
   5. SEARCH — every family, grouped
   ========================================================================= */
/* search folds accents and case on both sides: "malmo" finds Malmö, "eksjo" finds Eksjö */
function fold(s){
  return String(s == null ? '' : s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '')

  CALLOUTS.forEach(function(c){ if (matchAll([c.title, c.body, c.hostName], q)) out.push({ type:'callout', id:c.id }); });
  var net = networkPeople();
  Object.keys(PEOPLE).forEach(function(k){

    if (k === 'self' ? !S.loggedIn : net.indexOf(k) < 0) return;
    if (matchAll([p.displayName, p.handle, p.bio, (p.skills||[]).map(skillLabel).join(' '), (p.skills||[]).join(' '), citiesOf(p).join(' ')], q)) out.push({ type:'person', id:k });
  });

}

/* =========================================================================
   6. THE LIST
   ========================================================================= */
function sortItems(items){
  var k = S.sort;

/* an empty phone search offers your recent searches and Explore's kinds */

}
function isOwnCallout(c){ return !!c && S.loggedIn && !!c.hostAcct && c.hostAcct === S.acct; }
/* a call out: what is wanted, by whom, for which event; you answer it once, and its author edits or closes it

function calloutHTML(id){

var KINDNAME = { event:'Event', horizon:'Event Horizon', person:'Person', callout:'Call out', missing:'' };

}
function detailHTML(it){

var LASTDETAIL = '';
function renderDetail(){
  var it = S.stack[S.stack.length-1] || null;
  var key = it ? it.type + ':' + it.id + ':' + S.stack.length : 'none';
  var sc = $('dscroll'), keep = key === LASTDETAIL ? sc.scrollTop : 0;
  sc.innerHTML = detailHTML(it);
  sc.scrollTop = keep;

  var bar = $('evbar'), onEv = L.phone && it && it.type === 'event' && EVENTS[it.id];
  $('app').classList.toggle('has-evbar', !!onEv);
  if (onEv){ bar.className = ''; bar.setAttribute('style', themeVars(TH(it.id))); bar.innerHTML = evbarHTML(it.id); }
  else bar.innerHTML = '';

  $('app').classList.toggle('show-dbar', show);
  if (show){

    var prev = S.stack.length > 1 ? itemName(S.stack[S.stack.length-2]) : (isCal() ? folderName() + ' · Calendar' : folderName());
    $('dbar').innerHTML = (back ? '<button class="btn" data-act="back">'+ic('back')+'Back</button><span class="dcrumb">'+esc(prev)+'</span>'

<script>
/* =========================================================================
   7b. EXPLORE'S OVERVIEW — Spotify's structure in a 2000-era skin
   Sideways shelves of big squares, at every width. Event squares are the album art;
   horizons are playlists with a cover built from their events.
   ========================================================================= */
/* an event square at any pixel size */
function sqPx(id, px, extra){ return sqT(TH(id), px, extra); }
/* a horizon's cover: the owner's pick, or a 2×2 mosaic of its first four events */
function mosaicOf(ids, px){
  ids = ids.filter(function(id){ return EVENTS[id]; });
  if (!ids.length) return '<div class="mosaic empty" style="width:'+px+'px;height:'+px+'px">'+ic('horizon', Math.round(px/3))+'</div>';
  if (ids.length < 4) return '<div class="mosaic one" style="width:'+px+'px;height:'+px+'px">' + sqPx(ids[0], px) + '</div>';
  var h = Math.floor(px/2);
  return '<div class="mosaic" style="width:'+(h*2)+'px;height:'+(h*2)+'px">' + ids.slice(0,4).map(function(id){ return sqPx(id, h); }).join('') + '</div>';
}
function hzMosaic(hzId, px){
  var hz = HORIZONS[hzId], ids = hzEventIds(hzId);
  if (hzOwnSquare(hzId)) return '<div class="mosaic one" style="width:'+px+'px;height:'+px+'px">' + sqT(HZTHEME[hzId], px) + '</div>';
  if (!ids.length) return '<div class="mosaic empty" style="width:'+px+'px;height:'+px+'px">'+ic('horizon', Math.round(px/3))+'</div>';
  if (HZCOVER[hzId] || ids.length < 4) return '<div class="mosaic one" style="width:'+px+'px;height:'+px+'px">' + sqPx(hzCover(hzId), px) + '</div>';
  var h = Math.floor(px/2);
  return '<div class="mosaic" style="width:'+(h*2)+'px;height:'+(h*2)+'px">' + ids.slice(0,4).map(function(id){ return sqPx(id, h); }).join('') + '</div>';
}
function cardTag(it){
  if (!S.loggedIn) return '';
  if (it.type === 'event'){
    if (WENT[it.id]) return '<span class="ctag">Went</span>';
    var st = stateOf(it.id);
    return st ? '<span class="ctag">'+{ going:'Going', interested:'Interested', hosting:'Hosting' }[st]+'</span>' : PROMOTED[it.id] ? '<span class="ctag">Promoted</span>' : '';
  }
  if (it.type === 'horizon') return hzOwnedByMe(it.id) ? '<span class="ctag">Yours</span>' : HZFOLLOW[it.id] ? '<span class="ctag">Following</span>' : '';
  if (it.type === 'callout') return ANSWERED[it.id] ? '<span class="ctag">Answered</span>' : isOwnCallout(calloutOf(it.id)) ? '<span class="ctag">Yours</span>' : '';
  return '';
}
function cardHTML(it){
  var art, t, sub, sub2 = '', soc = '';
  if (it.type === 'event'){
    var e = EVENTS[it.id], end = endOf(e);
    art = sqPx(it.id, 150);
    t = e.title; sub = relDay(e) + (end && dayDiff(e.date) > 6 ? ' +' + (nDays(e.date, end) - 1) + 'd' : ''); sub2 = whereOf(e);
    soc = isPast(lastDay(e)) ? '' : socialHTML(it.id, 'csoc');
  } else if (it.type === 'horizon'){
    var hz = HORIZONS[it.id];
    art = hzMosaic(it.id, 150);
    t = hz.name; sub = hz.ownerName; sub2 = plural(hz.eventIds.length, 'event');
  } else {
    var c = calloutOf(it.id);
    art = '<div class="coart">'+ic('callout', 40)+'<span>Looking for</span><b>'+esc(c.title)+'</b></div>';
    t = c.hostName; sub = 'until ' + fmtShort(c.expiresAt);
  }
  return '<div class="card2'+(isSel(it) ? ' sel' : '')+'" data-act="row" data-type="'+it.type+'" data-id="'+it.id+'" role="button">' +
    '<div class="cart">'+art+cardTag(it)+'</div><div class="ct2">'+esc(t)+'</div><div class="cs2">'+esc(sub)+'</div>'+(sub2 ? '<div class="cs2">'+esc(sub2)+'</div>' : '')+soc+'</div>';
}
function upcoming(e){ return !isPast(lastDay(e)); }
function plural(n, w){ return n + ' ' + w + (n === 1 ? '' : 's'); }
/* this week's days read as days: Today, Tomorrow, Wed · in 3 days */
function relDay(e){
  var d = dayDiff(e.date);
  if (d < 0 && !isPast(lastDay(e))) return 'On now';
  if (d === 0) return 'Today';
  if (d === 1) return 'Tomorrow';
  if (d > 1 && d <= 6) return DAY[dOf(e.date).getDay()] + ' · in ' + d + ' days';
  return fmtShort(e.date);
}
/* horizons worth following: the newly published first, then the most followed */
function popularHorizons(){
  return browsableHorizons().filter(function(k){ return HORIZONS[k].isPublished; }).sort(function(a,b){
    var na = HORIZONS[a].ownerAcct ? 1 : 0, nb = HORIZONS[b].ownerAcct ? 1 : 0;
    return (nb - na) || (hzFollowers(b) - hzFollowers(a));
  });
}
/* the sections of Explore's overview, in order. Each one also backs a "Show all" list. */
var HOMESECTIONS = ['week','followed','soon','announced','yourhz','horizons','callouts'];
function shelfItems(id){
  var ev = function(list){ return list.map(function(e){ return { type:'event', id:e.id }; }); };
  var up = feedEvents().filter(upcoming);
  if (id === 'week') return ev(up.filter(function(e){ return dayDiff(e.date) <= 6; }));
  if (id === 'soon') return ev(up.filter(function(e){ return dayDiff(e.date) > 6; }).slice(0, 12));
  if (id === 'announced') return ev(Object.keys(NEXTED).map(function(k){ return EVENTS[NEXTED[k]]; }).filter(canSeeEvent).sort(byDate));
  if (id === 'horizons') return popularHorizons().filter(function(k){ return !(S.loggedIn && (HZFOLLOW[k] || MYHORIZONS.indexOf(k) >= 0)); }).map(function(k){ return { type:'horizon', id:k }; });
  if (id === 'yourhz') return !S.loggedIn ? [] : MYHORIZONS.slice().reverse().concat(Object.keys(HZFOLLOW).filter(function(k){ return HZFOLLOW[k] && MYHORIZONS.indexOf(k) < 0; })).filter(function(k){ return HORIZONS[k]; }).map(function(k){ return { type:'horizon', id:k }; });
  if (id === 'callouts') return openCallouts().map(function(c){ return { type:'callout', id:c.id }; });
  if (id === 'followed'){
    if (!S.loggedIn) return [];
    return ev(up.filter(function(e){ var hp = hostPersonOf(e); return hp && hp.id !== 'self' && PFOLLOW[hp.id]; }));
  }
  return [];
}
function shelfTitle(id){
  return { week:'This week', soon:'Coming up', announced:'Announced burns', yourhz:'Your Event Horizons', horizons:'Event Horizons worth following',
           callouts:'Call outs',
           followed:'From people you follow' }[id] || '';
}
/* each event shows up once in the overview, in the first section that has it */
function homeSections(){
  var seen = {};
  return HOMESECTIONS.map(function(id){
    var items = shelfItems(id).filter(function(it){
      var k = it.type + ':' + it.id;
      if (seen[k]) return false; seen[k] = 1; return true;
    });
    return { id:id, title:shelfTitle(id), items:items };
  }).filter(function(sec){ return sec.items.length; });
}
function greeting(){
  var hr = new Date().getHours();
  var g = hr < 5 ? 'Good night' : hr < 12 ? 'Good morning' : hr < 18 ? 'Good afternoon' : 'Good evening';
  return S.loggedIn ? g + ', ' + PEOPLE['self'].displayName.split(' ')[0] : g;
}
function shelvesHTML(){
  var h = '<div class="shelves">';
  homeSections().forEach(function(sec){
    var more = sec.items.length > 2;
    /* with a mouse a sideways shelf needs a way along it: ‹ › in its heading, shown when it holds more than fits */
    var step = L.phone ? '' : '<span class="shstep"><button type="button" class="ib" data-act="shelfstep" data-shelf="'+sec.id+'" data-id="-1" aria-label="Previous in '+esc(sec.title)+'">'+ic('back',14)+'</button>' +
      '<button type="button" class="ib" data-act="shelfstep" data-shelf="'+sec.id+'" data-id="1" aria-label="Next in '+esc(sec.title)+'">'+ic('back',14).replace('class="ic"', 'class="ic" style="transform:scaleX(-1)"')+'</button></span>';
    h += '<section class="shelf"><div class="shh"><h3>'+esc(sec.title)+' <span class="cnt">'+sec.items.length+'</span></h3>' +
         (more ? '<button class="showall" data-act="shelfall" data-id="'+sec.id+'">Show all</button>' : '') + step + '</div>';
    h += '<div class="srow" data-shelf="'+sec.id+'">' + sec.items.slice(0, SHELFMAX).map(cardHTML).join('') + '</div></section>';
  });
  return h + '</div>';
}
/* a shelf whose squares don't all fit offers its ‹ › */

   8. CALENDAR — a view of the destination you are in

function calEvents(){ return destEvents().filter(function(e){ return (S.calMine && S.loggedIn) ? !!RSVP[e.id] || MYEVENTS.indexOf(e.id) >= 0 : true; }); }

function calBlock(e){

    '<span class="cg">'+esc(t.glyph)+'</span><span>'+esc(e.title)+'</span>' +
    (S.loggedIn && RSVP[e.id]==='going' ? '<span style="margin-left:auto">'+ic('check',12)+'</span>' : '') + '</div>';

function narrowCal(){ return L.phone || L.cw < 640; }
function monthGrid(anchorIso){

             'aria-label="'+esc(fmtDate(iso) + (evs.length ? ', ' + evs.length + ' event' + (evs.length === 1 ? '' : 's') : ''))+'"'+(narrow ? ' aria-pressed="'+picked+'"' : '')+'>' +
           '<span class="dn">'+day.getDate()+'</span>' +
           (narrow ? '<div class="dots">' + evs.slice(0,3).map(function(e){ return '<i style="'+themeVars(TH(e.id))+'"></i>'; }).join('') + '</div>'

function weekGrid(anchorIso){
