var toggleInHorizon = gated(function(evId, hzId){
  var hz = HORIZONS[hzId], i = hz.eventIds.indexOf(evId);
  if (i < 0){ hz.eventIds.push(evId); toast('Added to ' + hz.name, EVENTS[evId].title); }
  else { hz.eventIds.splice(i, 1); toast('Removed from ' + hz.name, EVENTS[evId].title); }
  render();
  if (DLGS.length && document.querySelector('[data-act="dofile"]')){ closeDialogs(); addToDialog(evId); }
});
var addToHorizonDrop = gated(function(evId, hzId){
  var hz = HORIZONS[hzId];
  if (hz.eventIds.indexOf(evId) < 0){ hz.eventIds.push(evId); toast('Added to ' + hz.name, EVENTS[evId].title); }
  render();
});
var followHz = gated(function(hzId){
  HZFOLLOW[hzId] = !HZFOLLOW[hzId];
  HZCOUNT[hzId] = Math.max(0, (HZCOUNT[hzId]||0) + (HZFOLLOW[hzId] ? 1 : -1));
  render();
  toast(HZFOLLOW[hzId] ? 'Following' : 'Unfollowed', HORIZONS[hzId].name);
});
var renameHz = gated(function(hzId){
  var nm = ($('rh-n')||{}).value || HORIZONS[hzId].name;
  HORIZONS[hzId].name = nm; HORIZONS[hzId].description = ($('rh-d')||{}).value || '';
  closeDialogs(); render();
});
var publishHz = gated(function(hzId){
  HORIZONS[hzId].isPublished = !HORIZONS[hzId].isPublished;
  render();
  toast(HORIZONS[hzId].isPublished ? 'Published' : 'Private again', HORIZONS[hzId].name);
});
var setCover = gated(function(hzId, evId){ HZCOVER[hzId] = evId; closeDialogs(); render(); });
var followP = gated(function(pid){
  PFOLLOW[pid] = !PFOLLOW[pid]; render();
  toast(PFOLLOW[pid] ? 'Following' : 'Unfollowed', person(pid).displayName);
});
/* chats open in the right pane on a desktop, and in the Chats tab on a phone */
function openChat(cid){
  S.chatOpen = cid; UNREADCHAT[cid] = false;
  var i = CHATORDER.indexOf(cid); if (i > 0){ CHATORDER.splice(i, 1); CHATORDER.unshift(cid); }
  if (L.phone) S.tab = 'chats';
  else { S.rightOpen = true; S.lastOpened = 'right'; }
  render();
  setTimeout(function(){ var b = $('chatbox'); if (b && !L.phone) b.focus(); }, 30);
}
function openDM(pid){
  var dm = Object.keys(CHATS).filter(function(k){ return CHATS[k].kind === 'dm' && CHATS[k].memberIds[0] === pid; })[0];
  if (!dm){ dm = 'c-dm-'+pid; CHATS[dm] = { id:dm, name:person(pid).displayName, kind:'dm', memberIds:[pid], messages:[] }; CHATORDER.unshift(dm); }
  return dm;
}
var messagePerson = gated(function(pid){ openChat(openDM(pid)); });
var shareToChat = gated(function(evId, cid){
  CHATS[cid].messages.push({ from:'self', t:nowClock(), text:'', card:evId });
  closeDialogs(); openChat(cid);
  toast('Shared in ' + CHATS[cid].name, EVENTS[evId].title);
});
var answerCallout = gated(function(coId){
  var c = calloutOf(coId); if (!c) return;
  var cid = openDM(c.hostId || 'p-anna');
  CHATS[cid].messages.push({ from:'self', t:nowClock(), text:'Re: ' + c.title + ' — I can do this. When do you need me?' });
  openChat(cid);
});
function createChat(){
  if (!NC || !NC.sel.length) return;
  if (NC.sel.length === 1){ closeDialogs(); openChat(openDM(NC.sel[0])); return; }
  var name = NC.name.trim(); if (!name) return;
  var cid = 'c-new-' + (Object.keys(CHATS).length + 1);
  CHATS[cid] = { id:cid, name:name, kind:'group', memberIds:NC.sel.slice(),
    messages:[{ from:'sys', t:nowClock(), text:'You created “'+name+'” with ' + NC.sel.map(function(k){ return person(k).displayName.split(' ')[0]; }).join(', ') }] };
  CHATORDER.unshift(cid);
  closeDialogs(); openChat(cid);
  toast('Group created', name);
}
function sendChat(){
  var box = $('chatbox'); if (!box || !box.value.trim()) return;
  CHATS[S.chatOpen].messages.push({ from:'self', t:nowClock(), text:box.value.trim() });
  box.value = '';
  render();
  var b = $('chatbox'); if (b) b.focus();
}
var SEARCHRET = null;
function doSearch(q){
  S.query = q;
  if (!q.trim()){
    if (S.folder.kind === 'search'){ goFolder(SEARCHRET || { kind:'home' }); if (L.phone) S.phoneSearch = true; }
    render(); return;
  }
  if (S.folder.kind !== 'search'){ SEARCHRET = S.folder; goFolder({ kind:'search' }); }
  else S.stack = [];
  render();
}
function stepItem(delta){
  var list = S.rows; if (!list.length) return;
  var cur = S.stack[0], i = -1;
  if (cur) list.forEach(function(it, k){ if (it.type === cur.type && it.id === cur.id) i = k; });
  var n = i < 0 ? 0 : Math.max(0, Math.min(list.length-1, i + delta));
  openItem(list[n].type, list[n].id);
  var el = document.querySelector('#listbody .row.sel'); if (el && el.scrollIntoView) el.scrollIntoView({ block:'nearest' });
}
function runCmd(cmd, arg){
  closePopup();
  switch (cmd){
    case 'new-event':   closeDialogs(); newEventDialog(); break;
    case 'new-horizon': closeDialogs(); gated(function(){ newHorizonDialog(arg); })(); break;
    case 'newchat':     closeDialogs(); gated(function(){ newChatDialog(); })(); break;
    case 'new-callout': closeDialogs(); gated(newCalloutDialog)(); break;
    case 'profile':     openItem('person', 'self'); break;
    case 'logout':      doLogout(); break;
  }
}

/* =========================================================================
   14. EVENT WIRING
   ========================================================================= */
document.addEventListener('click', function(ev){
  var pop = ev.target.closest('.popmenu .pi');
  if (pop && !pop.classList.contains('sepi')){ runCmd(pop.getAttribute('data-pop'), pop.getAttribute('data-arg')); return; }
  var n = ev.target.closest('[data-act]');
  if (!n){ closePopup(); return; }
  if (n.tagName === 'SELECT' || (n.tagName === 'INPUT' && n.type !== 'checkbox')) return;
  var act = n.getAttribute('data-act'), id = n.getAttribute('data-id');
  if (act !== 'newmenu' && act !== 'acctmenu') closePopup();
  if (n.tagName === 'A') ev.preventDefault();
  switch (act){
    case 'newmenu':  if (POP){ closePopup(); break; } popup(n, NEWITEMS); break;
    case 'acctmenu': if (POP){ closePopup(); break; } popup(n, [{ label:'Your profile', cmd:'profile', icon:'user' }, '-', { label:'Log out', cmd:'logout', icon:'back' }]); break;
    case 'newsheet': newSheet(); break;
    case 'runcmd':   runCmd(id); break;
    case 'folder':   goFolder({ kind:n.getAttribute('data-kind'), id:id || null }); render(); $('listbody').scrollTop = 0; break;
    case 'setview':  S.view[destKey()] = id; S.stack = []; render(); break;
    case 'row':      openItem(n.getAttribute('data-type'), id); break;
    case 'open':     openItem(n.getAttribute('data-type'), id, 'push'); break;
    case 'open-reset': openItem(n.getAttribute('data-type'), id); break;
    case 'back':     goBack(); break;
    case 'pback':    phoneBack(); break;
    case 'psearch':  S.phoneSearch = true; if (S.folder.kind !== 'search'){ SEARCHRET = S.folder; } render(); break;
    case 'tab':      setTab(id); break;
    case 'toggle-left':  S.leftOpen = !L.left; if (S.leftOpen) S.lastOpened = 'left'; render(); break;
    case 'toggle-right': S.rightOpen = !L.right; if (S.rightOpen) S.lastOpened = 'right'; render(); break;
    case 'v-interested': setRSVP(id, 'interested'); break;
    case 'v-going':      setRSVP(id, 'going'); break;
    case 'v-promote':    doPromote(id); break;
    case 'addto':        gated(addToDialog)(id); break;
    case 'dofile':       toggleInHorizon(id, n.getAttribute('data-hz')); break;
    case 'share':        gated(shareDialog)(id); break;
    case 'doshare':      shareToChat(id, n.getAttribute('data-chat')); break;
    case 'customize':    customizeDialog(id); break;
    case 'followhz':     followHz(id); break;
    case 'renamehz':     gated(renameHzDialog)(id); break;
    case 'dorename':     renameHz(id); break;
    case 'publishhz':    publishHz(id); break;
    case 'coverhz':      gated(coverHzDialog)(id); break;
    case 'docover':      setCover(id, n.getAttribute('data-ev')); break;
    case 'followp':      followP(id); break;
    case 'dm':           messagePerson(id); break;
    case 'answercallout': answerCallout(id); break;
    case 'chatsel':      openChat(id); break;
    case 'chatback':     S.chatOpen = null; render(); break;
    case 'sendchat':     sendChat(); break;
    case 'newchat':      runCmd('newchat'); break;
    case 'ncpick': {
      var k = id, i = NC.sel.indexOf(k);
      if (n.checked && i < 0) NC.sel.push(k); else if (!n.checked && i >= 0) NC.sel.splice(i, 1);
      var q = $('nc-q'); NC.q = q ? q.value : NC.q;
      paintNewChat(); break;
    }
    case 'ncdrop':       NC.sel = NC.sel.filter(function(x){ return x !== id; }); paintNewChat(); break;
    case 'donewchat':    createChat(); break;
    case 'new-event':    runCmd('new-event'); break;
    case 'new-horizon':  runCmd('new-horizon', id); break;
    case 'login':        loginDialog(); break;
    case 'dologin':      doLogin(); break;
    case 'logout':       doLogout(); break;
    case 'closedlg':     closeDialogs(); S.pending = null; break;
    case 'donewhorizon': {
      var nm = ($('nh-n')||{}).value || 'Untitled horizon';
      var hid = 'horizon-new-' + (Object.keys(HORIZONS).length+1);
      HORIZONS[hid] = { id:hid, name:nm, description:($('nh-d')||{}).value||'', isPersonalDefault:false,
                        isPublished:!!($('nh-p')||{}).checked, ownerName:S.me.name, ownerId:'self', eventIds: id && EVENTS[id] ? [id] : [] };
      MYHORIZONS.push(hid); HZCOUNT[hid] = 0;
      closeDialogs();
      if (L.phone){ S.tab = 'you'; }
      goFolder({ kind:'horizon', id:hid }); render();
      toast('Horizon created', nm);
      break;
    }
    case 'donewcallout': {
      var cid3 = 'co-new-' + (CALLOUTS.length+1);
      CALLOUTS.unshift({ id:cid3, title:($('co-t')||{}).value||'Untitled', body:($('co-b')||{}).value||'',
                         expiresAt:isoDate(($('co-x')||{}).value)||'2026-12-31', hostName:S.me.name, hostId:'self' });
      closeDialogs();
      if (L.phone) S.tab = 'home';
      goFolder({ kind:'home' }); S.view['home'] = 'feed'; S.stack = [{ type:'callout', id:cid3 }]; render();
      toast('Call out posted', '');
      break;
    }
    case 'wiz':          wizAct(id); break;
    case 'calmode':      S.calMode = id; render(); break;
    case 'caltoday':     S.calAnchor = TODAY_ISO; render(); break;
    case 'calnav': {
      var a = dOf(S.calAnchor), step = +id, mode = narrowCal() && S.calMode === 'week' ? 'month' : S.calMode;
      if (mode === 'month'){ a.setDate(1); a.setMonth(a.getMonth() + step); }
      else if (mode === 'week') a.setDate(a.getDate() + 7*step);
      else a.setDate(a.getDate() + step);
      S.calAnchor = isoOf(a); render();
      break;
    }
  }
});
document.addEventListener('change', function(ev){
  var n = ev.target;
  if (n.closest('[data-cz]') && DRAFT){
    var k = n.getAttribute('data-cz'); if (k === 'preset') return;
    DRAFT[k] = k === 'pal' ? +n.value : n.value;
    if (DRAFT.step === 3) paintWiz();
    return;
  }
  var act = n.getAttribute('data-act');
  if (act === 'calmine'){ S.calMine = n.checked; render(); }
  if (act === 'sort'){ S.sort = n.value; render(); }
});
document.addEventListener('input', function(ev){
  var n = ev.target;
  if (n.id === 'q' || n.id === 'pq'){ doSearch(n.value); return; }
  if (n.id === 'nc-q'){ NC.q = n.value; var sel = NC.sel.slice(); paintNewChat(); var q = $('nc-q'); if (q){ q.focus(); q.setSelectionRange(q.value.length, q.value.length); } return; }
  if (n.id === 'nc-name'){ NC.name = n.value; paintNewChat(true); return; }
  if (!n.closest('[data-cz]') || !DRAFT || n.tagName === 'SELECT') return;
  DRAFT[n.getAttribute('data-cz')] = n.value;
  if (DRAFT.step === 3){
    var box = DLGS[DLGS.length-1] && DLGS[DLGS.length-1].querySelector('.custprev');
    if (box) box.innerHTML = customizePreviewHTML();
  }
});
document.addEventListener('click', function(ev){
  var pz = ev.target.closest('[data-cz="preset"]');
  if (pz && DRAFT){ applyPreset(+pz.getAttribute('data-i')); paintWiz(); }
});
document.addEventListener('mousedown', function(ev){ if (!ev.target.closest('.popmenu, [data-act="newmenu"], [data-act="acctmenu"]')) closePopup(); });

/* drag an event row onto one of your horizons */
var DRAGID = null;
document.addEventListener('dragstart', function(ev){
  var row = ev.target.closest && ev.target.closest('.row[draggable]');
  if (!row) return;
  DRAGID = row.getAttribute('data-id');
  ev.dataTransfer.effectAllowed = 'copy';
  try { ev.dataTransfer.setData('text/plain', DRAGID); } catch(e){}
});
document.addEventListener('dragend', function(){ DRAGID = null; document.querySelectorAll('.nrow.drop').forEach(function(n){ n.classList.remove('drop'); }); });
document.addEventListener('dragover', function(ev){
  var f = ev.target.closest && ev.target.closest('.nrow[data-drop]');
  if (f && DRAGID){ ev.preventDefault(); ev.dataTransfer.dropEffect = 'copy'; f.classList.add('drop'); }
});
document.addEventListener('dragleave', function(ev){ var f = ev.target.closest && ev.target.closest('.nrow[data-drop]'); if (f) f.classList.remove('drop'); });
document.addEventListener('drop', function(ev){
  var f = ev.target.closest && ev.target.closest('.nrow[data-drop]');
  if (f && DRAGID){ ev.preventDefault(); addToHorizonDrop(DRAGID, f.getAttribute('data-drop')); DRAGID = null; }
});

/* keyboard: the list follows the arrows; Escape steps back out */
document.addEventListener('keydown', function(ev){
  var ae = document.activeElement, inField = ae && /^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName);
  if (ev.key === 'Escape'){
    if (DLGS.length){ closeDialogs(); S.pending = null; return; }
    if (POP){ closePopup(); return; }
    if (inField){ ae.blur(); return; }
    if (L.phone){ phoneBack(); return; }
    if (S.stack.length > (L.split ? 1 : 0)){ goBack(); return; }
    return;
  }
  if (ev.key === 'Enter' && ae){
    if (ae.id === 'chatbox'){ sendChat(); ev.preventDefault(); return; }
    if (ae.id === 'lg-name' || ae.id === 'lg-handle'){ doLogin(); ev.preventDefault(); return; }
    if (ae.id === 'nc-name'){ createChat(); ev.preventDefault(); return; }
    if (ae.classList.contains('pi')){ ae.click(); ev.preventDefault(); return; }
  }
  if (POP && (ev.key === 'ArrowDown' || ev.key === 'ArrowUp')){
    var its = Array.prototype.slice.call(POP.querySelectorAll('.pi[tabindex]')), ix = its.indexOf(ae);
    its[(ix + (ev.key === 'ArrowDown' ? 1 : its.length - 1)) % its.length].focus(); ev.preventDefault(); return;
  }
  if (inField || DLGS.length) return;
  if (ev.key === '/' && !L.phone){ ev.preventDefault(); $('q').focus(); return; }
  if (!L.phone && L.split && !isCal()){
    if (ev.key === 'ArrowDown' || ev.key === 'j'){ ev.preventDefault(); stepItem(1); return; }
    if (ev.key === 'ArrowUp' || ev.key === 'k'){ ev.preventDefault(); stepItem(-1); return; }
  }
});

/* =========================================================================
   15. RENDER + BOOT
   ========================================================================= */
function render(){
  L = computeLayout();
  var app = $('app');
  if (!L.phone && S.folder.kind === 'you') goFolder({ kind:'home' });
  if (L.phone && S.folder.kind === 'you' && S.tab !== 'you') S.tab = 'you';
  /* in a split view something is always open in the reading pane */
  var items = null;
  if (L.split && !S.stack.length){ items = orderedItems(); var first = items.filter(function(it){ return it.type !== 'news' || newsOf(it.id).ref; })[0];
    if (first) S.stack = [first.type === 'news' ? newsOf(first.id).ref : first]; }
  if (L.split && S.folder.kind === 'horizon' && !S.stack.length) S.stack = [{ type:'horizon', id:S.folder.id }];
  var scr = L.phone ? (S.tab === 'chats' ? 'chats' : (S.tab === 'you' && S.folder.kind === 'you' && !S.stack.length) ? 'you' : 'center') : '';
  app.className = [L.phone ? 'phone' : 'desk', L.left ? 'l-open' : '', L.right ? 'r-open' : '', L.split ? 'split' : 'push',
    isCal() ? 'v-cal' : '', S.stack.length ? 'has-detail' : '', scr ? 'scr-' + scr : '',
    L.phone && S.tab === 'chats' && S.chatOpen && S.loggedIn ? 'conv-open' : ''].filter(Boolean).join(' ');
  document.body.className = L.phone ? 'is-phone' : 'is-desk';

  if (L.phone){ renderAppbar(); renderTabbar(); } else renderToolbar();
  if (L.left || scr === 'you') renderNav();
  if (!L.phone || scr === 'center'){
    renderCHead();
    if (isCal()) renderCalendar(); else renderList();
    renderDetail();
  }
  renderChats();
}
var RZ = null;
window.addEventListener('resize', function(){ clearTimeout(RZ); RZ = setTimeout(render, 60); });
(function boot(){
  if (window.innerWidth >= 1120) S.leftOpen = true;
  render();
  loadRealEvents();
})();
</script>
