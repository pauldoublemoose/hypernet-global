/* =========================================================================
   9. THE RIGHT PANE — chats, and nothing else
   ========================================================================= */
function chatAv(c){
  if (c.kind === 'dm') return avHTML(c.memberIds[0], 'a40');
  return '<span class="av a40 gav" aria-hidden="true">'+esc(initials(c.name))+'</span>';
}
function lastMsg(c){ return c.messages[c.messages.length-1]; }
/* when a message was sent: new ones carry a timestamp; the fixtures' "09:31" and "yesterday" are read on a
   morning clock that ends just before you arrived, so anything you send is newer */
var BOOTNOW = Date.now();
function msgTs(m){
  if (!m) return 0;
  if (m.ts) return m.ts;
  var t = String(m.t || ''), hm = t.match(/^(\d{1,2}):(\d{2})$/), H = 3600000;
  if (/^yesterday$/i.test(t)) return BOOTNOW - 22 * H;
  if (hm){ var ago = (10 - +hm[1] - +hm[2] / 60) * H; if (ago < 0) ago += 24 * H; return BOOTNOW - 60000 - ago; }
  return BOOTNOW - 48 * H;
}
function stamp(){ return { t:nowClock(), ts:Date.now() }; }
/* the chat list: newest message first; a chat with nothing in it yet is not listed */
function chatList(){
  return CHATORDER.filter(function(k){ return CHATS[k] && CHATS[k].messages.length; })
    .sort(function(a, b){ return msgTs(lastMsg(CHATS[b])) - msgTs(lastMsg(CHATS[a])); });
}
function msgPreview(m, c){
  if (!m) return 'No messages yet';
  var who = m.from === 'self' ? 'You: ' : (c.kind === 'group' && m.from !== 'sys' ? person(m.from).displayName.split(' ')[0] + ': ' : '');
  if (m.from === 'sys') return m.text;
  if (m.card) return who + 'shared ' + (EVENTS[m.card] ? EVENTS[m.card].title : 'an event');
  if (m.hzcard) return who + 'shared ' + (HORIZONS[m.hzcard] ? HORIZONS[m.hzcard].name : 'a horizon');
  return who + m.text;
}
function unreadChats(){ return S.loggedIn ? Object.keys(UNREADCHAT).filter(function(k){ return UNREADCHAT[k]; }).length : 0; }
function chatListHTML(){
  return '<div class="phead"><div class="ptitle">Chats</div><button class="btn primary" data-act="newchat">'+ic('edit')+'New chat</button></div>' +
    '<div class="panel">' + chatList().map(function(k){
      var c = CHATS[k], m = lastMsg(c), un = UNREADCHAT[k];
      return '<div class="chrow'+(un?' unread':'')+'" data-act="chatsel" data-id="'+k+'" role="button">' + chatAv(c) +
        '<div class="cmn"><div class="cnm">'+esc(c.name)+'</div><div class="cpv">'+(CHATDRAFT[k] ? '<b>Draft:</b> '+esc(CHATDRAFT[k]) : esc(msgPreview(m, c)))+'</div></div>' +
        '<div class="cside"><span class="ctime">'+esc(m ? m.t : '')+'</span>'+(un?'<span class="udot" aria-label="Unread"></span>':'')+'</div></div>';
    }).join('') + '</div>';
}
function convHTML(cid){
  var c = CHATS[cid];
  var sub = chatSub(c);
  var h = '<div class="phead"><button class="ib" data-act="chatback" aria-label="All chats">'+ic('back')+'</button>' +
    '<div class="ptitle">'+esc(c.name)+'<small>'+esc(sub)+'</small></div>' +
    (c.kind === 'group' ? '<span class="members">' + c.memberIds.slice(0,4).map(function(m){ return '<span data-act="open" data-type="person" data-id="'+m+'">'+avHTML(m,'a28')+'</span>'; }).join('') + '</span>'
                        : '<button class="ib" data-act="open" data-type="person" data-id="'+c.memberIds[0]+'" aria-label="Profile">'+ic('user')+'</button>') +
    '<button class="ib" data-act="chatinfo" data-id="'+cid+'" aria-label="Chat details" aria-haspopup="dialog">'+ic('dots')+'</button></div>';
  h += '<div class="conv"><div class="msgs" id="msgs">' + (c.messages.length ? c.messages.map(function(m){
    if (m.from === 'sys') return '<div class="msg sys">'+esc(m.text)+'</div>';
    var me = m.from === 'self';
    var head = '<div class="mfrom">'+(me ? '' : esc(person(m.from).displayName))+'<span class="mt">'+esc(m.t)+'</span></div>';
    if (m.card && EVENTS[m.card]){
      var e = EVENTS[m.card];
      return '<div class="msg'+(me?' me':'')+'">'+head+'<div class="evcard" data-act="open" data-type="event" data-id="'+m.card+'">'+sqHTML(m.card,40)+
        '<div><div class="t">'+esc(e.title)+'</div><div class="m">'+fmtShort(e.date)+' · '+esc(whereOf(e))+'</div></div></div></div>';
    }
    if (m.hzcard && HORIZONS[m.hzcard]){
      var hz = HORIZONS[m.hzcard];
      return '<div class="msg'+(me?' me':'')+'">'+head+'<div class="evcard" data-act="open" data-type="horizon" data-id="'+m.hzcard+'">'+hzMosaic(m.hzcard,40)+
        '<div><div class="t">'+esc(hz.name)+'</div><div class="m">Event Horizon · '+hz.eventIds.length+' events</div></div></div></div>';
    }
    return '<div class="msg'+(me?' me':'')+'">'+head+'<div class="mbody">'+esc(m.text)+'</div></div>';
  }).join('') : '<div class="msg sys">No messages yet</div>') + '</div>';
  h += '<div class="composer"><input type="text" id="chatbox" value="'+esc(CHATDRAFT[cid] || '')+'" placeholder="Message '+esc(c.kind === 'dm' ? c.name.split(' ')[0] : c.name)+'" autocomplete="off" aria-label="Message">' +
       '<button class="btn primary" data-act="sendchat">Send</button></div></div>';
  return h;
}
/* on a phone a conversation is a screen pushed onto whatever tab you are in; on a desktop it sits in the dock */
function phoneConv(){ var t = S.stack[S.stack.length-1]; return L.phone && t && t.type === 'chat' && CHATS[t.id] ? t.id : null; }
function activeChat(){ return L.phone ? phoneConv() : (S.chatOpen && CHATS[S.chatOpen] ? S.chatOpen : null); }
function chatSub(c){ return c.kind === 'dm' ? (PRESENCE[c.memberIds[0]] || 'offline') : (c.memberIds.length + 1) + ' members'; }
function renderChats(){
  var el = $('chats');
  var visible = L.phone ? L.scr === 'chats' : L.right;
  if (!visible) return;
  var focused = document.activeElement && document.activeElement.id === 'chatbox';
  if (!S.loggedIn){
    el.innerHTML = '<div class="phead"><div class="ptitle">Chats</div></div><div class="panel"><div class="empty">'+ic('chat',36).replace('class="ic"','class="ic" style="margin:0 auto 12px"')+
      'Chat with your crews.<br><button class="btn primary" data-act="login">'+joinLabel()+'</button></div></div>';
    return;
  }

    el.innerHTML = convHTML(cid);
    var box = $('chatbox'); if (box && focused){ box.focus(); box.setSelectionRange(box.value.length, box.value.length); }

}
</script>
<script>
/* =========================================================================
   10. CHROME — toolbar, header, navigation, phone shell
   ========================================================================= */
function navRow(f, icon, label, opts){
  opts = opts || {};

/* ---------- the layout engine ---------- */
function computeLayout(){
  var W = window.innerWidth;
  if (W < 760) return { phone:true, left:false, right:false, split:false, cw:W };
  var left = S.leftOpen, right = S.rightOpen;
  if (W < 1120 && left && right){ if (S.lastOpened === 'right') left = false; else right = false; }
  /* with the sidebar and the chat dock both open the dock narrows, and the list and the reading pane
     stay side by side: chatting never turns browsing into Back, click, Back */
  var narrow = left && right && W < 1680;
  var cw = W - 12 - (left ? 258 : 0) - (right ? (narrow ? 300 : 350) : 0);
  return { phone:false, left:left, right:right, cw:cw, narrowDock:narrow, split: cw >= (right ? 780 : 860) && !isCal() };
}

<script>

var POP = null;

  { label:'Call out', cmd:'new-callout', icon:'callout' }
];
var DLGS = [];
/* a dialog owns a history entry, so the phone's back gesture closes it instead of the page under it */
function closeDialogs(){ DLGS.forEach(function(d){ d.remove(); }); DLGS = []; $('mask').style.display = 'none'; scheduleSync(); }
function dialog(title, bodyHTML, footHTML, w, cls){
  closePopup();
  scheduleSync();
  $('mask').style.display = 'block';
  var d = document.createElement('div');
  d.className = 'dlg' + (cls ? ' ' + cls : '');
  d.setAttribute('role', 'dialog'); d.setAttribute('aria-modal', 'true'); d.setAttribute('aria-label', title);

    '<div class="dbody">'+bodyHTML+'</div>' + (footHTML ? '<div class="dfoot">'+footHTML+'</div>' : '');
  document.body.appendChild(d);
  d.style.left = Math.max(12, (window.innerWidth - w) / 2) + 'px';
  d.style.top = Math.max(16, (window.innerHeight - d.offsetHeight) / 2.4) + 'px';
  DLGS.push(d);
  placeDlg(d);
  var bar = d.querySelector('.dbar');

    if (ev.target.closest('[data-act]') || document.body.classList.contains('is-phone')) return;

    function up(){ document.removeEventListener('mousemove', mv); document.removeEventListener('mouseup', up); }

  return { profile:{ displayName:p.displayName, handle:p.handle, bio:p.bio, skills:p.skills, cities:p.cities, city:p.city },
           rsvp:RSVP, went:WENT, promoted:PROMOTED, hzfollow:HZFOLLOW, pfollow:PFOLLOW, myevents:MYEVENTS, myhorizons:MYHORIZONS,
           chats:{ byId:CHATS, order:CHATORDER }, unread:UNREADCHAT, drafts:{ forms:FORMDRAFTS, chat:CHATDRAFT }, answered:ANSWERED, answering:ANSWERING };
}
function loadAcct(a){
  a = a || blankAcct({ displayName:'', handle:'', bio:'', skills:[], cities:[], city:'' });
  var p = PEOPLE['self'], pr = a.profile || {};
  ['displayName','handle','bio','city'].forEach(function(k){ p[k] = pr[k] || ''; });
  p.skills = (pr.skills || []).slice(); p.cities = (pr.cities || []).slice();
  RSVP = a.rsvp || {}; WENT = a.went || {}; PROMOTED = a.promoted || {}; HZFOLLOW = a.hzfollow || {}; PFOLLOW = a.pfollow || {};
  MYEVENTS = (a.myevents || []).filter(function(id){ return EVENTS[id]; });
  MYHORIZONS = (a.myhorizons || []).filter(function(k){ return HORIZONS[k]; });
  CHATS = (a.chats && a.chats.byId) || {}; CHATORDER = ((a.chats && a.chats.order) || Object.keys(CHATS)).filter(function(k){ return CHATS[k]; });
  UNREADCHAT = a.unread || {};
  FORMDRAFTS = (a.drafts && a.drafts.forms) || {}; CHATDRAFT = (a.drafts && a.drafts.chat) || {};
  ANSWERED = a.answered || {}; ANSWERING = a.answering || {};
  S.me = { name:p.displayName || 'You', handle:p.handle || 'you' };
}
/* an account that is not logged in is, to everyone else, just a person on the network */
function syncAcctPeople(){
  Object.keys(ACCTS).forEach(function(k){
    var pid = acctPid(k);
    if (k === 'demo') return;
    if (S.loggedIn && S.acct === k) delete PEOPLE[pid];
    else PEOPLE[pid] = Object.assign({ id:pid }, ACCTS[k].profile);
  });
}
function useAcct(k){
  if (S.loggedIn && S.acct){ if (S.acct === k){ closeDialogs(); return; } ACCTS[S.acct] = captureAcct(); }
  if (!ACCTS[k]) ACCTS[k] = k === 'demo' ? demoAcct() : blankAcct({ displayName:'', handle:'' });
  S.acct = k;
  loadAcct(ACCTS[k]);
  S.loggedIn = true;
  syncAcctPeople();
  if (!WELCOME) WELCOME = k === 'demo' ? 'Demo account' : 'Welcome back, ' + PEOPLE['self'].displayName.split(' ')[0];
  logIn();
  if (WELCOME){ var w = WELCOME; WELCOME = null; toast(w, k === 'demo' ? PEOPLE['self'].displayName + ' · @' + PEOPLE['self'].handle : ''); }
}
function logIn(){
  S.loggedIn = true; S.me = { name:PEOPLE['self'].displayName, handle:PEOPLE['self'].handle };
  if (window.innerWidth >= 1680){ S.rightOpen = true; }
  closeDialogs();
  var p = S.pending; S.pending = null;
  render();
  if (p) p();
}
function doLogout(){
  if (S.acct) ACCTS[S.acct] = captureAcct();
  S.loggedIn = false; S.acct = null; loadAcct(null); syncAcctPeople();
  S.chatOpen = null; S.rightOpen = false;
  var open = { home:1, horizons:1, people:1, horizon:1, search:1, you:1 };
  if (!open[S.folder.kind] || (S.folder.kind === 'horizon' && !validItem({ type:'horizon', id:S.folder.id }))) goFolder({ kind:'home' });
  S.stack = S.stack.filter(validItem);

}

<script>

             '.track[data-type], .crow, .nrow[data-kind="horizon"], .nrow[data-type="horizon"], .evcard[data-type]';

function ctxTarget(node){
  var el = node && node.closest ? node.closest(CTXSEL) : null;
  if (!el || el.closest('.dlg, .ctxmenu')) return null;
  var act = el.classList.contains('crow') ? el.querySelector('.cm[data-type]') : el;
  if (!act) return null;
  var type = act.getAttribute('data-kind') === 'horizon' ? 'horizon' : act.getAttribute('data-type'), id = act.getAttribute('data-id');
  if (!((type === 'event' && EVENTS[id]) || (type === 'horizon' && HORIZONS[id]))) return null;
  return { el:el, act:act, type:type, id:id };
}
/* Open does exactly what a click on the item does */
function ctxOpen(t){
  if (t.act && document.body.contains(t.act)) t.act.click();
  else openItem(t.type, t.id);

}
/* a verb picked while logged out means "make it so": after log-in it is switched on, never toggled back off */
function ctxVerb(fn, isOn, label, name){

/* `only` keeps just the listed items (by code): the ⋯ on a page holds what the page does not already show */

      { code:'interested', label:'Interested', icon:'heart', check: st === 'interested',

      { code:'going', label:'Going', icon:'check', check: st === 'going',
        run: ctxVerb(function(){ setRSVP(id, 'going'); }, function(){ return RSVP[id] === 'going'; }, 'Going', EVENTS[id].title) });
    if (!past) out.push({ code:'promote', label:'Promote', icon:'promote', check: S.loggedIn && !!PROMOTED[id],
        run: ctxVerb(function(){ doPromote(id); }, function(){ return !!PROMOTED[id]; }, 'Promoted to your followers', EVENTS[id].title) });

  } else {
    var hmine = hzOwnedByMe(id), fol = S.loggedIn && HZFOLLOW[id], hz = HORIZONS[id];
    if (!hmine) out.push({ code:'follow', label: fol ? 'Unfollow' : 'Follow', icon: fol ? 'close' : 'plus',

               { code:'edit', label:'Edit details…', icon:'edit', run:function(){ gated(renameHzDialog)(id); } });

}
/* the ⋯ on a page: the same menu, drawn at the button (or as the sheet on a phone) */
function openMoreMenu(btn, type, id, only){

/* ---- the desktop menu ---- */
var CTX = null;                /* { root, sub, subOf, target, back, tOpen, tClose } */
function ctxMenuEl(items, level){
  var m = document.createElement('div');
  m.className = 'ctxmenu'; m.setAttribute('role', 'menu'); m.tabIndex = -1; m._items = items; m._level = level;
  m.innerHTML = items.map(function(it, i){
    if (it === '-') return '<div class="csep" role="separator"></div>';
    var role = it.check != null ? 'menuitemcheckbox' : 'menuitem';
    return '<div class="ci'+(it.def?' def':'')+'" role="'+role+'" tabindex="-1" data-ci="'+i+'"' +
      (it.check != null ? ' aria-checked="'+!!it.check+'"' : '') + (it.sub ? ' aria-haspopup="menu" aria-expanded="false"' : '') + '>' +
      '<span class="cck">'+(it.check ? ic('check', 14) : '')+'</span>' +
      (it.art ? '<span class="cart2">'+hzArt(it.art, 16)+'</span>' : '') +
      '<span class="clab">'+esc(it.label)+'</span>' + (it.sub ? '<span class="carr" aria-hidden="true"></span>' : '') + '</div>';
  }).join('');
  document.body.appendChild(m);
  return m;
}
/* place a menu at (x, y); flip left or up, or slide, so it stays on screen */
function ctxPlace(m, x, y, flipX, slideY){
  var w = m.offsetWidth, h = m.offsetHeight, W = window.innerWidth, Ht = window.innerHeight;
  var left = x + w > W - 4 ? (flipX != null ? flipX - w : x - w) : x;
  var top = y + h > Ht - 4 ? (slideY ? Ht - 4 - h : y - h) : y;
  m.style.left = Math.max(4, Math.min(left, W - 4 - w)) + 'px';
  m.style.top = Math.max(4, top) + 'px';
}
function ctxFocus(el){ if (el) try { el.focus({ preventScroll:true }); } catch(e){ el.focus(); } }
function openCtxMenu(t, x, y, fromKeyboard, only){
  closeCtx(); closePopup();
  var root = ctxMenuEl(ctxItems(t, only), 0);
  CTX = { root:root, sub:null, subOf:null, target:t, back:document.activeElement };
  t.el.classList.add('ctx-on');

}
function closeCtx(restore){
  if (!CTX) return;
  var c = CTX; CTX = null;
  clearTimeout(c.tOpen); clearTimeout(c.tClose);
  c.root.remove(); if (c.sub) c.sub.remove();
  if (c.target.el) c.target.el.classList.remove('ctx-on');
  if (restore && c.back && document.body.contains(c.back)) ctxFocus(c.back);
}
function ctxOpenSub(item, focusFirst){
  if (!CTX) return;
  clearTimeout(CTX.tOpen); clearTimeout(CTX.tClose);
  if (CTX.subOf === item){ if (focusFirst) ctxFocus(CTX.sub.querySelector('.ci')); return; }
  ctxCloseSub();
  var it = CTX.root._items[+item.getAttribute('data-ci')];
  var sub = ctxMenuEl(it.sub, 1), r = item.getBoundingClientRect(), pr = CTX.root.getBoundingClientRect();
  CTX.sub = sub; CTX.subOf = item;
  item.classList.add('open'); item.setAttribute('aria-expanded', 'true');
  ctxPlace(sub, pr.right - 3, r.top - 3, pr.left + 3, true);
  if (focusFirst) ctxFocus(sub.querySelector('.ci'));
}
function ctxCloseSub(){
  if (!CTX || !CTX.sub) return;
  CTX.sub.remove(); CTX.subOf.classList.remove('open'); CTX.subOf.setAttribute('aria-expanded', 'false');
  CTX.sub = null; CTX.subOf = null;
}
function ctxActivate(item){
  var m = item.closest('.ctxmenu'), it = m._items[+item.getAttribute('data-ci')];
  if (it.sub){ ctxOpenSub(item, true); return; }
  closeCtx();
  it.run();
}
function ctxMenuOf(node){ return node && node.closest ? node.closest('.ctxmenu') : null; }
document.addEventListener('click', function(ev){
  var m = ctxMenuOf(ev.target); if (!m) return;
  ev.stopPropagation();
  var item = ev.target.closest('.ci'); if (item) ctxActivate(item);
}, true);
document.addEventListener('mouseover', function(ev){
  if (!CTX) return;
  var m = ctxMenuOf(ev.target), item = m && ev.target.closest('.ci');
  if (!item) return;
  if (document.activeElement !== item) ctxFocus(item);
  clearTimeout(CTX.tOpen); clearTimeout(CTX.tClose);
  if (m === CTX.root){
    var it = m._items[+item.getAttribute('data-ci')];
    if (it.sub) CTX.tOpen = setTimeout(function(){ ctxOpenSub(item, false); }, 160);
    else if (CTX.sub) CTX.tClose = setTimeout(ctxCloseSub, 260);
  }
});
/* anywhere else: mouse down outside, scrolling, resizing or leaving the window closes it */
document.addEventListener('mousedown', function(ev){ if (CTX && !ctxMenuOf(ev.target)) closeCtx(); }, true);
document.addEventListener('scroll', function(){ if (CTX) closeCtx(); if (LP && !LP.fired) lpCancel(); }, true);
window.addEventListener('resize', function(){ closeCtx(); });
window.addEventListener('blur', function(){ closeCtx(); });
/* the keyboard, Windows-style: arrows move, → opens the submenu, ← and Esc step back out, Enter runs */
window.addEventListener('keydown', function(ev){
  if (!CTX) return;
  var k = ev.key, ae = document.activeElement, inSub = CTX.sub && CTX.sub.contains(ae);
  var menu = inSub ? CTX.sub : CTX.root, items = Array.prototype.slice.call(menu.querySelectorAll('.ci')), ix = items.indexOf(ae);
  ev.stopPropagation();
  if (k === 'ArrowDown' || k === 'ArrowUp'){
    var n = items.length, next = ix < 0 ? (k === 'ArrowDown' ? 0 : n - 1) : (ix + (k === 'ArrowDown' ? 1 : n - 1)) % n;
    ctxFocus(items[next]); ev.preventDefault(); return;
  }
  if (k === 'Home' || k === 'End'){ ctxFocus(items[k === 'Home' ? 0 : items.length - 1]); ev.preventDefault(); return; }
  if (k === 'ArrowRight'){ if (!inSub && ix >= 0 && CTX.root._items[+ae.getAttribute('data-ci')].sub) ctxOpenSub(ae, true); ev.preventDefault(); return; }
  if (k === 'ArrowLeft'){ if (inSub){ var p = CTX.subOf; ctxCloseSub(); ctxFocus(p); } ev.preventDefault(); return; }
  if (k === 'Enter' || k === ' '){ if (ix >= 0) ctxActivate(ae); ev.preventDefault(); return; }
  if (k === 'Escape'){ if (CTX.sub){ var q = CTX.subOf; ctxCloseSub(); ctxFocus(q); } else closeCtx(true); ev.preventDefault(); return; }
  if (k === 'Tab'){ ev.preventDefault(); return; }
}, true);

/* ---- the phone sheet: same items, the submenu is a second step with Back ---- */
var CTXS = null;               /* { target, items, stack:[{ title, items }] } */
function ctxSheetBody(items, back){
  var h = back ? '<div class="sheetrow" data-act="ctxback" role="button">'+'<span class="cico">'+ic('back', 22)+'</span><span class="clab">Back</span></div>' : '';
  return h + items.map(function(it, i){
    if (it === '-') return '<div class="csep" role="separator"></div>';
    var lead = it.lead || (it.art ? hzIconHTML(it.art, 32) : ic(it.icon || 'horizon', 22));
    var tail = it.sub ? ic('back', 18).replace('class="ic"', 'class="ic" style="transform:scaleX(-1)"')
             : it.check != null ? '<span class="lstate hzchk'+(it.check?' on':'')+'" aria-hidden="true">'+ic('check')+'</span>' : '';
    return '<div class="sheetrow'+(it.def?' def':'')+'" data-act="ctxrun" data-id="'+i+'" role="'+(it.check != null ? 'menuitemcheckbox' : 'menuitem')+'"' +
      (it.check != null ? ' aria-checked="'+!!it.check+'"' : '') + '><span class="cico">'+lead+'</span><span class="clab">'+esc(it.label)+'</span>'+tail+'</div>';
  }).join('');
}
function ctxSheetPaint(){
  var d = DLGS[DLGS.length-1], top = CTXS.stack[CTXS.stack.length-1];
  if (!d || !d.classList.contains('ctxsheet')) return;
  d.querySelector('.dtitle').textContent = top.title;
  d.setAttribute('aria-label', top.title);

}
function openCtxSheet(t, only){
  closeCtx(); closePopup(); closeDialogs();
  CTXS = { target:t, stack:[{ title:itemName(t), items:ctxItems(t, only) }] };
  dialog(itemName(t), '', '', 420, 'sheet ctxsheet');

}
function ctxSheetRun(i){
  if (!CTXS) return;
  var it = CTXS.stack[CTXS.stack.length-1].items[i];
  if (!it || it === '-') return;
  if (it.sub){ CTXS.stack.push({ title:it.label, items:it.sub }); ctxSheetPaint(); return; }
  closeDialogs(); CTXS = null;
  it.run();
}
function ctxSheetBack(){ if (CTXS && CTXS.stack.length > 1){ CTXS.stack.pop(); ctxSheetPaint(); } }
/* tapping the dimmed page above the sheet puts it away */
document.addEventListener('click', function(ev){
  if (ev.target.id === 'mask' && DLGS.length && DLGS[DLGS.length-1].classList.contains('ctxsheet')){ closeDialogs(); CTXS = null; }
});

/* ---- right-click: our menu on these items, the browser's everywhere else ---- */
var LP = null, LPQUIET = 0;
document.addEventListener('contextmenu', function(ev){
  if (ctxMenuOf(ev.target)){ ev.preventDefault(); return; }
  var t = ctxTarget(ev.target);
  if (!t) return;
  ev.preventDefault();
  /* a long-press the browser noticed first: the finger gets the sheet */
  if (LP || Date.now() < LPQUIET){ if (LP && !LP.fired){ lpFire(); } return; }
  if (L.phone){ openCtxSheet(t); return; }
  var kb = !ev.clientX && !ev.clientY, r = t.el.getBoundingClientRect();
  openCtxMenu(t, kb ? r.left + 12 : ev.clientX, kb ? r.bottom - 4 : ev.clientY, kb);
});

/* ---- long-press: about half a second, cancelled by any real movement ---- */
function lpCancel(){ if (LP){ clearTimeout(LP.timer); LP = null; } }
function lpFire(){
  if (!LP || LP.fired) return;
  clearTimeout(LP.timer); LP.fired = true;
  if (navigator.vibrate) try { navigator.vibrate(12); } catch(e){}
  openCtxSheet(LP.t);
}
document.addEventListener('touchstart', function(ev){
  lpCancel();
  if (ev.touches.length !== 1 || DLGS.length) return;
  var t = ctxTarget(ev.target); if (!t) return;
  var p = ev.touches[0];
  LP = { t:t, x:p.clientX, y:p.clientY, fired:false, timer:setTimeout(lpFire, 500) };
}, { passive:true });
document.addEventListener('touchmove', function(ev){
  if (!LP || LP.fired) return;
  var p = ev.touches[0];
  if (ev.touches.length !== 1 || Math.abs(p.clientX - LP.x) > 8 || Math.abs(p.clientY - LP.y) > 8) lpCancel();
}, { passive:true });
document.addEventListener('touchend', function(ev){
  if (LP && LP.fired){ ev.preventDefault(); LPQUIET = Date.now() + 350; LP = null; return; }
  lpCancel();
}, { passive:false });
document.addEventListener('touchcancel', function(){ if (LP && LP.fired) LPQUIET = Date.now() + 350; lpCancel(); }, { passive:true });
/* the lift after a long-press is not a tap */
document.addEventListener('click', function(ev){
  if (Date.now() < LPQUIET){ ev.preventDefault(); ev.stopPropagation(); }
}, true);

<script>

function goFolder(f){
  if (L.phone && S.tab === 'you' && f.kind !== 'you'){ /* stays in the You tab */ }
  if (!sameFolder(S.folder, f)){ S.folder = { kind:f.kind, id:f.id || null }; }

    var top = S.stack[S.stack.length-1];

  } else S.stack = [it];

/* ---- deleting what you own: one confirmation, then it is gone from everywhere ---- */

function deleteHorizonDialog(hzId){

function firstNames(ids){ return ids.map(function(k){ return person(k).displayName.split(' ')[0]; }).join(', '); }
function createChat(){

/* search is a place of its own: where you were (and what you had open) is kept, and clearing takes you back */
var SEARCHRET = null;
function rememberPlace(){ SEARCHRET = { folder:S.folder, stack:S.stack.slice(), autoSel:S.autoSel }; }
function leaveSearch(){
  var r = SEARCHRET || { folder:{ kind:'home' }, stack:[] };
  S.query = ''; SEARCHRET = null;
  goFolder(r.folder); S.stack = r.stack; S.autoSel = !!r.autoSel;
  var q = $('q'); if (q) q.value = '';
}
function doSearch(q){
  S.query = q;
  /* typing refines one search: the trail back is the place you searched from, not every keystroke */
  if (!q.trim()){
    if (S.folder.kind === 'search'){ leaveSearch(); if (L.phone){ S.phoneSearch = true; ROUTE.replace = true; } }
    render(); return;
  }
  if (S.folder.kind !== 'search'){ if (!SEARCHRET) rememberPlace(); if (S.phoneSearch) ROUTE.replace = true; goFolder({ kind:'search' }); }
  else S.stack = [];
  render();
}
function stepItem(delta){
  var list = S.rows; if (!list.length) return;
  var cur = S.stack[0], i = -1;
  if (cur) list.forEach(function(it, k){ if (it.type === cur.type && it.id === cur.id) i = k; });
  var n = i < 0 ? 0 : Math.max(0, Math.min(list.length-1, i + delta));
  ROUTE.replace = true;   /* stepping through a list is not a trail you want to walk back */
  openItem(list[n].type, list[n].id);
  var el = document.querySelector('#listbody .row.sel'); if (el && el.scrollIntoView) el.scrollIntoView({ block:'nearest' });
}
function runCmd(cmd, arg){
  closePopup();
  switch (cmd){
    case 'new-event':   closeDialogs(); newEventDialog(); break;
    case 'new-horizon': closeDialogs(); gated(function(){ newHorizonDialog(arg); })(); break;
    case 'newchat':     closeDialogs(); gated(function(){ newChatDialog(); })(); break;
    case 'new-callout': closeDialogs(); gated(newCalloutDialog)(arg ? { eventId:arg } : null); break;
    case 'profile':     openItem('person', 'self'); break;
    case 'editprofile': profileDialog('edit'); break;
    case 'logout':      doLogout(); break;
  }
}

document.addEventListener('keydown', function(ev){
  var ae = document.activeElement, inField = ae && /^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName);
  if (ev.key === 'Escape'){
    if (DLGS.length){ closeDialogs(); S.pending = null; return; }
    if (POP){ closePopup(); return; }
    if (ae && ae.id === 'q' && S.folder.kind === 'search'){ leaveSearch(); render(); ae.blur(); return; }
    if (inField){ ae.blur(); return; }
    if (L.phone){ if (phoneCanBack()) navBack(); return; }
    if (S.stack.length > (L.split ? 1 : 0)){ navBack(); return; }
    return;
  }
  if (ev.key === 'Enter' && ae){
    if (ae.id === 'chatbox'){ sendChat(); ev.preventDefault(); return; }
    if (ae.id === 'q' || ae.id === 'pq'){ rememberQuery(ae.value); if (L.phone) ae.blur(); ev.preventDefault(); return; }
    if (ae.id === 'pf-city'){ pfAddCity(); ev.preventDefault(); return; }
    if (/^pf-(name|handle|about)$/.test(ae.id)){ pfSave(); ev.preventDefault(); return; }

  syncAcctPeople();
}
var PERSISTT = null;
function schedulePersist(){ clearTimeout(PERSISTT); PERSISTT = setTimeout(persist, 400); }
var RZ = null;
window.addEventListener('resize', function(){ clearTimeout(RZ); RZ = setTimeout(render, 60); });
(function boot(){
  restore();
  if (window.innerWidth >= 1120) S.leftOpen = true;
  /* the real events carry the links people share, so the route waits for them (briefly) */
  var started = false, start = function(){ if (!started){ started = true; startRoutes(); } };
  loadRealEvents().then(start, start);
  setTimeout(start, 2500);
})();
</script>
